<!-- The change-email email. It carries a 6-digit code that the person types into the app (no link to tap). -->
<h2>Confirm your email change</h2>

<p>Your Dorinverse code is <strong>{{ .Token }}</strong>. It works for one hour.</p>
<p>Type it into the app to change your account's email to {{ .NewEmail }}.</p>

<p>If you didn't ask for this, you can ignore this email. Your email stays the same.</p>

<p>Questions? Write to support@dorinverse.com.</p>
