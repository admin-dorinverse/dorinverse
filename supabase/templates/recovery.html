<!-- The reset-password email. It carries a 6-digit code that the person types into the app (no link to tap). -->
<h2>Your Dorinverse code</h2>

<p>Your Dorinverse code is <strong>{{ .Token }}</strong>. It works for one hour.</p>
<p>Type it into the app to choose a new password.</p>

<p>If you didn't ask to reset your password, you can ignore this email. Your password stays the same.</p>

<p>Questions? Write to support@dorinverse.com.</p>
