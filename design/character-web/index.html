 reigneth in Hebron."],["2 Samuel 15:11","And with Absalom went two hundred men out of Jerusalem, that were called; and they went in their simplicity, and they knew not any thing."],["2 Samuel 15:12","And Absalom sent for Ahithophel the Gilonite, David’s counsellor, from his city, even from Giloh, while he offered sacrifices. And the conspiracy was strong; for the people increased continually with Absalom."],["2 Samuel 15:13","And there came a messenger to David, saying, The hearts of the men of Israel are after Absalom."],["2 Samuel 15:14","And David said unto all his servants that were with him at Jerusalem, Arise, and let us flee; for we shall not else escape from Absalom: make speed to depart, lest he overtake us suddenly, and bring evil upon us, and smite the city with the edge of the sword."]]},{"ref":"2 Samuel 16:11","verses":[["2 Samuel 16:11","And David said to Abishai, and to all his servants, Behold, my son, which came forth of my bowels, seeketh my life: how much more now may this Benjamite do it? let him alone, and let him curse; for the LORD hath bidden him."]]},{"ref":"2 Samuel 17:1–4","verses":[["2 Samuel 17:1","Moreover Ahithophel said unto Absalom, Let me now choose out twelve thousand men, and I will arise and pursue after David this night:"],["2 Samuel 17:2","And I will come upon him while he is weary and weak handed, and will make him afraid: and all the people that are with him shall flee; and I will smite the king only:"],["2 Samuel 17:3","And I will bring back all the people unto thee: the man whom thou seekest is as if all returned: so all the people shall be in peace."],["2 Samuel 17:4","And the saying pleased Absalom well, and all the elders of Israel."]]}]},{"a":"absalom_59","b":"amnon_232","type":"family","why":"Amnon and Absalom were sons of David born in Hebron, and scripture calls Amnon Absalom’s brother.","refs":[{"ref":"2 Samuel 3:2–3","verses":[["2 Samuel 3:2","And unto David were sons born in Hebron: and his firstborn was Amnon, of Ahinoam the Jezreelitess;"],["2 Samuel 3:3","And his second, Chileab, of Abigail the wife of Nabal the Carmelite; and the third, Absalom the son of Maacah the daughter of Talmai king of Geshur;"]]},{"ref":"2 Samuel 13:22","verses":[["2 Samuel 13:22","And Absalom spake unto his brother Amnon neither good nor bad: for Absalom hated Amnon, because he had forced his sister Tamar."]]}]},{"a":"absalom_59","b":"amnon_232","type":"enemies","why":"Absalom hated Amnon for forcing his sister Tamar, and two years later commanded his servants to kill him.","refs":[{"ref":"2 Samuel 13:22","verses":[["2 Samuel 13:22","And Absalom spake unto his brother Amnon neither good nor bad: for Absalom hated Amnon, because he had forced his sister Tamar."]]},{"ref":"2 Samuel 13:28–29","verses":[["2 Samuel 13:28","Now Absalom had commanded his servants, saying, Mark ye now when Amnon’s heart is merry with wine, and when I say unto you, Smite Amnon; then kill him, fear not: have not I commanded you? be courageous, and be valiant."],["2 Samuel 13:29","And the servants of Absalom did unto Amnon as Absalom had commanded. Then all the king’s sons arose, and every man gat him up upon his mule, and fled."]]}]},{"a":"absalom_59","b":"tamar_2822","type":"family","why":"Tamar was Absalom's sister, and after Amnon forced her she remained desolate in her brother Absalom's house.","refs":[{"ref":"2 Samuel 13:1","verses":[["2 Samuel 13:1","And it came to pass after this, that Absalom the son of David had a fair sister, whose name was Tamar; and Amnon the son of David loved her."]]},{"ref":"2 Samuel 13:20","verses":[["2 Samuel 13:20","And Absalom her brother said unto her, Hath Amnon thy brother been with thee? but hold now thy peace, my sister: he is thy brother; regard not this thing. So Tamar remained desolate in her brother Absalom’s house."]]}]},{"a":"absalom_59","b":"joab_1617","type":"helped","why":"Joab sent the wise woman of Tekoah to the king and then went to Geshur and brought Absalom back to Jerusalem.","refs":[{"ref":"2 Samuel 14:1–3","verses":[["2 Samuel 14:1","Now Joab the son of Zeruiah perceived that the king’s heart was toward Absalom."],["2 Samuel 14:2","And Joab sent to Tekoah, and fetched thence a wise woman, and said unto her, I pray thee, feign thyself to be a mourner, and put on now mourning apparel, and anoint not thyself with oil, but be as a woman that had a long time mourned for the dead:"],["2 Samuel 14:3","And come to the king, and speak on this manner unto him. So Joab put the words in her mouth."]]},{"ref":"2 Samuel 14:21–24","verses":[["2 Samuel 14:21","And the king said unto Joab, Behold now, I have done this thing: go therefore, bring the young man Absalom again."],["2 Samuel 14:22","And Joab fell to the ground on his face, and bowed himself, and thanked the king: and Joab said, To day thy servant knoweth that I have found grace in thy sight, my lord, O king, in that the king hath fulfilled the request of his servant."],["2 Samuel 14:23","So Joab arose and went to Geshur, and brought Absalom to Jerusalem."],["2 Samuel 14:24","And the king said, Let him turn to his own house, and let him not see my face. So Absalom returned to his own house, and saw not the king’s face."]]},{"ref":"2 Samuel 14:33","verses":[["2 Samuel 14:33","So Joab came to the king, and told him: and when he had called for Absalom, he came to the king, and bowed himself on his face to the ground before the king: and the king kissed Absalom."]]}]},{"a":"absalom_59","b":"joab_1617","type":"enemies","why":"When Absalom rebelled, Joab took three darts and thrust them through Absalom's heart as he hung in the oak.","refs":[{"ref":"2 Samuel 18:14–15","verses":[["2 Samuel 18:14","Then said Joab, I may not tarry thus with thee. And he took three darts in his hand, and thrust them through the heart of Absalom, while he was yet alive in the midst of the oak."],["2 Samuel 18:15","And ten young men that bare Joab’s armour compassed about and smote Absalom, and slew him."]]}]},{"a":"absalom_59","b":"ahithophel_162","type":"counseled","why":"Absalom sent for Ahithophel, who counselled him to go in to his father's concubines and to pursue David at once, and his counsel was as the oracle of God to Absalom.","refs":[{"ref":"2 Samuel 15:12","verses":[["2 Samuel 15:12","And Absalom sent for Ahithophel the Gilonite, David’s counsellor, from his city, even from Giloh, while he offered sacrifices. And the conspiracy was strong; for the people increased continually with Absalom."]]},{"ref":"2 Samuel 16:20–23","verses":[["2 Samuel 16:20","Then said Absalom to Ahithophel, Give counsel among you what we shall do."],["2 Samuel 16:21","And Ahithophel said unto Absalom, Go in unto thy father’s concubines, which he hath left to keep the house; and all Israel shall hear that thou art abhorred of thy father: then shall the hands of all that are with thee be strong."],["2 Samuel 16:22","So they spread Absalom a tent upon the top of the house; and Absalom went in unto his father’s concubines in the sight of all Israel."],["2 Samuel 16:23","And the counsel of Ahithophel, which he counselled in those days, was as if a man had enquired at the oracle of God: so was all the counsel of Ahithophel both with David and with Absalom."]]},{"ref":"2 Samuel 17:1–4","verses":[["2 Samuel 17:1","Moreover Ahithophel said unto Absalom, Let me now choose out twelve thousand men, and I will arise and pursue after David this night:"],["2 Samuel 17:2","And I will come upon him while he is weary and weak handed, and will make him afraid: and all the people that are with him shall flee; and I will smite the king only:"],["2 Samuel 17:3","And I will bring back all the people unto thee: the man whom thou seekest is as if all returned: so all the people shall be in peace."],["2 Samuel 17:4","And the saying pleased Absalom well, and all the elders of Israel."]]}]},{"a":"absalom_59","b":"hushai_1577","type":"betrayed","why":"Hushai pledged himself to Absalom, then gave him counsel that defeated Ahithophel's and secretly sent word to David.","refs":[{"ref":"2 Samuel 16:16–19","verses":[["2 Samuel 16:16","And it came to pass, when Hushai the Archite, David’s friend, was come unto Absalom, that Hushai said unto Absalom, God save the king, God save the king."],["2 Samuel 16:17","And Absalom said to Hushai, Is this thy kindness to thy friend? why wentest thou not with thy friend?"],["2 Samuel 16:18","And Hushai said unto Absalom, Nay; but whom the LORD, and this people, and all the men of Israel, choose, his will I be, and with him will I abide."],["2 Samuel 16:19","And again, whom should I serve? should I not serve in the presence of his son? as I have served in thy father’s presence, so will I be in thy presence."]]},{"ref":"2 Samuel 17:5–16","verses":[["2 Samuel 17:5","Then said Absalom, Call now Hushai the Archite also, and let us hear likewise what he saith."],["2 Samuel 17:6","And when Hushai was come to Absalom, Absalom spake unto him, saying, Ahithophel hath spoken after this manner: shall we do after his saying? if not; speak thou."],["2 Samuel 17:7","And Hushai said unto Absalom, The counsel that Ahithophel hath given is not good at this time."],["2 Samuel 17:8","For, said Hushai, thou knowest thy father and his men, that they be mighty men, and they be chafed in their minds, as a bear robbed of her whelps in the field: and thy father is a man of war, and will not lodge with the people."],["2 Samuel 17:9","Behold, he is hid now in some pit, or in some other place: and it will come to pass, when some of them be overthrown at the first, that whosoever heareth it will say, There is a slaughter among the people that follow Absalom."],["2 Samuel 17:10","And he also that is valiant, whose heart is as the heart of a lion, shall utterly melt: for all Israel knoweth that thy father is a mighty man, and they which be with him are valiant men."],["2 Samuel 17:11","Therefore I counsel that all Israel be generally gathered unto thee, from Dan even to Beersheba, as the sand that is by the sea for multitude; and that thou go to battle in thine own person."],["2 Samuel 17:12","So shall we come upon him in some place where he shall be found, and we will light upon him as the dew falleth on the ground: and of him and of all the men that are with him there shall not be left so much as one."],["2 Samuel 17:13","Moreover, if he be gotten into a city, then shall all Israel bring ropes to that city, and we will draw it into the river, until there be not one small stone found there."],["2 Samuel 17:14","And Absalom and all the men of Israel said, The counsel of Hushai the Archite is better than the counsel of Ahithophel. For the LORD had appointed to defeat the good counsel of Ahithophel, to the intent that the LORD might bring evil upon Absalom."],["2 Samuel 17:15","Then said Hushai unto Zadok and to Abiathar the priests, Thus and thus did Ahithophel counsel Absalom and the elders of Israel; and thus and thus have I counselled."],["2 Samuel 17:16","Now therefore send quickly, and tell David, saying, Lodge not this night in the plains of the wilderness, but speedily pass over; lest the king be swallowed up, and all the people that are with him."]]}]},{"a":"achan_61","b":"joshua_1727","type":"rebuked","why":"Joshua had Achan confess that he took the accursed thing, asked him why he had troubled Israel, and had him stoned in the valley of Achor.","refs":[{"ref":"Joshua 7:16–26","verses":[["Joshua 7:16","So Joshua rose up early in the morning, and brought Israel by their tribes; and the tribe of Judah was taken:"],["Joshua 7:17","And he brought the family of Judah; and he took the family of the Zarhites: and he brought the family of the Zarhites man by man; and Zabdi was taken:"],["Joshua 7:18","And he brought his household man by man; and Achan, the son of Carmi, the son of Zabdi, the son of Zerah, of the tribe of Judah, was taken."],["Joshua 7:19","And Joshua said unto Achan, My son, give, I pray thee, glory to the LORD God of Israel, and make confession unto him; and tell me now what thou hast done; hide it not from me."],["Joshua 7:20","And Achan answered Joshua, and said, Indeed I have sinned against the LORD God of Israel, and thus and thus have I done:"],["Joshua 7:21","When I saw among the spoils a goodly Babylonish garment, and two hundred shekels of silver, and a wedge of gold of fifty shekels weight, then I coveted them, and took them; and, behold, they are hid in the earth in the midst of my tent, and the silver under it."],["Joshua 7:22","So Joshua sent messengers, and they ran unto the tent; and, behold, it was hid in his tent, and the silver under it."],["Joshua 7:23","And they took them out of the midst of the tent, and brought them unto Joshua, and unto all the children of Israel, and laid them out before the LORD."],["Joshua 7:24","And Joshua, and all Israel with him, took Achan the son of Zerah, and the silver, and the garment, and the wedge of gold, and his sons, and his daughters, and his oxen, and his asses, and his sheep, and his tent, and all that he had: and they brought them unto the valley of Achor."],["Joshua 7:25","And Joshua said, Why hast thou troubled us? the LORD shall trouble thee this day. And all Israel stoned him with stones, and burned them with fire, after they had stoned them with stones."],["Joshua 7:26","And they raised over him a great heap of stones unto this day. So the LORD turned from the fierceness of his anger. Wherefore the name of that place was called, The valley of Achor, unto this day."]]}]},{"a":"achish_66","b":"david_994","type":"served","why":"David dwelt with Achish, who gave him Ziklag and made him keeper of his head, and Achish said David would be his servant for ever.","refs":[{"ref":"1 Samuel 27:1–7","verses":[["1 Samuel 27:1","And David said in his heart, I shall now perish one day by the hand of Saul: there is nothing better for me than that I should speedily escape into the land of the Philistines; and Saul shall despair of me, to seek me any more in any coast of Israel: so shall I escape out of his hand."],["1 Samuel 27:2","And David arose, and he passed over with the six hundred men that were with him unto Achish, the son of Maoch, king of Gath."],["1 Samuel 27:3","And David dwelt with Achish at Gath, he and his men, every man with his household, even David with his two wives, Ahinoam the Jezreelitess, and Abigail the Carmelitess, Nabal’s wife."],["1 Samuel 27:4","And it was told Saul that David was fled to Gath: and he sought no more again for him."],["1 Samuel 27:5","And David said unto Achish, If I have now found grace in thine eyes, let them give me a place in some town in the country, that I may dwell there: for why should thy servant dwell in the royal city with thee?"],["1 Samuel 27:6","Then Achish gave him Ziklag that day: wherefore Ziklag pertaineth unto the kings of Judah unto this day."],["1 Samuel 27:7","And the time that David dwelt in the country of the Philistines was a full year and four months."]]},{"ref":"1 Samuel 27:12","verses":[["1 Samuel 27:12","And Achish believed David, saying, He hath made his people Israel utterly to abhor him; therefore he shall be my servant for ever."]]},{"ref":"1 Samuel 28:1–2","verses":[["1 Samuel 28:1","And it came to pass in those days, that the Philistines gathered their armies together for warfare, to fight with Israel. And Achish said unto David, Know thou assuredly, that thou shalt go out with me to battle, thou and thy men."],["1 Samuel 28:2","And David said to Achish, Surely thou shalt know what thy servant can do. And Achish said to David, Therefore will I make thee keeper of mine head for ever."]]},{"ref":"1 Samuel 29:6–9","verses":[["1 Samuel 29:6","Then Achish called David, and said unto him, Surely, as the LORD liveth, thou hast been upright, and thy going out and thy coming in with me in the host is good in my sight: for I have not found evil in thee since the day of thy coming unto me unto this day: nevertheless the lords favour thee not."],["1 Samuel 29:7","Wherefore now return, and go in peace, that thou displease not the lords of the Philistines."],["1 Samuel 29:8","And David said unto Achish, But what have I done? and what hast thou found in thy servant so long as I have been with thee unto this day, that I may not go fight against the enemies of my lord the king?"],["1 Samuel 29:9","And Achish answered and said to David, I know that thou art good in my sight, as an angel of God: notwithstanding the princes of the Philistines have said, He shall not go up with us to the battle."]]}]},{"a":"ahithophel_162","b":"david_994","type":"counseled","why":"Ahithophel was the king's counsellor, and his counsel was esteemed both by David and by Absalom as if a man inquired at the oracle of God.","refs":[{"ref":"1 Chronicles 27:33","verses":[["1 Chronicles 27:33","And Ahithophel was the king’s counsellor: and Hushai the Archite was the king’s companion:"]]},{"ref":"2 Samuel 16:23","verses":[["2 Samuel 16:23","And the counsel of Ahithophel, which he counselled in those days, was as if a man had enquired at the oracle of God: so was all the counsel of Ahithophel both with David and with Absalom."]]}]},{"a":"ahithophel_162","b":"david_994","type":"betrayed","why":"Ahithophel, David's counsellor, joined Absalom's conspiracy and counselled him to pursue David and smite the king only.","refs":[{"ref":"2 Samuel 15:12","verses":[["2 Samuel 15:12","And Absalom sent for Ahithophel the Gilonite, David’s counsellor, from his city, even from Giloh, while he offered sacrifices. And the conspiracy was strong; for the people increased continually with Absalom."]]},{"ref":"2 Samuel 15:31","verses":[["2 Samuel 15:31","And one told David, saying, Ahithophel is among the conspirators with Absalom. And David said, O LORD, I pray thee, turn the counsel of Ahithophel into foolishness."]]},{"ref":"2 Samuel 17:1–4","verses":[["2 Samuel 17:1","Moreover Ahithophel said unto Absalom, Let me now choose out twelve thousand men, and I will arise and pursue after David this night:"],["2 Samuel 17:2","And I will come upon him while he is weary and weak handed, and will make him afraid: and all the people that are with him shall flee; and I will smite the king only:"],["2 Samuel 17:3","And I will bring back all the people unto thee: the man whom thou seekest is as if all returned: so all the people shall be in peace."],["2 Samuel 17:4","And the saying pleased Absalom well, and all the elders of Israel."]]}]},{"a":"ahithophel_162","b":"hushai_1577","type":"rivals","why":"Hushai set his counsel against Ahithophel's before Absalom, and Absalom and Israel said the counsel of Hushai was better than the counsel of Ahithophel.","refs":[{"ref":"2 Samuel 15:31–34","verses":[["2 Samuel 15:31","And one told David, saying, Ahithophel is among the conspirators with Absalom. And David said, O LORD, I pray thee, turn the counsel of Ahithophel into foolishness."],["2 Samuel 15:32","And it came to pass, that when David was come to the top of the mount, where he worshipped God, behold, Hushai the Archite came to meet him with his coat rent, and earth upon his head:"],["2 Samuel 15:33","Unto whom David said, If thou passest on with me, then thou shalt be a burden unto me:"],["2 Samuel 15:34","But if thou return to the city, and say unto Absalom, I will be thy servant, O king; as I have been thy father’s servant hitherto, so will I now also be thy servant: then mayest thou for me defeat the counsel of Ahithophel."]]},{"ref":"2 Samuel 17:5–14","verses":[["2 Samuel 17:5","Then said Absalom, Call now Hushai the Archite also, and let us hear likewise what he saith."],["2 Samuel 17:6","And when Hushai was come to Absalom, Absalom spake unto him, saying, Ahithophel hath spoken after this manner: shall we do after his saying? if not; speak thou."],["2 Samuel 17:7","And Hushai said unto Absalom, The counsel that Ahithophel hath given is not good at this time."],["2 Samuel 17:8","For, said Hushai, thou knowest thy father and his men, that they be mighty men, and they be chafed in their minds, as a bear robbed of her whelps in the field: and thy father is a man of war, and will not lodge with the people."],["2 Samuel 17:9","Behold, he is hid now in some pit, or in some other place: and it will come to pass, when some of them be overthrown at the first, that whosoever heareth it will say, There is a slaughter among the people that follow Absalom."],["2 Samuel 17:10","And he also that is valiant, whose heart is as the heart of a lion, shall utterly melt: for all Israel knoweth that thy father is a mighty man, and they which be with him are valiant men."],["2 Samuel 17:11","Therefore I counsel that all Israel be generally gathered unto thee, from Dan even to Beersheba, as the sand that is by the sea for multitude; and that thou go to battle in thine own person."],["2 Samuel 17:12","So shall we come upon him in some place where he shall be found, and we will light upon him as the dew falleth on the ground: and of him and of all the men that are with him there shall not be left so much as one."],["2 Samuel 17:13","Moreover, if he be gotten into a city, then shall all Israel bring ropes to that city, and we will draw it into the river, until there be not one small stone found there."],["2 Samuel 17:14","And Absalom and all the men of Israel said, The counsel of Hushai the Archite is better than the counsel of Ahithophel. For the LORD had appointed to defeat the good counsel of Ahithophel, to the intent that the LORD might bring evil upon Absalom."]]},{"ref":"2 Samuel 17:23","verses":[["2 Samuel 17:23","And when Ahithophel saw that his counsel was not followed, he saddled his ass, and arose, and gat him home to his house, to his city, and put his household in order, and hanged himself, and died, and was buried in the sepulchre of his father."]]}]},{"a":"amnon_232","b":"tamar_2822","type":"family","why":"Amnon and Tamar were both children of David, and Tamar called him my brother.","refs":[{"ref":"2 Samuel 13:1","verses":[["2 Samuel 13:1","And it came to pass after this, that Absalom the son of David had a fair sister, whose name was Tamar; and Amnon the son of David loved her."]]},{"ref":"2 Samuel 13:12","verses":[["2 Samuel 13:12","And she answered him, Nay, my brother, do not force me; for no such thing ought to be done in Israel: do not thou this folly."]]}]},{"a":"amnon_232","b":"tamar_2822","type":"betrayed","why":"Tamar came to Amnon's house at the king's word to make him food, and Amnon forced her, then hated her and had her put out.","refs":[{"ref":"2 Samuel 13:6–17","verses":[["2 Samuel 13:6","So Amnon lay down, and made himself sick: and when the king was come to see him, Amnon said unto the king, I pray thee, let Tamar my sister come, and make me a couple of cakes in my sight, that I may eat at her hand."],["2 Samuel 13:7","Then David sent home to Tamar, saying, Go now to thy brother Amnon’s house, and dress him meat."],["2 Samuel 13:8","So Tamar went to her brother Amnon’s house; and he was laid down. And she took flour, and kneaded it, and made cakes in his sight, and did bake the cakes."],["2 Samuel 13:9","And she took a pan, and poured them out before him; but he refused to eat. And Amnon said, Have out all men from me. And they went out every man from him."],["2 Samuel 13:10","And Amnon said unto Tamar, Bring the meat into the chamber, that I may eat of thine hand. And Tamar took the cakes which she had made, and brought them into the chamber to Amnon her brother."],["2 Samuel 13:11","And when she had brought them unto him to eat, he took hold of her, and said unto her, Come lie with me, my sister."],["2 Samuel 13:12","And she answered him, Nay, my brother, do not force me; for no such thing ought to be done in Israel: do not thou this folly."],["2 Samuel 13:13","And I, whither shall I cause my shame to go? and as for thee, thou shalt be as one of the fools in Israel. Now therefore, I pray thee, speak unto the king; for he will not withhold me from thee."],["2 Samuel 13:14","Howbeit he would not hearken unto her voice: but, being stronger than she, forced her, and lay with her."],["2 Samuel 13:15","Then Amnon hated her exceedingly; so that the hatred wherewith he hated her was greater than the love wherewith he had loved her. And Amnon said unto her, Arise, be gone."],["2 Samuel 13:16","And she said unto him, There is no cause: this evil in sending me away is greater than the other that thou didst unto me. But he would not hearken unto her."],["2 Samuel 13:17","Then he called his servant that ministered unto him, and said, Put now this woman out from me, and bolt the door after her."]]}]},{"a":"amnon_232","b":"david_994","type":"family","why":"Amnon was David's firstborn son, born in Hebron to Ahinoam.","refs":[{"ref":"2 Samuel 3:2","verses":[["2 Samuel 3:2","And unto David were sons born in Hebron: and his firstborn was Amnon, of Ahinoam the Jezreelitess;"]]}]},{"a":"barak_401","b":"deborah_997","type":"worked_together","why":"Deborah called Barak to lead Israel against Sisera, went up with him to Kedesh, sent him down from Tabor, and sang with him after the victory.","refs":[{"ref":"Judges 4:6–10","verses":[["Judges 4:6","And she sent and called Barak the son of Abinoam out of Kedeshnaphtali, and said unto him, Hath not the LORD God of Israel commanded, saying, Go and draw toward mount Tabor, and take with thee ten thousand men of the children of Naphtali and of the children of Zebulun?"],["Judges 4:7","And I will draw unto thee to the river Kishon Sisera, the captain of Jabin’s army, with his chariots and his multitude; and I will deliver him into thine hand."],["Judges 4:8","And Barak said unto her, If thou wilt go with me, then I will go: but if thou wilt not go with me, then I will not go."],["Judges 4:9","And she said, I will surely go with thee: notwithstanding the journey that thou takest shall not be for thine honour; for the LORD shall sell Sisera into the hand of a woman. And Deborah arose, and went with Barak to Kedesh."],["Judges 4:10","And Barak called Zebulun and Naphtali to Kedesh; and he went up with ten thousand men at his feet: and Deborah went up with him."]]},{"ref":"Judges 4:14","verses":[["Judges 4:14","And Deborah said unto Barak, Up; for this is the day in which the LORD hath delivered Sisera into thine hand: is not the LORD gone out before thee? So Barak went down from mount Tabor, and ten thousand men after him."]]},{"ref":"Judges 5:1","verses":[["Judges 5:1","Then sang Deborah and Barak the son of Abinoam on that day, saying,"]]}]},{"a":"barak_401","b":"sisera_2757","type":"enemies","why":"Barak went down from mount Tabor against Sisera, discomfited his host, and pursued after him.","refs":[{"ref":"Judges 4:14–16","verses":[["Judges 4:14","And Deborah said unto Barak, Up; for this is the day in which the LORD hath delivered Sisera into thine hand: is not the LORD gone out before thee? So Barak went down from mount Tabor, and ten thousand men after him."],["Judges 4:15","And the LORD discomfited Sisera, and all his chariots, and all his host, with the edge of the sword before Barak; so that Sisera lighted down off his chariot, and fled away on his feet."],["Judges 4:16","But Barak pursued after the chariots, and after the host, unto Harosheth of the Gentiles: and all the host of Sisera fell upon the edge of the sword; and there was not a man left."]]},{"ref":"Judges 4:22","verses":[["Judges 4:22","And, behold, as Barak pursued Sisera, Jael came out to meet him, and said unto him, Come, and I will shew thee the man whom thou seekest. And when he came into her tent, behold, Sisera lay dead, and the nail was in his temples."]]}]},{"a":"bathsheba_416","b":"uriah_2898","type":"married","why":"Bathsheba was the wife of Uriah the Hittite, and she mourned for her husband when he died.","refs":[{"ref":"2 Samuel 11:3","verses":[["2 Samuel 11:3","And David sent and enquired after the woman. And one said, Is not this Bathsheba, the daughter of Eliam, the wife of Uriah the Hittite?"]]},{"ref":"2 Samuel 11:26","verses":[["2 Samuel 11:26","And when the wife of Uriah heard that Uriah her husband was dead, she mourned for her husband."]]}]},{"a":"bathsheba_416","b":"david_994","type":"married","why":"After Uriah's death David sent for Bathsheba and she became his wife, and she bore him Solomon.","refs":[{"ref":"2 Samuel 11:27","verses":[["2 Samuel 11:27","And when the mourning was past, David sent and fetched her to his house, and she became his wife, and bare him a son. But the thing that David had done displeased the LORD."]]},{"ref":"2 Samuel 12:24","verses":[["2 Samuel 12:24","And David comforted Bathsheba his wife, and went in unto her, and lay with her: and she bare a son, and he called his name Solomon: and the LORD loved him."]]},{"ref":"1 Kings 1:28–31","verses":[["1 Kings 1:28","Then king David answered and said, Call me Bathsheba. And she came into the king’s presence, and stood before the king."],["1 Kings 1:29","And the king sware, and said, As the LORD liveth, that hath redeemed my soul out of all distress,"],["1 Kings 1:30","Even as I sware unto thee by the LORD God of Israel, saying, Assuredly Solomon thy son shall reign after me, and he shall sit upon my throne in my stead; even so will I certainly do this day."],["1 Kings 1:31","Then Bathsheba bowed with her face to the earth, and did reverence to the king, and said, Let my lord king David live for ever."]]}]},{"a":"benaiah_439","b":"david_994","type":"served","why":"Benaiah was over the Cherethites and the Pelethites, David set him over his guard, and at David's command he brought Solomon to Gihon to be anointed king.","refs":[{"ref":"2 Samuel 8:18","verses":[["2 Samuel 8:18","And Benaiah the son of Jehoiada was over both the Cherethites and the Pelethites; and David’s sons were chief rulers."]]},{"ref":"2 Samuel 23:20–23","verses":[["2 Samuel 23:20","And Benaiah the son of Jehoiada, the son of a valiant man, of Kabzeel, who had done many acts, he slew two lionlike men of Moab: he went down also and slew a lion in the midst of a pit in time of snow:"],["2 Samuel 23:21","And he slew an Egyptian, a goodly man: and the Egyptian had a spear in his hand; but he went down to him with a staff, and plucked the spear out of the Egyptian’s hand, and slew him with his own spear."],["2 Samuel 23:22","These things did Benaiah the son of Jehoiada, and had the name among three mighty men."],["2 Samuel 23:23","He was more honourable than the thirty, but he attained not to the first three. And David set him over his guard."]]},{"ref":"1 Kings 1:32–38","verses":[["1 Kings 1:32","And king David said, Call me Zadok the priest, and Nathan the prophet, and Benaiah the son of Jehoiada. And they came before the king."],["1 Kings 1:33","The king also said unto them, Take with you the servants of your lord, and cause Solomon my son to ride upon mine own mule, and bring him down to Gihon:"],["1 Kings 1:34","And let Zadok the priest and Nathan the prophet anoint him there king over Israel: and blow ye with the trumpet, and say, God save king Solomon."],["1 Kings 1:35","Then ye shall come up after him, that he may come and sit upon my throne; for he shall be king in my stead: and I have appointed him to be ruler over Israel and over Judah."],["1 Kings 1:36","And Benaiah the son of Jehoiada answered the king, and said, Amen: the LORD God of my lord the king say so too."],["1 Kings 1:37","As the LORD hath been with my lord the king, even so be he with Solomon, and make his throne greater than the throne of my lord king David."],["1 Kings 1:38","So Zadok the priest, and Nathan the prophet, and Benaiah the son of Jehoiada, and the Cherethites, and the Pelethites, went down, and caused Solomon to ride upon king David’s mule, and brought him to Gihon."]]}]},{"a":"boaz_519","b":"ruth_2450","type":"married","why":"Boaz redeemed the inheritance and took Ruth the Moabitess to be his wife, and she bore him a son.","refs":[{"ref":"Ruth 4:9–13","verses":[["Ruth 4:9","And Boaz said unto the elders, and unto all the people, Ye are witnesses this day, that I have bought all that was Elimelech’s, and all that was Chilion’s and Mahlon’s, of the hand of Naomi."],["Ruth 4:10","Moreover Ruth the Moabitess, the wife of Mahlon, have I purchased to be my wife, to raise up the name of the dead upon his inheritance, that the name of the dead be not cut off from among his brethren, and from the gate of his place: ye are witnesses this day."],["Ruth 4:11","And all the people that were in the gate, and the elders, said, We are witnesses. The LORD make the woman that is come into thine house like Rachel and like Leah, which two did build the house of Israel: and do thou worthily in Ephratah, and be famous in Bethlehem:"],["Ruth 4:12","And let thy house be like the house of Pharez, whom Tamar bare unto Judah, of the seed which the LORD shall give thee of this young woman."],["Ruth 4:13","So Boaz took Ruth, and she was his wife: and when he went in unto her, the LORD gave her conception, and she bare a son."]]}]},{"a":"boaz_519","b":"naomi_2147","type":"family","why":"Naomi had a kinsman of her husband's, Boaz, of the family of Elimelech, and she called him one of our next kinsmen.","refs":[{"ref":"Ruth 2:1","verses":[["Ruth 2:1","And Naomi had a kinsman of her husband’s, a mighty man of wealth, of the family of Elimelech; and his name was Boaz."]]},{"ref":"Ruth 2:20","verses":[["Ruth 2:20","And Naomi said unto her daughter in law, Blessed be he of the LORD, who hath not left off his kindness to the living and to the dead. And Naomi said unto her, The man is near of kin unto us, one of our next kinsmen."]]}]},{"a":"boaz_519","b":"naomi_2147","type":"helped","why":"Boaz sent six measures of barley to Naomi so Ruth would not come to her empty, and bought all that was Elimelech's from Naomi's hand.","refs":[{"ref":"Ruth 3:15–17","verses":[["Ruth 3:15","Also he said, Bring the vail that thou hast upon thee, and hold it. And when she held it, he measured six measures of barley, and laid it on her: and she went into the city."],["Ruth 3:16","And when she came to her mother in law, she said, Who art thou, my daughter? And she told her all that the man had done to her."],["Ruth 3:17","And she said, These six measures of barley gave he me; for he said to me, Go not empty unto thy mother in law."]]},{"ref":"Ruth 4:3–10","verses":[["Ruth 4:3","And he said unto the kinsman, Naomi, that is come again out of the country of Moab, selleth a parcel of land, which was our brother Elimelech’s:"],["Ruth 4:4","And I thought to advertise thee, saying, Buy it before the inhabitants, and before the elders of my people. If thou wilt redeem it, redeem it: but if thou wilt not redeem it, then tell me, that I may know: for there is none to redeem it beside thee; and I am after thee. And he said, I will redeem it."],["Ruth 4:5","Then said Boaz, What day thou buyest the field of the hand of Naomi, thou must buy it also of Ruth the Moabitess, the wife of the dead, to raise up the name of the dead upon his inheritance."],["Ruth 4:6","And the kinsman said, I cannot redeem it for myself, lest I mar mine own inheritance: redeem thou my right to thyself; for I cannot redeem it."],["Ruth 4:7","Now this was the manner in former time in Israel concerning redeeming and concerning changing, for to confirm all things; a man plucked off his shoe, and gave it to his neighbour: and this was a testimony in Israel."],["Ruth 4:8","Therefore the kinsman said unto Boaz, Buy it for thee. So he drew off his shoe."],["Ruth 4:9","And Boaz said unto the elders, and unto all the people, Ye are witnesses this day, that I have bought all that was Elimelech’s, and all that was Chilion’s and Mahlon’s, of the hand of Naomi."],["Ruth 4:10","Moreover Ruth the Moabitess, the wife of Mahlon, have I purchased to be my wife, to raise up the name of the dead upon his inheritance, that the name of the dead be not cut off from among his brethren, and from the gate of his place: ye are witnesses this day."]]}]},{"a":"caleb_537","b":"moses_2108","type":"served","why":"Moses sent Caleb from the wilderness of Paran to spy out the land, and Caleb stilled the people before Moses; Caleb later recalled that Moses the servant of the LORD sent him and swore him the land.","refs":[{"ref":"Numbers 13:1–6","verses":[["Numbers 13:1","And the LORD spake unto Moses, saying,"],["Numbers 13:2","Send thou men, that they may search the land of Canaan, which I give unto the children of Israel: of every tribe of their fathers shall ye send a man, every one a ruler among them."],["Numbers 13:3","And Moses by the commandment of the LORD sent them from the wilderness of Paran: all those men were heads of the children of Israel."],["Numbers 13:4","And these were their names: of the tribe of Reuben, Shammua the son of Zaccur."],["Numbers 13:5","Of the tribe of Simeon, Shaphat the son of Hori."],["Numbers 13:6","Of the tribe of Judah, Caleb the son of Jephunneh."]]},{"ref":"Numbers 13:30","verses":[["Numbers 13:30","And Caleb stilled the people before Moses, and said, Let us go up at once, and possess it; for we are well able to overcome it."]]},{"ref":"Joshua 14:6–9","verses":[["Joshua 14:6","Then the children of Judah came unto Joshua in Gilgal: and Caleb the son of Jephunneh the Kenezite said unto him, Thou knowest the thing that the LORD said unto Moses the man of God concerning me and thee in Kadeshbarnea."],["Joshua 14:7","Forty years old was I when Moses the servant of the LORD sent me from Kadeshbarnea to espy out the land; and I brought him word again as it was in mine heart."],["Joshua 14:8","Nevertheless my brethren that went up with me made the heart of the people melt: but I wholly followed the LORD my God."],["Joshua 14:9","And Moses sware on that day, saying, Surely the land whereon thy feet have trodden shall be thine inheritance, and thy children’s for ever, because thou hast wholly followed the LORD my God."]]}]},{"a":"david_994","b":"saul_2478","type":"served","why":"David stood before Saul as his armourbearer and played the harp for him, and Saul set him over the men of war.","refs":[{"ref":"1 Samuel 16:21–23","verses":[["1 Samuel 16:21","And David came to Saul, and stood before him: and he loved him greatly; and he became his armourbearer."],["1 Samuel 16:22","And Saul sent to Jesse, saying, Let David, I pray thee, stand before me; for he hath found favour in my sight."],["1 Samuel 16:23","And it came to pass, when the evil spirit from God was upon Saul, that David took an harp, and played with his hand: so Saul was refreshed, and was well, and the evil spirit departed from him."]]},{"ref":"1 Samuel 18:5","verses":[["1 Samuel 18:5","And David went out whithersoever Saul sent him, and behaved himself wisely: and Saul set him over the men of war, and he was accepted in the sight of all the people, and also in the sight of Saul’s servants."]]}]},{"a":"david_994","b":"saul_2478","type":"family","why":"Saul gave David his daughter Michal to wife, making David his son in law.","refs":[{"ref":"1 Samuel 18:26–27","verses":[["1 Samuel 18:26","And when his servants told David these words, it pleased David well to be the king’s son in law: and the days were not expired."],["1 Samuel 18:27","Wherefore David arose and went, he and his men, and slew of the Philistines two hundred men; and David brought their foreskins, and they gave them in full tale to the king, that he might be the king’s son in law. And Saul gave him Michal his daughter to wife."]]}]},{"a":"david_994","b":"saul_2478","type":"enemies","why":"Saul became David's enemy continually, spoke of killing him, and sought him every day.","refs":[{"ref":"1 Samuel 18:29","verses":[["1 Samuel 18:29","And Saul was yet the more afraid of David; and Saul became David’s enemy continually."]]},{"ref":"1 Samuel 19:1","verses":[["1 Samuel 19:1","And Saul spake to Jonathan his son, and to all his servants, that they should kill David."]]},{"ref":"1 Samuel 23:14","verses":[["1 Samuel 23:14","And David abode in the wilderness in strong holds, and remained in a mountain in the wilderness of Ziph. And Saul sought him every day, but God delivered him not into his hand."]]}]},{"a":"david_994","b":"jonathan_1692","type":"loved","why":"Jonathan loved David as his own soul and made a covenant with him, and David said Jonathan's love to him was wonderful.","refs":[{"ref":"1 Samuel 18:1–4","verses":[["1 Samuel 18:1","And it came to pass, when he had made an end of speaking unto Saul, that the soul of Jonathan was knit with the soul of David, and Jonathan loved him as his own soul."],["1 Samuel 18:2","And Saul took him that day, and would let him go no more home to his father’s house."],["1 Samuel 18:3","Then Jonathan and David made a covenant, because he loved him as his own soul."],["1 Samuel 18:4","And Jonathan stripped himself of the robe that was upon him, and gave it to David, and his garments, even to his sword, and to his bow, and to his girdle."]]},{"ref":"1 Samuel 20:17","verses":[["1 Samuel 20:17","And Jonathan caused David to swear again, because he loved him: for he loved him as he loved his own soul."]]},{"ref":"2 Samuel 1:26","verses":[["2 Samuel 1:26","I am distressed for thee, my brother Jonathan: very pleasant hast thou been unto me: thy love to me was wonderful, passing the love of women."]]}]},{"a":"david_994","b":"goliath_1327","type":"enemies","why":"Goliath cursed David by his gods and came against him, and David smote him with a stone and cut off his head.","refs":[{"ref":"1 Samuel 17:41–51","verses":[["1 Samuel 17:41","And the Philistine came on and drew near unto David; and the man that bare the shield went before him."],["1 Samuel 17:42","And when the Philistine looked about, and saw David, he disdained him: for he was but a youth, and ruddy, and of a fair countenance."],["1 Samuel 17:43","And the Philistine said unto David, Am I a dog, that thou comest to me with staves? And the Philistine cursed David by his gods."],["1 Samuel 17:44","And the Philistine said to David, Come to me, and I will give thy flesh unto the fowls of the air, and to the beasts of the field."],["1 Samuel 17:45","Then said David to the Philistine, Thou comest to me with a sword, and with a spear, and with a shield: but I come to thee in the name of the LORD of hosts, the God of the armies of Israel, whom thou hast defied."],["1 Samuel 17:46","This day will the LORD deliver thee into mine hand; and I will smite thee, and take thine head from thee; and I will give the carcases of the host of the Philistines this day unto the fowls of the air, and to the wild beasts of the earth; that all the earth may know that there is a God in Israel."],["1 Samuel 17:47","And all this assembly shall know that the LORD saveth not with sword and spear: for the battle is the LORD’S, and he will give you into our hands."],["1 Samuel 17:48","And it came to pass, when the Philistine arose, and came and drew nigh to meet David, that David hasted, and ran toward the army to meet the Philistine."],["1 Samuel 17:49","And David put his hand in his bag, and took thence a stone, and slang it, and smote the Philistine in his forehead, that the stone sunk into his forehead; and he fell upon his face to the earth."],["1 Samuel 17:50","So David prevailed over the Philistine with a sling and with a stone, and smote the Philistine, and slew him; but there was no sword in the hand of David."],["1 Samuel 17:51","Therefore David ran, and stood upon the Philistine, and took his sword, and drew it out of the sheath thereof, and slew him, and cut off his head therewith. And when the Philistines saw their champion was dead, they fled."]]}]},{"a":"david_994","b":"samuel_2469","type":"anointed","why":"Samuel took the horn of oil and anointed David in the midst of his brethren, and the Spirit of the LORD came upon David.","refs":[{"ref":"1 Samuel 16:1","verses":[["1 Samuel 16:1","And the LORD said unto Samuel, How long wilt thou mourn for Saul, seeing I have rejected him from reigning over Israel? fill thine horn with oil, and go, I will send thee to Jesse the Bethlehemite: for I have provided me a king among his sons."]]},{"ref":"1 Samuel 16:12–13","verses":[["1 Samuel 16:12","And he sent, and brought him in. Now he was ruddy, and withal of a beautiful countenance, and goodly to look to. And the LORD said, Arise, anoint him: for this is he."],["1 Samuel 16:13","Then Samuel took the horn of oil, and anointed him in the midst of his brethren: and the Spirit of the LORD came upon David from that day forward. So Samuel rose up, and went to Ramah."]]}]},{"a":"david_994","b":"nathan_2153","type":"counseled","why":"Nathan answered David about building the LORD's house and brought him God's word, rebuked him over Bathsheba, and came to him about Adonijah so that he made Solomon king.","refs":[{"ref":"2 Samuel 7:1–17","verses":[["2 Samuel 7:1","And it came to pass, when the king sat in his house, and the LORD had given him rest round about from all his enemies;"],["2 Samuel 7:2","That the king said unto Nathan the prophet, See now, I dwell in an house of cedar, but the ark of God dwelleth within curtains."],["2 Samuel 7:3","And Nathan said to the king, Go, do all that is in thine heart; for the LORD is with thee."],["2 Samuel 7:4","And it came to pass that night, that the word of the LORD came unto Nathan, saying,"],["2 Samuel 7:5","Go and tell my servant David, Thus saith the LORD, Shalt thou build me an house for me to dwell in?"],["2 Samuel 7:6","Whereas I have not dwelt in any house since the time that I brought up the children of Israel out of Egypt, even to this day, but have walked in a tent and in a tabernacle."],["2 Samuel 7:7","In all the places wherein I have walked with all the children of Israel spake I a word with any of the tribes of Israel, whom I commanded to feed my people Israel, saying, Why build ye not me an house of cedar?"],["2 Samuel 7:8","Now therefore so shalt thou say unto my servant David, Thus saith the LORD of hosts, I took thee from the sheepcote, from following the sheep, to be ruler over my people, over Israel:"],["2 Samuel 7:9","And I was with thee whithersoever thou wentest, and have cut off all thine enemies out of thy sight, and have made thee a great name, like unto the name of the great men that are in the earth."],["2 Samuel 7:10","Moreover I will appoint a place for my people Israel, and will plant them, that they may dwell in a place of their own, and move no more; neither shall the children of wickedness afflict them any more, as beforetime,"],["2 Samuel 7:11","And as since the time that I commanded judges to be over my people Israel, and have caused thee to rest from all thine enemies. Also the LORD telleth thee that he will make thee an house."],["2 Samuel 7:12","And when thy days be fulfilled, and thou shalt sleep with thy fathers, I will set up thy seed after thee, which shall proceed out of thy bowels, and I will establish his kingdom."],["2 Samuel 7:13","He shall build an house for my name, and I will stablish the throne of his kingdom for ever."],["2 Samuel 7:14","I will be his father, and he shall be my son. If he commit iniquity, I will chasten him with the rod of men, and with the stripes of the children of men:"],["2 Samuel 7:15","But my mercy shall not depart away from him, as I took it from Saul, whom I put away before thee."],["2 Samuel 7:16","And thine house and thy kingdom shall be established for ever before thee: thy throne shall be established for ever."],["2 Samuel 7:17","According to all these words, and according to all this vision, so did Nathan speak unto David."]]},{"ref":"2 Samuel 12:1–14","verses":[["2 Samuel 12:1","And the LORD sent Nathan unto David. And he came unto him, and said unto him, There were two men in one city; the one rich, and the other poor."],["2 Samuel 12:2","The rich man had exceeding many flocks and herds:"],["2 Samuel 12:3","But the poor man had nothing, save one little ewe lamb, which he had bought and nourished up: and it grew up together with him, and with his children; it did eat of his own meat, and drank of his own cup, and lay in his bosom, and was unto him as a daughter."],["2 Samuel 12:4","And there came a traveller unto the rich man, and he spared to take of his own flock and of his own herd, to dress for the wayfaring man that was come unto him; but took the poor man’s lamb, and dressed it for the man that was come to him."],["2 Samuel 12:5","And David’s anger was greatly kindled against the man; and he said to Nathan, As the LORD liveth, the man that hath done this thing shall surely die:"],["2 Samuel 12:6","And he shall restore the lamb fourfold, because he did this thing, and because he had no pity."],["2 Samuel 12:7","And Nathan said to David, Thou art the man. Thus saith the LORD God of Israel, I anointed thee king over Israel, and I delivered thee out of the hand of Saul;"],["2 Samuel 12:8","And I gave thee thy master’s house, and thy master’s wives into thy bosom, and gave thee the house of Israel and of Judah; and if that had been too little, I would moreover have given unto thee such and such things."],["2 Samuel 12:9","Wherefore hast thou despised the commandment of the LORD, to do evil in his sight? thou hast killed Uriah the Hittite with the sword, and hast taken his wife to be thy wife, and hast slain him with the sword of the children of Ammon."],["2 Samuel 12:10","Now therefore the sword shall never depart from thine house; because thou hast despised me, and hast taken the wife of Uriah the Hittite to be thy wife."],["2 Samuel 12:11","Thus saith the LORD, Behold, I will raise up evil against thee out of thine own house, and I will take thy wives before thine eyes, and give them unto thy neighbour, and he shall lie with thy wives in the sight of this sun."],["2 Samuel 12:12","For thou didst it secretly: but I will do this thing before all Israel, and before the sun."],["2 Samuel 12:13","And David said unto Nathan, I have sinned against the LORD. And Nathan said unto David, The LORD also hath put away thy sin; thou shalt not die."],["2 Samuel 12:14","Howbeit, because by this deed thou hast given great occasion to the enemies of the LORD to blaspheme, the child also that is born unto thee shall surely die."]]},{"ref":"1 Kings 1:22–30","verses":[["1 Kings 1:22","And, lo, while she yet talked with the king, Nathan the prophet also came in."],["1 Kings 1:23","And they told the king, saying, Behold Nathan the prophet. And when he was come in before the king, he bowed himself before the king with his face to the ground."],["1 Kings 1:24","And Nathan said, My lord, O king, hast thou said, Adonijah shall reign after me, and he shall sit upon my throne?"],["1 Kings 1:25","For he is gone down this day, and hath slain oxen and fat cattle and sheep in abundance, and hath called all the king’s sons, and the captains of the host, and Abiathar the priest; and, behold, they eat and drink before him, and say, God save king Adonijah."],["1 Kings 1:26","But me, even me thy servant, and Zadok the priest, and Benaiah the son of Jehoiada, and thy servant Solomon, hath he not called."],["1 Kings 1:27","Is this thing done by my lord the king, and thou hast not shewed it unto thy servant, who should sit on the throne of my lord the king after him?"],["1 Kings 1:28","Then king David answered and said, Call me Bathsheba. And she came into the king’s presence, and stood before the king."],["1 Kings 1:29","And the king sware, and said, As the LORD liveth, that hath redeemed my soul out of all distress,"],["1 Kings 1:30","Even as I sware unto thee by the LORD God of Israel, saying, Assuredly Solomon thy son shall reign after me, and he shall sit upon my throne in my stead; even so will I certainly do this day."]]}]},{"a":"david_994","b":"joab_1617","type":"served","why":"Joab went up first against Jebus and was made chief and captain, and he was over the host of David.","refs":[{"ref":"1 Chronicles 11:6","verses":[["1 Chronicles 11:6","And David said, Whosoever smiteth the Jebusites first shall be chief and captain. So Joab the son of Zeruiah went first up, and was chief."]]},{"ref":"2 Samuel 8:16","verses":[["2 Samuel 8:16","And Joab the son of Zeruiah was over the host; and Jehoshaphat the son of Ahilud was recorder;"]]},{"ref":"2 Samuel 18:1–2","verses":[["2 Samuel 18:1","And David numbered the people that were with him, and set captains of thousands and captains of hundreds over them."],["2 Samuel 18:2","And David sent forth a third part of the people under the hand of Joab, and a third part under the hand of Abishai the son of Zeruiah, Joab’s brother, and a third part under the hand of Ittai the Gittite. And the king said unto the people, I will surely go forth with you myself also."]]}]},{"a":"david_994","b":"joab_1617","type":"family","why":"Joab was a son of Zeruiah, a sister of David.","refs":[{"ref":"1 Chronicles 2:13–16","verses":[["1 Chronicles 2:13","And Jesse begat his firstborn Eliab, and Abinadab the second, and Shimma the third,"],["1 Chronicles 2:14","Nethaneel the fourth, Raddai the fifth,"],["1 Chronicles 2:15","Ozem the sixth, David the seventh:"],["1 Chronicles 2:16","Whose sisters were Zeruiah, and Abigail. And the sons of Zeruiah; Abishai, and Joab, and Asahel, three."]]}]},{"a":"david_994","b":"michal_2073","type":"married","why":"Saul gave Michal his daughter to David to wife, and David later demanded her back as my wife Michal.","refs":[{"ref":"1 Samuel 18:20–27","verses":[["1 Samuel 18:20","And Michal Saul’s daughter loved David: and they told Saul, and the thing pleased him."],["1 Samuel 18:21","And Saul said, I will give him her, that she may be a snare to him, and that the hand of the Philistines may be against him. Wherefore Saul said to David, Thou shalt this day be my son in law in the one of the twain."],["1 Samuel 18:22","And Saul commanded his servants, saying, Commune with David secretly, and say, Behold, the king hath delight in thee, and all his servants love thee: now therefore be the king’s son in law."],["1 Samuel 18:23","And Saul’s servants spake those words in the ears of David. And David said, Seemeth it to you a light thing to be a king’s son in law, seeing that I am a poor man, and lightly esteemed?"],["1 Samuel 18:24","And the servants of Saul told him, saying, On this manner spake David."],["1 Samuel 18:25","And Saul said, Thus shall ye say to David, The king desireth not any dowry, but an hundred foreskins of the Philistines, to be avenged of the king’s enemies. But Saul thought to make David fall by the hand of the Philistines."],["1 Samuel 18:26","And when his servants told David these words, it pleased David well to be the king’s son in law: and the days were not expired."],["1 Samuel 18:27","Wherefore David arose and went, he and his men, and slew of the Philistines two hundred men; and David brought their foreskins, and they gave them in full tale to the king, that he might be the king’s son in law. And Saul gave him Michal his daughter to wife."]]},{"ref":"2 Samuel 3:13–16","verses":[["2 Samuel 3:13","And he said, Well; I will make a league with thee: but one thing I require of thee, that is, Thou shalt not see my face, except thou first bring Michal Saul’s daughter, when thou comest to see my face."],["2 Samuel 3:14","And David sent messengers to Ishbosheth Saul’s son, saying, Deliver me my wife Michal, which I espoused to me for an hundred foreskins of the Philistines."],["2 Samuel 3:15","And Ishbosheth sent, and took her from her husband, even from Phaltiel the son of Laish."],["2 Samuel 3:16","And her husband went with her along weeping behind her to Bahurim. Then said Abner unto him, Go, return. And he returned."]]}]},{"a":"david_994","b":"uriah_2898","type":"served","why":"Uriah the Hittite was among David's mighty men, and he would not go down to his house while the ark and Joab and the servants of his lord camped in the field.","refs":[{"ref":"2 Samuel 23:39","verses":[["2 Samuel 23:39","Uriah the Hittite: thirty and seven in all."]]},{"ref":"2 Samuel 11:6–11","verses":[["2 Samuel 11:6","And David sent to Joab, saying, Send me Uriah the Hittite. And Joab sent Uriah to David."],["2 Samuel 11:7","And when Uriah was come unto him, David demanded of him how Joab did, and how the people did, and how the war prospered."],["2 Samuel 11:8","And David said to Uriah, Go down to thy house, and wash thy feet. And Uriah departed out of the king’s house, and there followed him a mess of meat from the king."],["2 Samuel 11:9","But Uriah slept at the door of the king’s house with all the servants of his lord, and went not down to his house."],["2 Samuel 11:10","And when they had told David, saying, Uriah went not down unto his house, David said unto Uriah, Camest thou not from thy journey? why then didst thou not go down unto thine house?"],["2 Samuel 11:11","And Uriah said unto David, The ark, and Israel, and Judah, abide in tents; and my lord Joab, and the servants of my lord, are encamped in the open fields; shall I then go into mine house, to eat and to drink, and to lie with my wife? as thou livest, and as thy soul liveth, I will not do this thing."]]}]},{"a":"david_994","b":"uriah_2898","type":"betrayed","why":"David wrote to Joab by Uriah's own hand to set him in the forefront of the hottest battle, and Nathan said, thou hast killed Uriah the Hittite with the sword.","refs":[{"ref":"2 Samuel 11:14–17","verses":[["2 Samuel 11:14","And it came to pass in the morning, that David wrote a letter to Joab, and sent it by the hand of Uriah."],["2 Samuel 11:15","And he wrote in the letter, saying, Set ye Uriah in the forefront of the hottest battle, and retire ye from him, that he may be smitten, and die."],["2 Samuel 11:16","And it came to pass, when Joab observed the city, that he assigned Uriah unto a place where he knew that valiant men were."],["2 Samuel 11:17","And the men of the city went out, and fought with Joab: and there fell some of the people of the servants of David; and Uriah the Hittite died also."]]},{"ref":"2 Samuel 12:9","verses":[["2 Samuel 12:9","Wherefore hast thou despised the commandment of the LORD, to do evil in his sight? thou hast killed Uriah the Hittite with the sword, and hast taken his wife to be thy wife, and hast slain him with the sword of the children of Ammon."]]}]},{"a":"david_994","b":"jesse_903","type":"family","why":"David was the youngest son of Jesse the Bethlehemite, who kept his father's sheep.","refs":[{"ref":"1 Samuel 16:10–13","verses":[["1 Samuel 16:10","Again, Jesse made seven of his sons to pass before Samuel. And Samuel said unto Jesse, The LORD hath not chosen these."],["1 Samuel 16:11","And Samuel said unto Jesse, Are here all thy children? And he said, There remaineth yet the youngest, and, behold, he keepeth the sheep. And Samuel said unto Jesse, Send and fetch him: for we will not sit down till he come hither."],["1 Samuel 16:12","And he sent, and brought him in. Now he was ruddy, and withal of a beautiful countenance, and goodly to look to. And the LORD said, Arise, anoint him: for this is he."],["1 Samuel 16:13","Then Samuel took the horn of oil, and anointed him in the midst of his brethren: and the Spirit of the LORD came upon David from that day forward. So Samuel rose up, and went to Ramah."]]},{"ref":"1 Samuel 17:12–15","verses":[["1 Samuel 17:12","Now David was the son of that Ephrathite of Bethlehemjudah, whose name was Jesse; and he had eight sons: and the man went among men for an old man in the days of Saul."],["1 Samuel 17:13","And the three eldest sons of Jesse went and followed Saul to the battle: and the names of his three sons that went to the battle were Eliab the firstborn, and next unto him Abinadab, and the third Shammah."],["1 Samuel 17:14","And David was the youngest: and the three eldest followed Saul."],["1 Samuel 17:15","But David went and returned from Saul to feed his father’s sheep at Bethlehem."]]},{"ref":"Ruth 4:22","verses":[["Ruth 4:22","And Obed begat Jesse, and Jesse begat David."]]}]},{"a":"david_994","b":"mephibosheth_1999","type":"helped","why":"David showed kindness to Mephibosheth for Jonathan's sake, restored him all the land of Saul, and had him eat continually at the king's table, and later spared him.","refs":[{"ref":"2 Samuel 9:1–13","verses":[["2 Samuel 9:1","And David said, Is there yet any that is left of the house of Saul, that I may shew him kindness for Jonathan’s sake?"],["2 Samuel 9:2","And there was of the house of Saul a servant whose name was Ziba. And when they had called him unto David, the king said unto him, Art thou Ziba? And he said, Thy servant is he."],["2 Samuel 9:3","And the king said, Is there not yet any of the house of Saul, that I may shew the kindness of God unto him? And Ziba said unto the king, Jonathan hath yet a son, which is lame on his feet."],["2 Samuel 9:4","And the king said unto him, Where is he? And Ziba said unto the king, Behold, he is in the house of Machir, the son of Ammiel, in Lodebar."],["2 Samuel 9:5","Then king David sent, and fetched him out of the house of Machir, the son of Ammiel, from Lodebar."],["2 Samuel 9:6","Now when Mephibosheth, the son of Jonathan, the son of Saul, was come unto David, he fell on his face, and did reverence. And David said, Mephibosheth. And he answered, Behold thy servant!"],["2 Samuel 9:7","And David said unto him, Fear not: for I will surely shew thee kindness for Jonathan thy father’s sake, and will restore thee all the land of Saul thy father; and thou shalt eat bread at my table continually."],["2 Samuel 9:8","And he bowed himself, and said, What is thy servant, that thou shouldest look upon such a dead dog as I am?"],["2 Samuel 9:9","Then the king called to Ziba, Saul’s servant, and said unto him, I have given unto thy master’s son all that pertained to Saul and to all his house."],["2 Samuel 9:10","Thou therefore, and thy sons, and thy servants, shall till the land for him, and thou shalt bring in the fruits, that thy master’s son may have food to eat: but Mephibosheth thy master’s son shall eat bread alway at my table. Now Ziba had fifteen sons and twenty servants."],["2 Samuel 9:11","Then said Ziba unto the king, According to all that my lord the king hath commanded his servant, so shall thy servant do. As for Mephibosheth, said the king, he shall eat at my table, as one of the king’s sons."],["2 Samuel 9:12","And Mephibosheth had a young son, whose name was Micha. And all that dwelt in the house of Ziba were servants unto Mephibosheth."],["2 Samuel 9:13","So Mephibosheth dwelt in Jerusalem: for he did eat continually at the king’s table; and was lame on both his feet."]]},{"ref":"2 Samuel 21:7","verses":[["2 Samuel 21:7","But the king spared Mephibosheth, the son of Jonathan the son of Saul, because of the LORD’S oath that was between them, between David and Jonathan the son of Saul."]]}]},{"a":"david_994","b":"hushai_1577","type":"served","why":"Hushai was the king's companion, and at David's word he returned to Absalom as David's servant to defeat Ahithophel's counsel and sent David word to flee.","refs":[{"ref":"1 Chronicles 27:33","verses":[["1 Chronicles 27:33","And Ahithophel was the king’s counsellor: and Hushai the Archite was the king’s companion:"]]},{"ref":"2 Samuel 15:32–37","verses":[["2 Samuel 15:32","And it came to pass, that when David was come to the top of the mount, where he worshipped God, behold, Hushai the Archite came to meet him with his coat rent, and earth upon his head:"],["2 Samuel 15:33","Unto whom David said, If thou passest on with me, then thou shalt be a burden unto me:"],["2 Samuel 15:34","But if thou return to the city, and say unto Absalom, I will be thy servant, O king; as I have been thy father’s servant hitherto, so will I now also be thy servant: then mayest thou for me defeat the counsel of Ahithophel."],["2 Samuel 15:35","And hast thou not there with thee Zadok and Abiathar the priests? therefore it shall be, that what thing soever thou shalt hear out of the king’s house, thou shalt tell it to Zadok and Abiathar the priests."],["2 Samuel 15:36","Behold, they have there with them their two sons, Ahimaaz Zadok’s son, and Jonathan Abiathar’s son; and by them ye shall send unto me every thing that ye can hear."],["2 Samuel 15:37","So Hushai David’s friend came into the city, and Absalom came into Jerusalem."]]},{"ref":"2 Samuel 17:15–16","verses":[["2 Samuel 17:15","Then said Hushai unto Zadok and to Abiathar the priests, Thus and thus did Ahithophel counsel Absalom and the elders of Israel; and thus and thus have I counselled."],["2 Samuel 17:16","Now therefore send quickly, and tell David, saying, Lodge not this night in the plains of the wilderness, but speedily pass over; lest the king be swallowed up, and all the people that are with him."]]}]},{"a":"david_994","b":"shimei_2684","type":"enemies","why":"Shimei came out cursing David and cast stones at him, calling him a bloody man, and David later charged Solomon to bring his hoar head down to the grave with blood.","refs":[{"ref":"2 Samuel 16:5–13","verses":[["2 Samuel 16:5","And when king David came to Bahurim, behold, thence came out a man of the family of the house of Saul, whose name was Shimei, the son of Gera: he came forth, and cursed still as he came."],["2 Samuel 16:6","And he cast stones at David, and at all the servants of king David: and all the people and all the mighty men were on his right hand and on his left."],["2 Samuel 16:7","And thus said Shimei when he cursed, Come out, come out, thou bloody man, and thou man of Belial:"],["2 Samuel 16:8","The LORD hath returned upon thee all the blood of the house of Saul, in whose stead thou hast reigned; and the LORD hath delivered the kingdom into the hand of Absalom thy son: and, behold, thou art taken in thy mischief, because thou art a bloody man."],["2 Samuel 16:9","Then said Abishai the son of Zeruiah unto the king, Why should this dead dog curse my lord the king? let me go over, I pray thee, and take off his head."],["2 Samuel 16:10","And the king said, What have I to do with you, ye sons of Zeruiah? so let him curse, because the LORD hath said unto him, Curse David. Who shall then say, Wherefore hast thou done so?"],["2 Samuel 16:11","And David said to Abishai, and to all his servants, Behold, my son, which came forth of my bowels, seeketh my life: how much more now may this Benjamite do it? let him alone, and let him curse; for the LORD hath bidden him."],["2 Samuel 16:12","It may be that the LORD will look on mine affliction, and that the LORD will requite me good for his cursing this day."],["2 Samuel 16:13","And as David and his men went by the way, Shimei went along on the hill’s side over against him, and cursed as he went, and threw stones at him, and cast dust."]]},{"ref":"2 Samuel 19:16–23","verses":[["2 Samuel 19:16","And Shimei the son of Gera, a Benjamite, which was of Bahurim, hasted and came down with the men of Judah to meet king David."],["2 Samuel 19:17","And there were a thousand men of Benjamin with him, and Ziba the servant of the house of Saul, and his fifteen sons and his twenty servants with him; and they went over Jordan before the king."],["2 Samuel 19:18","And there went over a ferry boat to carry over the king’s household, and to do what he thought good. And Shimei the son of Gera fell down before the king, as he was come over Jordan;"],["2 Samuel 19:19","And said unto the king, Let not my lord impute iniquity unto me, neither do thou remember that which thy servant did perversely the day that my lord the king went out of Jerusalem, that the king should take it to his heart."],["2 Samuel 19:20","For thy servant doth know that I have sinned: therefore, behold, I am come the first this day of all the house of Joseph to go down to meet my lord the king."],["2 Samuel 19:21","But Abishai the son of Zeruiah answered and said, Shall not Shimei be put to death for this, because he cursed the LORD’S anointed?"],["2 Samuel 19:22","And David said, What have I to do with you, ye sons of Zeruiah, that ye should this day be adversaries unto me? shall there any man be put to death this day in Israel? for do not I know that I am this day king over Israel?"],["2 Samuel 19:23","Therefore the king said unto Shimei, Thou shalt not die. And the king sware unto him."]]},{"ref":"1 Kings 2:8–9","verses":[["1 Kings 2:8","And, behold, thou hast with thee Shimei the son of Gera, a Benjamite of Bahurim, which cursed me with a grievous curse in the day when I went to Mahanaim: but he came down to meet me at Jordan, and I sware to him by the LORD, saying, I will not put thee to death with the sword."],["1 Kings 2:9","Now therefore hold him not guiltless: for thou art a wise man, and knowest what thou oughtest to do unto him; but his hoar head bring thou down to the grave with blood."]]}]},{"a":"david_994","b":"hiram_1532","type":"helped","why":"Hiram king of Tyre sent messengers to David with cedar trees, carpenters and masons, and they built David a house.","refs":[{"ref":"2 Samuel 5:11","verses":[["2 Samuel 5:11","And Hiram king of Tyre sent messengers to David, and cedar trees, and carpenters, and masons: and they built David an house."]]},{"ref":"1 Chronicles 14:1","verses":[["1 Chronicles 14:1","Now Hiram king of Tyre sent messengers to David, and timber of cedars, with masons and carpenters, to build him an house."]]}]},{"a":"david_994","b":"hiram_1532","type":"loved","why":"Scripture says Hiram king of Tyre was ever a lover of David.","refs":[{"ref":"1 Kings 5:1","verses":[["1 Kings 5:1","And Hiram king of Tyre sent his servants unto Solomon; for he had heard that they had anointed him king in the room of his father: for Hiram was ever a lover of David."]]}]},{"a":"david_994","b":"zadok_2973","type":"served","why":"Zadok was priest under David, carried the ark back to Jerusalem at the king's word during Absalom's revolt, and at David's command anointed Solomon.","refs":[{"ref":"2 Samuel 8:17","verses":[["2 Samuel 8:17","And Zadok the son of Ahitub, and Ahimelech the son of Abiathar, were the priests; and Seraiah was the scribe;"]]},{"ref":"2 Samuel 15:24–29","verses":[["2 Samuel 15:24","And lo Zadok also, and all the Levites were with him, bearing the ark of the covenant of God: and they set down the ark of God; and Abiathar went up, until all the people had done passing out of the city."],["2 Samuel 15:25","And the king said unto Zadok, Carry back the ark of God into the city: if I shall find favour in the eyes of the LORD, he will bring me again, and shew me both it, and his habitation:"],["2 Samuel 15:26","But if he thus say, I have no delight in thee; behold, here am I, let him do to me as seemeth good unto him."],["2 Samuel 15:27","The king said also unto Zadok the priest, Art not thou a seer? return into the city in peace, and your two sons with you, Ahimaaz thy son, and Jonathan the son of Abiathar."],["2 Samuel 15:28","See, I will tarry in the plain of the wilderness, until there come word from you to certify me."],["2 Samuel 15:29","Zadok therefore and Abiathar carried the ark of God again to Jerusalem: and they tarried there."]]},{"ref":"1 Kings 1:32–39","verses":[["1 Kings 1:32","And king David said, Call me Zadok the priest, and Nathan the prophet, and Benaiah the son of Jehoiada. And they came before the king."],["1 Kings 1:33","The king also said unto them, Take with you the servants of your lord, and cause Solomon my son to ride upon mine own mule, and bring him down to Gihon:"],["1 Kings 1:34","And let Zadok the priest and Nathan the prophet anoint him there king over Israel: and blow ye with the trumpet, and say, God save king Solomon."],["1 Kings 1:35","Then ye shall come up after him, that he may come and sit upon my throne; for he shall be king in my stead: and I have appointed him to be ruler over Israel and over Judah."],["1 Kings 1:36","And Benaiah the son of Jehoiada answered the king, and said, Amen: the LORD God of my lord the king say so too."],["1 Kings 1:37","As the LORD hath been with my lord the king, even so be he with Solomon, and make his throne greater than the throne of my lord king David."],["1 Kings 1:38","So Zadok the priest, and Nathan the prophet, and Benaiah the son of Jehoiada, and the Cherethites, and the Pelethites, went down, and caused Solomon to ride upon king David’s mule, and brought him to Gihon."],["1 Kings 1:39","And Zadok the priest took an horn of oil out of the tabernacle, and anointed Solomon. And they blew the trumpet; and all the people said, God save king Solomon."]]}]},{"a":"david_994","b":"nabal_2126","type":"enemies","why":"Nabal railed on David's messengers and David swore to leave none of his males alive, and when the LORD smote Nabal, David blessed the LORD who had pleaded his cause.","refs":[{"ref":"1 Samuel 25:10–13","verses":[["1 Samuel 25:10","And Nabal answered David’s servants, and said, Who is David? and who is the son of Jesse? there be many servants now a days that break away every man from his master."],["1 Samuel 25:11","Shall I then take my bread, and my water, and my flesh that I have killed for my shearers, and give it unto men, whom I know not whence they be?"],["1 Samuel 25:12","So David’s young men turned their way, and went again, and came and told him all those sayings."],["1 Samuel 25:13","And David said unto his men, Gird ye on every man his sword. And they girded on every man his sword; and David also girded on his sword: and there went up after David about four hundred men; and two hundred abode by the stuff."]]},{"ref":"1 Samuel 25:21–22","verses":[["1 Samuel 25:21","Now David had said, Surely in vain have I kept all that this fellow hath in the wilderness, so that nothing was missed of all that pertained unto him: and he hath requited me evil for good."],["1 Samuel 25:22","So and more also do God unto the enemies of David, if I leave of all that pertain to him by the morning light any that pisseth against the wall."]]},{"ref":"1 Samuel 25:39","verses":[["1 Samuel 25:39","And when David heard that Nabal was dead, he said, Blessed be the LORD, that hath pleaded the cause of my reproach from the hand of Nabal, and hath kept his servant from evil: for the LORD hath returned the wickedness of Nabal upon his own head. And David sent and communed with Abigail, to take her to him to wife."]]}]},{"a":"david_994","b":"sheba_2570","type":"enemies","why":"Sheba led the men of Israel away from David, and David sent his servants to pursue him lest he do more harm than Absalom.","refs":[{"ref":"2 Samuel 20:1–2","verses":[["2 Samuel 20:1","And there happened to be there a man of Belial, whose name was Sheba, the son of Bichri, a Benjamite: and he blew a trumpet, and said, We have no part in David, neither have we inheritance in the son of Jesse: every man to his tents, O Israel."],["2 Samuel 20:2","So every man of Israel went up from after David, and followed Sheba the son of Bichri: but the men of Judah clave unto their king, from Jordan even to Jerusalem."]]},{"ref":"2 Samuel 20:6","verses":[["2 Samuel 20:6","And David said to Abishai, Now shall Sheba the son of Bichri do us more harm than did Absalom: take thou thy lord’s servants, and pursue after him, lest he get him fenced cities, and escape us."]]},{"ref":"2 Samuel 20:21–22","verses":[["2 Samuel 20:21","The matter is not so: but a man of mount Ephraim, Sheba the son of Bichri by name, hath lifted up his hand against the king, even against David: deliver him only, and I will depart from the city. And the woman said unto Joab, Behold, his head shall be thrown to thee over the wall."],["2 Samuel 20:22","Then the woman went unto all the people in her wisdom. And they cut off the head of Sheba the son of Bichri, and cast it out to Joab. And he blew a trumpet, and they retired from the city, every man to his tent. And Joab returned to Jerusalem unto the king."]]}]},{"a":"deborah_997","b":"sisera_2757","type":"enemies","why":"Deborah sent Barak against Sisera with the LORD's word that he would be delivered into his hand, saying the LORD would sell Sisera into the hand of a woman.","refs":[{"ref":"Judges 4:4–9","verses":[["Judges 4:4","And Deborah, a prophetess, the wife of Lapidoth, she judged Israel at that time."],["Judges 4:5","And she dwelt under the palm tree of Deborah between Ramah and Bethel in mount Ephraim: and the children of Israel came up to her for judgment."],["Judges 4:6","And she sent and called Barak the son of Abinoam out of Kedeshnaphtali, and said unto him, Hath not the LORD God of Israel commanded, saying, Go and draw toward mount Tabor, and take with thee ten thousand men of the children of Naphtali and of the children of Zebulun?"],["Judges 4:7","And I will draw unto thee to the river Kishon Sisera, the captain of Jabin’s army, with his chariots and his multitude; and I will deliver him into thine hand."],["Judges 4:8","And Barak said unto her, If thou wilt go with me, then I will go: but if thou wilt not go with me, then I will not go."],["Judges 4:9","And she said, I will surely go with thee: notwithstanding the journey that thou takest shall not be for thine honour; for the LORD shall sell Sisera into the hand of a woman. And Deborah arose, and went with Barak to Kedesh."]]},{"ref":"Judges 4:14","verses":[["Judges 4:14","And Deborah said unto Barak, Up; for this is the day in which the LORD hath delivered Sisera into thine hand: is not the LORD gone out before thee? So Barak went down from mount Tabor, and ten thousand men after him."]]}]},{"a":"delilah_1005","b":"samson_2468","type":"loved","why":"Samson loved a woman in the valley of Sorek whose name was Delilah.","refs":[{"ref":"Judges 16:4","verses":[["Judges 16:4","And it came to pass afterward, that he loved a woman in the valley of Sorek, whose name was Delilah."]]}]},{"a":"delilah_1005","b":"samson_2468","type":"betrayed","why":"Delilah took the Philistines' silver, pressed Samson until he told her his heart, and had his head shaved so the Philistines took him.","refs":[{"ref":"Judges 16:5","verses":[["Judges 16:5","And the lords of the Philistines came up unto her, and said unto her, Entice him, and see wherein his great strength lieth, and by what means we may prevail against him, that we may bind him to afflict him: and we will give thee every one of us eleven hundred pieces of silver."]]},{"ref":"Judges 16:15–21","verses":[["Judges 16:15","And she said unto him, How canst thou say, I love thee, when thine heart is not with me? thou hast mocked me these three times, and hast not told me wherein thy great strength lieth."],["Judges 16:16","And it came to pass, when she pressed him daily with her words, and urged him, so that his soul was vexed unto death;"],["Judges 16:17","That he told her all his heart, and said unto her, There hath not come a razor upon mine head; for I have been a Nazarite unto God from my mother’s womb: if I be shaven, then my strength will go from me, and I shall become weak, and be like any other man."],["Judges 16:18","And when Delilah saw that he had told her all his heart, she sent and called for the lords of the Philistines, saying, Come up this once, for he hath shewed me all his heart. Then the lords of the Philistines came up unto her, and brought money in their hand."],["Judges 16:19","And she made him sleep upon her knees; and she called for a man, and she caused him to shave off the seven locks of his head; and she began to afflict him, and his strength went from him."],["Judges 16:20","And she said, The Philistines be upon thee, Samson. And he awoke out of his sleep, and said, I will go out as at other times before, and shake myself. And he wist not that the LORD was departed from him."],["Judges 16:21","But the Philistines took him, and put out his eyes, and brought him down to Gaza, and bound him with fetters of brass; and he did grind in the prison house."]]}]},{"a":"eleazar_1062","b":"joshua_172
