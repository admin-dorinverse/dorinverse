<style>
/* Layout: an app shell. The web fills the screen under one bar (search + link filter); a person or a link opens as its own full-screen page that slides over it. */
/* One warm light look on every device (owner's choice): the prototype's Keep it fresh card cream (#FBF8ED), white cards with a brown edge. */
:root {
  color-scheme: light;
  --bg: #FBF8ED; --dot: #ece3cf; --surface: #FBF8ED; --ink: #2b2118; --muted: #86634A; --line: #e6dac2; --accent: #5A3A22;
  --sq: #FBF8ED; --sq-top: #FFFDF6; --sq-bot: #F1E2C6; --sq-shadow: rgba(60,35,10,.38); --sq-ink: #4A3322; --sq-edge: #8a5a2b;
  --t-family: #c2410c; --t-married: #d6336c; --t-loved: #a21caf; --t-helped: #1f9d55; --t-worked_together: #0d9488; --t-counseled: #2563eb;
  --t-apostle: #4338ca; --t-followed: #0284c7; --t-served: #7c3aed; --t-anointed: #b7791f; --t-blessed: #ca8a04; --t-rebuked: #9a3412;
  --t-enemies: #dc2626; --t-betrayed: #881337; --t-rivals: #ea580c; --t-healed: #4d7c0f; --t-prophecy: #0e8f9c; --t-crossed_paths: #64748b;
  --t-friends: #16a34a; --t-covenant: #0f766e; --t-judged: #475569; --t-put_to_death: #7f1d1d; --t-saved: #0369a1; --t-deceived: #a16207; --t-prophesied: #155e75;
  --f-display: "Young Serif", Georgia, "Times New Roman", serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); overflow: hidden; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { position: relative; height: 100%; display: flex; flex-direction: column; }
.bar { background: var(--surface); border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; position: relative; z-index: 5;
  padding-block: 10px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.find { flex: 1; min-width: 0; position: relative; }
.find input { width: 100%; height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); font-size: 16px; }
.results { position: absolute; top: 50px; left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 28px rgba(10,20,40,.18); max-height: 50vh; overflow: auto; }
.results button { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 12px 14px; font-size: 16px; cursor: pointer; }
.results button:last-child { border-bottom: 0; }
.results small { color: var(--muted); }

.filter { position: relative; flex: none; }
.filter > button { height: 44px; display: inline-flex; align-items: center; gap: 8px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); font-size: 15px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.filter > button svg { transition: transform .15s; }
.filter > button[aria-expanded="true"] svg { transform: rotate(180deg); }
.menu { position: absolute; top: 50px; right: 0; width: min(290px, calc(100vw - 24px)); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 28px rgba(10,20,40,.18); padding: 6px; max-height: 70vh; overflow: auto; }
.menu label { display: flex; align-items: center; gap: 12px; padding: 0 10px; min-height: 46px; border-radius: 8px; cursor: pointer; font-size: 16px; }
.menu label:active { background: var(--bg); }
.menu input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; margin: 0; }
.menu .n { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 14px; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }

.stage { flex: 1; min-height: 0; position: relative; background-color: var(--bg); }
#web { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; cursor: grab; }
#web, .miniwrap { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.zoom { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; }
.zoom button { width: 46px; height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 22px; cursor: pointer; display: grid; place-items: center; box-shadow: 0 4px 12px rgba(10,20,40,.12); }

/* Full-screen pages */
.page { position: absolute; inset: 0; z-index: 10; background: var(--surface); display: flex; flex-direction: column; transform: translateX(100%); transition: transform .22s ease-out; visibility: hidden; }
.page.open { transform: none; visibility: visible; }
.page header { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--line); padding-block: 6px;
  padding-left: max(4px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.back { width: 48px; height: 48px; display: grid; place-items: center; border: 0; background: none; cursor: pointer; border-radius: 10px; flex: none; }
.page header h2 { font-family: var(--f-display); font-weight: 400; font-size: 1.15rem; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scroll { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; }
.body { max-width: 560px; margin: 0 auto; padding-block: 8px calc(28px + env(safe-area-inset-bottom, 0px)); padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
.mini { display: block; width: 100%; height: auto; max-width: 520px; margin: 0 auto; }
.miniwrap { position: relative; max-width: 520px; margin: 0 auto; }
.miniwrap.pz { background: var(--bg); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.miniwrap.pz svg { touch-action: none; cursor: grab; }
.minizoom { position: absolute; right: 8px; bottom: 8px; display: flex; gap: 6px; }
.minizoom button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 20px; cursor: pointer; }
.mini .sq rect { fill: url(#sqfill); filter: drop-shadow(0 5px 7px var(--sq-shadow)); }
.mini .sq text { fill: var(--sq-ink); font-family: var(--f-body); font-weight: 700; text-anchor: middle; pointer-events: none; }
.mini .tap { cursor: pointer; }
.mini .hit { stroke: transparent; fill: none; }
.title { font-family: var(--f-display); font-size: 1.6rem; line-height: 1.2; margin: 14px 0 4px; text-wrap: balance; }
.tagline { color: var(--muted); margin: 0 0 10px; }
.summary { font-size: 1.02rem; line-height: 1.55; margin: 8px 0 18px; }
.label { font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 20px 0 8px; }
.conns { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.conns button { display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 8px 14px; background: none; border: 0; border-bottom: 1px solid var(--line); text-align: left; cursor: pointer; font-size: 16px; }
.conns button:last-child { border-bottom: 0; }
.conns svg { flex: none; }
.conns .who { flex: 1; min-width: 0; }
.conns .who small { display: block; color: var(--muted); font-size: 13px; }
.pill { display: inline-flex; align-items: center; font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 5px 11px; border-radius: 999px; color: #fff; }
.why { font-size: 1.1rem; line-height: 1.5; margin: 14px 0 6px; }
.refline { font-weight: 700; margin: 0 0 8px; }
.refline span { font-weight: 400; color: var(--muted); }
blockquote { margin: 0 0 6px; padding: 12px 14px; background: var(--bg); border-left: 3px solid var(--line); border-radius: 0 8px 8px 0; font-size: 1rem; line-height: 1.6; }
blockquote p { margin: 0 0 8px; } blockquote p:last-child { margin: 0; }
blockquote sup { color: var(--muted); font-size: .7em; margin-right: 3px; }
@media (prefers-reduced-motion: reduce) { .page { transition: none; } }
</style>

<script>
const DATA = {"nodes":[{"id":"aaron_1","name":"Aaron","tag":null,"summary":"Moses' brother, who spoke for him before the people and before Pharaoh. God chose Aaron and his sons to serve Israel as priests.","era":1,"degree":7},{"id":"abel_13","name":"Abel","tag":null,"summary":"The second son of Adam and Eve, a shepherd whose offering the LORD accepted. His brother Cain killed him in a field.","era":0,"degree":4},{"id":"abiathar_20","name":"Abiathar","tag":null,"summary":"A priest, the son of Ahimelech, who alone escaped when Saul had the priests of Nob killed. He stayed with David for many years, but Solomon sent him away after he sided with Adonijah.","era":3,"degree":6},{"id":"abigail_26","name":"Abigail","tag":null,"summary":"The wise and beautiful wife of Nabal, whose quick gifts and words kept David from taking revenge on her husband. After Nabal died, she became the wife of David.","era":3,"degree":2},{"id":"abijah_38","name":"Abijah","tag":"king of Judah","summary":"A son of Rehoboam who reigned three years over Judah in Jerusalem. He walked in his father's sins, yet he won a great battle against Jeroboam when Judah relied on the LORD.","era":4,"degree":3},{"id":"abimelech_40","name":"Abimelech","tag":"king of Gerar","summary":"The king of Gerar who was told by Abraham that Sarah was his sister, and later by Isaac that Rebekah was his. Each time he made a covenant of peace with them.","era":0,"degree":2},{"id":"abimelech_41","name":"Abimelech","tag":"son of Gideon","summary":"A son of Gideon who killed his seventy brothers to make himself king at Shechem. He reigned three years before God sent trouble between him and the men of Shechem, and he died at Thebez.","era":2,"degree":2},{"id":"abishai_50","name":"Abishai","tag":null,"summary":"A son of Zeruiah, brother of Joab, and a bold captain in David's army. More than once he offered to kill David's enemies, and he saved David's life in battle against a son of the giant.","era":3,"degree":5},{"id":"abner_57","name":"Abner","tag":null,"summary":"The captain of Saul's army, who after Saul's death made Saul's son Ish-bosheth king over Israel. He later turned to David, but Joab killed him at Hebron.","era":3,"degree":5},{"id":"abraham_58","name":"Abraham","tag":null,"summary":"First called Abram, he was the man God called to leave his homeland, promising to make him a great nation and to bless all families of the earth through him. He believed the LORD, and in his old age God gave him and Sarah a son, Isaac.","era":0,"degree":8},{"id":"absalom_59","name":"Absalom","tag":null,"summary":"A son of David, praised above anyone in Israel for his beauty. He had his brother Amnon killed, later turned the people against his father to take the throne, and died in the battle that followed.","era":3,"degree":6},{"id":"achan_61","name":"Achan","tag":null,"summary":"A man of Judah who secretly took things the LORD had forbidden, bringing defeat on Israel. When he was found out, Israel stoned him in the valley of Achor.","era":2,"degree":1},{"id":"achish_66","name":"Achish","tag":null,"summary":"A Philistine king of Gath who took David in while he was running from Saul. He trusted David and gave him the town of Ziklag.","era":3,"degree":1},{"id":"adam_78","name":"Adam","tag":null,"summary":"The first man, whom the LORD God made and placed in the garden of Eden. He and his wife ate from the one tree God had forbidden, and they were sent out of the garden.","era":0,"degree":4},{"id":"adonijah_97","name":"Adonijah","tag":null,"summary":"The fourth son of David, born to Haggith. He tried to make himself king as David grew old, but Solomon was crowned instead, and Adonijah later lost his life.","era":4,"degree":5},{"id":"agrippa_111","name":"Agrippa","tag":null,"summary":"A king who came to Caesarea with Bernice to greet Festus and asked to hear Paul for himself. After Paul told his story, Agrippa said Paul had almost persuaded him to become a Christian.","era":7,"degree":2},{"id":"ahab_113","name":"Ahab","tag":null,"summary":"A king of Israel who reigned in Samaria and did more evil in the sight of the LORD than all the kings before him. He married Jezebel, served Baal, and stood against the prophet Elijah.","era":4,"degree":9},{"id":"ahasuerus_117","name":"Ahasuerus","tag":null,"summary":"A king who reigned over 127 provinces, from India to Ethiopia, from his throne in Shushan the palace. He put away Queen Vashti, made Esther his queen, and turned against Haman when Esther revealed his plot.","era":5,"degree":4},{"id":"ahaziah_120","name":"Ahaziah","tag":"son of Ahab","summary":"A son of Ahab who ruled Israel from Samaria for two years and served Baal as his father had. After a fall he sent to ask a foreign god whether he would recover, and he died as Elijah said.","era":4,"degree":3},{"id":"ahaziah_121","name":"Ahaziah","tag":"king of Judah","summary":"The youngest son of Jehoram king of Judah, who reigned one year in Jerusalem. His mother Athaliah counselled him to follow Ahab's house, and Jehu struck him down when he went to visit King Joram.","era":4,"degree":5},{"id":"ahaz_118","name":"Ahaz","tag":null,"summary":"A son of Jotham who ruled Judah for sixteen years and did not do what was right as David had. In his troubles he turned to Assyria's king and to foreign gods, and he shut up the LORD's house.","era":4,"degree":4},{"id":"ahijah_135","name":"Ahijah","tag":"prophet of Shiloh","summary":"A prophet from Shiloh who told Jeroboam that he would rule ten tribes of Israel. Years later, old and blind, he told Jeroboam's wife of the judgment coming on their house.","era":4,"degree":1},{"id":"ahikam_141","name":"Ahikam","tag":null,"summary":"Ahikam son of Shaphan was one of the men King Josiah sent to ask of the LORD about the book of the law that had been found. Later he stood by the prophet Jeremiah, so that Jeremiah was not handed over to be killed.","era":4,"degree":2},{"id":"ahithophel_162","name":"Ahithophel","tag":null,"summary":"David's counselor from Giloh, whose advice was trusted as if it came from God. He joined Absalom's revolt, and when his advice was not followed he went home and hanged himself.","era":3,"degree":3},{"id":"amaziah_214","name":"Amaziah","tag":null,"summary":"A son of Joash who reigned over Judah from Jerusalem. He defeated Edom but then bowed to Edom's gods, lost a war against Joash king of Israel, and was killed at Lachish.","era":4,"degree":3},{"id":"amnon_232","name":"Amnon","tag":null,"summary":"The firstborn son of David, born in Hebron. He forced his sister Tamar, and two years later her brother Absalom had him killed.","era":3,"degree":3},{"id":"amon_236","name":"Amon","tag":null,"summary":"A son of Manasseh who became king of Judah at twenty-two and reigned two years in Jerusalem. He served his father's idols, and his own servants killed him in his house.","era":4,"degree":2},{"id":"amos_238","name":"Amos","tag":null,"summary":"A herdsman from Tekoa whom the LORD called away from his flock to prophesy to Israel. He saw visions of judgment and stood firm when the priest of Bethel told him to leave.","era":5,"degree":1},{"id":"ananias_258","name":"Ananias","tag":"husband of Sapphira","summary":"A man in the early church who sold land with his wife Sapphira but kept back part of the price. Peter said he had lied to God, and he fell down dead.","era":7,"degree":2},{"id":"ananias_259","name":"Ananias","tag":"disciple at Damascus","summary":"A devout disciple in Damascus whom the Lord sent to Saul after Saul lost his sight. Though he had heard of the evil Saul had done, he obeyed, laid his hands on him, and Saul could see again.","era":7,"degree":2},{"id":"andrew_264","name":"Andrew","tag":null,"summary":"A fisherman, the brother of Simon Peter, who heard John the Baptist speak and followed Jesus. He brought his brother to Jesus and became one of the twelve apostles.","era":6,"degree":3},{"id":"annas_269","name":"Annas","tag":null,"summary":"A high priest and the father-in-law of Caiaphas. Jesus was brought to him first after His arrest, and later he sat with the council that questioned Peter and John.","era":6,"degree":3},{"id":"apollos_276","name":"Apollos","tag":null,"summary":"A Jew born at Alexandria, a gifted speaker who knew the scriptures well. After Aquila and Priscilla taught him more, he greatly helped the believers, and Paul called him a fellow servant who watered what Paul had planted.","era":7,"degree":3},{"id":"aquila_279","name":"Aquila","tag":null,"summary":"A Jew born in Pontus who, with his wife Priscilla, worked alongside Paul as a tentmaker in Corinth. Together they explained God's way more fully to Apollos, and a church met in their home.","era":7,"degree":3},{"id":"asa_318","name":"Asa","tag":null,"summary":"A king of Judah, son of Abijah, who did what was right in the eyes of the LORD and put away the idols in the land. Later he relied on the king of Syria instead of the LORD, and in his disease he sought the physicians.","era":4,"degree":2},{"id":"asher_337","name":"Asher","tag":null,"summary":"A son of Jacob, born to Zilpah, Leah's maid. Jacob said Asher's bread would be rich and he would give food fit for kings.","era":0,"degree":2},{"id":"athaliah_359","name":"Athaliah","tag":null,"summary":"Omri's daughter and the mother of Ahaziah king of Judah. When her son died, she killed the royal family and ruled the land for six years until she was overthrown.","era":4,"degree":3},{"id":"azariah_545","name":"Abednego","tag":null,"summary":"Abednego, first called Azariah, was one of Daniel's friends from Judah taken into the court of Babylon. With Shadrach and Meshach he would not worship the king's golden image, and God brought them out of the fiery furnace unharmed.","era":5,"degree":4},{"id":"balaam_593","name":"Balaam","tag":null,"summary":"A man from Pethor whom Balak, king of Moab, called to curse Israel. God let him speak only blessings, but his advice later led Israel into sin.","era":1,"degree":1},{"id":"balak_387","name":"Balak","tag":null,"summary":"The king of Moab who feared Israel and sent for Balaam to curse them. Each time, Balaam blessed Israel instead.","era":1,"degree":1},{"id":"barabbas_399","name":"Barabbas","tag":null,"summary":"A well-known prisoner, a robber who had committed murder in an uprising. When Pilate offered to release one prisoner at the feast, the crowd asked for Barabbas instead of Jesus.","era":6,"degree":2},{"id":"barak_401","name":"Barak","tag":null,"summary":"The son of Abinoam, whom Deborah called to lead Israel against Sisera. With ten thousand men he came down from Mount Tabor and destroyed Sisera's army.","era":2,"degree":3},{"id":"barnabas_1722","name":"Barnabas","tag":null,"summary":"A Levite from Cyprus named Joses, whom the apostles called Barnabas, meaning son of consolation. He stood up for Saul, encouraged the new church at Antioch, and travelled with Paul preaching to the Gentiles.","era":7,"degree":2},{"id":"bartholomew_405","name":"Bartholomew","tag":null,"summary":"One of the twelve apostles Jesus chose. Scripture names him in the lists of the twelve and among those praying in the upper room after Jesus was taken up.","era":6,"degree":1},{"id":"bartimaeus_406","name":"Bartimaeus","tag":null,"summary":"A blind beggar, the son of Timaeus, who sat by the road outside Jericho. He cried out to Jesus for mercy, and Jesus gave him his sight.","era":6,"degree":1},{"id":"baruch_410","name":"Baruch","tag":null,"summary":"Baruch son of Neriah was a scribe who wrote down the LORD's words as Jeremiah spoke them. He read the scroll aloud in the LORD's house and wrote it all again after the king burned it.","era":5,"degree":2},{"id":"bathsheba_416","name":"Bathsheba","tag":null,"summary":"The daughter of Eliam and wife of Uriah the Hittite, whom David took while Uriah was at war. She later became David's wife and the mother of King Solomon.","era":3,"degree":4},{"id":"belshazzar_437","name":"Belshazzar","tag":null,"summary":"A king of Babylon who held a great feast and drank from the holy cups taken from God's temple in Jerusalem. A hand wrote a message on his wall, Daniel read it as God's judgment, and he was killed that same night.","era":5,"degree":2},{"id":"benaiah_439","name":"Benaiah","tag":"son of Jehoiada","summary":"A mighty man of David from Kabzeel, set over the Cherethites and the Pelethites. He stood with Solomon and became captain over the whole army.","era":3,"degree":7},{"id":"benjamin_463","name":"Benjamin","tag":null,"summary":"Jacob's youngest son, born as his mother Rachel died. He was Joseph's brother by the same mother, and Joseph wept when he saw him again in Egypt.","era":0,"degree":4},{"id":"bildad_499","name":"Bildad","tag":null,"summary":"Bildad the Shuhite was one of Job's three friends, who came to comfort him and then argued that God does not pervert justice. The LORD later said the three friends had not spoken of Him what was right.","era":5,"degree":4},{"id":"boaz_519","name":"Boaz","tag":null,"summary":"A wealthy man of Bethlehem, a relative of Naomi's husband, who was kind to Ruth in his barley field. He bought back the family land and married her, and their son Obed was the grandfather of David.","era":2,"degree":2},{"id":"caiaphas_532","name":"Caiaphas","tag":null,"summary":"The high priest in the year Jesus was crucified. He told the council it was better for one man to die for the people, and Jesus was brought before him after His arrest.","era":6,"degree":3},{"id":"cain_533","name":"Cain","tag":null,"summary":"The firstborn son of Adam and Eve, a farmer who killed his brother Abel. The LORD sent him away to wander, but set a mark on him so that no one would kill him.","era":0,"degree":3},{"id":"caleb_537","name":"Caleb","tag":null,"summary":"A spy from the tribe of Judah who trusted the LORD when others were afraid. Because he followed the LORD with his whole heart, he lived to receive Hebron as his inheritance.","era":1,"degree":3},{"id":"cornelius_956","name":"Cornelius","tag":null,"summary":"A centurion in Caesarea who feared God, gave generously and prayed always. An angel told him to send for Peter, and while Peter preached in his house, the Holy Ghost came upon the Gentiles who were listening.","era":7,"degree":1},{"id":"cyrus_968","name":"Cyrus","tag":null,"summary":"A king of Persia whose spirit the LORD moved to send the people of Judah home. He commanded that the house of the LORD in Jerusalem be built again and gave back the vessels Nebuchadnezzar had taken from it.","era":5,"degree":1},{"id":"daniel_975","name":"Daniel","tag":null,"summary":"Daniel was a young man of Judah taken to Babylon, where God gave him understanding of visions and dreams. He served kings faithfully, kept praying to his God, and was kept safe in the lions' den.","era":5,"degree":6},{"id":"dan_973","name":"Dan","tag":null,"summary":"Jacob's fifth son, born to Bilhah, Rachel's maid. Jacob said Dan would judge his people and be like a snake beside the road.","era":0,"degree":3},{"id":"darius_980","name":"Darius","tag":null,"summary":"Darius the Median took the kingdom after Belshazzar and made Daniel one of his top leaders. Talked into a law that sent Daniel to the lions, he saw God rescue Daniel and told all nations to fear Daniel's God.","era":5,"degree":1},{"id":"daughter_of_pharaoh_988","name":"Daughter of Pharaoh","tag":null,"summary":"The daughter of Pharaoh who found baby Moses in a little ark by the river. She raised him as her own son and gave him his name.","era":1,"degree":2},{"id":"david_994","name":"David","tag":null,"summary":"A shepherd from Bethlehem whom the LORD chose to be king of Israel. He killed Goliath, spared Saul when he could have killed him, and reigned forty years from Hebron and Jerusalem.","era":3,"degree":35},{"id":"deborah_997","name":"Deborah","tag":null,"summary":"A prophetess who judged Israel under a palm tree in the hills of Ephraim. She called Barak to fight Sisera, went with him, and sang of the LORD's victory.","era":2,"degree":3},{"id":"delilah_1005","name":"Delilah","tag":null,"summary":"A woman in the valley of Sorek whom Samson loved. The lords of the Philistines paid her to learn the secret of his strength, and she gave him into their hands.","era":2,"degree":1},{"id":"demetrius_1007","name":"Demetrius","tag":null,"summary":"A silversmith in Ephesus who made silver shrines for the goddess Diana. Warning that Paul's preaching put their trade in danger, he stirred up the craftsmen and set off an uproar in the city.","era":7,"degree":1},{"id":"dinah_1012","name":"Dinah","tag":null,"summary":"The daughter of Jacob and Leah. After Shechem defiled her, her brothers Simeon and Levi took revenge on his whole city.","era":0,"degree":4},{"id":"dorcas_2810","name":"Dorcas","tag":null,"summary":"A disciple at Joppa, also called Tabitha, who was known for her good works and her gifts to the poor. When she died, Peter prayed and called her to rise, and she came back to life.","era":7,"degree":1},{"id":"eglon_1037","name":"Eglon","tag":null,"summary":"A king of Moab whom the LORD made strong against Israel when they did evil, and Israel served him eighteen years. He was a very fat man, and Ehud killed him in his summer parlour.","era":2,"degree":1},{"id":"ehud_1039","name":"Ehud","tag":null,"summary":"A left-handed man of Benjamin whom the LORD raised up to free Israel from Eglon, king of Moab. After killing Eglon he led Israel to victory, and the land had rest eighty years.","era":2,"degree":1},{"id":"eleazar_1062","name":"Eleazar","tag":null,"summary":"Aaron's son, who took his father's place as priest. He served beside Moses and then Joshua, and helped divide the land of Canaan among the tribes.","era":1,"degree":4},{"id":"eliakim_1084","name":"Eliakim","tag":"son of Hilkiah","summary":"The son of Hilkiah, who was over King Hezekiah's household. He spoke for the king when Rabshakeh came from Assyria to Jerusalem's wall.","era":4,"degree":3},{"id":"elihu_1130","name":"Elihu","tag":null,"summary":"Elihu the son of Barachel was a young man who waited while Job and his three friends spoke, then grew angry with them all. He spoke on God's behalf, telling Job that God is greater than man.","era":5,"degree":4},{"id":"elijah_1131","name":"Elijah","tag":null,"summary":"A prophet from Gilead who stood alone against King Ahab and the prophets of Baal. At the end, a fiery chariot parted him from Elisha and a whirlwind took him up into heaven.","era":4,"degree":7},{"id":"eliphaz_1145","name":"Eliphaz","tag":null,"summary":"Eliphaz the Temanite was the first of Job's three friends to speak, and he told Job that no innocent man ever perished. In the end the LORD said Eliphaz and his two friends had not spoken of Him what was right.","era":5,"degree":4},{"id":"elisabeth_1152","name":"Elisabeth","tag":null,"summary":"A woman descended from Aaron, married to the priest Zacharias, who had no children into old age. God gave her a son, John, and when Mary visited, she was filled with the Holy Ghost and blessed her.","era":6,"degree":3},{"id":"elisha_1153","name":"Elisha","tag":null,"summary":"The son of Shaphat who followed Elijah and took his place as prophet in Israel. Through him the LORD healed, fed and protected His people, and even his bones gave a dead man life.","era":4,"degree":8},{"id":"eli_1072","name":"Eli","tag":null,"summary":"The priest at Shiloh who judged Israel forty years and raised the young Samuel. He did not restrain his wicked sons, and he died when he heard the ark of God was taken.","era":3,"degree":2},{"id":"enoch_1192","name":"Enoch","tag":null,"summary":"A man in the family line from Adam who walked with God and was the father of Methuselah. He did not die; God took him.","era":0,"degree":1},{"id":"ephraim_1206","name":"Ephraim","tag":null,"summary":"Joseph's younger son, born in Egypt. When Jacob blessed the two boys, he put Ephraim ahead of his older brother Manasseh.","era":0,"degree":3},{"id":"esau_1216","name":"Esau","tag":null,"summary":"The older twin brother of Jacob, a skillful hunter who sold his birthright for a bowl of stew. Jacob took his father's blessing, but years later Esau ran to meet him and they made peace.","era":0,"degree":4},{"id":"esther_1343","name":"Esther","tag":null,"summary":"Esther was a Jewish orphan raised by her cousin Mordecai who became queen to King Ahasuerus. She risked her life to go before the king and saved her people from Haman's plot to destroy them.","era":5,"degree":3},{"id":"eve_1231","name":"Eve","tag":null,"summary":"The first woman, made by God from Adam's rib. She ate the forbidden fruit after the serpent tricked her, and Adam named her Eve because she was the mother of all living.","era":0,"degree":4},{"id":"ezekiel_1237","name":"Ezekiel","tag":null,"summary":"Ezekiel son of Buzi was a priest living with the captives at the river Chebar, in the land of the Chaldeans. There the LORD gave him visions and words to speak to His people, and even made his own life a sign to them.","era":5,"degree":2},{"id":"ezra_1245","name":"Ezra","tag":null,"summary":"Ezra was a priest and a scribe, skilled in the law of Moses, who traveled from Babylon to Jerusalem. He made up his mind to study the LORD's law, keep it, and teach it in Israel.","era":5,"degree":1},{"id":"felix_1257","name":"Felix","tag":null,"summary":"The governor to whom Paul was sent as a prisoner at Caesarea. He heard Paul speak and trembled, but he put off his decision and left Paul bound for two years.","era":7,"degree":1},{"id":"gad_1262","name":"Gad","tag":"son of Jacob","summary":"A son of Jacob, born to Leah's maid Zilpah. His descendants became the tribe of Gad, who chose to settle on the east side of the Jordan.","era":0,"degree":4},{"id":"gad_1263","name":"Gad","tag":"David's seer","summary":"A prophet, called David's seer, who brought the LORD's word to David. He told David where to go when he was hiding from Saul, and after David numbered the people he brought the LORD's three choices and the command to build an altar.","era":3,"degree":1},{"id":"gamaliel_1277","name":"Gamaliel","tag":null,"summary":"A Pharisee on the council, a teacher of the law respected by all the people. He warned the council not to fight against God, and Paul was taught the law under him.","era":7,"degree":2},{"id":"gedaliah_1287","name":"Gedaliah","tag":null,"summary":"Gedaliah son of Ahikam was made governor by the king of Babylon over the people left in Judah after Jerusalem fell. He told them to settle in the land, but he would not believe a warning about a plot and was killed at Mizpah.","era":5,"degree":4},{"id":"gehazi_1293","name":"Gehazi","tag":null,"summary":"The servant of Elisha, who helped him care for a woman of Shunem and her son. When he lied to get silver from Naaman, Naaman's leprosy came on him.","era":4,"degree":2},{"id":"gideon_1314","name":"Gideon","tag":null,"summary":"A man of Ophrah, the son of Joash, whom the angel of the LORD called to save Israel from the Midianites. With only three hundred men, trumpets and lamps, he saw the LORD put the whole army of Midian to flight.","era":2,"degree":2},{"id":"gilead_1318","name":"Gilead","tag":null,"summary":"The father of Jephthah, whose son was born to a harlot. His wife's sons later drove Jephthah out of their father's house.","era":2,"degree":1},{"id":"gog_1326","name":"Gog","tag":null,"summary":"Gog of the land of Magog, chief prince of Meshech and Tubal, was the one the LORD spoke against through Ezekiel. In later years he would come against Israel like a storm, and the LORD would defeat him and his army.","era":5,"degree":1},{"id":"goliath_1327","name":"Goliath","tag":null,"summary":"A towering Philistine champion from Gath, who for forty days dared Israel to send a man to fight him. The young David killed him with a sling and a stone.","era":3,"degree":2},{"id":"gomer_1329","name":"Gomer","tag":null,"summary":"The daughter of Diblaim, whom the prophet Hosea married when the LORD told him to take an unfaithful wife. Her children were given names that carried God's message to Israel.","era":5,"degree":1},{"id":"habakkuk_1334","name":"Habakkuk","tag":null,"summary":"A prophet who asked the LORD how long violence would go unpunished, waited for His answer, and ended rejoicing in the LORD though every crop should fail. Scripture tells nothing more about him and names no one else alongside him.","era":5,"degree":0},{"id":"hadarezer_1340","name":"Hadarezer","tag":null,"summary":"The son of Rehob and king of Zobah, who fought against David. David defeated him twice, and the kings who served him made peace with Israel.","era":3,"degree":1},{"id":"hagar_1348","name":"Hagar","tag":null,"summary":"An Egyptian maid of Sarai who bore Abram's son Ishmael. Twice in the wilderness, an angel spoke to her and promised that many people would come from her son.","era":0,"degree":3},{"id":"haggai_1349","name":"Haggai","tag":null,"summary":"A prophet who brought the LORD's message to the people who had come back to Jerusalem. He stirred up Zerubbabel, Joshua and the people to build the house of the LORD again.","era":5,"degree":3},{"id":"haman_1360","name":"Haman","tag":null,"summary":"Haman the Agagite was raised by King Ahasuerus over all the princes. Furious that Mordecai would not bow to him, he plotted to wipe out all the Jews, but he was hanged on the gallows he had built for Mordecai.","era":5,"degree":3},{"id":"ham_1359","name":"Ham","tag":null,"summary":"One of Noah's three sons, who was saved with his family in the ark. He was the father of Canaan, and many families and nations came from his sons.","era":0,"degree":3},{"id":"hannah_1400","name":"Hannah","tag":null,"summary":"The wife of Elkanah, who wept and prayed at Shiloh for a son and promised to give him to the LORD. The LORD answered with Samuel, and she kept her word.","era":3,"degree":2},{"id":"hazael_1463","name":"Hazael","tag":null,"summary":"A servant of Ben-hadad king of Syria who became king himself, as the LORD had shown Elijah and Elisha. As king he struck Israel again and again.","era":4,"degree":3},{"id":"herodias_1507","name":"Herodias","tag":null,"summary":"The wife of Philip who was married to his brother Herod the tetrarch. When John the Baptist told Herod the marriage was not lawful, she wanted John dead, and she had her daughter ask for his head.","era":6,"degree":2},{"id":"herod_1504","name":"Herod","tag":"king of Judaea","summary":"The king of Judaea when Jesus was born in Bethlehem. Troubled by news of a newborn King of the Jews, he tried to find and kill the child.","era":6,"degree":2},{"id":"herod_1505","name":"Herod","tag":"tetrarch of Galilee","summary":"The ruler of Galilee who put John the Baptist in prison and later had him beheaded. When Jesus was sent to him during His trial, he mocked Jesus and sent Him back to Pilate.","era":6,"degree":4},{"id":"herod_1506","name":"Herod","tag":"king who killed James","summary":"A king who attacked the church, killing James with the sword and putting Peter in prison. When the people hailed him as a god and he did not give God the glory, an angel of the Lord struck him and he died.","era":7,"degree":2},{"id":"hezekiah_1512","name":"Hezekiah","tag":null,"summary":"A son of Ahaz who became king of Judah and trusted the LORD like no other king of Judah. When Assyria threatened Jerusalem, he prayed, and the LORD saved the city.","era":4,"degree":5},{"id":"hilkiah_1524","name":"Hilkiah","tag":"the high priest","summary":"The high priest in the days of King Josiah. While the temple was being repaired, he discovered the book of the law inside the LORD's house.","era":4,"degree":1},{"id":"hiram_1532","name":"Hiram","tag":"king of Tyre","summary":"The king of Tyre and a friend to both David and Solomon. He sent cedar wood and skilled workers for their building, and his ships brought gold from Ophir.","era":3,"degree":2},{"id":"hosea_1555","name":"Hosea","tag":null,"summary":"A prophet, the son of Beeri, whom the LORD told to marry an unfaithful wife as a picture of Israel turning away from the LORD. His children's names carried God's message, and he was told to love an unfaithful woman again, as the LORD loves Israel.","era":5,"degree":2},{"id":"hoshea_1559","name":"Hoshea","tag":"son of Elah","summary":"A son of Elah who killed King Pekah and reigned nine years over Israel in Samaria. In his days Assyria's king captured Samaria and took Israel into exile.","era":4,"degree":1},{"id":"hushai_1577","name":"Hushai","tag":null,"summary":"Hushai the Archite, David's friend, who went back to Jerusalem to defeat Ahithophel's counsel during Absalom's revolt. His advice won out, and he sent word to David to cross over quickly.","era":3,"degree":5},{"id":"isaac_616","name":"Isaac","tag":null,"summary":"The son God promised to Abraham and Sarah, born when they were old. He married Rebekah and became the father of Esau and Jacob, and God repeated to him the promise He had made to Abraham.","era":0,"degree":7},{"id":"isaiah_617","name":"Isaiah","tag":null,"summary":"A prophet, the son of Amoz, who saw visions about Judah and Jerusalem during the reigns of four kings, from Uzziah to Hezekiah. He brought the LORD's word to kings in times of war and sickness.","era":5,"degree":5},{"id":"ish-bosheth_622","name":"Ish-bosheth","tag":null,"summary":"A son of Saul whom Abner made king over Israel after Saul's death, while Judah followed David. He reigned two years before two of his own captains killed him in his bed.","era":3,"degree":4},{"id":"ishmael_630","name":"Ishmael","tag":null,"summary":"Abraham's first son, born to Hagar, Sarai's Egyptian maid. God blessed him and promised to make him a great nation, the father of twelve princes.","era":0,"degree":5},{"id":"israel_682","name":"Jacob","tag":null,"summary":"The younger twin of Esau, who took his brother's blessing and fled to his uncle Laban. God renamed him Israel, and his twelve sons became the twelve tribes of Israel.","era":0,"degree":18},{"id":"issachar_645","name":"Issachar","tag":null,"summary":"Jacob's fifth son by Leah, born after she traded her son's mandrakes for a night with Jacob. Jacob said Issachar was a strong donkey who would bow his shoulder to bear burdens.","era":0,"degree":3},{"id":"jael_689","name":"Jael","tag":null,"summary":"The wife of Heber the Kenite. When Sisera, captain of Jabin's army, fled to her tent, she killed him with a tent nail, and the song of Deborah and Barak called her blessed above women.","era":2,"degree":3},{"id":"james_717","name":"James","tag":"son of Zebedee","summary":"A fisherman, the son of Zebedee and brother of John, who left his nets to follow Jesus. He was one of the three disciples Jesus often took with Him, and was later killed by King Herod.","era":6,"degree":4},{"id":"james_718","name":"James","tag":"son of Alphaeus","summary":"One of the twelve apostles Jesus chose, called James the son of Alphaeus. Scripture names him in the lists of the twelve and among those praying in the upper room after Jesus was taken up.","era":6,"degree":1},{"id":"james_719","name":"James","tag":"the Lord's brother","summary":"A brother of Jesus, named among His family in His hometown. He later became a leader of the church in Jerusalem, one of the men Paul said were seen as pillars.","era":7,"degree":4},{"id":"japheth_726","name":"Japheth","tag":null,"summary":"One of Noah's three sons, who was saved with his family in the ark. Noah prayed that God would enlarge Japheth, and the island peoples came from his sons.","era":0,"degree":3},{"id":"jehoahaz_2516","name":"Jehoahaz","tag":null,"summary":"A son of Josiah whom the people made king of Judah when his father was killed. He did evil and reigned only three months before Pharaoh-nechoh put him in chains and took him to Egypt, where he died.","era":4,"degree":2},{"id":"jehoiachin_791","name":"Jehoiachin","tag":null,"summary":"A son of Jehoiakim who reigned over Judah for only three months before he was carried away captive to Babylon. After many years in prison there, a new king of Babylon set him free and gave him a place at his table.","era":4,"degree":4},{"id":"jehoiada_793","name":"Jehoiada","tag":null,"summary":"The priest who hid young Joash in the LORD's house and then made him king of Judah. While Jehoiada lived, he taught the king and led the people to belong to the LORD.","era":4,"degree":2},{"id":"jehoiakim_1085","name":"Jehoiakim","tag":null,"summary":"A son of King Josiah whom the king of Egypt set on the throne of Judah, changing his name from Eliakim. He did evil in the LORD's eyes and burned the scroll of the LORD's words that had been written down as Jeremiah spoke them.","era":4,"degree":6},{"id":"jehoram_803","name":"Jehoram","tag":"son of Jehoshaphat","summary":"The firstborn son of Jehoshaphat, who ruled Judah from Jerusalem for eight years. He married a daughter of Ahab, did evil, and died of a painful disease with no one sorry to see him go.","era":4,"degree":4},{"id":"jehoshaphat_808","name":"Jehoshaphat","tag":null,"summary":"A king of Judah, son of Asa, who walked in the ways of the LORD and sent teachers through Judah with the book of the law. When a great army came against him he sought the LORD, and the LORD won the battle for Judah.","era":4,"degree":7},{"id":"jehu_817","name":"Jehu","tag":null,"summary":"An army captain anointed king over Israel to wipe out Ahab's family line. He wiped Baal worship out of Israel, but kept the golden calves at Bethel and Dan.","era":4,"degree":6},{"id":"jephthah_839","name":"Jephthah","tag":null,"summary":"A mighty man of valour from Gilead, driven out by his brothers and later called back to lead his people against Ammon. A vow he made before the battle fell on his only child, his daughter.","era":2,"degree":1},{"id":"jeremiah_853","name":"Jeremiah","tag":null,"summary":"A prophet from a priestly family in Anathoth whom the LORD called while he was young to speak His words to Judah and the nations. He warned of the fall of Jerusalem for many years and was beaten, imprisoned and thrown into a dungeon for it.","era":5,"degree":10},{"id":"jeroboam_872","name":"Jeroboam","tag":"son of Nebat","summary":"A servant of Solomon to whom the prophet Ahijah promised ten tribes of Israel. He became their king but made golden calves for the people to worship, and later kings of Israel kept walking in his sins.","era":4,"degree":4},{"id":"jeroboam_873","name":"Jeroboam","tag":"son of Joash","summary":"A king of Israel, the son of Joash, who reigned forty-one years from Samaria. He did evil, yet the LORD used him to rescue Israel and win back its borders.","era":4,"degree":3},{"id":"jesse_903","name":"Jesse","tag":null,"summary":"A man of Bethlehem, the grandson of Ruth and Boaz, and the father of eight sons. The LORD chose his youngest, David, to be king.","era":3,"degree":2},{"id":"jesus_905","name":"Jesus Christ","tag":null,"summary":"Born in Bethlehem, Jesus is the One an angel announced as a Saviour, Christ the Lord, and a voice from heaven called Him a beloved Son. He taught, healed and fed the crowds, was crucified, and on the third day He rose from the dead.","era":6,"degree":43},{"id":"jethro_2431","name":"Jethro","tag":null,"summary":"The priest of Midian who took Moses into his home and gave him his daughter Zipporah as a wife. Later he praised the LORD for rescuing Israel and taught Moses to share the work of judging.","era":1,"degree":3},{"id":"jezebel_1605","name":"Jezebel","tag":null,"summary":"The daughter of Ethbaal king of the Zidonians and wife of King Ahab. She killed the prophets of the LORD, threatened Elijah, and had Naboth stoned for his vineyard.","era":4,"degree":5},{"id":"joab_1617","name":"Joab","tag":null,"summary":"A son of Zeruiah and the captain of David's army, who led many of David's battles. He killed Abner, Absalom and Amasa with his own hand, and in Solomon's day he was put to death at the altar.","era":3,"degree":9},{"id":"joash_1632","name":"Joash","tag":"king of Judah","summary":"A son of Ahaziah who was hidden as a child in the LORD's house and crowned king of Judah at seven. He did right while Jehoiada the priest taught him, but later turned away and had Jehoiada's son killed.","era":4,"degree":5},{"id":"joash_1633","name":"Joash","tag":"king of Israel","summary":"A grandson of Jehu who reigned over Israel from Samaria for sixteen years. He wept at Elisha's deathbed, won back cities from Syria, and defeated Amaziah king of Judah.","era":4,"degree":3},{"id":"job_1639","name":"Job","tag":null,"summary":"Job was a man in the land of Uz who was perfect and upright, feared God and turned away from evil. He lost his children, his wealth and his health but did not sin in what he said, and in the end the LORD gave him double what he had before.","era":5,"degree":4},{"id":"joel_1660","name":"Joel","tag":null,"summary":"A prophet, the son of Pethuel, to whom the word of the LORD came. When locusts stripped the land, he called the people to fast and turn back to the LORD with all their heart.","era":5,"degree":1},{"id":"johanan_1666","name":"Johanan","tag":null,"summary":"Johanan son of Kareah was a captain who warned Gedaliah of a plot and later rescued the people Ishmael had carried off. Afterward he would not obey the word of the LORD through Jeremiah and led the people left in Judah away to Egypt.","era":5,"degree":2},{"id":"john_1676","name":"John","tag":"the Baptist","summary":"The son of Zacharias and Elisabeth, sent by God to prepare the way for Jesus. He preached repentance, baptized people in the Jordan, and pointed others to Jesus as the Lamb of God.","era":6,"degree":8},{"id":"john_1677","name":"John","tag":"son of Zebedee","summary":"A fisherman, the son of Zebedee and brother of James, who became one of the twelve apostles. After Jesus rose, he and Peter healed a lame man and spoke boldly before the council.","era":6,"degree":3},{"id":"jonah_1689","name":"Jonah","tag":null,"summary":"A prophet, the son of Amittai, whom the LORD sent to warn the great city of Nineveh. He ran from the LORD, was swallowed by a great fish, and was angry when God spared the city.","era":5,"degree":1},{"id":"jonathan_1691","name":"Jonathan","tag":"the Levite","summary":"A young Levite from Bethlehem-judah, the son of Gershom, who became the hired priest in Micah's house of idols. He later left with the men of Dan, and he and his sons were priests to the tribe of Dan.","era":2,"degree":1},{"id":"jonathan_1692","name":"Jonathan","tag":"son of Saul","summary":"A son of King Saul and a bold warrior, who made a covenant of friendship with David and protected him from his father. He died beside Saul in battle on Mount Gilboa.","era":3,"degree":3},{"id":"joram_804","name":"Joram","tag":"son of Ahab","summary":"A son of Ahab who ruled Israel from Samaria for twelve years. He did evil, though not like his parents, and was shot by Jehu in the field of Naboth.","era":4,"degree":7},{"id":"joseph_1710","name":"Joseph","tag":"son of Jacob","summary":"Jacob's favorite son, sold by his envious brothers into Egypt. God raised him up to rule Egypt, and through him his family was kept alive in a famine.","era":0,"degree":10},{"id":"joseph_1715","name":"Joseph","tag":"husband of Mary","summary":"A just man of the house of David who was engaged to Mary, the mother of Jesus. Guided by an angel in dreams, he took Mary as his wife and kept the young child safe.","era":6,"degree":3},{"id":"joseph_1716","name":"Joseph","tag":"of Arimathaea","summary":"A rich man of Arimathaea and an honourable counsellor who was a disciple of Jesus, though secretly for fear of the Jews. After the crucifixion he asked Pilate for Jesus' body and laid it in his own new tomb.","era":6,"degree":2},{"id":"joshua_1727","name":"Joshua","tag":"son of Nun","summary":"Moses' helper, who became Israel's leader after him. He led the people across the Jordan and into the land of Canaan.","era":1,"degree":5},{"id":"joshua_893","name":"Joshua","tag":"the high priest","summary":"Joshua, the son of Josedech, was the high priest when the people came back from captivity to Jerusalem. With Zerubbabel he rebuilt the altar and the house of the LORD, and in Zechariah's visions the LORD took away his filthy clothes and had crowns set on his head.","era":5,"degree":3},{"id":"josiah_1730","name":"Josiah","tag":null,"summary":"A king of Judah who began to reign at eight years old and did what was right in the eyes of the LORD. When the book of the law was found in the house of the LORD, he led the people back to the LORD and tore down the idols in the land.","era":4,"degree":5},{"id":"jotham_1734","name":"Jotham","tag":"son of Jerubbaal","summary":"The youngest son of Gideon, the only one to escape when Abimelech killed his brothers. From Mount Gerizim he told a parable of the trees that warned Shechem what its new king would bring.","era":2,"degree":2},{"id":"jotham_1735","name":"Jotham","tag":"son of Uzziah","summary":"A son of Uzziah who judged the people while his father was a leper, then reigned sixteen years in Jerusalem. He did right in the LORD's sight and grew mighty.","era":4,"degree":2},{"id":"judah_1751","name":"Judah","tag":null,"summary":"Jacob's fourth son, born to Leah. He urged his brothers to sell Joseph, but later offered himself as a slave in Benjamin's place, and Jacob said the right to rule would not leave Judah.","era":0,"degree":5},{"id":"judas_1760","name":"Judas Iscariot","tag":null,"summary":"One of the twelve apostles, the son of Simon, who kept the disciples' money bag. He betrayed Jesus to the chief priests for thirty pieces of silver.","era":6,"degree":2},{"id":"korah_1795","name":"Korah","tag":null,"summary":"A Levite who led a rebellion against Moses and Aaron, claiming the whole congregation was holy. The earth opened and swallowed him and his followers, though his own children did not die.","era":1,"degree":2},{"id":"laban_1803","name":"Laban","tag":null,"summary":"Rebekah's brother, who later became Jacob's father-in-law. He gave Jacob Leah when Jacob had worked for Rachel, but in the end he and Jacob made a covenant of peace.","era":0,"degree":4},{"id":"lazarus_1812","name":"Lazarus","tag":null,"summary":"A man of Bethany, brother of Martha and Mary, whom Jesus loved. After he had been dead four days, Jesus called him out of the tomb alive.","era":6,"degree":3},{"id":"leah_1813","name":"Leah","tag":null,"summary":"Laban's older daughter, whom Laban gave to Jacob in place of Rachel. Though Jacob loved Rachel more, Leah became the mother of six of his sons, including Levi and Judah, and of his daughter Dinah.","era":0,"degree":12},{"id":"lebbaeus_1815","name":"Thaddaeus","tag":null,"summary":"One of the twelve apostles, also called Lebbaeus and Judas the brother of James. He is not Judas Iscariot, the one who betrayed Jesus.","era":6,"degree":1},{"id":"levi_1820","name":"Levi","tag":null,"summary":"Jacob's third son, born to Leah. With his brother Simeon he took violent revenge on the city of Shechem, and Jacob cursed their fierce anger.","era":0,"degree":4},{"id":"lot_1830","name":"Lot","tag":null,"summary":"Abraham's nephew, who traveled with him to Canaan and then chose to live near Sodom. When the LORD destroyed Sodom, angels led Lot and his family out, but his wife looked back.","era":0,"degree":1},{"id":"luke_1836","name":"Luke","tag":null,"summary":"A companion of Paul whom Paul called the beloved physician and one of his fellow workers. When others had gone, Luke was the only one still with Paul.","era":7,"degree":1},{"id":"lydia_1837","name":"Lydia","tag":null,"summary":"A seller of purple from the city of Thyatira who worshipped God. In Philippi the Lord opened her heart to Paul's message, and she was baptized with her household and opened her home to Paul and his companions.","era":7,"degree":1},{"id":"malachi_1899","name":"Malachi","tag":null,"summary":"A prophet through whom the LORD sent His word to Israel. The LORD answered the people's doubting questions and promised to send His messenger before Him.","era":5,"degree":1},{"id":"manasseh_1928","name":"Manasseh","tag":"son of Joseph","summary":"Joseph's firstborn son, born in Egypt. Jacob claimed him as his own son, but when blessing him put his younger brother Ephraim first.","era":0,"degree":3},{"id":"manasseh_1930","name":"Manasseh","tag":"son of Hezekiah","summary":"A son of Hezekiah who became king of Judah at twelve and led the people into more evil than the nations before them. Taken in chains to Babylon, he humbled himself, and the LORD brought him home.","era":4,"degree":2},{"id":"manoah_1933","name":"Manoah","tag":null,"summary":"A man of Zorah, of the family of the Danites, whose wife had no children until the angel of the LORD promised them a son. That son was Samson.","era":2,"degree":1},{"id":"mark_1679","name":"John Mark","tag":null,"summary":"John, also called Mark, whose mother's house was a place where believers gathered to pray. He helped Barnabas and Saul, left them partway through a journey, and later Paul asked for him as one useful in the ministry.","era":7,"degree":2},{"id":"martha_1937","name":"Martha","tag":null,"summary":"A woman of Bethany, sister of Mary and Lazarus, whom Jesus loved. She welcomed Jesus into her house, and when Lazarus died she told Jesus she believed He was the Christ.","era":6,"degree":3},{"id":"mary_1938","name":"Mary","tag":"mother of Jesus","summary":"A virgin of Nazareth, engaged to Joseph, whom the angel Gabriel told she would bear the Son of God. She gave birth to Jesus in Bethlehem and stood by His cross.","era":6,"degree":5},{"id":"mary_1939","name":"Mary","tag":"sister of Lazarus","summary":"A woman of Bethany, sister of Martha and Lazarus, who loved to sit and listen to Jesus. Before His death she poured costly ointment on His feet and dried them with her hair.","era":6,"degree":3},{"id":"mary_1943","name":"Mary Magdalene","tag":null,"summary":"A woman out of whom Jesus cast seven devils, who followed Him and helped provide for Him. She watched His crucifixion, and she was the first to whom He appeared after He rose.","era":6,"degree":1},{"id":"matthew_1971","name":"Matthew","tag":null,"summary":"A tax collector, also called Levi, who got up and followed Jesus when He called. He became one of the twelve apostles.","era":6,"degree":1},{"id":"melchisedec_1991","name":"Melchisedec","tag":null,"summary":"The king of Salem and a priest of the most high God, who met Abram with bread and wine and blessed him. Abram gave him a tenth of everything.","era":0,"degree":1},{"id":"mephibosheth_1999","name":"Mephibosheth","tag":null,"summary":"The son of Jonathan and grandson of Saul, lame in both feet since he was a child. King David showed him kindness for Jonathan's sake and gave him a place at the king's table.","era":3,"degree":3},{"id":"meshach_2092","name":"Meshach","tag":null,"summary":"Meshach, first called Mishael, was one of Daniel's friends from Judah taken to Babylon. With Shadrach and Abednego he would not worship the king's golden image and was thrown into a fiery furnace, but God delivered them.","era":5,"degree":4},{"id":"methuselah_2042","name":"Methuselah","tag":null,"summary":"The son of Enoch and the grandfather of Noah. He lived to be 969 years old.","era":0,"degree":1},{"id":"micah_2049","name":"Micah","tag":"of mount Ephraim","summary":"A man of mount Ephraim who made a house of idols and hired a Levite as his own priest, in the days when Israel had no king. Men of the tribe of Dan later carried off his gods and his priest.","era":2,"degree":1},{"id":"micah_2053","name":"Micah","tag":"the Morasthite","summary":"A prophet from Moresheth to whom the word of the LORD came in the days of Jotham, Ahaz and Hezekiah, kings of Judah. He spoke against the sins of Samaria and Jerusalem and told what the LORD requires.","era":5,"degree":1},{"id":"micaiah_2054","name":"Micaiah","tag":null,"summary":"A prophet, the son of Imlah, whom Israel's king hated, saying he only ever foretold trouble for him. When four hundred prophets promised victory at Ramoth-gilead, Micaiah alone spoke the LORD's warning.","era":4,"degree":2},{"id":"michal_2073","name":"Michal","tag":null,"summary":"A daughter of King Saul who loved David, became his wife, and once saved his life from her father. Later she despised David for dancing before the LORD, and she had no child to the day of her death.","era":3,"degree":3},{"id":"miriam_2087","name":"Miriam","tag":null,"summary":"A prophetess and the sister of Aaron and Moses, who led the women in song after the LORD's victory at the sea. She died at Kadesh in the desert of Zin.","era":1,"degree":2},{"id":"mordecai_2107","name":"Mordecai","tag":null,"summary":"Mordecai was a Jew of the tribe of Benjamin in Shushan who raised his cousin Esther as his own daughter. He would not bow to Haman, urged Esther to plead for her people, and rose to be next to the king.","era":5,"degree":3},{"id":"moses_2108","name":"Moses","tag":null,"summary":"The man God sent to bring Israel out of bondage in Egypt. He led the people through the sea, received God's law at Mount Sinai, and died within sight of the promised land.","era":1,"degree":13},{"id":"naaman_2122","name":"Naaman","tag":null,"summary":"The captain of the king of Syria's army, a great and brave man who had leprosy. Washing in the Jordan at Elisha's word made him clean, and he vowed to worship only the LORD.","era":4,"degree":2},{"id":"nabal_2126","name":"Nabal","tag":null,"summary":"A rich man of Maon with flocks at Carmel, harsh and evil in what he did, who refused to help David's men. The LORD struck him, and he died ten days after he learned his wife Abigail had gone out to meet David.","era":3,"degree":2},{"id":"naboth_2127","name":"Naboth","tag":null,"summary":"A man of Jezreel who would not give his family's vineyard to King Ahab. Ahab's wife Jezebel had him falsely accused and stoned, and the LORD judged Ahab for it.","era":4,"degree":2},{"id":"nahum_2145","name":"Nahum","tag":null,"summary":"A prophet from Elkosh whose whole book is a vision that Nineveh, the bloody city, would be laid waste. Scripture tells nothing more about him and names no one else alongside him.","era":5,"degree":0},{"id":"naomi_2147","name":"Naomi","tag":null,"summary":"A woman of Bethlehem who lost her husband and both sons in Moab and came home saying the LORD had brought her back empty. Through her daughter-in-law Ruth and Boaz, she was given a grandson, Obed, the grandfather of David.","era":2,"degree":2},{"id":"naphtali_2149","name":"Naphtali","tag":null,"summary":"A son of Jacob, born to Bilhah, Rachel's maid. Jacob said Naphtali was a deer let loose who gives good words.","era":0,"degree":2},{"id":"nathan_2153","name":"Nathan","tag":"the prophet","summary":"A prophet who brought the LORD's words to King David. He told David of God's promise, rebuked him over Uriah and Bathsheba, and helped make Solomon king.","era":3,"degree":5},{"id":"nebuchadnezzar_2167","name":"Nebuchadnezzar","tag":null,"summary":"A king of Babylon who took Jerusalem, carried its people away captive, and later had the city and the house of the LORD burned. In Babylon God humbled him, and he came to praise the King of heaven.","era":4,"degree":10},{"id":"nehemiah_2172","name":"Nehemiah","tag":null,"summary":"Nehemiah son of Hachaliah served King Artaxerxes in Shushan the palace. When he heard that the wall of Jerusalem was broken down, he went there as governor and led the people to build it again.","era":5,"degree":3},{"id":"nicodemus_2204","name":"Nicodemus","tag":null,"summary":"A Pharisee and a ruler of the Jews who visited Jesus at night to talk with Him. Later he spoke up for Jesus among the Pharisees and helped lay His body in the tomb.","era":6,"degree":2},{"id":"noah_2210","name":"Noah","tag":null,"summary":"A righteous man who walked with God when the earth was full of violence. God had him build an ark that saved his family and the animals from the flood, then promised never to flood the earth again.","era":0,"degree":3},{"id":"obadiah_2226","name":"Obadiah","tag":null,"summary":"A prophet who saw a vision from the Lord GOD that Edom's pride would be brought down, because it rejoiced when Judah was destroyed. Scripture tells nothing more about him and names no one else alongside him.","era":5,"degree":0},{"id":"onesimus_2251","name":"Onesimus","tag":null,"summary":"A man from among the Colossian believers who had once served Philemon and became like a son to Paul while Paul was in chains. Paul sent him back, asking Philemon to welcome him as a beloved brother.","era":7,"degree":2},{"id":"ornan_289","name":"Ornan","tag":null,"summary":"A Jebusite whose threshing floor David bought to build an altar to the LORD. The LORD stopped His angel there, and Solomon later built the house of the LORD on that spot.","era":4,"degree":1},{"id":"othniel_2259","name":"Othniel","tag":null,"summary":"The son of Kenaz and younger brother of Caleb, who took a city to win Caleb's daughter Achsah. When Israel cried out after eight years under the king of Mesopotamia, the LORD raised him up as a deliverer, and the land had rest forty years.","era":2,"degree":1},{"id":"paul_2479","name":"Paul","tag":null,"summary":"A man from Tarsus, first called Saul, who attacked the church until Jesus spoke to him on the road to Damascus. He became an apostle who carried the gospel to the Gentiles in many lands and wrote many letters to the churches.","era":7,"degree":23},{"id":"pekah_2299","name":"Pekah","tag":null,"summary":"A captain who killed his king, Pekahiah, and took the throne of Israel in Samaria. In his days Assyria carried off much of Israel, and in the end Hoshea killed him and took his throne.","era":4,"degree":2},{"id":"peter_2745","name":"Simon Peter","tag":null,"summary":"A fisherman whom Jesus called to follow Him, and one of the twelve apostles. He confessed Jesus as the Christ, denied Him three times on the night of His arrest, and later preached boldly in Jerusalem.","era":6,"degree":16},{"id":"pharaoh_2329","name":"Pharaoh","tag":"in Joseph's day","summary":"The king of Egypt whose troubling dreams Joseph explained. He made Joseph ruler over Egypt and welcomed Jacob's family to live in Goshen.","era":0,"degree":3},{"id":"pharaoh_2330","name":"Pharaoh","tag":"new king over Egypt","summary":"The king of Egypt who did not know Joseph and feared how many the Israelites had become. He forced them into hard labor and ordered their newborn sons thrown into the river.","era":1,"degree":2},{"id":"pharaoh_2331","name":"Pharaoh","tag":"who faced Moses","summary":"The king of Egypt whom Moses and Aaron told to let Israel go. He hardened his heart through plague after plague, until the LORD struck Egypt's firstborn and then threw his army into the sea.","era":1,"degree":2},{"id":"pharaoh_2336","name":"Pharaoh","tag":"in Jeremiah's day","summary":"Pharaohhophra was a king of Egypt in the days of Jeremiah and Ezekiel. The LORD said He would hand him over to his enemies and break his arms before the king of Babylon.","era":5,"degree":1},{"id":"philemon_2342","name":"Philemon","tag":null,"summary":"A dearly loved fellow worker of Paul, with a church meeting in his house. Paul wrote to him asking him to take back his servant Onesimus as a beloved brother.","era":7,"degree":2},{"id":"philip_2344","name":"Philip","tag":"of Bethsaida","summary":"A man from Bethsaida whom Jesus called to follow Him, and one of the twelve apostles. He brought Nathanael to Jesus and later asked Jesus to show them the Father.","era":6,"degree":1},{"id":"philip_2347","name":"Philip","tag":"the evangelist","summary":"One of the seven men chosen to serve the church, later called Philip the evangelist. He preached Christ in Samaria and baptized an Ethiopian official on a desert road.","era":7,"degree":3},{"id":"phinehas_2349","name":"Phinehas","tag":null,"summary":"Aaron's grandson, a priest whose zeal for God stopped a plague in Israel. The LORD promised him and his descendants a lasting priesthood.","era":1,"degree":2},{"id":"pilate_2365","name":"Pontius Pilate","tag":null,"summary":"The governor of Judaea who questioned Jesus and found no fault in Him. Pressed by the crowd, he released Barabbas and handed Jesus over to be crucified.","era":6,"degree":3},{"id":"portius_2367","name":"Festus","tag":null,"summary":"The governor who took Felix's place and found Paul still a prisoner. When Paul appealed to Caesar, Festus agreed to send him, and he laid Paul's case before King Agrippa.","era":7,"degree":2},{"id":"potiphar_2368","name":"Potiphar","tag":null,"summary":"An officer of Pharaoh and captain of the guard who bought Joseph. He put Joseph in charge of his whole house, then had him thrown into prison.","era":0,"degree":2},{"id":"priscilla_2370","name":"Priscilla","tag":null,"summary":"The wife of Aquila, who with him worked alongside Paul as a tentmaker in Corinth. With her husband she explained God's way more fully to Apollos, and a church met in their home.","era":7,"degree":3},{"id":"queen_of_sheba_2379","name":"Queen of Sheba","tag":null,"summary":"A queen who heard of Solomon's fame and came to Jerusalem to test him with hard questions. Amazed by his wisdom, she blessed the LORD and gave the king great gifts.","era":4,"degree":1},{"id":"rabshakeh_2384","name":"Rabshakeh","tag":null,"summary":"A man sent by Assyria's king with a huge army to Jerusalem. Standing outside the wall, he mocked King Hezekiah's faith in the LORD.","era":4,"degree":2},{"id":"rachel_2386","name":"Rachel","tag":null,"summary":"Laban's younger daughter, whom Jacob loved and worked fourteen years for. She was the mother of Joseph and Benjamin, and she died giving birth to Benjamin.","era":0,"degree":7},{"id":"rahab_2388","name":"Rahab","tag":null,"summary":"A harlot of Jericho who hid Joshua's spies because she believed the LORD had given Israel the land. She and her family were spared when Jericho fell.","era":2,"degree":1},{"id":"rebekah_2401","name":"Rebekah","tag":null,"summary":"The woman God led Abraham's servant to as a wife for Isaac. She was the mother of Esau and Jacob, and she helped Jacob take his father's blessing.","era":0,"degree":4},{"id":"rehoboam_2412","name":"Rehoboam","tag":null,"summary":"The son of Solomon who became king after him. When he answered the people harshly, the tribes of Israel broke away, and he was left to reign over Judah from Jerusalem.","era":4,"degree":3},{"id":"reuben_2429","name":"Reuben","tag":null,"summary":"Jacob's firstborn son, born to Leah. He tried to save Joseph when the brothers planned to kill him, but Jacob said he would not excel because he had defiled his father's bed.","era":0,"degree":5},{"id":"ruth_2450","name":"Ruth","tag":null,"summary":"A woman of Moab who would not leave her mother-in-law Naomi and came to trust the God of Israel. She married Boaz of Bethlehem and became the great-grandmother of David.","era":2,"degree":2},{"id":"samson_2468","name":"Samson","tag":null,"summary":"A Nazarite from birth, given great strength by the Spirit of the LORD, who judged Israel twenty years in the days of the Philistines. Betrayed by Delilah and blinded, he pulled down the house of Dagon on the Philistines at his death.","era":2,"degree":2},{"id":"samuel_2469","name":"Samuel","tag":null,"summary":"A prophet and judge, given to the LORD as a child by his mother Hannah, whom the LORD called by name in the night at Shiloh. He judged Israel all his life and anointed both Saul and David as king.","era":3,"degree":5},{"id":"sanballat_2470","name":"Sanballat","tag":null,"summary":"Sanballat the Horonite was an enemy of Nehemiah who mocked the Jews and tried to stop them from rebuilding the wall of Jerusalem. He plotted to harm Nehemiah, but the wall was finished.","era":5,"degree":2},{"id":"sapphira_2472","name":"Sapphira","tag":null,"summary":"The wife of Ananias in the early church. She agreed with her husband to keep back part of the price of their land, lied to Peter about it, and fell down dead.","era":7,"degree":2},{"id":"sarah_2473","name":"Sarah","tag":null,"summary":"Abraham's wife, who had no children for many years. In her old age God kept His promise, and she gave birth to Isaac.","era":0,"degree":4},{"id":"saul_2478","name":"Saul","tag":null,"summary":"A tall young man of the tribe of Benjamin, the king the LORD gave Israel when they asked for one. He disobeyed the LORD, grew jealous of David, and died in battle on Mount Gilboa.","era":3,"degree":9},{"id":"seth_2504","name":"Seth","tag":null,"summary":"The son born to Adam and Eve after Cain killed Abel. After his son Enos was born, men began to call on the name of the LORD.","era":0,"degree":3},{"id":"shadrach_1398","name":"Shadrach","tag":null,"summary":"A young man of Judah, first called Hananiah, who was trained in the court of Babylon with Daniel. With Meshach and Abednego he refused to worship the king's golden image, and God brought them out of the furnace unharmed.","era":5,"degree":4},{"id":"sheba_2570","name":"Sheba","tag":"son of Bichri","summary":"A Benjamite who blew a trumpet and led Israel away from King David after Absalom's revolt. Joab chased him to the city of Abel, where the people cut off his head.","era":3,"degree":3},{"id":"shem_2613","name":"Shem","tag":null,"summary":"One of Noah's three sons, who was saved with his family in the ark. Noah praised the LORD as Shem's God, and Shem's family line led down to Abram.","era":0,"degree":3},{"id":"shimei_2684","name":"Shimei","tag":"son of Gera","summary":"A man of Saul's family from Bahurim who cursed David as he fled from Absalom. David spared him, but Solomon later put him to death for breaking his oath.","era":3,"degree":4},{"id":"sihon_2739","name":"Sihon","tag":null,"summary":"A king of the Amorites who ruled from Heshbon. When he refused to let Israel pass through his land and attacked them, Israel defeated him and took his land.","era":1,"degree":1},{"id":"silas_2740","name":"Silas","tag":null,"summary":"A leader and prophet among the believers who carried the apostles' letter to Antioch. He became Paul's companion, sang with him in prison at midnight, and helped spread the word through Macedonia.","era":7,"degree":2},{"id":"simeon_2741","name":"Simeon","tag":"son of Jacob","summary":"Jacob's second son, born to Leah. With his brother Levi he took violent revenge on the city of Shechem, and later Joseph held him as a prisoner in Egypt.","era":0,"degree":5},{"id":"simeon_2742","name":"Simeon","tag":"of Jerusalem","summary":"A just and devout man in Jerusalem who was waiting for the comfort of Israel. The Holy Ghost had shown him he would not die before seeing the Lord's Christ, and he took the baby Jesus in his arms in the temple.","era":6,"degree":3},{"id":"simon_2746","name":"Simon","tag":"called Zelotes","summary":"One of the twelve apostles Jesus chose, called Simon Zelotes and Simon the Canaanite. Scripture names him in the lists of the twelve and among those praying in the upper room after Jesus was taken up.","era":6,"degree":1},{"id":"simon_2749","name":"Simon","tag":"of Cyrene","summary":"A man of Cyrene, the father of Alexander and Rufus, who was coming in from the country as Jesus was led away. The soldiers made him carry Jesus' cross.","era":6,"degree":1},{"id":"simon_2752","name":"Simon","tag":"the sorcerer","summary":"A sorcerer in Samaria who had amazed the people, until he believed and was baptized when Philip preached. When he offered money for the power to give the Holy Ghost, Peter rebuked him.","era":7,"degree":2},{"id":"sisera_2757","name":"Sisera","tag":null,"summary":"The captain of King Jabin's army, who oppressed Israel for twenty years with nine hundred iron chariots. The LORD routed his army before Barak, and Jael killed him in her tent.","era":2,"degree":3},{"id":"solomon_2762","name":"Solomon","tag":null,"summary":"The son of David and Bathsheba who ruled Israel after his father. The LORD gave him great wisdom and he built the house of the LORD in Jerusalem, but in his old age his wives turned his heart to other gods.","era":4,"degree":13},{"id":"stephen_2802","name":"Stephen","tag":null,"summary":"One of the seven chosen to serve the church, full of faith, power and the Holy Ghost, who did great wonders among the people. He was stoned after telling the council he saw Jesus standing at the right hand of God, and he prayed for those who killed him.","era":7,"degree":3},{"id":"tamar_2821","name":"Tamar","tag":"Judah's daughter-in-law","summary":"The widow of Judah's son Er, left waiting when Judah did not give her to his son Shelah. She bore Judah twin sons, and he admitted she was more righteous than he.","era":0,"degree":1},{"id":"tamar_2822","name":"Tamar","tag":"sister of Absalom","summary":"A daughter of King David and the sister of Absalom. Her brother Amnon forced her, and Absalom later had him killed for it.","era":3,"degree":3},{"id":"the_giant_in_gath_2848","name":"the giant in Gath","tag":null,"summary":"A giant of the Philistines whose four sons, born to him in Gath, fell by the hand of David and his servants. Scripture never shows the giant himself with anyone; it was his sons who fought.","era":3,"degree":0},{"id":"thomas_2851","name":"Thomas","tag":null,"summary":"One of the twelve apostles, also called Didymus. He would not believe Jesus had risen until he saw Him, and then he called Jesus his Lord and his God.","era":6,"degree":1},{"id":"timotheus_2863","name":"Timotheus","tag":null,"summary":"A disciple with a believing Jewish mother and a Greek father, who became Paul's close helper on his travels. Paul sent him to strengthen the churches and called him his dearly beloved son.","era":7,"degree":2},{"id":"titus_2869","name":"Titus","tag":null,"summary":"A Greek believer who travelled with Paul and was his trusted partner. Paul sent him to the Corinthians, was comforted by his coming, and left him in Crete to set things in order and appoint elders.","era":7,"degree":1},{"id":"tobiah_2872","name":"Tobiah","tag":null,"summary":"Tobiah the Ammonite joined Sanballat in mocking and opposing the rebuilding of Jerusalem's wall. Later a priest gave him a room in God's house, and Nehemiah threw his things out.","era":5,"degree":2},{"id":"uriah_2898","name":"Uriah","tag":null,"summary":"A Hittite and one of David's mighty men, the husband of Bathsheba. David had him placed where the fighting was fiercest so that he would be killed.","era":3,"degree":3},{"id":"uzziah_375","name":"Uzziah","tag":null,"summary":"A king of Judah, also called Azariah, who began to reign at sixteen and grew strong while he looked to God. When pride led him to burn incense in the temple, he became a leper until he died.","era":4,"degree":2},{"id":"vashti_2937","name":"Vashti","tag":null,"summary":"Vashti was the queen of King Ahasuerus. When she would not come at his command, the king took away her royal place and later made Esther queen instead.","era":5,"degree":1},{"id":"zacchaeus_2961","name":"Zacchaeus","tag":null,"summary":"A rich chief tax collector in Jericho who climbed a tree to see Jesus. Jesus stayed at his house, and Zacchaeus said he would give half his goods to the poor.","era":6,"degree":1},{"id":"zacharias_2971","name":"Zacharias","tag":null,"summary":"A priest who, with his wife Elisabeth, had no children into old age. The angel Gabriel told him he would have a son, John, and because he did not believe, he could not speak until the boy was named.","era":6,"degree":2},{"id":"zadok_2973","name":"Zadok","tag":"the priest","summary":"A priest, the son of Ahitub, who stayed loyal to King David. He carried the ark during Absalom's revolt and anointed Solomon king.","era":3,"degree":6},{"id":"zebulun_3002","name":"Zebulun","tag":null,"summary":"Jacob's sixth son by Leah. Jacob said Zebulun would live by the sea and be a haven for ships.","era":0,"degree":2},{"id":"zechariah_3016","name":"Zechariah","tag":null,"summary":"A prophet, the son of Berechiah, who spoke to the people who had come back to Jerusalem. With Haggai he urged them to build the house of God, and the LORD showed him visions in the night.","era":5,"degree":4},{"id":"zedekiah_1950","name":"Zedekiah","tag":null,"summary":"The last king of Judah, whom the king of Babylon set on the throne and renamed from Mattaniah. He did evil, rebelled against Babylon, and would not obey the word of the LORD through Jeremiah, so he saw Jerusalem fall.","era":4,"degree":4},{"id":"zephaniah_3040","name":"Zephaniah","tag":null,"summary":"A prophet, the son of Cushi, who warned in the days of King Josiah that the day of the LORD was near and told the meek to seek the LORD. Scripture tells nothing more about him, and no story places him with anyone else.","era":5,"degree":0},{"id":"zerubbabel_3054","name":"Zerubbabel","tag":null,"summary":"Zerubbabel son of Shealtiel led people back from captivity and became governor of Judah. With Jeshua the priest he began rebuilding the house of the LORD in Jerusalem, and the LORD promised that his hands would finish it.","era":5,"degree":3},{"id":"zipporah_3095","name":"Zipporah","tag":null,"summary":"A daughter of the priest of Midian, given to Moses as his wife after he helped her and her sisters at a well. On the way to Egypt she circumcised her son when the LORD met him and sought to kill him.","era":1,"degree":2},{"id":"zophar_3105","name":"Zophar","tag":null,"summary":"Zophar the Naamathite was one of Job's three friends, and he told Job that God was asking less of him than his sin deserved. The LORD later said the three friends had not spoken of Him what was right.","era":5,"degree":4}],"links":[{"a":"aaron_1","b":"moses_2108","type":"family","why":"Aaron was Moses' brother; both were sons of Amram and Jochebed.","refs":[{"ref":"Exodus 4:14","verses":[["Exodus 4:14","And the anger of the LORD was kindled against Moses, and he said, Is not Aaron the Levite thy brother? I know that he can spea
