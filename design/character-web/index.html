 this Joseph of Arimathaea, being a disciple of Jesus, but secretly for fear of the Jews, besought Pilate that he might take away the body of Jesus: and Pilate gave him leave. He came therefore, and took the body of Jesus."],["John 19:39","And there came also Nicodemus, which at the first came to Jesus by night, and brought a mixture of myrrh and aloes, about an hundred pound weight."],["John 19:40","Then took they the body of Jesus, and wound it in linen clothes with the spices, as the manner of the Jews is to bury."],["John 19:41","Now in the place where he was crucified there was a garden; and in the garden a new sepulchre, wherein was never man yet laid."],["John 19:42","There laid they Jesus therefore because of the Jews’ preparation day; for the sepulchre was nigh at hand."]]}]},{"a":"jesus_905","b":"simon_2749","type":"helped","why":"As Jesus was led to be crucified, the soldiers compelled Simon of Cyrene to carry his cross after him.","refs":[{"ref":"Mark 15:21","verses":[["Mark 15:21","And they compel one Simon a Cyrenian, who passed by, coming out of the country, the father of Alexander and Rufus, to bear his cross."]]},{"ref":"Luke 23:26","verses":[["Luke 23:26","And as they led him away, they laid hold upon one Simon, a Cyrenian, coming out of the country, and on him they laid the cross, that he might bear it after Jesus."]]}]},{"a":"barabbas_399","b":"jesus_905","type":"crossed_paths","why":"Pilate offered the crowd Jesus or Barabbas; they chose Barabbas, who was released while Jesus was delivered to be crucified.","refs":[{"ref":"Matthew 27:15–26","verses":[["Matthew 27:15","Now at that feast the governor was wont to release unto the people a prisoner, whom they would."],["Matthew 27:16","And they had then a notable prisoner, called Barabbas."],["Matthew 27:17","Therefore when they were gathered together, Pilate said unto them, Whom will ye that I release unto you? Barabbas, or Jesus which is called Christ?"],["Matthew 27:18","For he knew that for envy they had delivered him."],["Matthew 27:19","When he was set down on the judgment seat, his wife sent unto him, saying, Have thou nothing to do with that just man: for I have suffered many things this day in a dream because of him."],["Matthew 27:20","But the chief priests and elders persuaded the multitude that they should ask Barabbas, and destroy Jesus."],["Matthew 27:21","The governor answered and said unto them, Whether of the twain will ye that I release unto you? They said, Barabbas."],["Matthew 27:22","Pilate saith unto them, What shall I do then with Jesus which is called Christ? They all say unto him, Let him be crucified."],["Matthew 27:23","And the governor said, Why, what evil hath he done? But they cried out the more, saying, Let him be crucified."],["Matthew 27:24","When Pilate saw that he could prevail nothing, but that rather a tumult was made, he took water, and washed his hands before the multitude, saying, I am innocent of the blood of this just person: see ye to it."],["Matthew 27:25","Then answered all the people, and said, His blood be on us, and on our children."],["Matthew 27:26","Then released he Barabbas unto them: and when he had scourged Jesus, he delivered him to be crucified."]]}]},{"a":"barabbas_399","b":"pilate_2365","type":"crossed_paths","why":"Barabbas was a prisoner who had committed murder in the insurrection, and Pilate released him to the crowd in place of Jesus.","refs":[{"ref":"Mark 15:6–15","verses":[["Mark 15:6","Now at that feast he released unto them one prisoner, whomsoever they desired."],["Mark 15:7","And there was one named Barabbas, which lay bound with them that had made insurrection with him, who had committed murder in the insurrection."],["Mark 15:8","And the multitude crying aloud began to desire him to do as he had ever done unto them."],["Mark 15:9","But Pilate answered them, saying, Will ye that I release unto you the King of the Jews?"],["Mark 15:10","For he knew that the chief priests had delivered him for envy."],["Mark 15:11","But the chief priests moved the people, that he should rather release Barabbas unto them."],["Mark 15:12","And Pilate answered and said again unto them, What will ye then that I shall do unto him whom ye call the King of the Jews?"],["Mark 15:13","And they cried out again, Crucify him."],["Mark 15:14","Then Pilate said unto them, Why, what evil hath he done? And they cried out the more exceedingly, Crucify him."],["Mark 15:15","And so Pilate, willing to content the people, released Barabbas unto them, and delivered Jesus, when he had scourged him, to be crucified."]]}]},{"a":"herod_1505","b":"herodias_1507","type":"married","why":"Herod married Herodias, his brother Philip's wife.","refs":[{"ref":"Mark 6:17","verses":[["Mark 6:17","For Herod himself had sent forth and laid hold upon John, and bound him in prison for Herodias’ sake, his brother Philip’s wife: for he had married her."]]}]},{"a":"herodias_1507","b":"john_1676","type":"enemies","why":"Herodias had a quarrel against John and would have killed him, and she had her daughter ask for his head.","refs":[{"ref":"Mark 6:17–28","verses":[["Mark 6:17","For Herod himself had sent forth and laid hold upon John, and bound him in prison for Herodias’ sake, his brother Philip’s wife: for he had married her."],["Mark 6:18","For John had said unto Herod, It is not lawful for thee to have thy brother’s wife."],["Mark 6:19","Therefore Herodias had a quarrel against him, and would have killed him; but she could not:"],["Mark 6:20","For Herod feared John, knowing that he was a just man and an holy, and observed him; and when he heard him, he did many things, and heard him gladly."],["Mark 6:21","And when a convenient day was come, that Herod on his birthday made a supper to his lords, high captains, and chief estates of Galilee;"],["Mark 6:22","And when the daughter of the said Herodias came in, and danced, and pleased Herod and them that sat with him, the king said unto the damsel, Ask of me whatsoever thou wilt, and I will give it thee."],["Mark 6:23","And he sware unto her, Whatsoever thou shalt ask of me, I will give it thee, unto the half of my kingdom."],["Mark 6:24","And she went forth, and said unto her mother, What shall I ask? And she said, The head of John the Baptist."],["Mark 6:25","And she came in straightway with haste unto the king, and asked, saying, I will that thou give me by and by in a charger the head of John the Baptist."],["Mark 6:26","And the king was exceeding sorry; yet for his oath’s sake, and for their sakes which sat with him, he would not reject her."],["Mark 6:27","And immediately the king sent an executioner, and commanded his head to be brought: and he went and beheaded him in the prison,"],["Mark 6:28","And brought his head in a charger, and gave it to the damsel: and the damsel gave it to her mother."]]}]},{"a":"ananias_258","b":"sapphira_2472","type":"married","why":"Sapphira was Ananias's wife, and she was privy to his lie.","refs":[{"ref":"Acts 5:1–2","verses":[["Acts 5:1","But a certain man named Ananias, with Sapphira his wife, sold a possession,"],["Acts 5:2","And kept back part of the price, his wife also being privy to it, and brought a certain part, and laid it at the apostles’ feet."]]}]},{"a":"peter_2745","b":"sapphira_2472","type":"rebuked","why":"Peter confronted Sapphira for agreeing with her husband to tempt the Spirit of the Lord, and she fell down dead.","refs":[{"ref":"Acts 5:7–10","verses":[["Acts 5:7","And it was about the space of three hours after, when his wife, not knowing what was done, came in."],["Acts 5:8","And Peter answered unto her, Tell me whether ye sold the land for so much? And she said, Yea, for so much."],["Acts 5:9","Then Peter said unto her, How is it that ye have agreed together to tempt the Spirit of the Lord? behold, the feet of them which have buried thy husband are at the door, and shall carry thee out."],["Acts 5:10","Then fell she down straightway at his feet, and yielded up the ghost: and the young men came in, and found her dead, and, carrying her forth, buried her by her husband."]]}]},{"a":"annas_269","b":"caiaphas_532","type":"family","why":"Annas was father-in-law to Caiaphas.","refs":[{"ref":"John 18:13","verses":[["John 18:13","And led him away to Annas first; for he was father in law to Caiaphas, which was the high priest that same year."]]}]},{"a":"annas_269","b":"jesus_905","type":"judged","why":"After his arrest Jesus was led to Annas first, was questioned by the high priest about his disciples and his doctrine, and Annas sent him bound to Caiaphas.","refs":[{"ref":"John 18:12–24","verses":[["John 18:12","Then the band and the captain and officers of the Jews took Jesus, and bound him,"],["John 18:13","And led him away to Annas first; for he was father in law to Caiaphas, which was the high priest that same year."],["John 18:14","Now Caiaphas was he, which gave counsel to the Jews, that it was expedient that one man should die for the people."],["John 18:15","And Simon Peter followed Jesus, and so did another disciple: that disciple was known unto the high priest, and went in with Jesus into the palace of the high priest."],["John 18:16","But Peter stood at the door without. Then went out that other disciple, which was known unto the high priest, and spake unto her that kept the door, and brought in Peter."],["John 18:17","Then saith the damsel that kept the door unto Peter, Art not thou also one of this man’s disciples? He saith, I am not."],["John 18:18","And the servants and officers stood there, who had made a fire of coals; for it was cold: and they warmed themselves: and Peter stood with them, and warmed himself."],["John 18:19","The high priest then asked Jesus of his disciples, and of his doctrine."],["John 18:20","Jesus answered him, I spake openly to the world; I ever taught in the synagogue, and in the temple, whither the Jews always resort; and in secret have I said nothing."],["John 18:21","Why askest thou me? ask them which heard me, what I have said unto them: behold, they know what I said."],["John 18:22","And when he had thus spoken, one of the officers which stood by struck Jesus with the palm of his hand, saying, Answerest thou the high priest so?"],["John 18:23","Jesus answered him, If I have spoken evil, bear witness of the evil: but if well, why smitest thou me?"],["John 18:24","Now Annas had sent him bound unto Caiaphas the high priest."]]}]},{"a":"annas_269","b":"peter_2745","type":"judged","why":"Annas sat with the council that set Peter in their midst, questioned him about the healing of the lame man, threatened him and let him go.","refs":[{"ref":"Acts 4:5–21","verses":[["Acts 4:5","And it came to pass on the morrow, that their rulers, and elders, and scribes,"],["Acts 4:6","And Annas the high priest, and Caiaphas, and John, and Alexander, and as many as were of the kindred of the high priest, were gathered together at Jerusalem."],["Acts 4:7","And when they had set them in the midst, they asked, By what power, or by what name, have ye done this?"],["Acts 4:8","Then Peter, filled with the Holy Ghost, said unto them, Ye rulers of the people, and elders of Israel,"],["Acts 4:9","If we this day be examined of the good deed done to the impotent man, by what means he is made whole;"],["Acts 4:10","Be it known unto you all, and to all the people of Israel, that by the name of Jesus Christ of Nazareth, whom ye crucified, whom God raised from the dead, even by him doth this man stand here before you whole."],["Acts 4:11","This is the stone which was set at nought of you builders, which is become the head of the corner."],["Acts 4:12","Neither is there salvation in any other: for there is none other name under heaven given among men, whereby we must be saved."],["Acts 4:13","Now when they saw the boldness of Peter and John, and perceived that they were unlearned and ignorant men, they marvelled; and they took knowledge of them, that they had been with Jesus."],["Acts 4:14","And beholding the man which was healed standing with them, they could say nothing against it."],["Acts 4:15","But when they had commanded them to go aside out of the council, they conferred among themselves,"],["Acts 4:16","Saying, What shall we do to these men? for that indeed a notable miracle hath been done by them is manifest to all them that dwell in Jerusalem; and we cannot deny it."],["Acts 4:17","But that it spread no further among the people, let us straitly threaten them, that they speak henceforth to no man in this name."],["Acts 4:18","And they called them, and commanded them not to speak at all nor teach in the name of Jesus."],["Acts 4:19","But Peter and John answered and said unto them, Whether it be right in the sight of God to hearken unto you more than unto God, judge ye."],["Acts 4:20","For we cannot but speak the things which we have seen and heard."],["Acts 4:21","So when they had further threatened them, they let them go, finding nothing how they might punish them, because of the people: for all men glorified God for that which was done."]]}]},{"a":"apollos_276","b":"paul_2479","type":"worked_together","why":"Paul says he planted and Apollos watered, both ministers by whom the Corinthians believed.","refs":[{"ref":"1 Corinthians 3:4–6","verses":[["1 Corinthians 3:4","For while one saith, I am of Paul; and another, I am of Apollos; are ye not carnal?"],["1 Corinthians 3:5","Who then is Paul, and who is Apollos, but ministers by whom ye believed, even as the Lord gave to every man?"],["1 Corinthians 3:6","I have planted, Apollos watered; but God gave the increase."]]},{"ref":"1 Corinthians 16:12","verses":[["1 Corinthians 16:12","As touching our brother Apollos, I greatly desired him to come unto you with the brethren: but his will was not at all to come at this time; but he will come when he shall have convenient time."]]}]},{"a":"luke_1836","b":"paul_2479","type":"worked_together","why":"Paul calls Luke one of his fellowlabourers, and near the end of his life Luke alone was with him.","refs":[{"ref":"Philemon 1:24","verses":[["Philemon 1:24","Marcus, Aristarchus, Demas, Lucas, my fellowlabourers."]]},{"ref":"Colossians 4:14","verses":[["Colossians 4:14","Luke, the beloved physician, and Demas, greet you."]]},{"ref":"2 Timothy 4:11","verses":[["2 Timothy 4:11","Only Luke is with me. Take Mark, and bring him with thee: for he is profitable to me for the ministry."]]}]},{"a":"onesimus_2251","b":"paul_2479","type":"helped","why":"Paul, who begot Onesimus in the faith in prison, pleaded with Philemon to receive him as Paul himself and charged any debt of his to Paul's account.","refs":[{"ref":"Philemon 1:10–19","verses":[["Philemon 1:10","I beseech thee for my son Onesimus, whom I have begotten in my bonds:"],["Philemon 1:11","Which in time past was to thee unprofitable, but now profitable to thee and to me:"],["Philemon 1:12","Whom I have sent again: thou therefore receive him, that is, mine own bowels:"],["Philemon 1:13","Whom I would have retained with me, that in thy stead he might have ministered unto me in the bonds of the gospel:"],["Philemon 1:14","But without thy mind would I do nothing; that thy benefit should not be as it were of necessity, but willingly."],["Philemon 1:15","For perhaps he therefore departed for a season, that thou shouldest receive him for ever;"],["Philemon 1:16","Not now as a servant, but above a servant, a brother beloved, specially to me, but how much more unto thee, both in the flesh, and in the Lord?"],["Philemon 1:17","If thou count me therefore a partner, receive him as myself."],["Philemon 1:18","If he hath wronged thee, or oweth thee ought, put that on mine account;"],["Philemon 1:19","I Paul have written it with mine own hand, I will repay it: albeit I do not say to thee how thou owest unto me even thine own self besides."]]}]},{"a":"paul_2479","b":"titus_2869","type":"worked_together","why":"Paul calls Titus his partner and fellowhelper and his own son after the common faith.","refs":[{"ref":"2 Corinthians 8:23","verses":[["2 Corinthians 8:23","Whether any do enquire of Titus, he is my partner and fellowhelper concerning you: or our brethren be enquired of, they are the messengers of the churches, and the glory of Christ."]]},{"ref":"Titus 1:4","verses":[["Titus 1:4","To Titus, mine own son after the common faith: Grace, mercy, and peace, from God the Father and the Lord Jesus Christ our Saviour."]]},{"ref":"Galatians 2:1–3","verses":[["Galatians 2:1","Then fourteen years after I went up again to Jerusalem with Barnabas, and took Titus with me also."],["Galatians 2:2","And I went up by revelation, and communicated unto them that gospel which I preach among the Gentiles, but privately to them which were of reputation, lest by any means I should run, or had run, in vain."],["Galatians 2:3","But neither Titus, who was with me, being a Greek, was compelled to be circumcised:"]]}]},{"a":"paul_2479","b":"priscilla_2370","type":"worked_together","why":"Paul lived and worked with Priscilla and her husband, and called them his helpers in Christ Jesus who laid down their necks for his life.","refs":[{"ref":"Acts 18:1–3","verses":[["Acts 18:1","After these things Paul departed from Athens, and came to Corinth;"],["Acts 18:2","And found a certain Jew named Aquila, born in Pontus, lately come from Italy, with his wife Priscilla; (because that Claudius had commanded all Jews to depart from Rome:) and came unto them."],["Acts 18:3","And because he was of the same craft, he abode with them, and wrought: for by their occupation they were tentmakers."]]},{"ref":"Acts 18:18–19","verses":[["Acts 18:18","And Paul after this tarried there yet a good while, and then took his leave of the brethren, and sailed thence into Syria, and with him Priscilla and Aquila; having shorn his head in Cenchrea: for he had a vow."],["Acts 18:19","And he came to Ephesus, and left them there: but he himself entered into the synagogue, and reasoned with the Jews."]]},{"ref":"Romans 16:3–4","verses":[["Romans 16:3","Greet Priscilla and Aquila my helpers in Christ Jesus:"],["Romans 16:4","Who have for my life laid down their own necks: unto whom not only I give thanks, but also all the churches of the Gentiles."]]}]},{"a":"paul_2479","b":"peter_2745","type":"rebuked","why":"Paul withstood Peter to his face at Antioch, because Peter withdrew from eating with the Gentiles and was to be blamed.","refs":[{"ref":"Galatians 2:11–14","verses":[["Galatians 2:11","But when Peter was come to Antioch, I withstood him to the face, because he was to be blamed."],["Galatians 2:12","For before that certain came from James, he did eat with the Gentiles: but when they were come, he withdrew and separated himself, fearing them which were of the circumcision."],["Galatians 2:13","And the other Jews dissembled likewise with him; insomuch that Barnabas also was carried away with their dissimulation."],["Galatians 2:14","But when I saw that they walked not uprightly according to the truth of the gospel, I said unto Peter before them all, If thou, being a Jew, livest after the manner of Gentiles, and not as do the Jews, why compellest thou the Gentiles to live as do the Jews?"]]}]},{"a":"paul_2479","b":"philemon_2342","type":"worked_together","why":"Paul calls Philemon his dearly beloved fellowlabourer.","refs":[{"ref":"Philemon 1:1–2","verses":[["Philemon 1:1","Paul, a prisoner of Jesus Christ, and Timothy our brother, unto Philemon our dearly beloved, and fellowlabourer,"],["Philemon 1:2","And to our beloved Apphia, and Archippus our fellowsoldier, and to the church in thy house:"]]}]},{"a":"onesimus_2251","b":"philemon_2342","type":"served","why":"Onesimus was Philemon's servant, whom Paul sent back to be received as a brother beloved.","refs":[{"ref":"Philemon 1:10–16","verses":[["Philemon 1:10","I beseech thee for my son Onesimus, whom I have begotten in my bonds:"],["Philemon 1:11","Which in time past was to thee unprofitable, but now profitable to t
