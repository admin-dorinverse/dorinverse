m, to bear witness against him, saying, Thou didst blaspheme God and the king. And then carry him out, and stone him, that he may die."],["1 Kings 21:11","And the men of his city, even the elders and the nobles who were the inhabitants in his city, did as Jezebel had sent unto them, and as it was written in the letters which she had sent unto them."],["1 Kings 21:12","They proclaimed a fast, and set Naboth on high among the people."],["1 Kings 21:13","And there came in two men, children of Belial, and sat before him: and the men of Belial witnessed against him, even against Naboth, in the presence of the people, saying, Naboth did blaspheme God and the king. Then they carried him forth out of the city, and stoned him with stones, that he died."],["1 Kings 21:14","Then they sent to Jezebel, saying, Naboth is stoned, and is dead."],["1 Kings 21:15","And it came to pass, when Jezebel heard that Naboth was stoned, and was dead, that Jezebel said to Ahab, Arise, take possession of the vineyard of Naboth the Jezreelite, which he refused to give thee for money: for Naboth is not alive, but dead."]]}]},{"a":"jezebel_1605","b":"joram_804","type":"family","why":"Jehu answered Joram, What peace, so long as the whoredoms of thy mother Jezebel and her witchcrafts are so many?","refs":[{"ref":"2 Kings 9:22","verses":[["2 Kings 9:22","And it came to pass, when Joram saw Jehu, that he said, Is it peace, Jehu? And he answered, What peace, so long as the whoredoms of thy mother Jezebel and her witchcrafts are so many?"]]}]},{"a":"joab_1617","b":"solomon_2762","type":"judged","why":"Solomon sentenced Joab to death for the innocent blood of Abner and Amasa, and had him killed at the altar.","refs":[{"ref":"1 Kings 2:28–34","verses":[["1 Kings 2:28","Then tidings came to Joab: for Joab had turned after Adonijah, though he turned not after Absalom. And Joab fled unto the tabernacle of the LORD, and caught hold on the horns of the altar."],["1 Kings 2:29","And it was told king Solomon that Joab was fled unto the tabernacle of the LORD; and, behold, he is by the altar. Then Solomon sent Benaiah the son of Jehoiada, saying, Go, fall upon him."],["1 Kings 2:30","And Benaiah came to the tabernacle of the LORD, and said unto him, Thus saith the king, Come forth. And he said, Nay; but I will die here. And Benaiah brought the king word again, saying, Thus said Joab, and thus he answered me."],["1 Kings 2:31","And the king said unto him, Do as he hath said, and fall upon him, and bury him; that thou mayest take away the innocent blood, which Joab shed, from me, and from the house of my father."],["1 Kings 2:32","And the LORD shall return his blood upon his own head, who fell upon two men more righteous and better than he, and slew them with the sword, my father David not knowing thereof, to wit, Abner the son of Ner, captain of the host of Israel, and Amasa the son of Jether, captain of the host of Judah."],["1 Kings 2:33","Their blood shall therefore return upon the head of Joab, and upon the head of his seed for ever: but upon David, and upon his seed, and upon his house, and upon his throne, shall there be peace for ever from the LORD."],["1 Kings 2:34","So Benaiah the son of Jehoiada went up, and fell upon him, and slew him: and he was buried in his own house in the wilderness."]]}]},{"a":"jotham_1735","b":"uzziah_375","type":"family","why":"Jotham his son was over the king's house, judging the people, while Uzziah was a leper, and reigned in his stead.","refs":[{"ref":"2 Chronicles 26:21","verses":[["2 Chronicles 26:21","And Uzziah the king was a leper unto the day of his death, and dwelt in a several house, being a leper; for he was cut off from the house of the LORD: and Jotham his son was over the king’s house, judging the people of the land."]]},{"ref":"2 Chronicles 26:23","verses":[["2 Chronicles 26:23","So Uzziah slept with his fathers, and they buried him with his fathers in the field of the burial which belonged to the kings; for they said, He is a leper: and Jotham his son reigned in his stead."]]}]},{"a":"nathan_2153","b":"solomon_2762","type":"anointed","why":"Zadok the priest and Nathan the prophet anointed Solomon king in Gihon at David's command.","refs":[{"ref":"1 Kings 1:32–34","verses":[["1 Kings 1:32","And king David said, Call me Zadok the priest, and Nathan the prophet, and Benaiah the son of Jehoiada. And they came before the king."],["1 Kings 1:33","The king also said unto them, Take with you the servants of your lord, and cause Solomon my son to ride upon mine own mule, and bring him down to Gihon:"],["1 Kings 1:34","And let Zadok the priest and Nathan the prophet anoint him there king over Israel: and blow ye with the trumpet, and say, God save king Solomon."]]},{"ref":"1 Kings 1:45","verses":[["1 Kings 1:45","And Zadok the priest and Nathan the prophet have anointed him king in Gihon: and they are come up from thence rejoicing, so that the city rang again. This is the noise that ye have heard."]]}]},{"a":"nathan_2153","b":"zadok_2973","type":"worked_together","why":"David commanded Zadok the priest and Nathan the prophet to anoint Solomon king, and Zadok and Nathan anointed him in Gihon.","refs":[{"ref":"1 Kings 1:32–34","verses":[["1 Kings 1:32","And king David said, Call me Zadok the priest, and Nathan the prophet, and Benaiah the son of Jehoiada. And they came before the king."],["1 Kings 1:33","The king also said unto them, Take with you the servants of your lord, and cause Solomon my son to ride upon mine own mule, and bring him down to Gihon:"],["1 Kings 1:34","And let Zadok the priest and Nathan the prophet anoint him there king over Israel: and blow ye with the trumpet, and say, God save king Solomon."]]},{"ref":"1 Kings 1:45","verses":[["1 Kings 1:45","And Zadok the priest and Nathan the prophet have anointed him king in Gihon: and they are come up from thence rejoicing, so that the city rang again. This is the noise that ye have heard."]]}]},{"a":"queen_of_sheba_2379","b":"solomon_2762","type":"counseled","why":"The queen of Sheba came to prove Solomon with hard questions and told him all that was in her heart, and Solomon answered all her questions.","refs":[{"ref":"1 Kings 10:1–3","verses":[["1 Kings 10:1","And when the queen of Sheba heard of the fame of Solomon concerning the name of the LORD, she came to prove him with hard questions."],["1 Kings 10:2","And she came to Jerusalem with a very great train, with camels that bare spices, and very much gold, and precious stones: and when she was come to Solomon, she communed with him of all that was in her heart."],["1 Kings 10:3","And Solomon told her all her questions: there was not any thing hid from the king, which he told her not."]]}]},{"a":"rehoboam_2412","b":"solomon_2762","type":"family","why":"Rehoboam was Solomon's son and reigned in his stead.","refs":[{"ref":"1 Kings 11:43","verses":[["1 Kings 11:43","And Solomon slept with his fathers, and was buried in the city of David his father: and Rehoboam his son reigned in his stead."]]}]},{"a":"shimei_2684","b":"solomon_2762","type":"judged","why":"Solomon bound Shimei by oath to stay in Jerusalem on pain of death, and when Shimei went to Gath, Solomon sentenced him and had him killed.","refs":[{"ref":"1 Kings 2:36–46","verses":[["1 Kings 2:36","And the king sent and called for Shimei, and said unto him, Build thee an house in Jerusalem, and dwell there, and go not forth thence any whither."],["1 Kings 2:37","For it shall be, that on the day thou goest out, and passest over the brook Kidron, thou shalt know for certain that thou shalt surely die: thy blood shall be upon thine own head."],["1 Kings 2:38","And Shimei said unto the king, The saying is good: as my lord the king hath said, so will thy servant do. And Shimei dwelt in Jerusalem many days."],["1 Kings 2:39","And it came to pass at the end of three years, that two of the servants of Shimei ran away unto Achish son of Maachah king of Gath. And they told Shimei, saying, Behold, thy servants be in Gath."],["1 Kings 2:40","And Shimei arose, and saddled his ass, and went to Gath to Achish to seek his servants: and Shimei went, and brought his servants from Gath."],["1 Kings 2:41","And it was told Solomon that Shimei had gone from Jerusalem to Gath, and was come again."],["1 Kings 2:42","And the king sent and called for Shimei, and said unto him, Did I not make thee to swear by the LORD, and protested unto thee, saying, Know for a certain, on the day thou goest out, and walkest abroad any whither, that thou shalt surely die? and thou saidst unto me, The word that I have heard is good."],["1 Kings 2:43","Why then hast thou not kept the oath of the LORD, and the commandment that I have charged thee with?"],["1 Kings 2:44","The king said moreover to Shimei, Thou knowest all the wickedness which thine heart is privy to, that thou didst to David my father: therefore the LORD shall return thy wickedness upon thine own head;"],["1 Kings 2:45","And king Solomon shall be blessed, and the throne of David shall be established before the LORD for ever."],["1 Kings 2:46","So the king commanded Benaiah the son of Jehoiada; which went out, and fell upon him, that he died. And the kingdom was established in the hand of Solomon."]]}]},{"a":"solomon_2762","b":"zadok_2973","type":"anointed","why":"Zadok the priest took an horn of oil out of the tabernacle and anointed Solomon.","refs":[{"ref":"1 Kings 1:39","verses":[["1 Kings 1:39","And Zadok the priest took an horn of oil out of the tabernacle, and anointed Solomon. And they blew the trumpet; and all the people said, God save king Solomon."]]},{"ref":"1 Chronicles 29:22","verses":[["1 Chronicles 29:22","And did eat and drink before the LORD on that day with great gladness. And they made Solomon the son of David king the second time, and anointed him unto the LORD to be the chief governor, and Zadok to be priest."]]}]},{"a":"solomon_2762","b":"zadok_2973","type":"served","why":"Solomon put Zadok the priest in the room of Abiathar.","refs":[{"ref":"1 Kings 2:35","verses":[["1 Kings 2:35","And the king put Benaiah the son of Jehoiada in his room over the host: and Zadok the priest did the king put in the room of Abiathar."]]},{"ref":"1 Kings 4:4","verses":[["1 Kings 4:4","And Benaiah the son of Jehoiada was over the host: and Zadok and Abiathar were the priests:"]]}]},{"a":"elijah_1131","b":"jehu_817","type":"prophecy","why":"Elijah foretold that the LORD would cut off Ahab's house and that dogs would eat Jezebel, and when Jehu did it scripture says the LORD had done that which he spake by his servant Elijah.","refs":[{"ref":"1 Kings 21:21–24","verses":[["1 Kings 21:21","Behold, I will bring evil upon thee, and will take away thy posterity, and will cut off from Ahab him that pisseth against the wall, and him that is shut up and left in Israel,"],["1 Kings 21:22","And will make thine house like the house of Jeroboam the son of Nebat, and like the house of Baasha the son of Ahijah, for the provocation wherewith thou hast provoked me to anger, and made Israel to sin."],["1 Kings 21:23","And of Jezebel also spake the LORD, saying, The dogs shall eat Jezebel by the wall of Jezreel."],["1 Kings 21:24","Him that dieth of Ahab in the city the dogs shall eat; and him that dieth in the field shall the fowls of the air eat."]]}],"fulfilled":[{"ref":"2 Kings 9:36","verses":[["2 Kings 9:36","Wherefore they came again, and told him. And he said, This is the word of the LORD, which he spake by his servant Elijah the Tishbite, saying, In the portion of Jezreel shall dogs eat the flesh of Jezebel:"]]},{"ref":"2 Kings 10:10","verses":[["2 Kings 10:10","Know now that there shall fall unto the earth nothing of the word of the LORD, which the LORD spake concerning the house of Ahab: for the LORD hath done that which he spake by his servant Elijah."]]},{"ref":"2 Kings 10:17","verses":[["2 Kings 10:17","And when he came to Samaria, he slew all that remained unto Ahab in Samaria, till he had destroyed him, according to the saying of the LORD, which he spake to Elijah."]]}]},{"a":"ahaziah_121","b":"athaliah_359","type":"family","why":"Ahaziah's mother's name was Athaliah.","refs":[{"ref":"2 Kings 8:26","verses":[["2 Kings 8:26","Two and twenty years old was Ahaziah when he began to reign; and he reigned one year in Jerusalem. And his mother’s name was Athaliah, the daughter of Omri king of Israel."]]}]},{"a":"ahaziah_121","b":"athaliah_359","type":"counseled","why":"Ahaziah walked in the ways of the house of Ahab, for his mother was his counsellor to do wickedly.","refs":[{"ref":"2 Chronicles 22:2–3","verses":[["2 Chronicles 22:2","Forty and two years old was Ahaziah when he began to reign, and he reigned one year in Jerusalem. His mother’s name also was Athaliah the daughter of Omri."],["2 Chronicles 22:3","He also walked in the ways of the house of Ahab: for his mother was his counsellor to do wickedly."]]}]},{"a":"ahaziah_121","b":"jehoram_803","type":"family","why":"Ahaziah Jehoram's son reigned in his stead.","refs":[{"ref":"2 Kings 8:24","verses":[["2 Kings 8:24","And Joram slept with his fathers, and was buried with his fathers in the city of David: and Ahaziah his son reigned in his stead."]]}]},{"a":"ahaziah_121","b":"jehu_817","type":"enemies","why":"Jehu followed after Ahaziah and said, Smite him also in the chariot, and he died; the destruction of Ahaziah was of God by coming to Joram.","refs":[{"ref":"2 Kings 9:27–28","verses":[["2 Kings 9:27","But when Ahaziah the king of Judah saw this, he fled by the way of the garden house. And Jehu followed after him, and said, Smite him also in the chariot. And they did so at the going up to Gur, which is by Ibleam. And he fled to Megiddo, and died there."],["2 Kings 9:28","And his servants carried him in a chariot to Jerusalem, and buried him in his sepulchre with his fathers in the city of David."]]},{"ref":"2 Chronicles 22:7–9","verses":[["2 Chronicles 22:7","And the destruction of Ahaziah was of God by coming to Joram: for when he was come, he went out with Jehoram against Jehu the son of Nimshi, whom the LORD had anointed to cut off the house of Ahab."],["2 Chronicles 22:8","And it came to pass, that, when Jehu was executing judgment upon the house of Ahab, and found the princes of Judah, and the sons of the brethren of Ahaziah, that ministered to Ahaziah, he slew them."],["2 Chronicles 22:9","And he sought Ahaziah: and they caught him, (for he was hid in Samaria,) and brought him to Jehu: and when they had slain him, they buried him: Because, said they, he is the son of Jehoshaphat, who sought the LORD with all his heart. So the house of Ahaziah had no power to keep still the kingdom."]]}]},{"a":"ahaziah_121","b":"joram_804","type":"helped","why":"Ahaziah went with Joram to the war against Hazael and went down to see him in Jezreel when he was sick of his wounds.","refs":[{"ref":"2 Kings 8:28–29","verses":[["2 Kings 8:28","And he went with Joram the son of Ahab to the war against Hazael king of Syria in Ramothgilead; and the Syrians wounded Joram."],["2 Kings 8:29","And king Joram went back to be healed in Jezreel of the wounds which the Syrians had given him at Ramah, when he fought against Hazael king of Syria. And Ahaziah the son of Jehoram king of Judah went down to see Joram the son of Ahab in Jezreel, because he was sick."]]},{"ref":"2 Chronicles 22:5–7","verses":[["2 Chronicles 22:5","He walked also after their counsel, and went with Jehoram the son of Ahab king of Israel to war against Hazael king of Syria at Ramothgilead: and the Syrians smote Joram."],["2 Chronicles 22:6","And he returned to be healed in Jezreel because of the wounds which were given him at Ramah, when he fought with Hazael king of Syria. And Azariah the son of Jehoram king of Judah went down to see Jehoram the son of Ahab at Jezreel, because he was sick."],["2 Chronicles 22:7","And the destruction of Ahaziah was of God by coming to Joram: for when he was come, he went out with Jehoram against Jehu the son of Nimshi, whom the LORD had anointed to cut off the house of Ahab."]]}]},{"a":"ahaziah_121","b":"joash_1632","type":"family","why":"Jehosheba took Joash the son of Ahaziah and hid him.","refs":[{"ref":"2 Kings 11:2","verses":[["2 Kings 11:2","But Jehosheba, the daughter of king Joram, sister of Ahaziah, took Joash the son of Ahaziah, and stole him from among the king’s sons which were slain; and they hid him, even him and his nurse, in the bedchamber from Athaliah, so that he was not slain."]]}]},{"a":"amon_236","b":"manasseh_1930","type":"family","why":"Amon was Manasseh's son, reigned in his stead, and walked in all the way his father walked in.","refs":[{"ref":"2 Kings 21:18","verses":[["2 Kings 21:18","And Manasseh slept with his fathers, and was buried in the garden of his own house, in the garden of Uzza: and Amon his son reigned in his stead."]]},{"ref":"2 Kings 21:20–21","verses":[["2 Kings 21:20","And he did that which was evil in the sight of the LORD, as his father Manasseh did."],["2 Kings 21:21","And he walked in all the way that his father walked in, and served the idols that his father served, and worshipped them:"]]}]},{"a":"amon_236","b":"josiah_1730","type":"family","why":"Josiah was Amon's son, and the people made him king in his stead.","refs":[{"ref":"2 Kings 21:24","verses":[["2 Kings 21:24","And the people of the land slew all them that had conspired against king Amon; and the people of the land made Josiah his son king in his stead."]]},{"ref":"2 Kings 21:26","verses":[["2 Kings 21:26","And he was buried in his sepulchre in the garden of Uzza: and Josiah his son reigned in his stead."]]}]},{"a":"jehoahaz_2516","b":"josiah_1730","type":"family","why":"The people took Jehoahaz the son of Josiah and anointed him king in his father's stead.","refs":[{"ref":"2 Kings 23:30","verses":[["2 Kings 23:30","And his servants carried him in a chariot dead from Megiddo, and brought him to Jerusalem, and buried him in his own sepulchre. And the people of the land took Jehoahaz the son of Josiah, and anointed him, and made him king in his father’s stead."]]}]},{"a":"jehoahaz_2516","b":"jehoiakim_1085","type":"family","why":"The king of Egypt made Eliakim his brother king over Judah, and took Jehoahaz away to Egypt.","refs":[{"ref":"2 Chronicles 36:4","verses":[["2 Chronicles 36:4","And the king of Egypt made Eliakim his brother king over Judah and Jerusalem, and turned his name to Jehoiakim. And Necho took Jehoahaz his brother, and carried him to Egypt."]]}]},{"a":"ahasuerus_117","b":"esther_1343","type":"married","why":"Esther was taken to King Ahasuerus, who loved her above all the women and made her his queen.","refs":[{"ref":"Esther 2:16–17","verses":[["Esther 2:16","So Esther was taken unto king Ahasuerus into his house royal in the tenth month, which is the month Tebeth, in the seventh year of his reign."],["Esther 2:17","And the king loved Esther above all the women, and she obtained grace and favour in his sight more than all the virgins; so that he set the royal crown upon her head, and made her queen instead of Vashti."]]}]},{"a":"ahasuerus_117","b":"vashti_2937","type":"married","why":"Vashti was Ahasuerus's queen; when she refused to come at his command, a decree was made that she come no more before him.","refs":[{"ref":"Esther 1:9–12","verses":[["Esther 1:9","Also Vashti the queen made a feast for the women in the royal house which belonged to king Ahasuerus."],["Esther 1:10","On the seventh day, when the heart of the king was merry with wine, he commanded Mehuman, Biztha, Harbona, Bigtha, and Abagtha, Zethar, and Carcas, the seven chamberlains that served in the presence of Ahasuerus the king,"],["Esther 1:11","To bring Vashti the queen before the king with the crown royal, to shew the people and the princes her beauty: for she was fair to look on."],["Esther 1:12","But the queen Vashti refused to come at the king’s commandment by his chamberlains: therefore was the king very wroth, and his anger burned in him."]]},{"ref":"Esther 1:19","verses":[["Esther 1:19","If it please the king, let there go a royal commandment from him, and let it be written among the laws of the Persians and the Medes, that it be not altered, That Vashti come no more before king Ahasuerus; and let the king give her royal estate unto another that is better than she."]]}]},{"a":"ahasuerus_117","b":"haman_1360","type":"served","why":"King Ahasuerus set Haman above all his princes, and later had him hanged on the gallows Haman built for Mordecai.","refs":[{"ref":"Esther 3:1–2","verses":[["Esther 3:1","After these things did king Ahasuerus promote Haman the son of Hammedatha the Agagite, and advanced him, and set his seat above all the princes that were with him."],["Esther 3:2","And all the king’s servants, that were in the king’s gate, bowed, and reverenced Haman: for the king had so commanded concerning him. But Mordecai bowed not, nor did him reverence."]]},{"ref":"Esther 7:9–10","verses":[["Esther 7:9","And Harbonah, one of the chamberlains, said before the king, Behold also, the gallows fifty cubits high, which Haman had made for Mordecai, who had spoken good for the king, standeth in the house of Haman. Then the king said, Hang him thereon."],["Esther 7:10","So they hanged Haman on the gallows that he had prepared for Mordecai. Then was the king’s wrath pacified."]]}]},{"a":"ahasuerus_117","b":"mordecai_2107","type":"served","why":"Mordecai, who sat in the king's gate, uncovered a plot against King Ahasuerus, and the king later gave him his ring and made him next to himself.","refs":[{"ref":"Esther 2:21–23","verses":[["Esther 2:21","In those days, while Mordecai sat in the king’s gate, two of the king’s chamberlains, Bigthan and Teresh, of those which kept the door, were wroth, and sought to lay hand on the king Ahasuerus."],["Esther 2:22","And the thing was known to Mordecai, who told it unto Esther the queen; and Esther certified the king thereof in Mordecai’s name."],["Esther 2:23","And when inquisition was made of the matter, it was found out; therefore they were both hanged on a tree: and it was written in the book of the chronicles before the king."]]},{"ref":"Esther 8:2","verses":[["Esther 8:2","And the king took off his ring, which he had taken from Haman, and gave it unto Mordecai. And Esther set Mordecai over the house of Haman."]]},{"ref":"Esther 10:3","verses":[["Esther 10:3","For Mordecai the Jew was next unto king Ahasuerus, and great among the Jews, and accepted of the multitude of his brethren, seeking the wealth of his people, and speaking peace to all his seed."]]}]},{"a":"ahaz_118","b":"isaiah_617","type":"counseled","why":"The LORD sent Isaiah to tell King Ahaz to take heed, be quiet and not fear, and when Ahaz would not ask a sign, Isaiah gave him the sign of Immanuel.","refs":[{"ref":"Isaiah 7:3–4","verses":[["Isaiah 7:3","Then said the LORD unto Isaiah, Go forth now to meet Ahaz, thou, and Shearjashub thy son, at the end of the conduit of the upper pool in the highway of the fuller’s field;"],["Isaiah 7:4","And say unto him, Take heed, and be quiet; fear not, neither be fainthearted for the two tails of these smoking firebrands, for the fierce anger of Rezin with Syria, and of the son of Remaliah."]]},{"ref":"Isaiah 7:10–14","verses":[["Isaiah 7:10","Moreover the LORD spake again unto Ahaz, saying,"],["Isaiah 7:11","Ask thee a sign of the LORD thy God; ask it either in the depth, or in the height above."],["Isaiah 7:12","But Ahaz said, I will not ask, neither will I tempt the LORD."],["Isaiah 7:13","And he said, Hear ye now, O house of David; Is it a small thing for you to weary men, but will ye weary my God also?"],["Isaiah 7:14","Therefore the Lord himself shall give you a sign; Behold, a virgin shall conceive, and bear a son, and shall call his name Immanuel."]]}]},{"a":"ahikam_141","b":"jeremiah_853","type":"helped","why":"The hand of Ahikam was with Jeremiah, so that he was not given into the hand of the people to be put to death.","refs":[{"ref":"Jeremiah 26:24","verses":[["Jeremiah 26:24","Nevertheless the hand of Ahikam the son of Shaphan was with Jeremiah, that they should not give him into the hand of the people to put him to death."]]}]},{"a":"amos_238","b":"jeroboam_873","type":"prophesied","why":"Amos spoke the LORD's word against the house of Jeroboam, that Jeroboam would die by the sword, and Amaziah the priest reported his words to the king.","refs":[{"ref":"Amos 7:9–11","verses":[["Amos 7:9","And the high places of Isaac shall be desolate, and the sanctuaries of Israel shall be laid waste; and I will rise against the house of Jeroboam with the sword."],["Amos 7:10","Then Amaziah the priest of Bethel sent to Jeroboam king of Israel, saying, Amos hath conspired against thee in the midst of the house of Israel: the land is not able to bear all his words."],["Amos 7:11","For thus Amos saith, Jeroboam shall die by the sword, and Israel shall surely be led away captive out of their own land."]]}]},{"a":"baruch_410","b":"jeremiah_853","type":"served","why":"Baruch wrote the LORD's words from Jeremiah's mouth and did all that Jeremiah the prophet commanded him.","refs":[{"ref":"Jeremiah 36:4–8","verses":[["Jeremiah 36:4","Then Jeremiah called Baruch the son of Neriah: and Baruch wrote from the mouth of Jeremiah all the words of the LORD, which he had spoken unto him, upon a roll of a book."],["Jeremiah 36:5","And Jeremiah commanded Baruch, saying, I am shut up; I cannot go into the house of the LORD:"],["Jeremiah 36:6","Therefore go thou, and read in the roll, which thou hast written from my mouth, the words of the LORD in the ears of the people in the LORD’S house upon the fasting day: and also thou shalt read them in the ears of all Judah that come out of their cities."],["Jeremiah 36:7","It may be they will present their supplication before the LORD, and will return every one from his evil way: for great is the anger and the fury that the LORD hath pronounced against this people."],["Jeremiah 36:8","And Baruch the son of Neriah did according to all that Jeremiah the prophet commanded him, reading in the book the words of the LORD in the LORD’S house."]]},{"ref":"Jeremiah 36:32","verses":[["Jeremiah 36:32","Then took Jeremiah another roll, and gave it to Baruch the scribe, the son of Neriah; who wrote therein from the mouth of Jeremiah all the words of the book which Jehoiakim king of Judah had burned in the fire: and there were added besides unto them many like words."]]},{"ref":"Jeremiah 32:12–13","verses":[["Jeremiah 32:12","And I gave the evidence of the purchase unto Baruch the son of Neriah, the son of Maaseiah, in the sight of Hanameel mine uncle’s son, and in the presence of the witnesses that subscribed the book of the purchase, before all the Jews that sat in the court of the prison."],["Jeremiah 32:13","And I charged Baruch before them, saying,"]]}]},{"a":"baruch_410","b":"jehoiakim_1085","type":"enemies","why":"After King Jehoiakim burned the scroll Baruch had written, he commanded men to take Baruch the scribe and Jeremiah, but the LORD hid them.","refs":[{"ref":"Jeremiah 36:21–23","verses":[["Jeremiah 36:21","So the king sent Jehudi to fetch the roll: and he took it out of Elishama the scribe’s chamber. And Jehudi read it in the ears of the king, and in the ears of all the princes which stood beside the king."],["Jeremiah 36:22","Now the king sat in the winterhouse in the ninth month: and there was a fire on the hearth burning before him."],["Jeremiah 36:23","And it came to pass, that when Jehudi had read three or four leaves, he cut it with the penknife, and cast it into the fire that was on the hearth, until all the roll was consumed in the fire that was on the hearth."]]},{"ref":"Jeremiah 36:26","verses":[["Jeremiah 36:26","But the king commanded Jerahmeel the son of Hammelech, and Seraiah the son of Azriel, and Shelemiah the son of Abdeel, to take Baruch the scribe and Jeremiah the prophet: but the LORD hid them."]]}]},{"a":"belshazzar_437","b":"daniel_975","type":"rebuked","why":"Daniel told Belshazzar he had lifted himself up against the Lord of heaven and not humbled his heart, and read him the writing that his kingdom was finished.","refs":[{"ref":"Daniel 5:13","verses":[["Daniel 5:13","Then was Daniel brought in before the king. And the king spake and said unto Daniel, Art thou that Daniel, which art of the children of the captivity of Judah, whom the king my father brought out of Jewry?"]]},{"ref":"Daniel 5:17–18","verses":[["Daniel 5:17","Then Daniel answered and said before the king, Let thy gifts be to thyself, and give thy rewards to another; yet I will read the writing unto the king, and make known to him the interpretation."],["Daniel 5:18","O thou king, the most high God gave Nebuchadnezzar thy father a kingdom, and majesty, and glory, and honour:"]]},{"ref":"Daniel 5:22–29","verses":[["Daniel 5:22","And thou his son, O Belshazzar, hast not humbled thine heart, though thou knewest all this;"],["Daniel 5:23","But hast lifted up thyself against the Lord of heaven; and they have brought the vessels of his house before thee, and thou, and thy lords, thy wives, and thy concubines, have drunk wine in them; and thou hast praised the gods of silver, and gold, of brass, iron, wood, and stone, which see not, nor hear, nor know: and the God in whose hand thy breath is, and whose are all thy ways, hast thou not glorified:"],["Daniel 5:24","Then was the part of the hand sent from him; and this writing was written."],["Daniel 5:25","And this is the writing that was written, MENE, MENE, TEKEL, UPHARSIN."],["Daniel 5:26","This is the interpretation of the thing: MENE; God hath numbered thy kingdom, and finished it."],["Daniel 5:27","TEKEL; Thou art weighed in the balances, and art found wanting."],["Daniel 5:28","PERES; Thy kingdom is divided, and given to the Medes and Persians."],["Daniel 5:29","Then commanded Belshazzar, and they clothed Daniel with scarlet, and put a chain of gold about his neck, and made a proclamation concerning him, that he should be the third ruler in the kingdom."]]}]},{"a":"belshazzar_437","b":"nebuchadnezzar_2167","type":"family","why":"Daniel 5 calls Nebuchadnezzar Belshazzar's father and says to Belshazzar, 'thou his son.'","refs":[{"ref":"Daniel 5:2","verses":[["Daniel 5:2","Belshazzar, whiles he tasted the wine, commanded to bring the golden and silver vessels which his father Nebuchadnezzar had taken out of the temple which was in Jerusalem; that the king, and his princes, his wives, and his concubines, might drink therein."]]},{"ref":"Daniel 5:18","verses":[["Daniel 5:18","O thou king, the most high God gave Nebuchadnezzar thy father a kingdom, and majesty, and glory, and honour:"]]},{"ref":"Daniel 5:22","verses":[["Daniel 5:22","And thou his son, O Belshazzar, hast not humbled thine heart, though thou knewest all this;"]]}]},{"a":"daniel_975","b":"shadrach_1398","type":"friends","why":"Daniel called Hananiah (Shadrach) one of his companions; they were taken captive together, and Daniel asked him to pray with him for mercy over the king's dream.","refs":[{"ref":"Daniel 1:6–7","verses":[["Daniel 1:6","Now among these were of the children of Judah, Daniel, Hananiah, Mishael, and Azariah:"],["Daniel 1:7","Unto whom the prince of the eunuchs gave names: for he gave unto Daniel the name of Belteshazzar; and to Hananiah, of Shadrach; and to Mishael, of Meshach; and to Azariah, of Abednego."]]},{"ref":"Daniel 2:17–18","verses":[["Daniel 2:17","Then Daniel went to his house, and made the thing known to Hananiah, Mishael, and Azariah, his companions:"],["Daniel 2:18","That they would desire mercies of the God of heaven concerning this secret; that Daniel and his fellows should not perish with the rest of the wise men of Babylon."]]}]},{"a":"daniel_975","b":"meshach_2092","type":"friends","why":"Daniel called Mishael (Meshach) one of his companions; they were taken captive together, and Daniel asked him to pray with him for mercy over the king's dream.","refs":[{"ref":"Daniel 1:6–7","verses":[["Daniel 1:6","Now among these were of the children of Judah, Daniel, Hananiah, Mishael, and Azariah:"],["Daniel 1:7","Unto whom the prince of the eunuchs gave names: for he gave unto Daniel the name of Belteshazzar; and to Hananiah, of Shadrach; and to Mishael, of Meshach; and to Azariah, of Abednego."]]},{"ref":"Daniel 2:17–18","verses":[["Daniel 2:17","Then Daniel went to his house, and made the thing known to Hananiah, Mishael, and Azariah, his companions:"],["Daniel 2:18","That they would desire mercies of the God of heaven concerning this secret; that Daniel and his fellows should not perish with the rest of the wise men of Babylon."]]}]},{"a":"daniel_975","b":"nebuchadnezzar_2167","type":"served","why":"Nebuchadnezzar made Daniel ruler over the whole province of Babylon and chief of the governors over all its wise men.","refs":[{"ref":"Daniel 1:19–20","verses":[["Daniel 1:19","And the king communed with them; and among them all was found none like Daniel, Hananiah, Mishael, and Azariah: therefore stood they before the king."],["Daniel 1:20","And in all matters of wisdom and understanding, that the king enquired of them, he found them ten times better than all the magicians and astrologers that were in all his realm."]]},{"ref":"Daniel 2:46–48","verses":[["Daniel 2:46","Then the king Nebuchadnezzar fell upon his face, and worshipped Daniel, and commanded that they should offer an oblation and sweet odours unto him."],["Daniel 2:47","The king answered unto Daniel, and said, Of a truth it is, that your God is a God of gods, and a Lord of kings, and a revealer of secrets, seeing thou couldest reveal this secret."],["Daniel 2:48","Then the king made Daniel a great man, and gave him many great gifts, and made him ruler over the whole province of Babylon, and chief of the governors over all the wise men of Babylon."]]}]},{"a":"daniel_975","b":"nebuchadnezzar_2167","type":"counseled","why":"Daniel interpreted Nebuchadnezzar's dreams and told him, 'let my counsel be acceptable unto thee, and break off thy sins by righteousness.'","refs":[{"ref":"Daniel 2:27–45","verses":[["Daniel 2:27","Daniel answered in the presence of the king, and said, The secret which the king hath demanded cannot the wise men, the astrologers, the magicians, the soothsayers, shew unto the king;"],["Daniel 2:28","But there is a God in heaven that revealeth secrets, and maketh known to the king Nebuchadnezzar what shall be in the latter days. Thy dream, and the visions of thy head upon thy bed, are these;"],["Daniel 2:29","As for thee, O king, thy thoughts came into thy mind upon thy bed, what should come to pass hereafter: and he that revealeth secrets maketh known to thee what shall come to pass."],["Daniel 2:30","But as for me, this secret is not revealed to me for any wisdom that I have more than any living, but for their sakes that shall make known the interpretation to the king, and that thou mightest know the thoughts of thy heart."],["Daniel 2:31","Thou, O king, sawest, and behold a great image. This great image, whose brightness was excellent, stood before thee; and the form thereof was terrible."],["Daniel 2:32","This image’s head was of fine gold, his breast and his arms of silver, his belly and his thighs of brass,"],["Daniel 2:33","His legs of iron, his feet part of iron and part of clay."],["Daniel 2:34","Thou sawest till that a stone was cut out without hands, which smote the image upon his feet that were of iron and clay, and brake them to pieces."],["Daniel 2:35","Then was the iron, the clay, the brass, the silver, and the gold, broken to pieces together, and became like the chaff of the summer threshingfloors; and the wind carried them away, that no place was found for them: and the stone that smote the image became a great mountain, and filled the whole earth."],["Daniel 2:36","This is the dream; and we will tell the interpretation thereof before the king."],["Daniel 2:37","Thou, O king, art a king of kings: for the God of heaven hath given thee a kingdom, power, and strength, and glory."],["Daniel 2:38","And wheresoever the children of men dwell, the beasts of the field and the fowls of the heaven hath he given into thine hand, and hath made thee ruler over them all. Thou art this head of gold."],["Daniel 2:39","And after thee shall arise another kingdom inferior to thee, and another third kingdom of brass, which shall bear rule over all the earth."],["Daniel 2:40","And the fourth kingdom shall be strong as iron: forasmuch as iron breaketh in pieces and subdueth all things: and as iron that breaketh all these, shall it break in pieces and bruise."],["Daniel 2:41","And whereas thou sawest the feet and toes, part of potters’ clay, and part of iron, the kingdom shall be divided; but there shall be in it of the strength of the iron, forasmuch as thou sawest the iron mixed with miry clay."],["Daniel 2:42","And as the toes of the feet were part of iron, and part of clay, so the kingdom shall be partly strong, and partly broken."],["Daniel 2:43","And whereas thou sawest iron mixed with miry clay, they shall mingle themselves with the seed of men: but they shall not cleave one to another, even as iron is not mixed with clay."],["Daniel 2:44","And in the days of these kings shall the God of heaven set up a kingdom, which shall never be destroyed: and the kingdom shall not be left to other people, but it shall break in pieces and consume all these kingdoms, and it shall stand for ever."],["Daniel 2:45","Forasmuch as thou sawest that the stone was cut out of the mountain without hands, and that it brake in pieces the iron, the brass, the clay, the silver, and the gold; the great God hath made known to the king what shall come to pass hereafter: and the dream is certain, and the interpretation thereof sure."]]},{"ref":"Daniel 4:8–9","verses":[["Daniel 4:8","But at the last Daniel came in before me, whose name was Belteshazzar, according to the name of my god, and in whom is the spirit of the holy gods: and before him I told the dream, saying,"],["Daniel 4:9","O Belteshazzar, master of the magicians, because I know that the spirit of the holy gods is in thee, and no secret troubleth thee, tell me the visions of my dream that I have seen, and the interpretation thereof."]]},{"ref":"Daniel 4:19–27","verses":[["Daniel 4:19","Then Daniel, whose name was Belteshazzar, was astonied for one hour, and his thoughts troubled him. The king spake, and said, Belteshazzar, let not the dream, or the interpretation thereof, trouble thee. Belteshazzar answered and said, My lord, the dream be to them that hate thee, and the interpretation thereof to thine enemies."],["Daniel 4:20","The tree that thou sawest, which grew, and was strong, whose height reached unto the heaven, and the sight thereof to all the earth;"],["Daniel 4:21","Whose leaves were fair, and the fruit thereof much, and in it was meat for all; under which the beasts of the field dwelt, and upon whose branches the fowls of the heaven had their habitation:"],["Daniel 4:22","It is thou, O king, that art grown and become strong: for thy greatness is grown, and reacheth unto heaven, and thy dominion to the end of the earth."],["Daniel 4:23","And whereas the king saw a watcher and an holy one coming down from heaven, and saying, Hew the tree down, and destroy it; yet leave the stump of the roots thereof in the earth, even with a band of iron and brass, in the tender grass of the field; and let it be wet with the dew of heaven, and let his portion be with the beasts of the field, till seven times pass over him;"],["Daniel 4:24","This is the interpretation, O king, and this is the decree of the most High, which is come upon my lord the king:"],["Daniel 4:25","That they shall drive thee from men, and thy dwelling shall be with the beasts of the field, and they shall make thee to eat grass as oxen, and they shall wet thee with the dew of heaven, and seven times shall pass over thee, till thou know that the most High ruleth in the kingdom of men, and giveth it to whomsoever he will."],["Daniel 4:26","And whereas they commanded to leave the stump of the tree roots; thy kingdom shall be sure unto thee, after that thou shalt have known that the heavens do rule."],["Daniel 4:27","Wherefore, O king, let my counsel be acceptable unto thee, and break off thy sins by righteousness, and thine iniquities by shewing mercy to the poor; if it may be a lengthening of thy tranquillity."]]}]},{"a":"daniel_975","b":"darius_980","type":"served","why":"Darius set Daniel first of the three presidents over his kingdom and thought to set him over the whole realm; Daniel prospered in his reign.","refs":[{"ref":"Daniel 6:1–3","verses":[["Daniel 6:1","It pleased Darius to set over the kingdom an hundred and twenty princes, which should be over the whole kingdom;"],["Daniel 6:2","And over these three presidents; of whom Daniel was first: that the princes might give accounts unto them, and the king should have no damage."],["Daniel 6:3","Then this Daniel was preferred above the presidents and princes, because an excellent spirit was in him; and the king thought to set him over the whole realm."]]},{"ref":"Daniel 6:28","verses":[["Daniel 6:28","So this Daniel prospered in the reign of Darius, and in the reign of Cyrus the Persian."]]}]},{"a":"esther_1343","b":"mordecai_2107","type":"family","why":"Esther was the daughter of Mordecai's uncle, and Mordecai took her as his own daughter when her parents died.","refs":[{"ref":"Esther 2:7","verses":[["Esther 2:7","And he brought up Hadassah, that is, Esther, his uncle’s daughter: for she had neither father nor mother, and the maid was fair and beautiful; whom Mordecai, when her father and mother were dead, took for his own daughter."]]},{"ref":"Esther 2:15","verses":[["Esther 2:15","Now when the turn of Esther, the daughter of Abihail the uncle of Mordecai, who had taken her for his daughter, was come to go in unto the king, she required nothing but what Hegai the king’s chamberlain, the keeper of the women, appointed. And Esther obtained favour in the sight of all them that looked upon her."]]}]},{"a":"esther_1343","b":"mordecai_2107","type":"counseled","why":"Esther did the commandment of Mordecai as when she was brought up with him, and at his charge she went to the king for her people.","refs":[{"ref":"Esther 2:10","verses":[["Esther 2:10","Esther had not shewed her people nor her kindred: for Mordecai had charged her that she should not shew it."]]},{"ref":"Esther 2:20","verses":[["Esther 2:20","Esther had not yet shewed her kindred nor her people; as Mordecai had charged her: for Esther did the commandment of Mordecai, like as when she was brought up with him."]]},{"ref":"Esther 4:13–16","verses":[["Esther 4:13","Then Mordecai commanded to answer Esther, Think not with thyself that thou shalt escape in the king’s house, more than all the Jews."],["Esther 4:14","For if thou altogether holdest thy peace at this time, then shall there enlargement and deliverance arise to the Jews from another place; but thou and thy father’s house shall be destroyed: and who knoweth whether thou art come to the kingdom for such a time as this?"],["Esther 4:15","Then Esther bade them return Mordecai this answer,"],["Esther 4:16","Go, gather together all the Jews that are present in Shushan, and fast ye for me, and neither eat nor drink three days, night or day: I also and my maidens will fast likewise; and so will I go in unto the king, which is not according to the law: and if I perish, I perish."]]}]},{"a":"esther_1343","b":"haman_1360","type":"enemies","why":"Esther named Haman before the king as 'the adversary and enemy' who had sold her and her people to be destroyed, and he was hanged.","refs":[{"ref":"Esther 7:3–6","verses":[["Esther 7:3","Then Esther the queen answered and said, If I have found favour in thy sight, O king, and if it please the king, let my life be given me at my petition, and my people at my request:"],["Esther 7:4","For we are sold, I and my people, to be destroyed, to be slain, and to perish. But if we had been sold for bondmen and bondwomen, I had held my tongue, although the enemy could not countervail the king’s damage."],["Esther 7:5","Then the king Ahasuerus answered and said unto Esther the queen, Who is he, and where is he, that durst presume in his heart to do so?"],["Esther 7:6","And Esther said, The adversary and enemy is this wicked Haman. Then Haman was afraid before the king and the queen."]]},{"ref":"Esther 7:9–10","verses":[["Esther 7:9","And Harbonah, one of the chamberlains, said before the king, Behold also, the gallows fifty cubits high, which Haman had made for Mordecai, who had spoken good for the king, standeth in the house of Haman. Then the king said, Hang him thereon."],["Esther 7:10","So they hanged Haman on the gallows that he had prepared for Mordecai. Then was the king’s wrath pacified."]]}]},{"a":"ezekiel_1237","b":"gog_1326","type":"prophesied","why":"The LORD told Ezekiel to set his face against Gog, chief prince of Meshech and Tubal, and prophesy against him.","refs":[{"ref":"Ezekiel 38:1–3","verses":[["Ezekiel 38:1","And the word of the LORD came unto me, saying,"],["Ezekiel 38:2","Son of man, set thy face against Gog, the land of Magog, the chief prince of Meshech and Tubal, and prophesy against him,"],["Ezekiel 38:3","And say, Thus saith the Lord GOD; Behold, I am against thee, O Gog, the chief prince of Meshech and Tubal:"]]},{"ref":"Ezekiel 39:1","verses":[["Ezekiel 39:1","Therefore, thou son of man, prophesy against Gog, and say, Thus saith the Lord GOD; Behold, I am against thee, O Gog, the chief prince of Meshech and Tubal:"]]}]},{"a":"ezekiel_1237","b":"pharaoh_2336","type":"prophesied","why":"The LORD told Ezekiel to set his face against Pharaoh king of Egypt and prophesy against him, and Ezekiel spoke the LORD's word that He would break Pharaoh's arms.","refs":[{"ref":"Ezekiel 29:1–3","verses":[["Ezekiel 29:1","In the tenth year, in the tenth month, in the twelfth day of the month, the word of the LORD came unto me, saying,"],["Ezekiel 29:2","Son of man, set thy face against Pharaoh king of Egypt, and prophesy against him, and against all Egypt:"],["Ezekiel 29:3","Speak, and say, Thus saith the Lord GOD; Behold, I am against thee, Pharaoh king of Egypt, the great dragon that lieth in the midst of his rivers, which hath said, My river is mine own, and I have made it for myself."]]},{"ref":"Ezekiel 30:20–22","verses":[["Ezekiel 30:20","And it came to pass in the eleventh year, in the first month, in the seventh day of the month, that the word of the LORD came unto me, saying,"],["Ezekiel 30:21","Son of man, I have broken the arm of Pharaoh king of Egypt; and, lo, it shall not be bound up to be healed, to put a roller to bind it, to make it strong to hold the sword."],["Ezekiel 30:22","Therefore thus saith the Lord GOD; Behold, I am against Pharaoh king of Egypt, and will break his arms, the strong, and that which was broken; and I will cause the sword to fall out of his hand."]]}]},{"a":"ezra_1245","b":"nehemiah_2172","type":"worked_together","why":"Nehemiah the governor and Ezra the priest and scribe together told the people the day was holy, and their days are named together.","refs":[{"ref":"Nehemiah 8:9","verses":[["Nehemiah 8:9","And Nehemiah, which is the Tirshatha, and Ezra the priest the scribe, and the Levites that taught the people, said unto all the people, This day is holy unto the LORD your God; mourn not, nor weep. For all the people wept, when they heard the words of the law."]]},{"ref":"Nehemiah 12:26","verses":[["Nehemiah 12:26","These were in the days of Joiakim the son of Jeshua, the son of Jozadak, and in the days of Nehemiah the governor, and of Ezra the priest, the scribe."]]}]},{"a":"gedaliah_1287","b":"jeremiah_853","type":"helped","why":"Jeremiah was taken out of prison and committed to Gedaliah to carry him home, and Jeremiah went and dwelt with him at Mizpah.","refs":[{"ref":"Jeremiah 39:14","verses":[["Jeremiah 39:14","Even they sent, and took Jeremiah out of the court of the prison, and committed him unto Gedaliah the son of Ahikam the son of Shaphan, that he should carry him home: so he dwelt among the people."]]},{"ref":"Jeremiah 40:5–6","verses":[["Jeremiah 40:5","Now while he was not yet gone back, he said, Go back also to Gedaliah the son of Ahikam the son of Shaphan, whom the king of Babylon hath made governor over the cities of Judah, and dwell with him among the people: or go wheresoever it seemeth convenient unto thee to go. So the captain of the guard gave him victuals and a reward, and let him go."],["Jeremiah 40:6","Then went Jeremiah unto Gedaliah the son of Ahikam to Mizpah; and dwelt with him among the people that were left in the land."]]}]},{"a":"gedaliah_1287","b":"johanan_1666","type":"helped","why":"Johanan warned Gedaliah that Ishmael was sent to slay him and offered to kill Ishmael to save him, but Gedaliah did not believe him.","refs":[{"ref":"Jeremiah 40:13–16","verses":[["Jeremiah 40:13","Moreover Johanan the son of Kareah, and all the captains of the forces that were in the fields, came to Gedaliah to Mizpah,"],["Jeremiah 40:14","And said unto him, Dost thou certainly know that Baalis the king of the Ammonites hath sent Ishmael the son of Nethaniah to slay thee? But Gedaliah the son of Ahikam believed them not."],["Jeremiah 40:15","Then Johanan the son of Kareah spake to Gedaliah in Mizpah secretly, saying, Let me go, I pray thee, and I will slay Ishmael the son of Nethaniah, and no man shall know it: wherefore should he slay thee, that all the Jews which are gathered unto thee should be scattered, and the remnant in Judah perish?"],["Jeremiah 40:16","But Gedaliah the son of Ahikam said unto Johanan the son of Kareah, Thou shalt not do this thing: for thou speakest falsely of Ishmael."]]}]},{"a":"gomer_1329","b":"hosea_1555","type":"married","why":"The LORD told Hosea to take a wife of whoredoms, and he took Gomer, who bore him a son.","refs":[{"ref":"Hosea 1:2–3","verses":[["Hosea 1:2","The beginning of the word of the LORD by Hosea. And the LORD said to Hosea, Go, take unto thee a wife of whoredoms and children of whoredoms: for the land hath committed great whoredom, departing from the LORD."],["Hosea 1:3","So he went and took Gomer the daughter of Diblaim; which conceived, and bare him a son."]]}]},{"a":"haggai_1349","b":"zerubbabel_3054","type":"counseled","why":"The word of the LORD came by Haggai to Zerubbabel, who obeyed it and built the house, and Haggai told him 'be strong, O Zerubbabel... and work.'","refs":[{"ref":"Haggai 1:1","verses":[["Haggai 1:1","In the second year of Darius the king, in the sixth month, in the first day of the month, came the word of the LORD by Haggai the prophet unto Zerubbabel the son of Shealtiel, governor of Judah, and to Joshua the son of Josedech, the high priest, saying,"]]},{"ref":"Haggai 1:12–14","verses":[["Haggai 1:12","Then Zerubbabel the son of Shealtiel, and Joshua the son of Josedech, the high priest, with all the remnant of the people, obeyed the voice of the LORD their God, and the words of Haggai the prophet, as the LORD their God had sent him, and the people did fear before the LORD."],["Haggai 1:13","Then spake Haggai the LORD’S messenger in the LORD’S message unto the people, saying, I am with you, saith the LORD."],["Haggai 1:14","And the LORD stirred up the spirit of Zerubbabel the son of Shealtiel, governor of Judah, and the spirit of Joshua the son of Josedech, the high priest, and the spirit of all the remnant of the people; and they came and did work in the house of the LORD of hosts, their God,"]]},{"ref":"Haggai 2:2–4","verses":[["Haggai 2:2","Speak now to Zerubbabel the son of Shealtiel, governor of Judah, and to Joshua the son of Josedech, the high priest, and to the residue of the people, saying,"],["Haggai 2:3","Who is left among you that saw this house in her first glory? and how do ye see it now? is it not in your eyes in comparison of it as nothing?"],["Haggai 2:4","Yet now be strong, O Zerubbabel, saith the LORD; and be strong, O Joshua, son of Josedech, the high priest; and be strong, all ye people of the land, saith the LORD, and work: for I am with you, saith the LORD of hosts:"]]},{"ref":"Ezra 5:1–2","verses":[["Ezra 5:1","Then the prophets, Haggai the prophet, and Zechariah the son of Iddo, prophesied unto the Jews that were in Judah and Jerusalem in the name of the God of Israel, even unto them."],["Ezra 5:2","Then rose up Zerubbabel the son of Shealtiel, and Jeshua the son of Jozadak, and began to build the house of God which is at Jerusalem: and with them were the prophets of God helping them."]]}]},{"a":"haggai_1349","b":"joshua_893","type":"counseled","why":"The word of the LORD came by Haggai to Joshua the high priest, who obeyed it, and Haggai told him 'be strong, O Joshua.'","refs":[{"ref":"Haggai 1:1","verses":[["Haggai 1:1","In the second year of Darius the king, in the sixth month, in the first day of the month, came the word of the LORD by Haggai the prophet unto Zerubbabel the son of Shealtiel, governor of Judah, and to Joshua the son of Josedech, the high priest, saying,"]]},{"ref":"Haggai 1:12–14","verses":[["Haggai 1:12","Then Zerubbabel the son of Shealtiel, and Joshua the son of Josedech, the high priest, with all the remnant of the people, obeyed the voice of the LORD their God, and the words of Haggai the prophet, as the LORD their God had sent him, and the people did fear before the LORD."],["Haggai 1:13","Then spake Haggai the LORD’S messenger in the LORD’S message unto the people, saying, I am with you, saith the LORD."],["Haggai 1:14","And the LORD stirred up the spirit of Zerubbabel the son of Shealtiel, governor of Judah, and the spirit of Joshua the son of Josedech, the high priest, and the spirit of all the remnant of the people; and they came and did work in the house of the LORD of hosts, their God,"]]},{"ref":"Haggai 2:2–4","verses":[["Haggai 2:2","Speak now to Zerubbabel the son of Shealtiel, governor of Judah, and to Joshua the son of Josedech, the high priest, and to the residue of the people, saying,"],["Haggai 2:3","Who is left among you that saw this house in her first glory? and how do ye see it now? is it not in your eyes in comparison of it as nothing?"],["Haggai 2:4","Yet now be strong, O Zerubbabel, saith the LORD; and be strong, O Joshua, son of Josedech, the high priest; and be strong, all ye people of the land, saith the LORD, and work: for I am with you, saith the LORD of hosts:"]]}]},{"a":"haggai_1349","b":"zechariah_3016","type":"worked_together","why":"Haggai and Zechariah prophesied together to the Jews in Judah and Jerusalem, and the elders built and prospered through their prophesying.","refs":[{"ref":"Ezra 5:1–2","verses":[["Ezra 5:1","Then the prophets, Haggai the prophet, and Zechariah the son of Iddo, prophesied unto the Jews that were in Judah and Jerusalem in the name of the God of Israel, even unto them."],["Ezra 5:2","Then rose up Zerubbabel the son of Shealtiel, and Jeshua the son of Jozadak, and began to build the house of God which is at Jerusalem: and with them were the prophets of God helping them."]]},{"ref":"Ezra 6:14","verses":[["Ezra 6:14","And the elders of the Jews builded, and they prospered through the prophesying of Haggai the prophet and Zechariah the son of Iddo. And they builded, and finished it, according to the commandment of the God of Israel, and according to the commandment of Cyrus, and Darius, and Artaxerxes king of Persia."]]}]},{"a":"haman_1360","b":"mordecai_2107","type":"enemies","why":"When Mordecai would not bow, Haman sought to destroy him and all the Jews and built gallows for him, but Haman himself was hanged on them.","refs":[{"ref":"Esther 3:2–6","verses":[["Esther 3:2","And all the king’s servants, that were in the king’s gate, bowed, and reverenced Haman: for the king had so commanded concerning him. But Mordecai bowed not, nor did him reverence."],["Esther 3:3","Then the king’s servants, which were in the king’s gate, said unto Mordecai, Why transgressest thou the king’s commandment?"],["Esther 3:4","Now it came to pass, when they spake daily unto him, and he hearkened not unto them, that they told Haman, to see whether Mordecai’s matters would stand: for he had told them that he was a Jew."],["Esther 3:5","And when Haman saw that Mordecai bowed not, nor did him reverence, then was Haman full of wrath."],["Esther 3:6","And he thought scorn to lay hands on Mordecai alone; for they had shewed him the people of Mordecai: wherefore Haman sought to destroy all the Jews that were throughout the whole kingdom of Ahasuerus, even the people of Mordecai."]]},{"ref":"Esther 5:9–14","verses":[["Esther 5:9","Then went Haman forth that day joyful and with a glad heart: but when Haman saw Mordecai in the king’s gate, that he stood not up, nor moved for him, he was full of indignation against Mordecai."],["Esther 5:10","Nevertheless Haman refrained himself: and when he came home, he sent and called for his friends, and Zeresh his wife."],["Esther 5:11","And Haman told them of the glory of his riches, and the multitude of his children, and all the things wherein the king had promoted him, and how he had advanced him above the princes and servants of the king."],["Esther 5:12","Haman said moreover, Yea, Esther the queen did let no man come in with the king unto the banquet that she had prepared but myself; and to morrow am I invited unto her also with the king."],["Esther 5:13","Yet all this availeth me nothing, so long as I see Mordecai the Jew sitting at the king’s gate."],["Esther 5:14","Then said Zeresh his wife and all his friends unto him, Let a gallows be made of fifty cubits high, and to morrow speak thou unto the king that Mordecai may be hanged thereon: then go thou in merrily with the king unto the banquet. And the thing pleased Haman; and he caused the gallows to be made."]]},{"ref":"Esther 7:9–10","verses":[["Esther 7:9","And Harbonah, one of the chamberlains, said before the king, Behold also, the gallows fifty cubits high, which Haman had made for Mordecai, who had spoken good for the king, standeth in the house of Haman. Then the king said, Hang him thereon."],["Esther 7:10","So they hanged Haman on the gallows that he had prepared for Mordecai. Then was the king’s wrath pacified."]]}]},{"a":"jehoiakim_1085","b":"jeremiah_853","type":"enemies","why":"Jehoiakim burned the scroll of Jeremiah's words and commanded men to take Jeremiah, but the LORD hid him.","refs":[{"ref":"Jeremiah 36:21–23","verses":[["Jeremiah 36:21","So the king sent Jehudi to fetch the roll: and he took it out of Elishama the scribe’s chamber. And Jehudi read it in the ears of the king, and in the ears of all the princes which stood beside the king."],["Jeremiah 36:22","Now the king sat in the winterhouse in the ninth month: and there was a fire on the hearth burning before him."],["Jeremiah 36:23","And it came to pass, that when Jehudi had read three or four leaves, he cut it with the penknife, and cast it into the fire that was on the hearth, until all the roll was consumed in the fire that was on the hearth."]]},{"ref":"Jeremiah 36:26","verses":[["Jeremiah 36:26","But the king commanded Jerahmeel the son of Hammelech, and Seraiah the son of Azriel, and Shelemiah the son of Abdeel, to take Baruch the scribe and Jeremiah the prophet: but the LORD hid them."]]}]},{"a":"jeremiah_853","b":"zedekiah_1950","type":"counseled","why":"Zedekiah asked Jeremiah in secret for the LORD's word, and Jeremiah gave him counsel: go out to the king of Babylon's princes and your soul shall live.","refs":[{"ref":"Jeremiah 37:17","verses":[["Jeremiah 37:17","Then Zedekiah the king sent, and took him out: and the king asked him secretly in his house, and said, Is there any word from the LORD? And Jeremiah said, There is: for, said he, thou shalt be delivered into the hand of the king of Babylon."]]},{"ref":"Jeremiah 38:14–18","verses":[["Jeremiah 38:14","Then Zedekiah the king sent, and took Jeremiah the prophet unto him into the third entry that is in the house of the LORD: and the king said unto Jeremiah, I will ask thee a thing; hide nothing from me."],["Jeremiah 38:15","Then Jeremiah said unto Zedekiah, If I declare it unto thee, wilt thou not surely put me to death? and if I give thee counsel, wilt thou not hearken unto me?"],["Jeremiah 38:16","So Zedekiah the king sware secretly unto Jeremiah, saying, As the LORD liveth, that made us this soul, I will not put thee to death, neither will I give thee into the hand of these men that seek thy life."],["Jeremiah 38:17","Then said Jeremiah unto Zedekiah, Thus saith the LORD, the God of hosts, the God of Israel; If thou wilt assuredly go forth unto the king of Babylon’s princes, then thy soul shall live, and this city shall not be burned with fire; and thou shalt live, and thine house:"],["Jeremiah 38:18","But if thou wilt not go forth to the king of Babylon’s princes, then shall this city be given into the hand of the Chaldeans, and they shall burn it with fire, and thou shalt not escape out of their hand."]]},{"ref":"Jeremiah 21:1–2","verses":[["Jeremiah 21:1","The word which came unto Jeremiah from the LORD, when king Zedekiah sent unto him Pashur the son of Melchiah, and Zephaniah the son of Maaseiah the priest, saying,"],["Jeremiah 21:2","Enquire, I pray thee, of the LORD for us; for Nebuchadrezzar king of Babylon maketh war against us; if so be that the LORD will deal with us according to all his wondrous works, that he may go up from us."]]}]},{"a":"jeremiah_853","b":"nebuchadnezzar_2167","type":"prophecy","why":"Jeremiah said the LORD would bring Nebuchadnezzar against the land and the nations would serve the king of Babylon seventy years, and Chronicles says the captivity in Babylon fulfilled the word by Jeremiah.","refs":[{"ref":"Jeremiah 25:9–11","verses":[["Jeremiah 25:9","Behold, I will send and take all the families of the north, saith the LORD, and Nebuchadrezzar the king of Babylon, my servant, and will bring them against this land, and against the inhabitants thereof, and against all these nations round about, and will utterly destroy them, and make them an astonishment, and an hissing, and perpetual desolations."],["Jeremiah 25:10","Moreover I will take from them the voice of mirth, and the voice of gladness, the voice of the bridegroom, and the voice of the bride, the sound of the millstones, and the light of the candle."],["Jeremiah 25:11","And this whole land shall be a desolation, and an astonishment; and these nations shall serve the king of Babylon seventy years."]]}],"fulfilled":[{"ref":"2 Chronicles 36:17–21","verses":[["2 Chronicles 36:17","Therefore he brought upon them the king of the Chaldees, who slew their young men with the sword in the house of their sanctuary, and had no compassion upon young man or maiden, old man, or him that stooped for age: he gave them all into his hand."],["2 Chronicles 36:18","And all the vessels of the house of God, great and small, and the treasures of the house of the LORD, and the treasures of the king, and of his princes; all these he brought to Babylon."],["2 Chronicles 36:19","And they burnt the house of God, and brake down the wall of Jerusalem, and burnt all the palaces thereof with fire, and destroyed all the goodly vessels thereof."],["2 Chronicles 36:20","And them that had escaped from the sword carried he away to Babylon; where they were servants to him and his sons until the reign of the kingdom of Persia:"],["2 Chronicles 36:21","To fulfil the word of the LORD by the mouth of Jeremiah, until the land had enjoyed her sabbaths: for as long as she lay desolate she kept sabbath, to fulfil threescore and ten years."]]}]},{"a":"jeremiah_853","b":"johanan_1666","type":"counseled","why":"Johanan and the people asked Jeremiah to seek the LORD's way for them, and Jeremiah told them not to go into Egypt, but Johanan called his word false and took him to Egypt.","refs":[{"ref":"Jeremiah 42:1–6","verses":[["Jeremiah 42:1","Then all the captains of the forces, and Johanan the son of Kareah, and Jezaniah the son of Hoshaiah, and all the people from the least even unto the greatest, came near,"],["Jeremiah 42:2","And said unto Jeremiah the prophet, Let, we beseech thee, our supplication be accepted before thee, and pray for us unto the LORD thy God, even for all this remnant; (for we are left but a few of many, as thine eyes do behold us:)"],["Jeremiah 42:3","That the LORD thy God may shew us the way wherein we may walk, and the thing that we may do."],["Jeremiah 42:4","Then Jeremiah the prophet said unto them, I have heard you; behold, I will pray unto the LORD your God according to your words; and it shall come to pass, that whatsoever thing the LORD shall answer you, I will declare it unto you; I will keep nothing back from you."],["Jeremiah 42:5","Then they said to Jeremiah, The LORD be a true and faithful witness between us, if we do not even according to all things for the which the LORD thy God shall send thee to us."],["Jeremiah 42:6","Whether it be good, or whether it be evil, we will obey the voice of the LORD our God, to whom we send thee; that it may be well with us, when we obey the voice of the LORD our God."]]},{"ref":"Jeremiah 42:19–21","verses":[["Jeremiah 42:19","The LORD hath said concerning you, O ye remnant of Judah; Go ye not into Egypt: know certainly that I have admonished you this day."],["Jeremiah 42:20","For ye dissembled in your hearts, when ye sent me unto the LORD your God, saying, Pray for us unto the LORD our God; and according unto all that the LORD our God shall say, so declare unto us, and we will do it."],["Jeremiah 42:21","And now I have this day declared it to you; but ye have not obeyed the voice of the LORD your God, nor any thing for the which he hath sent me unto you."]]},{"ref":"Jeremiah 43:2–7","verses":[["Jeremiah 43:2","Then spake Azariah the son of Hoshaiah, and Johanan the son of Kareah, and all the proud men, saying unto Jeremiah, Thou speakest falsely: the LORD our God hath not sent thee to say, Go not into Egypt to sojourn there:"],["Jeremiah 43:3","But Baruch the son of Neriah setteth thee on against us, for to deliver us into the hand of the Chaldeans, that they might put us to death, and carry us away captives into Babylon."],["Jeremiah 43:4","So Johanan the son of Kareah, and all the captains of the forces, and all the people, obeyed not the voice of the LORD, to dwell in the land of Judah."],["Jeremiah 43:5","But Johanan the son of Kareah, and all the captains of the forces, took all the remnant of Judah, that were returned from all nations, whither they had been driven, to dwell in the land of Judah;"],["Jeremiah 43:6","Even men, and women, and children, and the king’s daughters, and every person that Nebuzaradan the captain of the guard had left with Gedaliah the son of Ahikam the son of Shaphan, and Jeremiah the prophet, and Baruch the son of Neriah."],["Jeremiah 43:7","So they came into the land of Egypt: for they obeyed not the voice of the LORD: thus came they even to Tahpanhes."]]}]},{"a":"joshua_893","b":"zerubbabel_3054","type":"worked_together","why":"Jeshua and Zerubbabel together built the altar and began building the house of God in Jerusalem.","refs":[{"ref":"Ezra 3:2","verses":[["Ezra 3:2","Then stood up Jeshua the son of Jozadak, and his brethren the priests, and Zerubbabel the son of Shealtiel, and his brethren, and builded the altar of the God of Israel, to offer burnt offerings thereon, as it is written in the law of Moses the man of God."]]},{"ref":"Ezra 3:8","verses":[["Ezra 3:8","Now in the second year of their coming unto the house of God at Jerusalem, in the second month, began Zerubbabel the son of Shealtiel, and Jeshua the son of Jozadak, and the remnant of their brethren the priests and the Levites, and all they that were come out of the captivity unto Jerusalem; and appointed the Levites, from twenty years old and upward, to set forward the work of the house of the LORD."]]},{"ref":"Ezra 5:2","verses":[["Ezra 5:2","Then rose up Zerubbabel the son of Shealtiel, and Jeshua the son of Jozadak, and began to build the house of God which is at Jerusalem: and with them were the prophets of God helping them."]]},{"ref":"Haggai 1:12–14","verses":[["Haggai 1:12","Then Zerubbabel the son of Shealtiel, and Joshua the son of Josedech, the high priest, with all the remnant of the people, obeyed the voice of the LORD their God, and the words of Haggai the prophet, as the LORD their God had sent him, and the people did fear before the LORD."],["Haggai 1:13","Then spake Haggai the LORD’S messenger in the LORD’S message unto the people, saying, I am with you, saith the LORD."],["Haggai 1:14","And the LORD stirred up the spirit of Zerubbabel the son of Shealtiel, governor of Judah, and the spirit of Joshua the son of Josedech, the high priest, and the spirit of all the remnant of the people; and they came and did work in the house of the LORD of hosts, their God,"]]}]},{"a":"joshua_893","b":"zechariah_3016","type":"counseled","why":"Zechariah saw the angel of the LORD take away Joshua’s iniquity and charge him to walk in the LORD’s ways, and at the LORD’s word Zechariah set crowns on Joshua’s head and told him of the BRANCH.","refs":[{"ref":"Zechariah 3:1–8","verses":[["Zechariah 3:1","And he shewed me Joshua the high priest standing before the angel of the LORD, and Satan standing at his right hand to resist him."],["Zechariah 3:2","And the LORD said unto Satan, The LORD rebuke thee, O Satan; even the LORD that hath chosen Jerusalem rebuke thee: is not this a brand plucked out of the fire?"],["Zechariah 3:3","Now Joshua was clothed with filthy garments, and stood before the angel."],["Zechariah 3:4","And he answered and spake unto those that stood before him, saying, Take away the filthy garments from him. And unto him he said, Behold, I have caused thine iniquity to pass from thee, and I will clothe thee with change of raiment."],["Zechariah 3:5","And I said, Let them set a fair mitre upon his head. So they set a fair mitre upon his head, and clothed him with garments. And the angel of the LORD stood by."],["Zechariah 3:6","And the angel of the LORD protested unto Joshua, saying,"],["Zechariah 3:7","Thus saith the LORD of hosts; If thou wilt walk in my ways, and if thou wilt keep my charge, then thou shalt also judge my house, and shalt also keep my courts, and I will give thee places to walk among these that stand by."],["Zechariah 3:8","Hear now, O Joshua the high priest, thou, and thy fellows that sit before thee: for they are men wondered at: for, behold, I will bring forth my servant the BRANCH."]]},{"ref":"Zechariah 6:9–13","verses":[["Zechariah 6:9","And the word of the LORD came unto me, saying,"],["Zechariah 6:10","Take of them of the captivity, even of Heldai, of Tobijah, and of Jedaiah, which are come from Babylon, and come thou the same day, and go into the house of Josiah the son of Zephaniah;"],["Zechariah 6:11","Then take silver and gold, and make crowns, and set them upon the head of Joshua the son of Josedech, the high priest;"],["Zechariah 6:12","And speak unto him, saying, Thus speaketh the LORD of hosts, saying, Behold the man whose name is The BRANCH; and he shall grow up out of his place, and he shall build the temple of the LORD:"],["Zechariah 6:13","Even he shall build the temple of the LORD; and he shall bear the glory, and shall sit and rule upon his throne; and he shall be a priest upon his throne: and the counsel of peace shall be between them both."]]}]},{"a":"meshach_2092","b":"shadrach_1398","type":"friends","why":"Meshach and Shadrach were both Daniel's companions; they were set over the province of Babylon together, refused together to worship the golden image, and were cast into the furnace together and delivered.","refs":[{"ref":"Daniel 2:17–18","verses":[["Daniel 2:17","Then Daniel went to his house, and made the thing known to Hananiah, Mishael, and Azariah, his companions:"],["Daniel 2:18","That they would desire mercies of the God of heaven concerning this secret; that Daniel and his fellows should not perish with the rest of the wise men of Babylon."]]},{"ref":"Daniel 2:49","verses":[["Daniel 2:49","Then Daniel requested of the king, and he set Shadrach, Meshach, and Abednego, over the affairs of the province of Babylon: but Daniel sat in the gate of the king."]]},{"ref":"Daniel 3:16–27","verses":[["Daniel 3:16","Shadrach, Meshach, and Abednego, answered and said to the king, O Nebuchadnezzar, we are not careful to answer thee in this matter."],["Daniel 3:17","If it be so, our God whom we serve is able to deliver us from the burning fiery furnace, and he will deliver us out of thine hand, O king."],["Daniel 3:18","But if not, be it known unto thee, O king, that we will not serve thy gods, nor worship the golden image which thou hast set up."],["Daniel 3:19","Then was Nebuchadnezzar full of fury, and the form of his visage was changed against Shadrach, Meshach, and Abednego: therefore he spake, and commanded that they should heat the furnace one seven times more than it was wont to be heated."],["Daniel 3:20","And he commanded the most mighty men that were in his army to bind Shadrach, Meshach, and Abednego, and to cast them into the burning fiery furnace."],["Daniel 3:21","Then these men were bound in their coats, their hosen, and their hats, and their other garments, and were cast into the midst of the burning fiery furnace."],["Daniel 3:22","Therefore because the king’s commandment was urgent, and the furnace exceeding hot, the flame of the fire slew those men that took up Shadrach, Meshach, and Abednego."],["Daniel 3:23","And these three men, Shadrach, Meshach, and Abednego, fell down bound into the midst of the burning fiery furnace."],["Daniel 3:24","Then Nebuchadnezzar the king was astonied, and rose up in haste, and spake, and said unto his counsellors, Did not we cast three men bound into the midst of the fire? They answered and said unto the king, True, O king."],["Daniel 3:25","He answered and said, Lo, I see four men loose, walking in the midst of the fire, and they have no hurt; and the form of the fourth is like the Son of God."],["Daniel 3:26","Then Nebuchadnezzar came near to the mouth of the burning fiery furnace, and spake, and said, Shadrach, Meshach, and Abednego, ye servants of the most high God, come forth, and come hither. Then Shadrach, Meshach, and Abednego, came forth of the midst of the fire."],["Daniel 3:27","And the princes, governors, and captains, and the king’s counsellors, being gathered together, saw these men, upon whose bodies the fire had no power, nor was an hair of their head singed, neither were their coats changed, nor the smell of fire had passed on them."]]}]},{"a":"meshach_2092","b":"nebuchadnezzar_2167","type":"served","why":"Nebuchadnezzar set Meshach over the affairs of the province of Babylon and, after the furnace, promoted him.","refs":[{"ref":"Daniel 2:49","verses":[["Daniel 2:49","Then Daniel requested of the king, and he set Shadrach, Meshach, and Abednego, over the affairs of the province of Babylon: but Daniel sat in the gate of the king."]]},{"ref":"Daniel 3:30","verses":[["Daniel 3:30","Then the king promoted Shadrach, Meshach, and Abednego, in the province of Babylon."]]}]},{"a":"meshach_2092","b":"nebuchadnezzar_2167","type":"enemies","why":"When Meshach would not serve his gods, Nebuchadnezzar in fury had him bound and cast into the burning fiery furnace.","refs":[{"ref":"Daniel 3:12–21","verses":[["Daniel 3:12","There are certain Jews whom thou hast set over the affairs of the province of Babylon, Shadrach, Meshach, and Abednego; these men, O king, have not regarded thee: they serve not thy gods, nor worship the golden image which thou hast set up."],["Daniel 3:13","Then Nebuchadnezzar in his rage and fury commanded to bring Shadrach, Meshach, and Abednego. Then they brought these men before the king."],["Daniel 3:14","Nebuchadnezzar spake and said unto them, Is it true, O Shadrach, Meshach, and Abednego, do not ye serve my gods, nor worship the golden image which I have set up?"],["Daniel 3:15","Now if ye be ready that at what time ye hear the sound of the cornet, flute, harp, sackbut, psaltery, and dulcimer, and all kinds of musick, ye fall down and worship the image which I have made; well: but if ye worship not, ye shall be cast the same hour into the midst of a burning fiery furnace; and who is that God that shall deliver you out of my hands?"],["Daniel 3:16","Shadrach, Meshach, and Abednego, answered and said to the king, O Nebuchadnezzar, we are not careful to answer thee in this matter."],["Daniel 3:17","If it be so, our God whom we serve is able to deliver us from the burning fiery furnace, and he will deliver us out of thine hand, O king."],["Daniel 3:18","But if not, be it known unto thee, O king, that we will not serve thy gods, nor worship the golden image which thou hast set up."],["Daniel 3:19","Then was Nebuchadnezzar full of fury, and the form of his visage was changed against Shadrach, Meshach, and Abednego: therefore he spake, and commanded that they should heat the furnace one seven times more than it was wont to be heated."],["Daniel 3:20","And he commanded the most mighty men that were in his army to bind Shadrach, Meshach, and Abednego, and to cast them into the burning fiery furnace."],["Daniel 3:21","Then these men were bound in their coats, their hosen, and their hats, and their other garments, and were cast into the midst of the burning fiery furnace."]]}]},{"a":"nebuchadnezzar_2167","b":"shadrach_1398","type":"served","why":"Nebuchadnezzar set Shadrach over the affairs of the province of Babylon and, after the furnace, promoted him.","refs":[{"ref":"Daniel 2:49","verses":[["Daniel 2:49","Then Daniel requested of the king, and he set Shadrach, Meshach, and Abednego, over the affairs of the province of Babylon: but Daniel sat in the gate of the king."]]},{"ref":"Daniel 3:30","verses":[["Daniel 3:30","Then the king promoted Shadrach, Meshach, and Abednego, in the province of Babylon."]]}]},{"a":"nebuchadnezzar_2167","b":"shadrach_1398","type":"enemies","why":"When Shadrach would not serve his gods, Nebuchadnezzar in fury had him bound and cast into the burning fiery furnace.","refs":[{"ref":"Daniel 3:12–21","verses":[["Daniel 3:12","There are certain Jews whom thou hast set over the affairs of the province of Babylon, Shadrach, Meshach, and Abednego; these men, O king, have not regarded thee: they serve not thy gods, nor worship the golden image which thou hast set up."],["Daniel 3:13","Then Nebuchadnezzar in his rage and fury commanded to bring Shadrach, Meshach, and Abednego. Then they brought these men before the king."],["Daniel 3:14","Nebuchadnezzar spake and said unto them, Is it true, O Shadrach, Meshach, and Abednego, do not ye serve my gods, nor worship the golden image which I have set up?"],["Daniel 3:15","Now if ye be ready that at what time ye hear the sound of the cornet, flute, harp, sackbut, psaltery, and dulcimer, and all kinds of musick, ye fall down and worship the image which I have made; well: but if ye worship not, ye shall be cast the same hour into the midst of a burning fiery furnace; and who is that God that shall deliver you out of my hands?"],["Daniel 3:16","Shadrach, Meshach, and Abednego, answered and said to the king, O Nebuchadnezzar, we are not careful to answer thee in this matter."],["Daniel 3:17","If it be so, our God whom we serve is able to deliver us from the burning fiery furnace, and he will deliver us out of thine hand, O king."],["Daniel 3:18","But if not, be it known unto thee, O king, that we will not serve thy gods, nor worship the golden image which thou hast set up."],["Dani
