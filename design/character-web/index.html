es":[["Genesis 29:35","And she conceived again, and bare a son: and she said, Now will I praise the LORD: therefore she called his name Judah; and left bearing."]]},{"ref":"Genesis 35:23","verses":[["Genesis 35:23","The sons of Leah; Reuben, Jacob’s firstborn, and Simeon, and Levi, and Judah, and Issachar, and Zebulun:"]]}]},{"a":"japheth_726","b":"noah_2210","type":"family","why":"Japheth was one of the three sons of Noah who went forth from the ark.","refs":[{"ref":"Genesis 5:32","verses":[["Genesis 5:32","And Noah was five hundred years old: and Noah begat Shem, Ham, and Japheth."]]},{"ref":"Genesis 9:18–19","verses":[["Genesis 9:18","And the sons of Noah, that went forth of the ark, were Shem, and Ham, and Japheth: and Ham is the father of Canaan."],["Genesis 9:19","These are the three sons of Noah: and of them was the whole earth overspread."]]}]},{"a":"japheth_726","b":"shem_2613","type":"family","why":"Shem and Japheth were sons of Noah.","refs":[{"ref":"Genesis 9:18–19","verses":[["Genesis 9:18","And the sons of Noah, that went forth of the ark, were Shem, and Ham, and Japheth: and Ham is the father of Canaan."],["Genesis 9:19","These are the three sons of Noah: and of them was the whole earth overspread."]]}]},{"a":"jethro_2431","b":"moses_2108","type":"family","why":"Jethro was Moses' father-in-law, who gave him his daughter Zipporah.","refs":[{"ref":"Exodus 2:16–21","verses":[["Exodus 2:16","Now the priest of Midian had seven daughters: and they came and drew water, and filled the troughs to water their father’s flock."],["Exodus 2:17","And the shepherds came and drove them away: but Moses stood up and helped them, and watered their flock."],["Exodus 2:18","And when they came to Reuel their father, he said, How is it that ye are come so soon to day?"],["Exodus 2:19","And they said, An Egyptian delivered us out of the hand of the shepherds, and also drew water enough for us, and watered the flock."],["Exodus 2:20","And he said unto his daughters, And where is he? why is it that ye have left the man? call him, that he may eat bread."],["Exodus 2:21","And Moses was content to dwell with the man: and he gave Moses Zipporah his daughter."]]},{"ref":"Exodus 18:1–7","verses":[["Exodus 18:1","When Jethro, the priest of Midian, Moses’ father in law, heard of all that God had done for Moses, and for Israel his people, and that the LORD had brought Israel out of Egypt;"],["Exodus 18:2","Then Jethro, Moses’ father in law, took Zipporah, Moses’ wife, after he had sent her back,"],["Exodus 18:3","And her two sons; of which the name of the one was Gershom; for he said, I have been an alien in a strange land:"],["Exodus 18:4","And the name of the other was Eliezer; for the God of my father, said he, was mine help, and delivered me from the sword of Pharaoh:"],["Exodus 18:5","And Jethro, Moses’ father in law, came with his sons and his wife unto Moses into the wilderness, where he encamped at the mount of God:"],["Exodus 18:6","And he said unto Moses, I thy father in law Jethro am come unto thee, and thy wife, and her two sons with her."],["Exodus 18:7","And Moses went out to meet his father in law, and did obeisance, and kissed him; and they asked each other of their welfare; and they came into the tent."]]}]},{"a":"jethro_2431","b":"moses_2108","type":"counseled","why":"Jethro saw Moses judging the people alone and gave him counsel to appoint rulers, and Moses hearkened to his voice.","refs":[{"ref":"Exodus 18:13–24","verses":[["Exodus 18:13","And it came to pass on the morrow, that Moses sat to judge the people: and the people stood by Moses from the morning unto the evening."],["Exodus 18:14","And when Moses’ father in law saw all that he did to the people, he said, What is this thing that thou doest to the people? why sittest thou thyself alone, and all the people stand by thee from morning unto even?"],["Exodus 18:15","And Moses said unto his father in law, Because the people come unto me to enquire of God:"],["Exodus 18:16","When they have a matter, they come unto me; and I judge between one and another, and I do make them know the statutes of God, and his laws."],["Exodus 18:17","And Moses’ father in law said unto him, The thing that thou doest is not good."],["Exodus 18:18","Thou wilt surely wear away, both thou, and this people that is with thee: for this thing is too heavy for thee; thou art not able to perform it thyself alone."],["Exodus 18:19","Hearken now unto my voice, I will give thee counsel, and God shall be with thee: Be thou for the people to God-ward, that thou mayest bring the causes unto God:"],["Exodus 18:20","And thou shalt teach them ordinances and laws, and shalt shew them the way wherein they must walk, and the work that they must do."],["Exodus 18:21","Moreover thou shalt provide out of all the people able men, such as fear God, men of truth, hating covetousness; and place such over them, to be rulers of thousands, and rulers of hundreds, rulers of fifties, and rulers of tens:"],["Exodus 18:22","And let them judge the people at all seasons: and it shall be, that every great matter they shall bring unto thee, but every small matter they shall judge: so shall it be easier for thyself, and they shall bear the burden with thee."],["Exodus 18:23","If thou shalt do this thing, and God command thee so, then thou shalt be able to endure, and all this people shall also go to their place in peace."],["Exodus 18:24","So Moses hearkened to the voice of his father in law, and did all that he had said."]]}]},{"a":"aaron_1","b":"jethro_2431","type":"crossed_paths","why":"Aaron and the elders of Israel came to eat bread with Moses' father-in-law Jethro before God.","refs":[{"ref":"Exodus 18:12","verses":[["Exodus 18:12","And Jethro, Moses’ father in law, took a burnt offering and sacrifices for God: and Aaron came, and all the elders of Israel, to eat bread with Moses’ father in law before God."]]}]},{"a":"joseph_1710","b":"pharaoh_2329","type":"served","why":"Pharaoh set Joseph over his house and all the land of Egypt, second only to the throne.","refs":[{"ref":"Genesis 41:37–44","verses":[["Genesis 41:37","And the thing was good in the eyes of Pharaoh, and in the eyes of all his servants."],["Genesis 41:38","And Pharaoh said unto his servants, Can we find such a one as this is, a man in whom the Spirit of God is?"],["Genesis 41:39","And Pharaoh said unto Joseph, Forasmuch as God hath shewed thee all this, there is none so discreet and wise as thou art:"],["Genesis 41:40","Thou shalt be over my house, and according unto thy word shall all my people be ruled: only in the throne will I be greater than thou."],["Genesis 41:41","And Pharaoh said unto Joseph, See, I have set thee over all the land of Egypt."],["Genesis 41:42","And Pharaoh took off his ring from his hand, and put it upon Joseph’s hand, and arrayed him in vestures of fine linen, and put a gold chain about his neck;"],["Genesis 41:43","And he made him to ride in the second chariot which he had; and they cried before him, Bow the knee: and he made him ruler over all the land of Egypt."],["Genesis 41:44","And Pharaoh said unto Joseph, I am Pharaoh, and without thee shall no man lift up his hand or foot in all the land of Egypt."]]}]},{"a":"joseph_1710","b":"judah_1751","type":"family","why":"Joseph and Judah were both among the twelve sons of Jacob.","refs":[{"ref":"Genesis 35:22–26","verses":[["Genesis 35:22","And it came to pass, when Israel dwelt in that land, that Reuben went and lay with Bilhah his father’s concubine: and Israel heard it. Now the sons of Jacob were twelve:"],["Genesis 35:23","The sons of Leah; Reuben, Jacob’s firstborn, and Simeon, and Levi, and Judah, and Issachar, and Zebulun:"],["Genesis 35:24","The sons of Rachel; Joseph, and Benjamin:"],["Genesis 35:25","And the sons of Bilhah, Rachel’s handmaid; Dan, and Naphtali:"],["Genesis 35:26","And the sons of Zilpah, Leah’s handmaid; Gad, and Asher: these are the sons of Jacob, which were born to him in Padanaram."]]}]},{"a":"joseph_1710","b":"judah_1751","type":"betrayed","why":"Judah urged his brothers to sell their brother Joseph to the Ishmeelites, and Joseph later named himself to them as the brother whom they sold into Egypt.","refs":[{"ref":"Genesis 37:26–28","verses":[["Genesis 37:26","And Judah said unto his brethren, What profit is it if we slay our brother, and conceal his blood?"],["Genesis 37:27","Come, and let us sell him to the Ishmeelites, and let not our hand be upon him; for he is our brother and our flesh. And his brethren were content."],["Genesis 37:28","Then there passed by Midianites merchantmen; and they drew and lifted up Joseph out of the pit, and sold Joseph to the Ishmeelites for twenty pieces of silver: and they brought Joseph into Egypt."]]},{"ref":"Genesis 45:4","verses":[["Genesis 45:4","And Joseph said unto his brethren, Come near to me, I pray you. And they came near. And he said, I am Joseph your brother, whom ye sold into Egypt."]]}]},{"a":"joseph_1710","b":"reuben_2429","type":"family","why":"Joseph and Reuben were both among the twelve sons of Jacob.","refs":[{"ref":"Genesis 35:22–26","verses":[["Genesis 35:22","And it came to pass, when Israel dwelt in that land, that Reuben went and lay with Bilhah his father’s concubine: and Israel heard it. Now the sons of Jacob were twelve:"],["Genesis 35:23","The sons of Leah; Reuben, Jacob’s firstborn, and Simeon, and Levi, and Judah, and Issachar, and Zebulun:"],["Genesis 35:24","The sons of Rachel; Joseph, and Benjamin:"],["Genesis 35:25","And the sons of Bilhah, Rachel’s handmaid; Dan, and Naphtali:"],["Genesis 35:26","And the sons of Zilpah, Leah’s handmaid; Gad, and Asher: these are the sons of Jacob, which were born to him in Padanaram."]]}]},{"a":"joseph_1710","b":"reuben_2429","type":"helped","why":"Reuben delivered Joseph out of his brothers' hands, so that they did not kill him, to restore him to his father.","refs":[{"ref":"Genesis 37:21–22","verses":[["Genesis 37:21","And Reuben heard it, and he delivered him out of their hands; and said, Let us not kill him."],["Genesis 37:22","And Reuben said unto them, Shed no blood, but cast him into this pit that is in the wilderness, and lay no hand upon him; that he might rid him out of their hands, to deliver him to his father again."]]},{"ref":"Genesis 37:29–30","verses":[["Genesis 37:29","And Reuben returned unto the pit; and, behold, Joseph was not in the pit; and he rent his clothes."],["Genesis 37:30","And he returned unto his brethren, and said, The child is not; and I, whither shall I go?"]]},{"ref":"Genesis 42:22","verses":[["Genesis 42:22","And Reuben answered them, saying, Spake I not unto you, saying, Do not sin against the child; and ye would not hear? therefore, behold, also his blood is required."]]}]},{"a":"joseph_1710","b":"manasseh_1928","type":"family","why":"Joseph named his firstborn Manasseh, for God had made him forget all his toil.","refs":[{"ref":"Genesis 41:50–51","verses":[["Genesis 41:50","And unto Joseph were born two sons before the years of famine came, which Asenath the daughter of Potipherah priest of On bare unto him."],["Genesis 41:51","And Joseph called the name of the firstborn Manasseh: For God, said he, hath made me forget all my toil, and all my father’s house."]]},{"ref":"Genesis 48:1","verses":[["Genesis 48:1","And it came to pass after these things, that one told Joseph, Behold, thy father is sick: and he took with him his two sons, Manasseh and Ephraim."]]}]},{"a":"joseph_1710","b":"potiphar_2368","type":"served","why":"Potiphar bought Joseph and made him overseer over his house and all he had.","refs":[{"ref":"Genesis 39:1–6","verses":[["Genesis 39:1","And Joseph was brought down to Egypt; and Potiphar, an officer of Pharaoh, captain of the guard, an Egyptian, bought him of the hands of the Ishmeelites, which had brought him down thither."],["Genesis 39:2","And the LORD was with Joseph, and he was a prosperous man; and he was in the house of his master the Egyptian."],["Genesis 39:3","And his master saw that the LORD was with him, and that the LORD made all that he did to prosper in his hand."],["Genesis 39:4","And Joseph found grace in his sight, and he served him: and he made him overseer over his house, and all that he had he put into his hand."],["Genesis 39:5","And it came to pass from the time that he had made him overseer in his house, and over all that he had, that the LORD blessed the Egyptian’s house for Joseph’s sake; and the blessing of the LORD was upon all that he had in the house, and in the field."],["Genesis 39:6","And he left all that he had in Joseph’s hand; and he knew not ought he had, save the bread which he did eat. And Joseph was a goodly person, and well favoured."]]}]},{"a":"joseph_1710","b":"rachel_2386","type":"family","why":"God remembered Rachel, and she bore a son and called him Joseph.","refs":[{"ref":"Genesis 30:22–24","verses":[["Genesis 30:22","And God remembered Rachel, and God hearkened to her, and opened her womb."],["Genesis 30:23","And she conceived, and bare a son; and said, God hath taken away my reproach:"],["Genesis 30:24","And she called his name Joseph; and said, The LORD shall add to me another son."]]}]},{"a":"joshua_1727","b":"moses_2108","type":"served","why":"Joshua was Moses' minister, who went up the mount with him and served him from his youth.","refs":[{"ref":"Exodus 24:13","verses":[["Exodus 24:13","And Moses rose up, and his minister Joshua: and Moses went up into the mount of God."]]},{"ref":"Numbers 11:28","verses":[["Numbers 11:28","And Joshua the son of Nun, the servant of Moses, one of his young men, answered and said, My lord Moses, forbid them."]]},{"ref":"Joshua 1:1","verses":[["Joshua 1:1","Now after the death of Moses the servant of the LORD it came to pass, that the LORD spake unto Joshua the son of Nun, Moses’ minister, saying,"]]}]},{"a":"joshua_1727","b":"moses_2108","type":"anointed","why":"At the LORD's command Moses laid his hands on Joshua and gave him a charge before the congregation, and Joshua was full of the spirit of wisdom.","refs":[{"ref":"Numbers 27:18–23","verses":[["Numbers 27:18","And the LORD said unto Moses, Take thee Joshua the son of Nun, a man in whom is the spirit, and lay thine hand upon him;"],["Numbers 27:19","And set him before Eleazar the priest, and before all the congregation; and give him a charge in their sight."],["Numbers 27:20","And thou shalt put some of thine honour upon him, that all the congregation of the children of Israel may be obedient."],["Numbers 27:21","And he shall stand before Eleazar the priest, who shall ask counsel for him after the judgment of Urim before the LORD: at his word shall they go out, and at his word they shall come in, both he, and all the children of Israel with him, even all the congregation."],["Numbers 27:22","And Moses did as the LORD commanded him: and he took Joshua, and set him before Eleazar the priest, and before all the congregation:"],["Numbers 27:23","And he laid his hands upon him, and gave him a charge, as the LORD commanded by the hand of Moses."]]},{"ref":"Deuteronomy 34:9","verses":[["Deuteronomy 34:9","And Joshua the son of Nun was full of the spirit of wisdom; for Moses had laid his hands upon him: and the children of Israel hearkened unto him, and did as the LORD commanded Moses."]]}]},{"a":"benjamin_463","b":"judah_1751","type":"family","why":"Judah and Benjamin were both among the twelve sons of Jacob.","refs":[{"ref":"Genesis 35:22–26","verses":[["Genesis 35:22","And it came to pass, when Israel dwelt in that land, that Reuben went and lay with Bilhah his father’s concubine: and Israel heard it. Now the sons of Jacob were twelve:"],["Genesis 35:23","The sons of Leah; Reuben, Jacob’s firstborn, and Simeon, and Levi, and Judah, and Issachar, and Zebulun:"],["Genesis 35:24","The sons of Rachel; Joseph, and Benjamin:"],["Genesis 35:25","And the sons of Bilhah, Rachel’s handmaid; Dan, and Naphtali:"],["Genesis 35:26","And the sons of Zilpah, Leah’s handmaid; Gad, and Asher: these are the sons of Jacob, which were born to him in Padanaram."]]}]},{"a":"benjamin_463","b":"judah_1751","type":"helped","why":"Judah became surety for Benjamin to his father, and offered to remain a bondman in Egypt in Benjamin's place.","refs":[{"ref":"Genesis 43:8–9","verses":[["Genesis 43:8","And Judah said unto Israel his father, Send the lad with me, and we will arise and go; that we may live, and not die, both we, and thou, and also our little ones."],["Genesis 43:9","I will be surety for him; of my hand shalt thou require him: if I bring him not unto thee, and set him before thee, then let me bear the blame for ever:"]]},{"ref":"Genesis 44:30–34","verses":[["Genesis 44:30","Now therefore when I come to thy servant my father, and the lad be not with us; seeing that his life is bound up in the lad’s life;"],["Genesis 44:31","It shall come to pass, when he seeth that the lad is not with us, that he will die: and thy servants shall bring down the gray hairs of thy servant our father with sorrow to the grave."],["Genesis 44:32","For thy servant became surety for the lad unto my father, saying, If I bring him not unto thee, then I shall bear the blame to my father for ever."],["Genesis 44:33","Now therefore, I pray thee, let thy servant abide instead of the lad a bondman to my lord; and let the lad go up with his brethren."],["Genesis 44:34","For how shall I go up to my father, and the lad be not with me? lest peradventure I see the evil that shall come on my father."]]}]},{"a":"judah_1751","b":"tamar_2821","type":"family","why":"Judah took Tamar as wife for his firstborn Er, and she later bore Judah twin sons, Pharez and Zarah.","refs":[{"ref":"Genesis 38:6","verses":[["Genesis 38:6","And Judah took a wife for Er his firstborn, whose name was Tamar."]]},{"ref":"Genesis 38:24–30","verses":[["Genesis 38:24","And it came to pass about three months after, that it was told Judah, saying, Tamar thy daughter in law hath played the harlot; and also, behold, she is with child by whoredom. And Judah said, Bring her forth, and let her be burnt."],["Genesis 38:25","When she was brought forth, she sent to her father in law, saying, By the man, whose these are, am I with child: and she said, Discern, I pray thee, whose are these, the signet, and bracelets, and staff."],["Genesis 38:26","And Judah acknowledged them, and said, She hath been more righteous than I; because that I gave her not to Shelah my son. And he knew her again no more."],["Genesis 38:27","And it came to pass in the time of her travail, that, behold, twins were in her womb."],["Genesis 38:28","And it came to pass, when she travailed, that the one put out his hand: and the midwife took and bound upon his hand a scarlet thread, saying, This came out first."],["Genesis 38:29","And it came to pass, as he drew back his hand, that, behold, his brother came out: and she said, How hast thou broken forth? this breach be upon thee: therefore his name was called Pharez."],["Genesis 38:30","And afterward came out his brother, that had the scarlet thread upon his hand: and his name was called Zarah."]]}]},{"a":"judah_1751","b":"leah_1813","type":"family","why":"Leah bore Judah and said, Now will I praise the LORD.","refs":[{"ref":"Genesis 29:35","verses":[["Genesis 29:35","And she conceived again, and bare a son: and she said, Now will I praise the LORD: therefore she called his name Judah; and left bearing."]]}]},{"a":"korah_1795","b":"moses_2108","type":"rivals","why":"Korah gathered men against Moses and Aaron, saying they lifted themselves above the congregation, and Moses told him he was seeking the priesthood also.","refs":[{"ref":"Numbers 16:1–3","verses":[["Numbers 16:1","Now Korah, the son of Izhar, the son of Kohath, the son of Levi, and Dathan and Abiram, the sons of Eliab, and On, the son of Peleth, sons of Reuben, took men:"],["Numbers 16:2","And they rose up before Moses, with certain of the children of Israel, two hundred and fifty princes of the assembly, famous in the congregation, men of renown:"],["Numbers 16:3","And they gathered themselves together against Moses and against Aaron, and said unto them, Ye take too much upon you, seeing all the congregation are holy, every one of them, and the LORD is among them: wherefore then lift ye up yourselves above the congregation of the LORD?"]]},{"ref":"Numbers 16:8–11","verses":[["Numbers 16:8","And Moses said unto Korah, Hear, I pray you, ye sons of Levi:"],["Numbers 16:9","Seemeth it but a small thing unto you, that the God of Israel hath separated you from the congregation of Israel, to bring you near to himself to do the service of the tabernacle of the LORD, and to stand before the congregation to minister unto them?"],["Numbers 16:10","And he hath brought thee near to him, and all thy brethren the sons of Levi with thee: and seek ye the priesthood also?"],["Numbers 16:11","For which cause both thou and all thy company are gathered together against the LORD: and what is Aaron, that ye murmur against him?"]]}]},{"a":"laban_1803","b":"leah_1813","type":"family","why":"Leah was Laban's elder daughter, and he gave her to Jacob as wife.","refs":[{"ref":"Genesis 29:16","verses":[["Genesis 29:16","And Laban had two daughters: the name of the elder was Leah, and the name of the younger was Rachel."]]},{"ref":"Genesis 29:23–26","verses":[["Genesis 29:23","And it came to pass in the evening, that he took Leah his daughter, and brought her to him; and he went in unto her."],["Genesis 29:24","And Laban gave unto his daughter Leah Zilpah his maid for an handmaid."],["Genesis 29:25","And it came to pass, that in the morning, behold, it was Leah: and he said to Laban, What is this thou hast done unto me? did not I serve with thee for Rachel? wherefore then hast thou beguiled me?"],["Genesis 29:26","And Laban said, It must not be so done in our country, to give the younger before the firstborn."]]}]},{"a":"laban_1803","b":"rachel_2386","type":"family","why":"Rachel was Laban's younger daughter.","refs":[{"ref":"Genesis 29:16","verses":[["Genesis 29:16","And Laban had two daughters: the name of the elder was Leah, and the name of the younger was Rachel."]]},{"ref":"Genesis 29:28","verses":[["Genesis 29:28","And Jacob did so, and fulfilled her week: and he gave him Rachel his daughter to wife also."]]}]},{"a":"laban_1803","b":"rebekah_2401","type":"family","why":"Rebekah had a brother, Laban, who with their father agreed she should be Isaac's wife.","refs":[{"ref":"Genesis 24:29","verses":[["Genesis 24:29","And Rebekah had a brother, and his name was Laban: and Laban ran out unto the man, unto the well."]]},{"ref":"Genesis 24:50–51","verses":[["Genesis 24:50","Then Laban and Bethuel answered and said, The thing proceedeth from the LORD: we cannot speak unto thee bad or good."],["Genesis 24:51","Behold, Rebekah is before thee, take her, and go, and let her be thy master’s son’s wife, as the LORD hath spoken."]]}]},{"a":"leah_1813","b":"rachel_2386","type":"family","why":"Leah and Rachel were Laban's two daughters.","refs":[{"ref":"Genesis 29:16","verses":[["Genesis 29:16","And Laban had two daughters: the name of the elder was Leah, and the name of the younger was Rachel."]]}]},{"a":"leah_1813","b":"rachel_2386","type":"rivals","why":"Rachel envied her sister's children, and Leah said Rachel had taken her husband; they strove for Jacob's love.","refs":[{"ref":"Genesis 30:1","verses":[["Genesis 30:1","And when Rachel saw that she bare Jacob no children, Rachel envied her sister; and said unto Jacob, Give me children, or else I die."]]},{"ref":"Genesis 30:8","verses":[["Genesis 30:8","And Rachel said, With great wrestlings have I wrestled with my sister, and I have prevailed: and she called his name Naphtali."]]},{"ref":"Genesis 30:14–15","verses":[["Genesis 30:14","And Reuben went in the days of wheat harvest, and found mandrakes in the field, and brought them unto his mother Leah. Then Rachel said to Leah, Give me, I pray thee, of thy son’s mandrakes."],["Genesis 30:15","And she said unto her, Is it a small matter that thou hast taken my husband? and wouldest thou take away my son’s mandrakes also? And Rachel said, Therefore he shall lie with thee to night for thy son’s mandrakes."]]}]},{"a":"leah_1813","b":"reuben_2429","type":"family","why":"Leah bore Reuben, her firstborn, and said, Surely the LORD hath looked upon my affliction.","refs":[{"ref":"Genesis 29:31–32","verses":[["Genesis 29:31","And when the LORD saw that Leah was hated, he opened her womb: but Rachel was barren."],["Genesis 29:32","And Leah conceived, and bare a son, and she called his name Reuben: for she said, Surely the LORD hath looked upon my affliction; now therefore my husband will love me."]]}]},{"a":"israel_682","b":"manasseh_1928","type":"family","why":"Jacob told Joseph that Ephraim and Manasseh, born in Egypt, were his own, as Reuben and Simeon.","refs":[{"ref":"Genesis 48:5","verses":[["Genesis 48:5","And now thy two sons, Ephraim and Manasseh, which were born unto thee in the land of Egypt before I came unto thee into Egypt, are mine; as Reuben and Simeon, they shall be mine."]]}]},{"a":"israel_682","b":"manasseh_1928","type":"blessed","why":"Jacob blessed Manasseh with Ephraim in the name of God, laying his left hand on Manasseh's head.","refs":[{"ref":"Genesis 48:13–20","verses":[["Genesis 48:13","And Joseph took them both, Ephraim in his right hand toward Israel’s left hand, and Manasseh in his left hand toward Israel’s right hand, and brought them near unto him."],["Genesis 48:14","And Israel stretched out his right hand, and laid it upon Ephraim’s head, who was the younger, and his left hand upon Manasseh’s head, guiding his hands wittingly; for Manasseh was the firstborn."],["Genesis 48:15","And he blessed Joseph, and said, God, before whom my fathers Abraham and Isaac did walk, the God which fed me all my life long unto this day,"],["Genesis 48:16","The Angel which redeemed me from all evil, bless the lads; and let my name be named on them, and the name of my fathers Abraham and Isaac; and let them grow into a multitude in the midst of the earth."],["Genesis 48:17","And when Joseph saw that his father laid his right hand upon the head of Ephraim, it displeased him: and he held up his father’s hand, to remove it from Ephraim’s head unto Manasseh’s head."],["Genesis 48:18","And Joseph said unto his father, Not so, my father: for this is the firstborn; put thy right hand upon his head."],["Genesis 48:19","And his father refused, and said, I know it, my son, I know it: he also shall become a people, and he also shall be great: but truly his younger brother shall be greater than he, and his seed shall become a multitude of nations."],["Genesis 48:20","And he blessed them that day, saying, In thee shall Israel bless, saying, God make thee as Ephraim and as Manasseh: and he set Ephraim before Manasseh."]]}]},{"a":"miriam_2087","b":"moses_2108","type":"family","why":"Miriam was the sister of Aaron and Moses, a daughter of Amram and Jochebed.","refs":[{"ref":"Numbers 26:59","verses":[["Numbers 26:59","And the name of Amram’s wife was Jochebed, the daughter of Levi, whom her mother bare to Levi in Egypt: and she bare unto Amram Aaron and Moses, and Miriam their sister."]]}]},{"a":"moses_2108","b":"pharaoh_2331","type":"enemies","why":"Pharaoh refused the LORD's word that Moses brought, threatened to kill Moses if he saw his face again, and chased Israel with his army.","refs":[{"ref":"Exodus 5:1–4","verses":[["Exodus 5:1","And afterward Moses and Aaron went in, and told Pharaoh, Thus saith the LORD God of Israel, Let my people go, that they may hold a feast unto me in the wilderness."],["Exodus 5:2","And Pharaoh said, Who is the LORD, that I should obey his voice to let Israel go? I know not the LORD, neither will I let Israel go."],["Exodus 5:3","And they said, The God of the Hebrews hath met with us: let us go, we pray thee, three days’ journey into the desert, and sacrifice unto the LORD our God; lest he fall upon us with pestilence, or with the sword."],["Exodus 5:4","And the king of Egypt said unto them, Wherefore do ye, Moses and Aaron, let the people from their works? get you unto your burdens."]]},{"ref":"Exodus 10:28–29","verses":[["Exodus 10:28","And Pharaoh said unto him, Get thee from me, take heed to thyself, see my face no more; for in that day thou seest my face thou shalt die."],["Exodus 10:29","And Moses said, Thou hast spoken well, I will see thy face again no more."]]},{"ref":"Exodus 14:5–9","verses":[["Exodus 14:5","And it was told the king of Egypt that the people fled: and the heart of Pharaoh and of his servants was turned against the people, and they said, Why have we done this, that we have let Israel go from serving us?"],["Exodus 14:6","And he made ready his chariot, and took his people with him:"],["Exodus 14:7","And he took six hundred chosen chariots, and all the chariots of Egypt, and captains over every one of them."],["Exodus 14:8","And the LORD hardened the heart of Pharaoh king of Egypt, and he pursued after the children of Israel: and the children of Israel went out with an high hand."],["Exodus 14:9","But the Egyptians pursued after them, all the horses and chariots of Pharaoh, and his horsemen, and his army, and overtook them encamping by the sea, beside Pihahiroth, before Baalzephon."]]}]},{"a":"moses_2108","b":"pharaoh_2330","type":"enemies","why":"When Pharaoh heard Moses had killed an Egyptian, he sought to slay Moses, and Moses fled from his face to Midian.","refs":[{"ref":"Exodus 2:15","verses":[["Exodus 2:15","Now when Pharaoh heard this thing, he sought to slay Moses. But Moses fled from the face of Pharaoh, and dwelt in the land of Midian: and he sat down by a well."]]}]},{"a":"noah_2210","b":"shem_2613","type":"family","why":"Shem was one of the three sons of Noah who went forth from the ark.","refs":[{"ref":"Genesis 5:32","verses":[["Genesis 5:32","And Noah was five hundred years old: and Noah begat Shem, Ham, and Japheth."]]},{"ref":"Genesis 9:18–19","verses":[["Genesis 9:18","And the sons of Noah, that went forth of the ark, were Shem, and Ham, and Japheth: and Ham is the father of Canaan."],["Genesis 9:19","These are the three sons of Noah: and of them was the whole earth overspread."]]}]},{"a":"pharaoh_2329","b":"potiphar_2368","type":"served","why":"Potiphar was an officer of Pharaoh, captain of the guard.","refs":[{"ref":"Genesis 37:36","verses":[["Genesis 37:36","And the Midianites sold him into Egypt unto Potiphar, an officer of Pharaoh’s, and captain of the guard."]]},{"ref":"Genesis 39:1","verses":[["Genesis 39:1","And Joseph was brought down to Egypt; and Potiphar, an officer of Pharaoh, captain of the guard, an Egyptian, bought him of the hands of the Ishmeelites, which had brought him down thither."]]}]},{"a":"aaron_1","b":"phinehas_2349","type":"family","why":"Phinehas was the son of Eleazar, the son of Aaron the priest.","refs":[{"ref":"Numbers 25:7","verses":[["Numbers 25:7","And when Phinehas, the son of Eleazar, the son of Aaron the priest, saw it, he rose up from among the congregation, and took a javelin in his hand;"]]},{"ref":"Numbers 25:11","verses":[["Numbers 25:11","Phinehas, the son of Eleazar, the son of Aaron the priest, hath turned my wrath away from the children of Israel, while he was zealous for my sake among them, that I consumed not the children of Israel in my jealousy."]]}]},{"a":"israel_682","b":"reuben_2429","type":"family","why":"Reuben was Jacob's firstborn, born to Leah.","refs":[{"ref":"Genesis 29:32","verses":[["Genesis 29:32","And Leah conceived, and bare a son, and she called his name Reuben: for she said, Surely the LORD hath looked upon my affliction; now therefore my husband will love me."]]},{"ref":"Genesis 35:23","verses":[["Genesis 35:23","The sons of Leah; Reuben, Jacob’s firstborn, and Simeon, and Levi, and Judah, and Issachar, and Zebulun:"]]}]},{"a":"moses_2108","b":"sihon_2739","type":"enemies","why":"Sihon refused Moses' request to pass through and came out against Israel to fight, and Israel smote him and took his land.","refs":[{"ref":"Numbers 21:21–24","verses":[["Numbers 21:21","And Israel sent messengers unto Sihon king of the Amorites, saying,"],["Numbers 21:22","Let me pass through thy land: we will not turn into the fields, or into the vineyards; we will not drink of the waters of the well: but we will go along by the king’s high way, until we be past thy borders."],["Numbers 21:23","And Sihon would not suffer Israel to pass through his border: but Sihon gathered all his people together, and went out against Israel into the wilderness: and he came to Jahaz, and fought against Israel."],["Numbers 21:24","And Israel smote him with the edge of the sword, and possessed his land from Arnon unto Jabbok, even unto the children of Ammon: for the border of the children of Ammon was strong."]]},{"ref":"Deuteronomy 2:26–33","verses":[["Deuteronomy 2:26","And I sent messengers out of the wilderness of Kedemoth unto Sihon king of Heshbon with words of peace, saying,"],["Deuteronomy 2:27","Let me pass through thy land: I will go along by the high way, I will neither turn unto the right hand nor to the left."],["Deuteronomy 2:28","Thou shalt sell me meat for money, that I may eat; and give me water for money, that I may drink: only I will pass through on my feet;"],["Deuteronomy 2:29","(As the children of Esau which dwell in Seir, and the Moabites which dwell in Ar, did unto me;) until I shall pass over Jordan into the land which the LORD our God giveth us."],["Deuteronomy 2:30","But Sihon king of Heshbon would not let us pass by him: for the LORD thy God hardened his spirit, and made his heart obstinate, that he might deliver him into thy hand, as appeareth this day."],["Deuteronomy 2:31","And the LORD said unto me, Behold, I have begun to give Sihon and his land before thee: begin to possess, that thou mayest inherit his land."],["Deuteronomy 2:32","Then Sihon came out against us, he and all his people, to fight at Jahaz."],["Deuteronomy 2:33","And the LORD our God delivered him before us; and we smote him, and his sons, and all his people."]]}]},{"a":"israel_682","b":"simeon_2741","type":"family","why":"Simeon was the second son Leah bore Jacob.","refs":[{"ref":"Genesis 29:33","verses":[["Genesis 29:33","And she conceived again, and bare a son; and said, Because the LORD hath heard that I was hated, he hath therefore given me this son also: and she called his name Simeon."]]},{"ref":"Genesis 35:23","verses":[["Genesis 35:23","The sons of Leah; Reuben, Jacob’s firstborn, and Simeon, and Levi, and Judah, and Issachar, and Zebulun:"]]}]},{"a":"joseph_1710","b":"simeon_2741","type":"family","why":"Joseph and Simeon were both among the twelve sons of Jacob.","refs":[{"ref":"Genesis 35:22–26","verses":[["Genesis 35:22","And it came to pass, when Israel dwelt in that land, that Reuben went and lay with Bilhah his father’s concubine: and Israel heard it. Now the sons of Jacob were twelve:"],["Genesis 35:23","The sons of Leah; Reuben, Jacob’s firstborn, and Simeon, and Levi, and Judah, and Issachar, and Zebulun:"],["Genesis 35:24","The sons of Rachel; Joseph, and Benjamin:"],["Genesis 35:25","And the sons of Bilhah, Rachel’s handmaid; Dan, and Naphtali:"],["Genesis 35:26","And the sons of Zilpah, Leah’s handmaid; Gad, and Asher: these are the sons of Jacob, which were born to him in Padanaram."]]}]},{"a":"leah_1813","b":"simeon_2741","type":"family","why":"Leah bore Simeon and said, The LORD hath heard that I was hated.","refs":[{"ref":"Genesis 29:33","verses":[["Genesis 29:33","And she conceived again, and bare a son; and said, Because the LORD hath heard that I was hated, he hath therefore given me this son also: and she called his name Simeon."]]}]},{"a":"adam_78","b":"seth_2504","type":"family","why":"Adam begat Seth in his own likeness, after his image.","refs":[{"ref":"Genesis 4:25","verses":[["Genesis 4:25","And Adam knew his wife again; and she bare a son, and called his name Seth: For God, said she, hath appointed me another seed instead of Abel, whom Cain slew."]]},{"ref":"Genesis 5:3","verses":[["Genesis 5:3","And Adam lived an hundred and thirty years, and begat a son in his own likeness, after his image; and called his name Seth:"]]}]},{"a":"eve_1231","b":"seth_2504","type":"family","why":"Eve bore Seth and said God had appointed her another seed instead of Abel.","refs":[{"ref":"Genesis 4:25","verses":[["Genesis 4:25","And Adam knew his wife again; and she bare a son, and called his name Seth: For God, said she, hath appointed me another seed instead of Abel, whom Cain slew."]]}]},{"a":"abel_13","b":"seth_2504","type":"family","why":"Eve bore Seth as another seed God gave her in place of her son Abel, whom Cain slew.","refs":[{"ref":"Genesis 4:25","verses":[["Genesis 4:25","And Adam knew his wife again; and she bare a son, and called his name Seth: For God, said she, hath appointed me another seed instead of Abel, whom Cain slew."]]}]},{"a":"moses_2108","b":"zipporah_3095","type":"married","why":"Jethro gave Moses his daughter Zipporah, and she bore him sons.","refs":[{"ref":"Exodus 2:21–22","verses":[["Exodus 2:21","And Moses was content to dwell with the man: and he gave Moses Zipporah his daughter."],["Exodus 2:22","And she bare him a son, and he called his name Gershom: for he said, I have been a stranger in a strange land."]]},{"ref":"Exodus 18:2–6","verses":[["Exodus 18:2","Then Jethro, Moses’ father in law, took Zipporah, Moses’ wife, after he had sent her back,"],["Exodus 18:3","And her two sons; of which the name of the one was Gershom; for he said, I have been an alien in a strange land:"],["Exodus 18:4","And the name of the other was Eliezer; for the God of my father, said he, was mine help, and delivered me from the sword of Pharaoh:"],["Exodus 18:5","And Jethro, Moses’ father in law, came with his sons and his wife unto Moses into the wilderness, where he encamped at the mount of God:"],["Exodus 18:6","And he said unto Moses, I thy father in law Jethro am come unto thee, and thy wife, and her two sons with her."]]}]},{"a":"jethro_2431","b":"zipporah_3095","type":"family","why":"Zipporah was the daughter of Jethro, priest of Midian.","refs":[{"ref":"Exodus 2:16–21","verses":[["Exodus 2:16","Now the priest of Midian had seven daughters: and they came and drew water, and filled the troughs to water their father’s flock."],["Exodus 2:17","And the shepherds came and drove them away: but Moses stood up and helped them, and watered their flock."],["Exodus 2:18","And when they came to Reuel their father, he said, How is it that ye are come so soon to day?"],["Exodus 2:19","And they said, An Egyptian delivered us out of the hand of the shepherds, and also drew water enough for us, and watered the flock."],["Exodus 2:20","And he said unto his daughters, And where is he? why is it that ye have left the man? call him, that he may eat bread."],["Exodus 2:21","And Moses was content to dwell with the man: and he gave Moses Zipporah his daughter."]]},{"ref":"Exodus 18:2","verses":[["Exodus 18:2","Then Jethro, Moses’ father in law, took Zipporah, Moses’ wife, after he had sent her back,"]]}]},{"a":"levi_1820","b":"simeon_2741","type":"family","why":"Simeon and Levi were Leah's second and third sons, and Jacob called them brethren in his words over them.","refs":[{"ref":"Genesis 29:33–34","verses":[["Genesis 29:33","And she conceived again, and bare a son; and said, Because the LORD hath heard that I was hated, he hath therefore given me this son also: and she called his name Simeon."],["Genesis 29:34","And she conceived again, and bare a son; and said, Now this time will my husband be joined unto me, because I have born him three sons: therefore was his name called Levi."]]},{"ref":"Genesis 49:5–7","verses":[["Genesis 49:5","Simeon and Levi are brethren; instruments of cruelty are in their habitations."],["Genesis 49:6","O my soul, come not thou into their secret; unto their assembly, mine honour, be not thou united: for in their anger they slew a man, and in their selfwill they digged down a wall."],["Genesis 49:7","Cursed be their anger, for it was fierce; and their wrath, for it was cruel: I will divide them in Jacob, and scatter them in Israel."]]}]},{"a":"leah_1813","b":"levi_1820","type":"family","why":"Leah bore Levi and said, Now this time will my husband be joined unto me.","refs":[{"ref":"Genesis 29:34","verses":[["Genesis 29:34","And she conceived again, and bare a son; and said, Now this time will my husband be joined unto me, because I have born him three sons: therefore was his name called Levi."]]}]},{"a":"israel_682","b":"levi_1820","type":"family","why":"Levi was the third son Leah bore Jacob.","refs":[{"ref":"Genesis 29:34","verses":[["Genesis 29:34","And she conceived again, and bare a son; and said, Now this time will my husband be joined unto me, because I have born him three sons: therefore was his name called Levi."]]},{"ref":"Genesis 35:23","verses":[["Genesis 35:23","The sons of Leah; Reuben, Jacob’s firstborn, and Simeon, and Levi, and Judah, and Issachar, and Zebulun:"]]}]},{"a":"dinah_1012","b":"levi_1820","type":"family","why":"Simeon and Levi were Dinah's brothers, and they took their swords and slew the men of Shechem because their sister was defiled.","refs":[{"ref":"Genesis 34:25–31","verses":[["Genesis 34:25","And it came to pass on the third day, when they were sore, that two of the sons of Jacob, Simeon and Levi, Dinah’s brethren, took each man his sword, and came upon the city boldly, and slew all the males."],["Genesis 34:26","And they slew Hamor and Shechem his son with the edge of the sword, and took Dinah out of Shechem’s house, and went out."],["Genesis 34:27","The sons of Jacob came upon the slain, and spoiled the city, because they had defiled their sister."],["Genesis 34:28","They took their sheep, and their oxen, and their asses, and that which was in the city, and that which was in the field,"],["Genesis 34:29","And all their wealth, and all their little ones, and their wives took they captive, and spoiled even all that was in the house."],["Genesis 34:30","And Jacob said to Simeon and Levi, Ye have troubled me to make me to stink among the inhabitants of the land, among the Canaanites and the Perizzites: and I being few in number, they shall gather themselves together against me, and slay me; and I shall be destroyed, I and my house."],["Genesis 34:31","And they said, Should he deal with our sister as with an harlot?"]]}]},{"a":"issachar_645","b":"leah_1813","type":"family","why":"Leah bore Jacob a fifth son and called him Issachar.","refs":[{"ref":"Genesis 30:17–18","verses":[["Genesis 30:17","And God hearkened unto Leah, and she conceived, and bare Jacob the fifth son."],["Genesis 30:18","And Leah said, God hath given me my hire, because I have given my maiden to my husband: and she called his name Issachar."]]}]},{"a":"issachar_645","b":"reuben_2429","type":"family","why":"Reuben and Issachar were both sons of Leah, among the twelve sons of Jacob.","refs":[{"ref":"Genesis 35:23","verses":[["Genesis 35:23","The sons of Leah; Reuben, Jacob’s firstborn, and Simeon, and Levi, and Judah, and Issachar, and Zebulun:"]]}]},{"a":"leah_1813","b":"zebulun_3002","type":"family","why":"Leah bore Jacob a sixth son and called him Zebulun.","refs":[{"ref":"Genesis 30:19–20","verses":[["Genesis 30:19","And Leah conceived again, and bare Jacob the sixth son."],["Genesis 30:20","And Leah said, God hath endued me with a good dowry; now will my husband dwell with me, because I have born him six sons: and she called his name Zebulun."]]}]},{"a":"issachar_645","b":"zebulun_3002","type":"family","why":"Issachar and Zebulun were Leah's fifth and sixth sons.","refs":[{"ref":"Genesis 30:17–20","verses":[["Genesis 30:17","And God hearkened unto Leah, and she conceived, and bare Jacob the fifth son."],["Genesis 30:18","And Leah said, God hath given me my hire, because I have given my maiden to my husband: and she called his name Issachar."],["Genesis 30:19","And Leah conceived again, and bare Jacob the sixth son."],["Genesis 30:20","And Leah said, God hath endued me with a good dowry; now will my husband dwell with me, because I have born him six sons: and she called his name Zebulun."]]}]},{"a":"naphtali_2149","b":"rachel_2386","type":"family","why":"Bilhah, Rachel's maid, bore Naphtali, and Rachel named him, saying she had wrestled with her sister and prevailed.","refs":[{"ref":"Genesis 30:7–8","verses":[["Genesis 30:7","And Bilhah Rachel’s maid conceived again, and bare Jacob a second son."],["Genesis 30:8","And Rachel said, With great wrestlings have I wrestled with my sister, and I have prevailed: and she called his name Naphtali."]]}]},{"a":"dan_973","b":"naphtali_2149","type":"family","why":"Dan and Naphtali were the sons of Bilhah, Rachel's handmaid.","refs":[{"ref":"Genesis 35:25","verses":[["Genesis 35:25","And the sons of Bilhah, Rachel’s handmaid; Dan, and Naphtali:"]]}]},{"a":"asher_337","b":"leah_1813","type":"family","why":"Zilpah, Leah's maid, bore Jacob a second son, and Leah named him Asher.","refs":[{"ref":"Genesis 30:12–13","verses":[["Genesis 30:12","And Zilpah Leah’s maid bare Jacob a second son."],["Genesis 30:13","And Leah said, Happy am I, for the daughters will call me blessed: and she called his name Asher."]]}]},{"a":"asher_337","b":"gad_1262","type":"family","why":"Gad and Asher were the sons of Zilpah, Leah's handmaid.","refs":[{"ref":"Genesis 35:26","verses":[["Genesis 35:26","And the sons of Zilpah, Leah’s handmaid; Gad, and Asher: these are the sons of Jacob, which were born to him in Padanaram."]]}]},{"a":"abiathar_20","b":"david_994","type":"served","why":"Abiathar fled to David and stayed with him, bringing the ephod to inquire of the LORD for him, and served as priest under King David.","refs":[{"ref":"1 Samuel 22:20–23","verses":[["1 Samuel 22:20","And one of the sons of Ahimelech the son of Ahitub, named Abiathar, escaped, and fled after David."],["1 Samuel 22:21","And Abiathar shewed David that Saul had slain the LORD’S priests."],["1 Samuel 22:22","And David said unto Abiathar, I knew it that day, when Doeg the Edomite was there, that he would surely tell Saul: I have occasioned the death of all the persons of thy father’s house."],["1 Samuel 22:23","Abide thou with me, fear not: for he that seeketh my life seeketh thy life: but with me thou shalt be in safeguard."]]},{"ref":"1 Samuel 30:7–8","verses":[["1 Samuel 30:7","And David said to Abiathar the priest, Ahimelech’s son, I pray thee, bring me hither the ephod. And Abiathar brought thither the ephod to David."],["1 Samuel 30:8","And David enquired at the LORD, saying, Shall I pursue after this troop? shall I overtake them? And he answered him, Pursue: for thou shalt surely overtake them, and without fail recover all."]]},{"ref":"2 Samuel 20:25","verses":[["2 Samuel 20:25","And Sheva was scribe: and Zadok and Abiathar were the priests:"]]},{"ref":"1 Kings 2:26","verses":[["1 Kings 2:26","And unto Abiathar the priest said the king, Get thee to Anathoth, unto thine own fields; for thou art worthy of death: but I will not at this time put thee to death, because thou barest the ark of the Lord GOD before David my father, and because thou hast been afflicted in all wherein my father was afflicted."]]}]},{"a":"abiathar_20","b":"saul_2478","type":"enemies","why":"Saul had Abiathar's father and the priests of Nob slain, and Abiathar escaped to David, who told him that the one who sought David's life sought his as well.","refs":[{"ref":"1 Samuel 22:16–23","verses":[["1 Samuel 22:16","And the king said, Thou shalt surely die, Ahimelech, thou, and all thy father’s house."],["1 Samuel 22:17","And the king said unto the footmen that stood about him, Turn, and slay the priests of the LORD; because their hand also is with David, and because they knew when he fled, and did not shew it to me. But the servants of the king would not put forth their hand to fall upon the priests of the LORD."],["1 Samuel 22:18","And the king said to Doeg, Turn thou, and fall upon the priests. And Doeg the Edomite turned, and he fell upon the priests, and slew on that day fourscore and five persons that did wear a linen ephod."],["1 Samuel 22:19","And Nob, the city of the priests, smote he with the edge of the sword, both men and women, children and sucklings, and oxen, and asses, and sheep, with the edge of the sword."],["1 Samuel 22:20","And one of the sons of Ahimelech the son of Ahitub, named Abiathar, escaped, and fled after David."],["1 Samuel 22:21","And Abiathar shewed David that Saul had slain the LORD’S priests."],["1 Samuel 22:22","And David said unto Abiathar, I knew it that day, when Doeg the Edomite was there, that he would surely tell Saul: I have occasioned the death of all the persons of thy father’s house."],["1 Samuel 22:23","Abide thou with me, fear not: for he that seeketh my life seeketh thy life: but with me thou shalt be in safeguard."]]}]},{"a":"abiathar_20","b":"zadok_2973","type":"worked_together","why":"Zadok and Abiathar were the priests together under David, carrying the ark of God and sending David word from Jerusalem during Absalom's revolt.","refs":[{"ref":"2 Samuel 15:24–29","verses":[["2 Samuel 15:24","And lo Zadok also, and all the Levites were with him, bearing the ark of the covenant of God: and they set down the ark of God; and Abiathar went up, until all the people had done passing out of the city."],["2 Samuel 15:25","And the king said unto Zadok, Carry back the ark of God into the city: if I shall find favour in the eyes of the LORD, he will bring me again, and shew me both it, and his habitation:"],["2 Samuel 15:26","But if he thus say, I have no delight in thee; behold, here am I, let him do to me as seemeth good unto him."],["2 Samuel 15:27","The king said also unto Zadok the priest, Art not thou a seer? return into the city in peace, and your two sons with you, Ahimaaz thy son, and Jonathan the son of Abiathar."],["2 Samuel 15:28","See, I will tarry in the plain of the wilderness, until there come word from you to certify me."],["2 Samuel 15:29","Zadok therefore and Abiathar carried the ark of God again to Jerusalem: and they tarried there."]]},{"ref":"2 Samuel 15:35–36","verses":[["2 Samuel 15:35","And hast thou not there with thee Zadok and Abiathar the priests? therefore it shall be, that what thing soever thou shalt hear out of the king’s house, thou shalt tell it to Zadok and Abiathar the priests."],["2 Samuel 15:36","Behold, they have there with them their two sons, Ahimaaz Zadok’s son, and Jonathan Abiathar’s son; and by them ye shall send unto me every thing that ye can hear."]]},{"ref":"1 Chronicles 15:11–12","verses":[["1 Chronicles 15:11","And David called for Zadok and Abiathar the priests, and for the Levites, for Uriel, Asaiah, and Joel, Shemaiah, and Eliel, and Amminadab,"],["1 Chronicles 15:12","And said unto them, Ye are the chief of the fathers of the Levites: sanctify yourselves, both ye and your brethren, that ye may bring up the ark of the LORD God of Israel unto the place that I have prepared for it."]]}]},{"a":"abigail_26","b":"nabal_2126","type":"married","why":"Abigail was the wife of Nabal of Maon.","refs":[{"ref":"1 Samuel 25:2–3","verses":[["1 Samuel 25:2","And there was a man in Maon, whose possessions were in Carmel; and the man was very great, and he had three thousand sheep, and a thousand goats: and he was shearing his sheep in Carmel."],["1 Samuel 25:3","Now the name of the man was Nabal; and the name of his wife Abigail: and she was a woman of good understanding, and of a beautiful countenance: but the man was churlish and evil in his doings; and he was of the house of Caleb."]]},{"ref":"1 Samuel 25:36–38","verses":[["1 Samuel 25:36","And Abigail came to Nabal; and, behold, he held a feast in his house, like the feast of a king; and Nabal’s heart was merry within him, for he was very drunken: wherefore she told him nothing, less or more, until the morning light."],["1 Samuel 25:37","But it came to pass in the morning, when the wine was gone out of Nabal, and his wife had told him these things, that his heart died within him, and he became as a stone."],["1 Samuel 25:38","And it came to pass about ten days after, that the LORD smote Nabal, that he died."]]}]},{"a":"abigail_26","b":"david_994","type":"married","why":"After Nabal died, David sent for Abigail and she became his wife.","refs":[{"ref":"1 Samuel 25:39–42","verses":[["1 Samuel 25:39","And when David heard that Nabal was dead, he said, Blessed be the LORD, that hath pleaded the cause of my reproach from the hand of Nabal, and hath kept his servant from evil: for the LORD hath returned the wickedness of Nabal upon his own head. And David sent and communed with Abigail, to take her to him to wife."],["1 Samuel 25:40","And when the servants of David were come to Abigail to Carmel, they spake unto her, saying, David sent us unto thee, to take thee to him to wife."],["1 Samuel 25:41","And she arose, and bowed herself on her face to the earth, and said, Behold, let thine handmaid be a servant to wash the feet of the servants of my lord."],["1 Samuel 25:42","And Abigail hasted, and arose, and rode upon an ass, with five damsels of hers that went after her; and she went after the messengers of David, and became his wife."]]},{"ref":"2 Samuel 2:2","verses":[["2 Samuel 2:2","So David went up thither, and his two wives also, Ahinoam the Jezreelitess, and Abigail Nabal’s wife the Carmelite."]]}]},{"a":"abimelech_41","b":"gideon_1314","type":"family","why":"Gideon's concubine in Shechem bore him a son, and Gideon named him Abimelech.","refs":[{"ref":"Judges 8:30–31","verses":[["Judges 8:30","And Gideon had threescore and ten sons of his body begotten: for he had many wives."],["Judges 8:31","And his concubine that was in Shechem, she also bare him a son, whose name he called Abimelech."]]}]},{"a":"abimelech_41","b":"jotham_1734","type":"family","why":"Jotham was the youngest son of Jerubbaal, and he fled for fear of Abimelech his brother.","refs":[{"ref":"Judges 9:5","verses":[["Judges 9:5","And he went unto his father’s house at Ophrah, and slew his brethren the sons of Jerubbaal, being threescore and ten persons, upon one stone: notwithstanding yet Jotham the youngest son of Jerubbaal was left; for he hid himself."]]},{"ref":"Judges 9:21","verses":[["Judges 9:21","And Jotham ran away, and fled, and went to Beer, and dwelt there, for fear of Abimelech his brother."]]}]},{"a":"abimelech_41","b":"jotham_1734","type":"enemies","why":"Abimelech slew his brothers and Jotham alone escaped, then cursed Abimelech and the men of Shechem, and God rendered Abimelech's wickedness.","refs":[{"ref":"Judges 9:5","verses":[["Judges 9:5","And he went unto his father’s house at Ophrah, and slew his brethren the sons of Jerubbaal, being threescore and ten persons, upon one stone: notwithstanding yet Jotham the youngest son of Jerubbaal was left; for he hid himself."]]},{"ref":"Judges 9:16–21","verses":[["Judges 9:16","Now therefore, if ye have done truly and sincerely, in that ye have made Abimelech king, and if ye have dealt well with Jerubbaal and his house, and have done unto him according to the deserving of his hands;"],["Judges 9:17","(For my father fought for you, and adventured his life far, and delivered you out of the hand of Midian:"],["Judges 9:18","And ye are risen up against my father’s house this day, and have slain his sons, threescore and ten persons, upon one stone, and have made Abimelech, the son of his maidservant, king over the men of Shechem, because he is your brother;)"],["Judges 9:19","If ye then have dealt truly and sincerely with Jerubbaal and with his house this day, then rejoice ye in Abimelech, and let him also rejoice in you:"],["Judges 9:20","But if not, let fire come out from Abimelech, and devour the men of Shechem, and the house of Millo; and let fire come out from the men of Shechem, and from the house of Millo, and devour Abimelech."],["Judges 9:21","And Jotham ran away, and fled, and went to Beer, and dwelt there, for fear of Abimelech his brother."]]},{"ref":"Judges 9:56–57","verses":[["Judges 9:56","Thus God rendered the wickedness of Abimelech, which he did unto his father, in slaying his seventy brethren:"],["Judges 9:57","And all the evil of the men of Shechem did God render upon their heads: and upon them came the curse of Jotham the son of Jerubbaal."]]}]},{"a":"abishai_50","b":"joab_1617","type":"family","why":"Joab and Abishai were brothers, sons of Zeruiah.","refs":[{"ref":"2 Samuel 2:18","verses":[["2 Samuel 2:18","And there were three sons of Zeruiah there, Joab, and Abishai, and Asahel: and Asahel was as light of foot as a wild roe."]]},{"ref":"1 Chronicles 2:16","verses":[["1 Chronicles 2:16","Whose sisters were Zeruiah, and Abigail. And the sons of Zeruiah; Abishai, and Joab, and Asahel, three."]]}]},{"a":"abishai_50","b":"joab_1617","type":"worked_together","why":"Joab and Abishai led David's army together, slaying Abner and dividing the host between them against Ammon and Syria.","refs":[{"ref":"2 Samuel 3:30","verses":[["2 Samuel 3:30","So Joab and Abishai his brother slew Abner, because he had slain their brother Asahel at Gibeon in the battle."]]},{"ref":"2 Samuel 10:9–14","verses":[["2 Samuel 10:9","When Joab saw that the front of the battle was against him before and behind, he chose of all the choice men of Israel, and put them in array against the Syrians:"],["2 Samuel 10:10","And the rest of the people he delivered into the hand of Abishai his brother, that he might put them in array against the children of Ammon."],["2 Samuel 10:11","And he said, If the Syrians be too strong for me, then thou shalt help me: but if the children of Ammon be too strong for thee, then I will come and help thee."],["2 Samuel 10:12","Be of good courage, and let us play the men for our people, and for the cities of our God: and the LORD do that which seemeth him good."],["2 Samuel 10:13","And Joab drew nigh, and the people that were with him, unto the battle against the Syrians: and they fled before him."],["2 Samuel 10:14","And when the children of Ammon saw that the Syrians were fled, then fled they also before Abishai, and entered into the city. So Joab returned from the children of Ammon, and came to Jerusalem."]]},{"ref":"2 Samuel 20:6–10","verses":[["2 Samuel 20:6","And David said to Abishai, Now shall Sheba the son of Bichri do us more harm than did Absalom: take thou thy lord’s servants, and pursue after him, lest he get him fenced cities, and escape us."],["2 Samuel 20:7","And there went out after him Joab’s men, and the Cherethites, and the Pelethites, and all the mighty men: and they went out of Jerusalem, to pursue after Sheba the son of Bichri."],["2 Samuel 20:8","When they were at the great stone which is in Gibeon, Amasa went before them. And Joab’s garment that he had put on was girded unto him, and upon it a girdle with a sword fastened upon his loins in the sheath thereof; and as he went forth it fell out."],["2 Samuel 20:9","And Joab said to Amasa, Art thou in health, my brother? And Joab took Amasa by the beard with the right hand to kiss him."],["2 Samuel 20:10","But Amasa took no heed to the sword that was in Joab’s hand: so he smote him therewith in the fifth rib, and shed out his bowels to the ground, and struck him not again; and he died. So Joab and Abishai his brother pursued after Sheba the son of Bichri."]]}]},{"a":"abishai_50","b":"david_994","type":"served","why":"Abishai went down with David into Saul's camp, commanded a third of David's army, and saved David from the giant's son who sought to kill him.","refs":[{"ref":"1 Samuel 26:6–9","verses":[["1 Samuel 26:6","Then answered David and said to Ahimelech the Hittite, and to Abishai the son of Zeruiah, brother to Joab, saying, Who will go down with me to Saul to the camp? And Abishai said, I will go down with thee."],["1 Samuel 26:7","So David and Abishai came to the people by night: and, behold, Saul lay sleeping within the trench, and his spear stuck in the ground at his bolster: but Abner and the people lay round about him."],["1 Samuel 26:8","Then said Abishai to David, God hath delivered thine enemy into thine hand this day: now therefore let me smite him, I pray thee, with the spear even to the earth at once, and I will not smite him the second time."],["1 Samuel 26:9","And David said to Abishai, Destroy him not: for who can stretch forth his hand against the LORD’S anointed, and be guiltless?"]]},{"ref":"2 Samuel 18:2","verses":[["2 Samuel 18:2","And David sent forth a third part of the people under the hand of Joab, and a third part under the hand of Abishai the son of Zeruiah, Joab’s brother, and a third part under the hand of Ittai the Gittite. And the king said unto the people, I will surely go forth with you myself also."]]},{"ref":"2 Samuel 21:15–17","verses":[["2 Samuel 21:15","Moreover the Philistines had yet war again with Israel; and David went down, and his servants with him, and fought against the Philistines: and David waxed faint."],["2 Samuel 21:16","And Ishbibenob, which was of the sons of the giant, the weight of whose spear weighed three hundred shekels of brass in weight, he being girded with a new sword, thought to have slain David."],["2 Samuel 21:17","But Abishai the son of Zeruiah succoured him, and smote the Philistine, and killed him. Then the men of David sware unto him, saying, Thou shalt go no more out with us to battle, that thou quench not the light of Israel."]]}]},{"a":"abishai_50","b":"david_994","type":"family","why":"Zeruiah, Abishai's mother, was a sister of David and his brothers.","refs":[{"ref":"1 Chronicles 2:13–16","verses":[["1 Chronicles 2:13","And Jesse begat his firstborn Eliab, and Abinadab the second, and Shimma the third,"],["1 Chronicles 2:14","Nethaneel the fourth, Raddai the fifth,"],["1 Chronicles 2:15","Ozem the sixth, David the seventh:"],["1 Chronicles 2:16","Whose sisters were Zeruiah, and Abigail. And the sons of Zeruiah; Abishai, and Joab, and Asahel, three."]]}]},{"a":"abishai_50","b":"abner_57","type":"enemies","why":"Abishai pursued Abner after the battle at Gibeon, and Joab and Abishai slew Abner because he had slain their brother Asahel.","refs":[{"ref":"2 Samuel 2:18–24","verses":[["2 Samuel 2:18","And there were three sons of Zeruiah there, Joab, and Abishai, and Asahel: and Asahel was as light of foot as a wild roe."],["2 Samuel 2:19","And Asahel pursued after Abner; and in going he turned not to the right hand nor to the left from following Abner."],["2 Samuel 2:20","Then Abner looked behind him, and said, Art thou Asahel? And he answered, I am."],["2 Samuel 2:21","And Abner said to him, Turn thee aside to thy right hand or to thy left, and lay thee hold on one of the young men, and take thee his armour. But Asahel would not turn aside from following of him."],["2 Samuel 2:22","And Abner said again to Asahel, Turn thee aside from following me: wherefore should I smite thee to the ground? how then should I hold up my face to Joab thy brother?"],["2 Samuel 2:23","Howbeit he refused to turn aside: wherefore Abner with the hinder end of the spear smote him under the fifth rib, that the spear came out behind him; and he fell down there, and died in the same place: and it came to pass, that as many as came to the place where Asahel fell down and died stood still."],["2 Samuel 2:24","Joab also and Abishai pursued after Abner: and the sun went down when they were come to the hill of Ammah, that lieth before Giah by the way of the wilderness of Gibeon."]]},{"ref":"2 Samuel 3:30","verses":[["2 Samuel 3:30","So Joab and Abishai his brother slew Abner, because he had slain their brother Asahel at Gibeon in the battle."]]}]},{"a":"abishai_50","b":"shimei_2684","type":"enemies","why":"Abishai twice asked to kill Shimei for cursing David, and David forbade him both times.","refs":[{"ref":"2 Samuel 16:9–11","verses":[["2 Samuel 16:9","Then said Abishai the son of Zeruiah unto the king, Why should this dead dog curse my lord the king? let me go over, I pray thee, and take off his head."],["2 Samuel 16:10","And the king said, What have I to do with you, ye sons of Zeruiah? so let him curse, because the LORD hath said unto him, Curse David. Who shall then say, Wherefore hast thou done so?"],["2 Samuel 16:11","And David said to Abishai, and to all his servants, Behold, my son, which came forth of my bowels, seeketh my life: how much more now may this Benjamite do it? let him alone, and let him curse; for the LORD hath bidden him."]]},{"ref":"2 Samuel 19:21–23","verses":[["2 Samuel 19:21","But Abishai the son of Zeruiah answered and said, Shall not Shimei be put to death for this, because he cursed the LORD’S anointed?"],["2 Samuel 19:22","And David said, What have I to do with you, ye sons of Zeruiah, that ye should this day be adversaries unto me? shall there any man be put to death this day in Israel? for do not I know that I am this day king over Israel?"],["2 Samuel 19:23","Therefore the king said unto Shimei, Thou shalt not die. And the king sware unto him."]]}]},{"a":"abishai_50","b":"sheba_2570","type":"enemies","why":"David sent Abishai with the mighty men to pursue Sheba the son of Bichri, and they chased him to Abel.","refs":[{"ref":"2 Samuel 20:6–10","verses":[["2 Samuel 20:6","And David said to Abishai, Now shall Sheba the son of Bichri do us more harm than did Absalom: take thou thy lord’s servants, and pursue after him, lest he get him fenced cities, and escape us."],["2 Samuel 20:7","And there went out after him Joab’s men, and the Cherethites, and the Pelethites, and all the mighty men: and they went out of Jerusalem, to pursue after Sheba the son of Bichri."],["2 Samuel 20:8","When they were at the great stone which is in Gibeon, Amasa went before them. And Joab’s garment that he had put on was girded unto him, and upon it a girdle with a sword fastened upon his loins in the sheath thereof; and as he went forth it fell out."],["2 Samuel 20:9","And Joab said to Amasa, Art thou in health, my brother? And Joab took Amasa by the beard with the right hand to kiss him."],["2 Samuel 20:10","But Amasa took no heed to the sword that was in Joab’s hand: so he smote him therewith in the fifth rib, and shed out his bowels to the ground, and struck him not again; and he died. So Joab and Abishai his brother pursued after Sheba the son of Bichri."]]}]},{"a":"abner_57","b":"saul_2478","type":"served","why":"Abner was the captain of Saul's host, sat by Saul's side, and lay by him in camp to keep him.","refs":[{"ref":"1 Samuel 14:50–51","verses":[["1 Samuel 14:50","And the name of Saul’s wife was Ahinoam, the daughter of Ahimaaz: and the name of the captain of his host was Abner, the son of Ner, Saul’s uncle."],["1 Samuel 14:51","And Kish was the father of Saul; and Ner the father of Abner was the son of Abiel."]]},{"ref":"1 Samuel 20:25","verses":[["1 Samuel 20:25","And the king sat upon his seat, as at other times, even upon a seat by the wall: and Jonathan arose, and Abner sat by Saul’s side, and David’s place was empty."]]},{"ref":"1 Samuel 26:5–16","verses":[["1 Samuel 26:5","And David arose, and came to the place where Saul had pitched: and David beheld the place where Saul lay, and Abner the son of Ner, the captain of his host: and Saul lay in the trench, and the people pitched round about him."],["1 Samuel 26:6","Then answered David and said to Ahimelech the Hittite, and to Abishai the son of Zeruiah, brother to Joab, saying, Who will go down with me to Saul to the camp? And Abishai said, I will go down with thee."],["1 Samuel 26:7","So David and Abishai came to the people by night: and, behold, Saul lay sleeping within the trench, and his spear stuck in the ground at his bolster: but Abner and the people lay round about him."],["1 Samuel 26:8","Then said Abishai to David, God hath delivered thine enemy into thine hand this day: now therefore let me smite him, I pray thee, with the spear even to the earth at once, and I will not smite him the second time."],["1 Samuel 26:9","And David said to Abishai, Destroy him not: for who can stretch forth his hand against the LORD’S anointed, and be guiltless?"],["1 Samuel 26:10","David said furthermore, As the LORD liveth, the LORD shall smite him; or his day shall come to die; or he shall descend into battle, and perish."],["1 Samuel 26:11","The LORD forbid that I should stretch forth mine hand against the LORD’S anointed: but, I pray thee, take thou now the spear that is at his bolster, and the cruse of water, and let us go."],["1 Samuel 26:12","So David took the spear and the cruse of water from Saul’s bolster; and they gat them away, and no man saw it, nor knew it, neither awaked: for they were all asleep; because a deep sleep from the LORD was fallen upon them."],["1 Samuel 26:13","Then David went over to the other side, and stood on the top of an hill afar off; a great space being between them:"],["1 Samuel 26:14","And David cried to the people, and to Abner the son of Ner, saying, Answerest thou not, Abner? Then Abner answered and said, Who art thou that criest to the king?"],["1 Samuel 26:15","And David said to Abner, Art not thou a valiant man? and who is like to thee in Israel? wherefore then hast thou not kept thy lord the king? for there came one of the people in to destroy the king thy lord."],["1 Samuel 26:16","This thing is not good that thou hast done. As the LORD liveth, ye are worthy to die, because ye have not kept your master, the LORD’S anointed. And now see where the king’s spear is, and the cruse of water that was at his bolster."]]}]},{"a":"abner_57","b":"saul_2478","type":"family","why":"Abner was the son of Ner, Saul's uncle.","refs":[{"ref":"1 Samuel 14:50–51","verses":[["1 Samuel 14:50","And the name of Saul’s wife was Ahinoam, the daughter of Ahimaaz: and the name of the captain of his host was Abner, the son of Ner, Saul’s uncle."],["1 Samuel 14:51","And Kish was the father of Saul; and Ner the father of Abner was the son of Abiel."]]}]},{"a":"abner_57","b":"ish-bosheth_622","type":"served","why":"Abner, captain of Saul's host, took Ish-bosheth and made him king over all Israel, and made himself strong for the house of Saul.","refs":[{"ref":"2 Samuel 2:8–10","verses":[["2 Samuel 2:8","But Abner the son of Ner, captain of Saul’s host, took Ishbosheth the son of Saul, and brought him over to Mahanaim;"],["2 Samuel 2:9","And made him king over Gilead, and over the Ashurites, and over Jezreel, and over Ephraim, and over Benjamin, and over all Israel."],["2 Samuel 2:10","Ishbosheth Saul’s son was forty years old when he began to reign over Israel, and reigned two years. But the house of Judah followed David."]]},{"ref":"2 Samuel 3:6","verses":[["2 Samuel 3:6","And it came to pass, while there was war between the house of Saul and the house of David, that Abner made himself strong for the house of Saul."]]}]},{"a":"abner_57","b":"ish-bosheth_622","type":"betrayed","why":"After Ish-bosheth rebuked him over Rizpah, Abner swore to translate the kingdom from the house of Saul to David and went to bring all Israel over to him.","refs":[{"ref":"2 Samuel 3:7–12","verses":[["2 Samuel 3:7","And Saul had a concubine, whose name was Rizpah, the daughter of Aiah: and Ishbosheth said to Abner, Wherefore hast thou gone in unto my father’s concubine?"],["2 Samuel 3:8","Then was Abner very wroth for the words of Ishbosheth, and said, Am I a dog’s head, which against Judah do shew kindness this day unto the house of Saul thy father, to his brethren, and to his friends, and have not delivered thee into the hand of David, that thou chargest me to day with a fault concerning this woman?"],["2 Samuel 3:9","So do God to Abner, and more also, except, as the LORD hath sworn to David, even so I do to him;"],["2 Samuel 3:10","To translate the kingdom from the house of Saul, and to set up the throne of David over Israel and over Judah, from Dan even to Beersheba."],["2 Samuel 3:11","And he could not answer Abner a word again, because he feared him."],["2 Samuel 3:12","And Abner sent messengers to David on his behalf, saying, Whose is the land? saying also, Make thy league with me, and, behold, my hand shall be with thee, to bring about all Israel unto thee."]]},{"ref":"2 Samuel 3:17–21","verses":[["2 Samuel 3:17","And Abner had communication with the elders of Israel, saying, Ye sought for David in times past to be king over you:"],["2 Samuel 3:18","Now then do it: for the LORD hath spoken of David, saying, By the hand of my servant David I will save my people Israel out of the hand of the Philistines, and out of the hand of all their enemies."],["2 Samuel 3:19","And Abner also spake in the ears of Benjamin: and Abner went also to speak in the ears of David in Hebron all that seemed good to Israel, and that seemed good to the whole house of Benjamin."],["2 Samuel 3:20","So Abner came to David to Hebron, and twenty men with him. And David made Abner and the men that were with him a feast."],["2 Samuel 3:21","And Abner said unto David, I will arise and go, and will gather all Israel unto my lord the king, that they may make a league with thee, and that thou mayest reign over all that thine heart desireth. And David sent Abner away; and he went in peace."]]}]},{"a":"abner_57","b":"joab_1617","type":"enemies","why":"Abner and Joab led the two sides at Gibeon, and Joab later took Abner aside at Hebron and killed him for the blood of Asahel his brother.","refs":[{"ref":"2 Samuel 2:12–28","verses":[["2 Samuel 2:12","And Abner the son of Ner, and the servants of Ishbosheth the son of Saul, went out from Mahanaim to Gibeon."],["2 Samuel 2:13","And Joab the son of Zeruiah, and the servants of David, went out, and met together by the pool of Gibeon: and they sat down, the one on the one side of the pool, and the other on the other side of the pool."],["2 Samuel 2:14","And Abner said to Joab, Let the young men now arise, and play before us. And Joab said, Let them arise."],["2 Samuel 2:15","Then there arose and went over by number twelve of Benjamin, which pertained to Ishbosheth the son of Saul, and twelve of the servants of David."],["2 Samuel 2:16","And they caught every one his fellow by the head, and thrust his sword in his fellow’s side; so they fell down together: wherefore that place was called Helkathhazzurim, which is in Gibeon."],["2 Samuel 2:17","And there was a very sore battle that day; and Abner was beaten, and the men of Israel, before the servants of David."],["2 Samuel 2:18","And there were three sons of Zeruiah there, Joab, and Abishai, and Asahel: and Asahel was as light of foot as a wild roe."],["2 Samuel 2:19","And Asahel pursued after Abner; and in going he turned not to the right hand nor to the left from following Abner."],["2 Samuel 2:20","Then Abner looked behind him, and said, Art thou Asahel? And he answered, I am."],["2 Samuel 2:21","And Abner said to him, Turn thee aside to thy right hand or to thy left, and lay thee hold on one of the young men, and take thee his armour. But Asahel would not turn aside from following of him."],["2 Samuel 2:22","And Abner said again to Asahel, Turn thee aside from following me: wherefore should I smite thee to the ground? how then should I hold up my face to Joab thy brother?"],["2 Samuel 2:23","Howbeit he refused to turn aside: wherefore Abner with the hinder end of the spear smote him under the fifth rib, that the spear came out behind him; and he fell down there, and died in the same place: and it came to pass, that as many as came to the place where Asahel fell down and died stood still."],["2 Samuel 2:24","Joab also and Abishai pursued after Abner: and the sun went down when they were come to the hill of Ammah, that lieth before Giah by the way of the wilderness of Gibeon."],["2 Samuel 2:25","And the children of Benjamin gathered themselves together after Abner, and became one troop, and stood on the top of an hill."],["2 Samuel 2:26","Then Abner called to Joab, and said, Shall the sword devour for ever? knowest thou not that it will be bitterness in the latter end? how long shall it be then, ere thou bid the people return from following their brethren?"],["2 Samuel 2:27","And Joab said, As God liveth, unless thou hadst spoken, surely then in the morning the people had gone up every one from following his brother."],["2 Samuel 2:28","So Joab blew a trumpet, and all the people stood still, and pursued after Israel no more, neither fought they any more."]]},{"ref":"2 Samuel 3:26–27","verses":[["2 Samuel 3:26","And when Joab was come out from David, he sent messengers after Abner, which brought him again from the well of Sirah: but David knew it not."],["2 Samuel 3:27","And when Abner was returned to Hebron, Joab took him aside in the gate to speak with him quietly, and smote him there under the fifth rib, that he died, for the blood of Asahel his brother."]]},{"ref":"1 Kings 2:5","verses":[["1 Kings 2:5","Moreover thou knowest also what Joab the son of Zeruiah did to me, and what he did to the two captains of the hosts of Israel, unto Abner the son of Ner, and unto Amasa the son of Jether, whom he slew, and shed the blood of war in peace, and put the blood of war upon his girdle that was about his loins, and in his shoes that were on his feet."]]}]},{"a":"abner_57","b":"david_994","type":"enemies","why":"Abner led the house of Saul against the servants of David at Gibeon and made himself strong for the house of Saul in the long war between the two houses.","refs":[{"ref":"2 Samuel 2:12–17","verses":[["2 Samuel 2:12","And Abner the son of Ner, and the servants of Ishbosheth the son of Saul, went out from Mahanaim to Gibeon."],["2 Samuel 2:13","And Joab the son of Zeruiah, and the servants of David, went out, and met together by the pool of Gibeon: and they sat down, the one on the one side of the pool, and the other on the other side of the pool."],["2 Samuel 2:14","And Abner said to Joab, Let the young men now arise, and play before us. And Joab said, Let them arise."],["2 Samuel 2:15","Then there arose and went over by number twelve of Benjamin, which pertained to Ishbosheth the son of Saul, and twelve of the servants of David."],["2 Samuel 2:16","And they caught every one his fellow by the head, and thrust his sword in his fellow’s side; so they fell down together: wherefore that place was called Helkathhazzurim, which is in Gibeon."],["2 Samuel 2:17","And there was a very sore battle that day; and Abner was beaten, and the men of Israel, before the servants of David."]]},{"ref":"2 Samuel 3:1","verses":[["2 Samuel 3:1","Now there was long war between the house of Saul and the house of David: but David waxed stronger and stronger, and the house of Saul waxed weaker and weaker."]]},{"ref":"2 Samuel 3:6","verses":[["2 Samuel 3:6","And it came to pass, while there was war between the house of Saul and the house of David, that Abner made himself strong for the house of Saul."]]}]},{"a":"absalom_59","b":"david_994","type":"family","why":"Absalom was David's third son, born in Hebron to Maacah.","refs":[{"ref":"2 Samuel 3:2–3","verses":[["2 Samuel 3:2","And unto David were sons born in Hebron: and his firstborn was Amnon, of Ahinoam the Jezreelitess;"],["2 Samuel 3:3","And his second, Chileab, of Abigail the wife of Nabal the Carmelite; and the third, Absalom the son of Maacah the daughter of Talmai king of Geshur;"]]}]},{"a":"absalom_59","b":"david_994","type":"enemies","why":"Absalom made himself king in Hebron and drove David from Jerusalem, and David said, my son seeketh my life.","refs":[{"ref":"2 Samuel 15:10–14","verses":[["2 Samuel 15:10","But Absalom sent spies throughout all the tribes of Israel, saying, As soon as ye hear the sound of the trumpet, then ye shall say, Absalom
