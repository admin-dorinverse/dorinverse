n, and David our lord knoweth it not?"],["1 Kings 1:12","Now therefore come, let me, I pray thee, give thee counsel, that thou mayest save thine own life, and the life of thy son Solomon."],["1 Kings 1:13","Go and get thee in unto king David, and say unto him, Didst not thou, my lord, O king, swear unto thine handmaid, saying, Assuredly Solomon thy son shall reign after me, and he shall sit upon my throne? why then doth Adonijah reign?"],["1 Kings 1:14","Behold, while thou yet talkest there with the king, I also will come in after thee, and confirm thy words."]]},{"ref":"1 Kings 1:22–23","verses":[["1 Kings 1:22","And, lo, while she yet talked with the king, Nathan the prophet also came in."],["1 Kings 1:23","And they told the king, saying, Behold Nathan the prophet. And when he was come in before the king, he bowed himself before the king with his face to the ground."]]}]},{"a":"benaiah_439","b":"solomon_2762","type":"served","why":"Benaiah brought Solomon down to Gihon to be anointed, carried out the king's commands, and Solomon put him over the host in Joab's place.","refs":[{"ref":"1 Kings 1:36–38","verses":[["1 Kings 1:36","And Benaiah the son of Jehoiada answered the king, and said, Amen: the LORD God of my lord the king say so too."],["1 Kings 1:37","As the LORD hath been with my lord the king, even so be he with Solomon, and make his throne greater than the throne of my lord king David."],["1 Kings 1:38","So Zadok the priest, and Nathan the prophet, and Benaiah the son of Jehoiada, and the Cherethites, and the Pelethites, went down, and caused Solomon to ride upon king David’s mule, and brought him to Gihon."]]},{"ref":"1 Kings 2:25","verses":[["1 Kings 2:25","And king Solomon sent by the hand of Benaiah the son of Jehoiada; and he fell upon him that he died."]]},{"ref":"1 Kings 2:35","verses":[["1 Kings 2:35","And the king put Benaiah the son of Jehoiada in his room over the host: and Zadok the priest did the king put in the room of Abiathar."]]},{"ref":"1 Kings 4:4","verses":[["1 Kings 4:4","And Benaiah the son of Jehoiada was over the host: and Zadok and Abiathar were the priests:"]]}]},{"a":"benaiah_439","b":"zadok_2973","type":"worked_together","why":"David sent Zadok, Nathan and Benaiah together to bring Solomon to Gihon and make him king, and they did it.","refs":[{"ref":"1 Kings 1:32–40","verses":[["1 Kings 1:32","And king David said, Call me Zadok the priest, and Nathan the prophet, and Benaiah the son of Jehoiada. And they came before the king."],["1 Kings 1:33","The king also said unto them, Take with you the servants of your lord, and cause Solomon my son to ride upon mine own mule, and bring him down to Gihon:"],["1 Kings 1:34","And let Zadok the priest and Nathan the prophet anoint him there king over Israel: and blow ye with the trumpet, and say, God save king Solomon."],["1 Kings 1:35","Then ye shall come up after him, that he may come and sit upon my throne; for he shall be king in my stead: and I have appointed him to be ruler over Israel and over Judah."],["1 Kings 1:36","And Benaiah the son of Jehoiada answered the king, and said, Amen: the LORD God of my lord the king say so too."],["1 Kings 1:37","As the LORD hath been with my lord the king, even so be he with Solomon, and make his throne greater than the throne of my lord king David."],["1 Kings 1:38","So Zadok the priest, and Nathan the prophet, and Benaiah the son of Jehoiada, and the Cherethites, and the Pelethites, went down, and caused Solomon to ride upon king David’s mule, and brought him to Gihon."],["1 Kings 1:39","And Zadok the priest took an horn of oil out of the tabernacle, and anointed Solomon. And they blew the trumpet; and all the people said, God save king Solomon."],["1 Kings 1:40","And all the people came up after him, and the people piped with pipes, and rejoiced with great joy, so that the earth rent with the sound of them."]]}]},{"a":"benaiah_439","b":"nathan_2153","type":"worked_together","why":"David sent Zadok, Nathan and Benaiah together to bring Solomon to Gihon and make him king, and they did it.","refs":[{"ref":"1 Kings 1:32–40","verses":[["1 Kings 1:32","And king David said, Call me Zadok the priest, and Nathan the prophet, and Benaiah the son of Jehoiada. And they came before the king."],["1 Kings 1:33","The king also said unto them, Take with you the servants of your lord, and cause Solomon my son to ride upon mine own mule, and bring him down to Gihon:"],["1 Kings 1:34","And let Zadok the priest and Nathan the prophet anoint him there king over Israel: and blow ye with the trumpet, and say, God save king Solomon."],["1 Kings 1:35","Then ye shall come up after him, that he may come and sit upon my throne; for he shall be king in my stead: and I have appointed him to be ruler over Israel and over Judah."],["1 Kings 1:36","And Benaiah the son of Jehoiada answered the king, and said, Amen: the LORD God of my lord the king say so too."],["1 Kings 1:37","As the LORD hath been with my lord the king, even so be he with Solomon, and make his throne greater than the throne of my lord king David."],["1 Kings 1:38","So Zadok the priest, and Nathan the prophet, and Benaiah the son of Jehoiada, and the Cherethites, and the Pelethites, went down, and caused Solomon to ride upon king David’s mule, and brought him to Gihon."],["1 Kings 1:39","And Zadok the priest took an horn of oil out of the tabernacle, and anointed Solomon. And they blew the trumpet; and all the people said, God save king Solomon."],["1 Kings 1:40","And all the people came up after him, and the people piped with pipes, and rejoiced with great joy, so that the earth rent with the sound of them."]]}]},{"a":"benaiah_439","b":"joab_1617","type":"put_to_death","why":"At Solomon's command Benaiah went to the altar, fell upon Joab and killed him.","refs":[{"ref":"1 Kings 2:29–34","verses":[["1 Kings 2:29","And it was told king Solomon that Joab was fled unto the tabernacle of the LORD; and, behold, he is by the altar. Then Solomon sent Benaiah the son of Jehoiada, saying, Go, fall upon him."],["1 Kings 2:30","And Benaiah came to the tabernacle of the LORD, and said unto him, Thus saith the king, Come forth. And he said, Nay; but I will die here. And Benaiah brought the king word again, saying, Thus said Joab, and thus he answered me."],["1 Kings 2:31","And the king said unto him, Do as he hath said, and fall upon him, and bury him; that thou mayest take away the innocent blood, which Joab shed, from me, and from the house of my father."],["1 Kings 2:32","And the LORD shall return his blood upon his own head, who fell upon two men more righteous and better than he, and slew them with the sword, my father David not knowing thereof, to wit, Abner the son of Ner, captain of the host of Israel, and Amasa the son of Jether, captain of the host of Judah."],["1 Kings 2:33","Their blood shall therefore return upon the head of Joab, and upon the head of his seed for ever: but upon David, and upon his seed, and upon his house, and upon his throne, shall there be peace for ever from the LORD."],["1 Kings 2:34","So Benaiah the son of Jehoiada went up, and fell upon him, and slew him: and he was buried in his own house in the wilderness."]]}]},{"a":"benaiah_439","b":"shimei_2684","type":"put_to_death","why":"At Solomon's command Benaiah went out and fell upon Shimei, and he died.","refs":[{"ref":"1 Kings 2:46","verses":[["1 Kings 2:46","So the king commanded Benaiah the son of Jehoiada; which went out, and fell upon him, that he died. And the kingdom was established in the hand of Solomon."]]}]},{"a":"david_994","b":"solomon_2762","type":"family","why":"Solomon was born to David and Bathsheba; David made him king after him and charged him as his son to keep the LORD's charge.","refs":[{"ref":"2 Samuel 12:24","verses":[["2 Samuel 12:24","And David comforted Bathsheba his wife, and went in unto her, and lay with her: and she bare a son, and he called his name Solomon: and the LORD loved him."]]},{"ref":"1 Kings 1:30","verses":[["1 Kings 1:30","Even as I sware unto thee by the LORD God of Israel, saying, Assuredly Solomon thy son shall reign after me, and he shall sit upon my throne in my stead; even so will I certainly do this day."]]},{"ref":"1 Kings 2:1–4","verses":[["1 Kings 2:1","Now the days of David drew nigh that he should die; and he charged Solomon his son, saying,"],["1 Kings 2:2","I go the way of all the earth: be thou strong therefore, and shew thyself a man;"],["1 Kings 2:3","And keep the charge of the LORD thy God, to walk in his ways, to keep his statutes, and his commandments, and his judgments, and his testimonies, as it is written in the law of Moses, that thou mayest prosper in all that thou doest, and whithersoever thou turnest thyself:"],["1 Kings 2:4","That the LORD may continue his word which he spake concerning me, saying, If thy children take heed to their way, to walk before me in truth with all their heart and with all their soul, there shall not fail thee (said he) a man on the throne of Israel."]]},{"ref":"1 Chronicles 28:9–10","verses":[["1 Chronicles 28:9","And thou, Solomon my son, know thou the God of thy father, and serve him with a perfect heart and with a willing mind: for the LORD searcheth all hearts, and understandeth all the imaginations of the thoughts: if thou seek him, he will be found of thee; but if thou forsake him, he will cast thee off for ever."],["1 Chronicles 28:10","Take heed now; for the LORD hath chosen thee to build an house for the sanctuary: be strong, and do it."]]}]},{"a":"david_994","b":"ornan_289","type":"helped","why":"Ornan offered David his threshing floor, oxen and wheat freely for the LORD's altar, but David paid him the full price and built the altar there.","refs":[{"ref":"1 Chronicles 21:18–28","verses":[["1 Chronicles 21:18","Then the angel of the LORD commanded Gad to say to David, that David should go up, and set up an altar unto the LORD in the threshingfloor of Ornan the Jebusite."],["1 Chronicles 21:19","And David went up at the saying of Gad, which he spake in the name of the LORD."],["1 Chronicles 21:20","And Ornan turned back, and saw the angel; and his four sons with him hid themselves. Now Ornan was threshing wheat."],["1 Chronicles 21:21","And as David came to Ornan, Ornan looked and saw David, and went out of the threshingfloor, and bowed himself to David with his face to the ground."],["1 Chronicles 21:22","Then David said to Ornan, Grant me the place of this threshingfloor, that I may build an altar therein unto the LORD: thou shalt grant it me for the full price: that the plague may be stayed from the people."],["1 Chronicles 21:23","And Ornan said unto David, Take it to thee, and let my lord the king do that which is good in his eyes: lo, I give thee the oxen also for burnt offerings, and the threshing instruments for wood, and the wheat for the meat offering; I give it all."],["1 Chronicles 21:24","And king David said to Ornan, Nay; but I will verily buy it for the full price: for I will not take that which is thine for the LORD, nor offer burnt offerings without cost."],["1 Chronicles 21:25","So David gave to Ornan for the place six hundred shekels of gold by weight."],["1 Chronicles 21:26","And David built there an altar unto the LORD, and offered burnt offerings and peace offerings, and called upon the LORD; and he answered him from heaven by fire upon the altar of burnt offering."],["1 Chronicles 21:27","And the LORD commanded the angel; and he put up his sword again into the sheath thereof."],["1 Chronicles 21:28","At that time when David saw that the LORD had answered him in the threshingfloor of Ornan the Jebusite, then he sacrificed there."]]}]},{"a":"david_994","b":"hadarezer_1340","type":"enemies","why":"David smote Hadarezer king of Zobah and took his chariots, horsemen and shields of gold, and later defeated the Syrians Hadarezer had sent out.","refs":[{"ref":"2 Samuel 8:3–8","verses":[["2 Samuel 8:3","David smote also Hadadezer, the son of Rehob, king of Zobah, as he went to recover his border at the river Euphrates."],["2 Samuel 8:4","And David took from him a thousand chariots, and seven hundred horsemen, and twenty thousand footmen: and David houghed all the chariot horses, but reserved of them for an hundred chariots."],["2 Samuel 8:5","And when the Syrians of Damascus came to succour Hadadezer king of Zobah, David slew of the Syrians two and twenty thousand men."],["2 Samuel 8:6","Then David put garrisons in Syria of Damascus: and the Syrians became servants to David, and brought gifts. And the LORD preserved David whithersoever he went."],["2 Samuel 8:7","And David took the shields of gold that were on the servants of Hadadezer, and brought them to Jerusalem."],["2 Samuel 8:8","And from Betah, and from Berothai, cities of Hadadezer, king David took exceeding much brass."]]},{"ref":"2 Samuel 10:16–19","verses":[["2 Samuel 10:16","And Hadarezer sent, and brought out the Syrians that were beyond the river: and they came to Helam; and Shobach the captain of the host of Hadarezer went before them."],["2 Samuel 10:17","And when it was told David, he gathered all Israel together, and passed over Jordan, and came to Helam. And the Syrians set themselves in array against David, and fought with him."],["2 Samuel 10:18","And the Syrians fled before Israel; and David slew the men of seven hundred chariots of the Syrians, and forty thousand horsemen, and smote Shobach the captain of their host, who died there."],["2 Samuel 10:19","And when all the kings that were servants to Hadarezer saw that they were smitten before Israel, they made peace with Israel, and served them. So the Syrians feared to help the children of Ammon any more."]]}]},{"a":"eliakim_1084","b":"rabshakeh_2384","type":"enemies","why":"Rabshakeh came with a great host against Jerusalem, and Eliakim went out to answer him at the wall, where Rabshakeh mocked their trust in the LORD and threatened the men on the wall.","refs":[{"ref":"2 Kings 18:17–27","verses":[["2 Kings 18:17","And the king of Assyria sent Tartan and Rabsaris and Rabshakeh from Lachish to king Hezekiah with a great host against Jerusalem. And they went up and came to Jerusalem. And when they were come up, they came and stood by the conduit of the upper pool, which is in the highway of the fuller’s field."],["2 Kings 18:18","And when they had called to the king, there came out to them Eliakim the son of Hilkiah, which was over the household, and Shebna the scribe, and Joah the son of Asaph the recorder."],["2 Kings 18:19","And Rabshakeh said unto them, Speak ye now to Hezekiah, Thus saith the great king, the king of Assyria, What confidence is this wherein thou trustest?"],["2 Kings 18:20","Thou sayest, (but they are but vain words,) I have counsel and strength for the war. Now on whom dost thou trust, that thou rebellest against me?"],["2 Kings 18:21","Now, behold, thou trustest upon the staff of this bruised reed, even upon Egypt, on which if a man lean, it will go into his hand, and pierce it: so is Pharaoh king of Egypt unto all that trust on him."],["2 Kings 18:22","But if ye say unto me, We trust in the LORD our God: is not that he, whose high places and whose altars Hezekiah hath taken away, and hath said to Judah and Jerusalem, Ye shall worship before this altar in Jerusalem?"],["2 Kings 18:23","Now therefore, I pray thee, give pledges to my lord the king of Assyria, and I will deliver thee two thousand horses, if thou be able on thy part to set riders upon them."],["2 Kings 18:24","How then wilt thou turn away the face of one captain of the least of my master’s servants, and put thy trust on Egypt for chariots and for horsemen?"],["2 Kings 18:25","Am I now come up without the LORD against this place to destroy it? The LORD said to me, Go up against this land, and destroy it."],["2 Kings 18:26","Then said Eliakim the son of Hilkiah, and Shebna, and Joah, unto Rabshakeh, Speak, I pray thee, to thy servants in the Syrian language; for we understand it: and talk not with us in the Jews’ language in the ears of the people that are on the wall."],["2 Kings 18:27","But Rabshakeh said unto them, Hath my master sent me to thy master, and to thee, to speak these words? hath he not sent me to the men which sit on the wall, that they may eat their own dung, and drink their own piss with you?"]]}]},{"a":"eliakim_1084","b":"hezekiah_1512","type":"served","why":"Eliakim son of Hilkiah was over Hezekiah's household, and Hezekiah sent him to Rabshakeh and to Isaiah.","refs":[{"ref":"2 Kings 18:18","verses":[["2 Kings 18:18","And when they had called to the king, there came out to them Eliakim the son of Hilkiah, which was over the household, and Shebna the scribe, and Joah the son of Asaph the recorder."]]},{"ref":"2 Kings 18:37","verses":[["2 Kings 18:37","Then came Eliakim the son of Hilkiah, which was over the household, and Shebna the scribe, and Joah the son of Asaph the recorder, to Hezekiah with their clothes rent, and told him the words of Rabshakeh."]]},{"ref":"2 Kings 19:1–2","verses":[["2 Kings 19:1","And it came to pass, when king Hezekiah heard it, that he rent his clothes, and covered himself with sackcloth, and went into the house of the LORD."],["2 Kings 19:2","And he sent Eliakim, which was over the household, and Shebna the scribe, and the elders of the priests, covered with sackcloth, to Isaiah the prophet the son of Amoz."]]}]},{"a":"eliakim_1084","b":"isaiah_617","type":"prophesied","why":"Isaiah spoke the LORD's word that He would call His servant Eliakim the son of Hilkiah and commit the government into his hand, and later, when Eliakim was sent to him, Isaiah gave him the LORD's answer for Hezekiah.","refs":[{"ref":"Isaiah 22:20–24","verses":[["Isaiah 22:20","And it shall come to pass in that day, that I will call my servant Eliakim the son of Hilkiah:"],["Isaiah 22:21","And I will clothe him with thy robe, and strengthen him with thy girdle, and I will commit thy government into his hand: and he shall be a father to the inhabitants of Jerusalem, and to the house of Judah."],["Isaiah 22:22","And the key of the house of David will I lay upon his shoulder; so he shall open, and none shall shut; and he shall shut, and none shall open."],["Isaiah 22:23","And I will fasten him as a nail in a sure place; and he shall be for a glorious throne to his father’s house."],["Isaiah 22:24","And they shall hang upon him all the glory of his father’s house, the offspring and the issue, all vessels of small quantity, from the vessels of cups, even to all the vessels of flagons."]]},{"ref":"2 Kings 19:2–7","verses":[["2 Kings 19:2","And he sent Eliakim, which was over the household, and Shebna the scribe, and the elders of the priests, covered with sackcloth, to Isaiah the prophet the son of Amoz."],["2 Kings 19:3","And they said unto him, Thus saith Hezekiah, This day is a day of trouble, and of rebuke, and blasphemy: for the children are come to the birth, and there is not strength to bring forth."],["2 Kings 19:4","It may be the LORD thy God will hear all the words of Rabshakeh, whom the king of Assyria his master hath sent to reproach the living God; and will reprove the words which the LORD thy God hath heard: wherefore lift up thy prayer for the remnant that are left."],["2 Kings 19:5","So the servants of king Hezekiah came to Isaiah."],["2 Kings 19:6","And Isaiah said unto them, Thus shall ye say to your master, Thus saith the LORD, Be not afraid of the words which thou hast heard, with which the servants of the king of Assyria have blasphemed me."],["2 Kings 19:7","Behold, I will send a blast upon him, and he shall hear a rumour, and shall return to his own land; and I will cause him to fall by the sword in his own land."]]}]},{"a":"elijah_1131","b":"jezebel_1605","type":"enemies","why":"After Elijah slew the prophets of Baal, Jezebel sent to swear she would take his life, and he fled for his life.","refs":[{"ref":"1 Kings 19:1–3","verses":[["1 Kings 19:1","And Ahab told Jezebel all that Elijah had done, and withal how he had slain all the prophets with the sword."],["1 Kings 19:2","Then Jezebel sent a messenger unto Elijah, saying, So let the gods do to me, and more also, if I make not thy life as the life of one of them by to morrow about this time."],["1 Kings 19:3","And when he saw that, he arose, and went for his life, and came to Beersheba, which belongeth to Judah, and left his servant there."]]}]},{"a":"elijah_1131","b":"jezebel_1605","type":"prophecy","why":"Elijah said the dogs shall eat Jezebel by the wall of Jezreel, and when she died Jehu said, This is the word of the LORD, which he spake by his servant Elijah.","refs":[{"ref":"1 Kings 21:23","verses":[["1 Kings 21:23","And of Jezebel also spake the LORD, saying, The dogs shall eat Jezebel by the wall of Jezreel."]]}],"fulfilled":[{"ref":"2 Kings 9:36–37","verses":[["2 Kings 9:36","Wherefore they came again, and told him. And he said, This is the word of the LORD, which he spake by his servant Elijah the Tishbite, saying, In the portion of Jezreel shall dogs eat the flesh of Jezebel:"],["2 Kings 9:37","And the carcase of Jezebel shall be as dung upon the face of the field in the portion of Jezreel; so that they shall not say, This is Jezebel."]]}]},{"a":"elijah_1131","b":"elisha_1153","type":"followed","why":"Elisha went after Elijah and ministered unto him, and would not leave him until Elijah was taken up into heaven.","refs":[{"ref":"1 Kings 19:19–21","verses":[["1 Kings 19:19","So he departed thence, and found Elisha the son of Shaphat, who was plowing with twelve yoke of oxen before him, and he with the twelfth: and Elijah passed by him, and cast his mantle upon him."],["1 Kings 19:20","And he left the oxen, and ran after Elijah, and said, Let me, I pray thee, kiss my father and my mother, and then I will follow thee. And he said unto him, Go back again: for what have I done to thee?"],["1 Kings 19:21","And he returned back from him, and took a yoke of oxen, and slew them, and boiled their flesh with the instruments of the oxen, and gave unto the people, and they did eat. Then he arose, and went after Elijah, and ministered unto him."]]},{"ref":"2 Kings 2:1–12","verses":[["2 Kings 2:1","And it came to pass, when the LORD would take up Elijah into heaven by a whirlwind, that Elijah went with Elisha from Gilgal."],["2 Kings 2:2","And Elijah said unto Elisha, Tarry here, I pray thee; for the LORD hath sent me to Bethel. And Elisha said unto him, As the LORD liveth, and as thy soul liveth, I will not leave thee. So they went down to Bethel."],["2 Kings 2:3","And the sons of the prophets that were at Bethel came forth to Elisha, and said unto him, Knowest thou that the LORD will take away thy master from thy head to day? And he said, Yea, I know it; hold ye your peace."],["2 Kings 2:4","And Elijah said unto him, Elisha, tarry here, I pray thee; for the LORD hath sent me to Jericho. And he said, As the LORD liveth, and as thy soul liveth, I will not leave thee. So they came to Jericho."],["2 Kings 2:5","And the sons of the prophets that were at Jericho came to Elisha, and said unto him, Knowest thou that the LORD will take away thy master from thy head to day? And he answered, Yea, I know it; hold ye your peace."],["2 Kings 2:6","And Elijah said unto him, Tarry, I pray thee, here; for the LORD hath sent me to Jordan. And he said, As the LORD liveth, and as thy soul liveth, I will not leave thee. And they two went on."],["2 Kings 2:7","And fifty men of the sons of the prophets went, and stood to view afar off: and they two stood by Jordan."],["2 Kings 2:8","And Elijah took his mantle, and wrapped it together, and smote the waters, and they were divided hither and thither, so that they two went over on dry ground."],["2 Kings 2:9","And it came to pass, when they were gone over, that Elijah said unto Elisha, Ask what I shall do for thee, before I be taken away from thee. And Elisha said, I pray thee, let a double portion of thy spirit be upon me."],["2 Kings 2:10","And he said, Thou hast asked a hard thing: nevertheless, if thou see me when I am taken from thee, it shall be so unto thee; but if not, it shall not be so."],["2 Kings 2:11","And it came to pass, as they still went on, and talked, that, behold, there appeared a chariot of fire, and horses of fire, and parted them both asunder; and Elijah went up by a whirlwind into heaven."],["2 Kings 2:12","And Elisha saw it, and he cried, My father, my father, the chariot of Israel, and the horsemen thereof. And he saw him no more: and he took hold of his own clothes, and rent them in two pieces."]]}]},{"a":"elijah_1131","b":"elisha_1153","type":"anointed","why":"The LORD told Elijah to anoint Elisha to be prophet in his room, and Elijah cast his mantle upon him; the spirit of Elijah rested on Elisha.","refs":[{"ref":"1 Kings 19:16","verses":[["1 Kings 19:16","And Jehu the son of Nimshi shalt thou anoint to be king over Israel: and Elisha the son of Shaphat of Abelmeholah shalt thou anoint to be prophet in thy room."]]},{"ref":"1 Kings 19:19","verses":[["1 Kings 19:19","So he departed thence, and found Elisha the son of Shaphat, who was plowing with twelve yoke of oxen before him, and he with the twelfth: and Elijah passed by him, and cast his mantle upon him."]]},{"ref":"2 Kings 2:13–15","verses":[["2 Kings 2:13","He took up also the mantle of Elijah that fell from him, and went back, and stood by the bank of Jordan;"],["2 Kings 2:14","And he took the mantle of Elijah that fell from him, and smote the waters, and said, Where is the LORD God of Elijah? and when he also had smitten the waters, they parted hither and thither: and Elisha went over."],["2 Kings 2:15","And when the sons of the prophets which were to view at Jericho saw him, they said, The spirit of Elijah doth rest on Elisha. And they came to meet him, and bowed themselves to the ground before him."]]}]},{"a":"elijah_1131","b":"jehoram_803","type":"rebuked","why":"Elijah's writing told Jehoram that because he had not walked in the ways of Jehoshaphat, had made Judah go a whoring, and had slain his brethren, the LORD would smite him and his people.","refs":[{"ref":"2 Chronicles 21:12–15","verses":[["2 Chronicles 21:12","And there came a writing to him from Elijah the prophet, saying, Thus saith the LORD God of David thy father, Because thou hast not walked in the ways of Jehoshaphat thy father, nor in the ways of Asa king of Judah,"],["2 Chronicles 21:13","But hast walked in the way of the kings of Israel, and hast made Judah and the inhabitants of Jerusalem to go a whoring, like to the whoredoms of the house of Ahab, and also hast slain thy brethren of thy father’s house, which were better than thyself:"],["2 Chronicles 21:14","Behold, with a great plague will the LORD smite thy people, and thy children, and thy wives, and all thy goods:"],["2 Chronicles 21:15","And thou shalt have great sickness by disease of thy bowels, until thy bowels fall out by reason of the sickness day by day."]]}]},{"a":"elisha_1153","b":"gehazi_1293","type":"served","why":"Gehazi was the servant of Elisha the man of God, who spoke for him to the Shunammite and went before him with his staff.","refs":[{"ref":"2 Kings 4:12–15","verses":[["2 Kings 4:12","And he said to Gehazi his servant, Call this Shunammite. And when he had called her, she stood before him."],["2 Kings 4:13","And he said unto him, Say now unto her, Behold, thou hast been careful for us with all this care; what is to be done for thee? wouldest thou be spoken for to the king, or to the captain of the host? And she answered, I dwell among mine own people."],["2 Kings 4:14","And he said, What then is to be done for her? And Gehazi answered, Verily she hath no child, and her husband is old."],["2 Kings 4:15","And he said, Call her. And when he had called her, she stood in the door."]]},{"ref":"2 Kings 4:29–31","verses":[["2 Kings 4:29","Then he said to Gehazi, Gird up thy loins, and take my staff in thine hand, and go thy way: if thou meet any man, salute him not; and if any salute thee, answer him not again: and lay my staff upon the face of the child."],["2 Kings 4:30","And the mother of the child said, As the LORD liveth, and as thy soul liveth, I will not leave thee. And he arose, and followed her."],["2 Kings 4:31","And Gehazi passed on before them, and laid the staff upon the face of the child; but there was neither voice, nor hearing. Wherefore he went again to meet him, and told him, saying, The child is not awaked."]]},{"ref":"2 Kings 5:20","verses":[["2 Kings 5:20","But Gehazi, the servant of Elisha the man of God, said, Behold, my master hath spared Naaman this Syrian, in not receiving at his hands that which he brought: but, as the LORD liveth, I will run after him, and take somewhat of him."]]}]},{"a":"elisha_1153","b":"gehazi_1293","type":"rebuked","why":"When Gehazi took Naaman's silver and lied about it, Elisha said, Went not mine heart with thee? and the leprosy of Naaman cleaved unto Gehazi.","refs":[{"ref":"2 Kings 5:25–27","verses":[["2 Kings 5:25","But he went in, and stood before his master. And Elisha said unto him, Whence comest thou, Gehazi? And he said, Thy servant went no whither."],["2 Kings 5:26","And he said unto him, Went not mine heart with thee, when the man turned again from his chariot to meet thee? Is it a time to receive money, and to receive garments, and oliveyards, and vineyards, and sheep, and oxen, and menservants, and maidservants?"],["2 Kings 5:27","The leprosy therefore of Naaman shall cleave unto thee, and unto thy seed for ever. And he went out from his presence a leper as white as snow."]]}]},{"a":"elisha_1153","b":"naaman_2122","type":"healed","why":"Elisha sent word to Naaman to wash in Jordan seven times, and his flesh came again like the flesh of a little child, and he was clean.","refs":[{"ref":"2 Kings 5:8–14","verses":[["2 Kings 5:8","And it was so, when Elisha the man of God had heard that the king of Israel had rent his clothes, that he sent to the king, saying, Wherefore hast thou rent thy clothes? let him come now to me, and he shall know that there is a prophet in Israel."],["2 Kings 5:9","So Naaman came with his horses and with his chariot, and stood at the door of the house of Elisha."],["2 Kings 5:10","And Elisha sent a messenger unto him, saying, Go and wash in Jordan seven times, and thy flesh shall come again to thee, and thou shalt be clean."],["2 Kings 5:11","But Naaman was wroth, and went away, and said, Behold, I thought, He will surely come out to me, and stand, and call on the name of the LORD his God, and strike his hand over the place, and recover the leper."],["2 Kings 5:12","Are not Abana and Pharpar, rivers of Damascus, better than all the waters of Israel? may I not wash in them, and be clean? So he turned and went away in a rage."],["2 Kings 5:13","And his servants came near, and spake unto him, and said, My father, if the prophet had bid thee do some great thing, wouldest thou not have done it? how much rather then, when he saith to thee, Wash, and be clean?"],["2 Kings 5:14","Then went he down, and dipped himself seven times in Jordan, according to the saying of the man of God: and his flesh came again like unto the flesh of a little child, and he was clean."]]}]},{"a":"elisha_1153","b":"hazael_1463","type":"prophesied","why":"When Hazael came to Elisha for Ben-hadad, Elisha wept for the evil Hazael would do to Israel and told him the LORD had shown him that Hazael would be king over Syria.","refs":[{"ref":"2 Kings 8:7–15","verses":[["2 Kings 8:7","And Elisha came to Damascus; and Benhadad the king of Syria was sick; and it was told him, saying, The man of God is come hither."],["2 Kings 8:8","And the king said unto Hazael, Take a present in thine hand, and go, meet the man of God, and enquire of the LORD by him, saying, Shall I recover of this disease?"],["2 Kings 8:9","So Hazael went to meet him, and took a present with him, even of every good thing of Damascus, forty camels’ burden, and came and stood before him, and said, Thy son Benhadad king of Syria hath sent me to thee, saying, Shall I recover of this disease?"],["2 Kings 8:10","And Elisha said unto him, Go, say unto him, Thou mayest certainly recover: howbeit the LORD hath shewed me that he shall surely die."],["2 Kings 8:11","And he settled his countenance stedfastly, until he was ashamed: and the man of God wept."],["2 Kings 8:12","And Hazael said, Why weepeth my lord? And he answered, Because I know the evil that thou wilt do unto the children of Israel: their strong holds wilt thou set on fire, and their young men wilt thou slay with the sword, and wilt dash their children, and rip up their women with child."],["2 Kings 8:13","And Hazael said, But what, is thy servant a dog, that he should do this great thing? And Elisha answered, The LORD hath shewed me that thou shalt be king over Syria."],["2 Kings 8:14","So he departed from Elisha, and came to his master; who said to him, What said Elisha to thee? And he answered, He told me that thou shouldest surely recover."],["2 Kings 8:15","And it came to pass on the morrow, that he took a thick cloth, and dipped it in water, and spread it on his face, so that he died: and Hazael reigned in his stead."]]}]},{"a":"elisha_1153","b":"jehu_817","type":"anointed","why":"Elisha sent one of the children of the prophets with a box of oil to anoint Jehu king over Israel, and he did.","refs":[{"ref":"2 Kings 9:1–6","verses":[["2 Kings 9:1","And Elisha the prophet called one of the children of the prophets, and said unto him, Gird up thy loins, and take this box of oil in thine hand, and go to Ramothgilead:"],["2 Kings 9:2","And when thou comest thither, look out there Jehu the son of Jehoshaphat the son of Nimshi, and go in, and make him arise up from among his brethren, and carry him to an inner chamber;"],["2 Kings 9:3","Then take the box of oil, and pour it on his head, and say, Thus saith the LORD, I have anointed thee king over Israel. Then open the door, and flee, and tarry not."],["2 Kings 9:4","So the young man, even the young man the prophet, went to Ramothgilead."],["2 Kings 9:5","And when he came, behold, the captains of the host were sitting; and he said, I have an errand to thee, O captain. And Jehu said, Unto which of all us? And he said, To thee, O captain."],["2 Kings 9:6","And he arose, and went into the house; and he poured the oil on his head, and said unto him, Thus saith the LORD God of Israel, I have anointed thee king over the people of the LORD, even over Israel."]]}]},{"a":"elisha_1153","b":"joash_1633","type":"prophesied","why":"When Joash king of Israel came to the dying Elisha, Elisha had him shoot the arrow of the LORD's deliverance and told him he would smite Syria but three times.","refs":[{"ref":"2 Kings 13:14–19","verses":[["2 Kings 13:14","Now Elisha was fallen sick of his sickness whereof he died. And Joash the king of Israel came down unto him, and wept over his face, and said, O my father, my father, the chariot of Israel, and the horsemen thereof."],["2 Kings 13:15","And Elisha said unto him, Take bow and arrows. And he took unto him bow and arrows."],["2 Kings 13:16","And he said to the king of Israel, Put thine hand upon the bow. And he put his hand upon it: and Elisha put his hands upon the king’s hands."],["2 Kings 13:17","And he said, Open the window eastward. And he opened it. Then Elisha said, Shoot. And he shot. And he said, The arrow of the LORD’S deliverance, and the arrow of deliverance from Syria: for thou shalt smite the Syrians in Aphek, till thou have consumed them."],["2 Kings 13:18","And he said, Take the arrows. And he took them. And he said unto the king of Israel, Smite upon the ground. And he smote thrice, and stayed."],["2 Kings 13:19","And the man of God was wroth with him, and said, Thou shouldest have smitten five or six times; then hadst thou smitten Syria till thou hadst consumed it: whereas now thou shalt smite Syria but thrice."]]}]},{"a":"elisha_1153","b":"jehoshaphat_808","type":"prophesied","why":"Jehoshaphat asked for a prophet of the LORD, and for Jehoshaphat's sake Elisha spoke the LORD's word that the valley would be filled with water and Moab delivered into their hand.","refs":[{"ref":"2 Kings 3:11–20","verses":[["2 Kings 3:11","But Jehoshaphat said, Is there not here a prophet of the LORD, that we may enquire of the LORD by him? And one of the king of Israel’s servants answered and said, Here is Elisha the son of Shaphat, which poured water on the hands of Elijah."],["2 Kings 3:12","And Jehoshaphat said, The word of the LORD is with him. So the king of Israel and Jehoshaphat and the king of Edom went down to him."],["2 Kings 3:13","And Elisha said unto the king of Israel, What have I to do with thee? get thee to the prophets of thy father, and to the prophets of thy mother. And the king of Israel said unto him, Nay: for the LORD hath called these three kings together, to deliver them into the hand of Moab."],["2 Kings 3:14","And Elisha said, As the LORD of hosts liveth, before whom I stand, surely, were it not that I regard the presence of Jehoshaphat the king of Judah, I would not look toward thee, nor see thee."],["2 Kings 3:15","But now bring me a minstrel. And it came to pass, when the minstrel played, that the hand of the LORD came upon him."],["2 Kings 3:16","And he said, Thus saith the LORD, Make this valley full of ditches."],["2 Kings 3:17","For thus saith the LORD, Ye shall not see wind, neither shall ye see rain; yet that valley shall be filled with water, that ye may drink, both ye, and your cattle, and your beasts."],["2 Kings 3:18","And this is but a light thing in the sight of the LORD: he will deliver the Moabites also into your hand."],["2 Kings 3:19","And ye shall smite every fenced city, and every choice city, and shall fell every good tree, and stop all wells of water, and mar every good piece of land with stones."],["2 Kings 3:20","And it came to pass in the morning, when the meat offering was offered, that, behold, there came water by the way of Edom, and the country was filled with water."]]}]},{"a":"elisha_1153","b":"joram_804","type":"prophesied","why":"Elisha told the king of Israel he would not look at him but for Jehoshaphat, then spoke the LORD's word to the kings that the valley would be filled with water and Moab delivered into their hand.","refs":[{"ref":"2 Kings 3:11–20","verses":[["2 Kings 3:11","But Jehoshaphat said, Is there not here a prophet of the LORD, that we may enquire of the LORD by him? And one of the king of Israel’s servants answered and said, Here is Elisha the son of Shaphat, which poured water on the hands of Elijah."],["2 Kings 3:12","And Jehoshaphat said, The word of the LORD is with him. So the king of Israel and Jehoshaphat and the king of Edom went down to him."],["2 Kings 3:13","And Elisha said unto the king of Israel, What have I to do with thee? get thee to the prophets of thy father, and to the prophets of thy mother. And the king of Israel said unto him, Nay: for the LORD hath called these three kings together, to deliver them into the hand of Moab."],["2 Kings 3:14","And Elisha said, As the LORD of hosts liveth, before whom I stand, surely, were it not that I regard the presence of Jehoshaphat the king of Judah, I would not look toward thee, nor see thee."],["2 Kings 3:15","But now bring me a minstrel. And it came to pass, when the minstrel played, that the hand of the LORD came upon him."],["2 Kings 3:16","And he said, Thus saith the LORD, Make this valley full of ditches."],["2 Kings 3:17","For thus saith the LORD, Ye shall not see wind, neither shall ye see rain; yet that valley shall be filled with water, that ye may drink, both ye, and your cattle, and your beasts."],["2 Kings 3:18","And this is but a light thing in the sight of the LORD: he will deliver the Moabites also into your hand."],["2 Kings 3:19","And ye shall smite every fenced city, and every choice city, and shall fell every good tree, and stop all wells of water, and mar every good piece of land with stones."],["2 Kings 3:20","And it came to pass in the morning, when the meat offering was offered, that, behold, there came water by the way of Edom, and the country was filled with water."]]}]},{"a":"gedaliah_1287","b":"nebuchadnezzar_2167","type":"served","why":"Nebuchadnezzar king of Babylon made Gedaliah ruler over the people he left in the land of Judah.","refs":[{"ref":"2 Kings 25:22","verses":[["2 Kings 25:22","And as for the people that remained in the land of Judah, whom Nebuchadnezzar king of Babylon had left, even over them he made Gedaliah the son of Ahikam, the son of Shaphan, ruler."]]},{"ref":"Jeremiah 40:7","verses":[["Jeremiah 40:7","Now when all the captains of the forces which were in the fields, even they and their men, heard that the king of Babylon had made Gedaliah the son of Ahikam governor in the land, and had committed unto him men, and women, and children, and of the poor of the land, of them that were not carried away captive to Babylon;"]]}]},{"a":"gehazi_1293","b":"naaman_2122","type":"deceived","why":"Gehazi ran after Naaman and lied that Elisha had sent him for silver and garments, and Naaman gave him two talents.","refs":[{"ref":"2 Kings 5:20–27","verses":[["2 Kings 5:20","But Gehazi, the servant of Elisha the man of God, said, Behold, my master hath spared Naaman this Syrian, in not receiving at his hands that which he brought: but, as the LORD liveth, I will run after him, and take somewhat of him."],["2 Kings 5:21","So Gehazi followed after Naaman. And when Naaman saw him running after him, he lighted down from the chariot to meet him, and said, Is all well?"],["2 Kings 5:22","And he said, All is well. My master hath sent me, saying, Behold, even now there be come to me from mount Ephraim two young men of the sons of the prophets: give them, I pray thee, a talent of silver, and two changes of garments."],["2 Kings 5:23","And Naaman said, Be content, take two talents. And he urged him, and bound two talents of silver in two bags, with two changes of garments, and laid them upon two of his servants; and they bare them before him."],["2 Kings 5:24","And when he came to the tower, he took them from their hand, and bestowed them in the house: and he let the men go, and they departed."],["2 Kings 5:25","But he went in, and stood before his master. And Elisha said unto him, Whence comest thou, Gehazi? And he said, Thy servant went no whither."],["2 Kings 5:26","And he said unto him, Went not mine heart with thee, when the man turned again from his chariot to meet thee? Is it a time to receive money, and to receive garments, and oliveyards, and vineyards, and sheep, and oxen, and menservants, and maidservants?"],["2 Kings 5:27","The leprosy therefore of Naaman shall cleave unto thee, and unto thy seed for ever. And he went out from his presence a leper as white as snow."]]}]},{"a":"hazael_1463","b":"joram_804","type":"enemies","why":"Joram went to war against Hazael king of Syria at Ramoth-gilead and was wounded when he fought with Hazael.","refs":[{"ref":"2 Kings 8:28–29","verses":[["2 Kings 8:28","And he went with Joram the son of Ahab to the war against Hazael king of Syria in Ramothgilead; and the Syrians wounded Joram."],["2 Kings 8:29","And king Joram went back to be healed in Jezreel of the wounds which the Syrians had given him at Ramah, when he fought against Hazael king of Syria. And Ahaziah the son of Jehoram king of Judah went down to see Joram the son of Ahab in Jezreel, because he was sick."]]},{"ref":"2 Kings 9:14–15","verses":[["2 Kings 9:14","So Jehu the son of Jehoshaphat the son of Nimshi conspired against Joram. (Now Joram had kept Ramothgilead, he and all Israel, because of Hazael king of Syria."],["2 Kings 9:15","But king Joram was returned to be healed in Jezreel of the wounds which the Syrians had given him, when he fought with Hazael king of Syria.) And Jehu said, If it be your minds, then let none go forth nor escape out of the city to go to tell it in Jezreel."]]}]},{"a":"hazael_1463","b":"joash_1632","type":"enemies","why":"Hazael set his face to go up to Jerusalem, and Joash king of Judah sent him all the hallowed things and gold, and Hazael went away.","refs":[{"ref":"2 Kings 12:17–18","verses":[["2 Kings 12:17","Then Hazael king of Syria went up, and fought against Gath, and took it: and Hazael set his face to go up to Jerusalem."],["2 Kings 12:18","And Jehoash king of Judah took all the hallowed things that Jehoshaphat, and Jehoram, and Ahaziah, his fathers, kings of Judah, had dedicated, and his own hallowed things, and all the gold that was found in the treasures of the house of the LORD, and in the king’s house, and sent it to Hazael king of Syria: and he went away from Jerusalem."]]}]},{"a":"hezekiah_1512","b":"isaiah_617","type":"counseled","why":"Hezekiah sent to Isaiah in the Assyrian crisis, and Isaiah brought him the LORD's word then, when he was sick unto death, and when he showed his treasures to Babylon's messengers.","refs":[{"ref":"2 Kings 19:1–7","verses":[["2 Kings 19:1","And it came to pass, when king Hezekiah heard it, that he rent his clothes, and covered himself with sackcloth, and went into the house of the LORD."],["2 Kings 19:2","And he sent Eliakim, which was over the household, and Shebna the scribe, and the elders of the priests, covered with sackcloth, to Isaiah the prophet the son of Amoz."],["2 Kings 19:3","And they said unto him, Thus saith Hezekiah, This day is a day of trouble, and of rebuke, and blasphemy: for the children are come to the birth, and there is not strength to bring forth."],["2 Kings 19:4","It may be the LORD thy God will hear all the words of Rabshakeh, whom the king of Assyria his master hath sent to reproach the living God; and will reprove the words which the LORD thy God hath heard: wherefore lift up thy prayer for the remnant that are left."],["2 Kings 19:5","So the servants of king Hezekiah came to Isaiah."],["2 Kings 19:6","And Isaiah said unto them, Thus shall ye say to your master, Thus saith the LORD, Be not afraid of the words which thou hast heard, with which the servants of the king of Assyria have blasphemed me."],["2 Kings 19:7","Behold, I will send a blast upon him, and he shall hear a rumour, and shall return to his own land; and I will cause him to fall by the sword in his own land."]]},{"ref":"2 Kings 20:1–11","verses":[["2 Kings 20:1","In those days was Hezekiah sick unto death. And the prophet Isaiah the son of Amoz came to him, and said unto him, Thus saith the LORD, Set thine house in order; for thou shalt die, and not live."],["2 Kings 20:2","Then he turned his face to the wall, and prayed unto the LORD, saying,"],["2 Kings 20:3","I beseech thee, O LORD, remember now how I have walked before thee in truth and with a perfect heart, and have done that which is good in thy sight. And Hezekiah wept sore."],["2 Kings 20:4","And it came to pass, afore Isaiah was gone out into the middle court, that the word of the LORD came to him, saying,"],["2 Kings 20:5","Turn again, and tell Hezekiah the captain of my people, Thus saith the LORD, the God of David thy father, I have heard thy prayer, I have seen thy tears: behold, I will heal thee: on the third day thou shalt go up unto the house of the LORD."],["2 Kings 20:6","And I will add unto thy days fifteen years; and I will deliver thee and this city out of the hand of the king of Assyria; and I will defend this city for mine own sake, and for my servant David’s sake."],["2 Kings 20:7","And Isaiah said, Take a lump of figs. And they took and laid it on the boil, and he recovered."],["2 Kings 20:8","And Hezekiah said unto Isaiah, What shall be the sign that the LORD will heal me, and that I shall go up into the house of the LORD the third day?"],["2 Kings 20:9","And Isaiah said, This sign shalt thou have of the LORD, that the LORD will do the thing that he hath spoken: shall the shadow go forward ten degrees, or go back ten degrees?"],["2 Kings 20:10","And Hezekiah answered, It is a light thing for the shadow to go down ten degrees: nay, but let the shadow return backward ten degrees."],["2 Kings 20:11","And Isaiah the prophet cried unto the LORD: and he brought the shadow ten degrees backward, by which it had gone down in the dial of Ahaz."]]},{"ref":"2 Kings 20:14–19","verses":[["2 Kings 20:14","Then came Isaiah the prophet unto king Hezekiah, and said unto him, What said these men? and from whence came they unto thee? And Hezekiah said, They are come from a far country, even from Babylon."],["2 Kings 20:15","And he said, What have they seen in thine house? And Hezekiah answered, All the things that are in mine house have they seen: there is nothing among my treasures that I have not shewed them."],["2 Kings 20:16","And Isaiah said unto Hezekiah, Hear the word of the LORD."],["2 Kings 20:17","Behold, the days come, that all that is in thine house, and that which thy fathers have laid up in store unto this day, shall be carried into Babylon: nothing shall be left, saith the LORD."],["2 Kings 20:18","And of thy sons that shall issue from thee, which thou shalt beget, shall they take away; and they shall be eunuchs in the palace of the king of Babylon."],["2 Kings 20:19","Then said Hezekiah unto Isaiah, Good is the word of the LORD which thou hast spoken. And he said, Is it not good, if peace and truth be in my days?"]]}]},{"a":"hezekiah_1512","b":"rabshakeh_2384","type":"enemies","why":"Rabshakeh came with a great host against Hezekiah at Jerusalem, mocked his trust in the LORD, and told the people not to let Hezekiah deceive them.","refs":[{"ref":"2 Kings 18:17–19","verses":[["2 Kings 18:17","And the king of Assyria sent Tartan and Rabsaris and Rabshakeh from Lachish to king Hezekiah with a great host against Jerusalem. And they went up and came to Jerusalem. And when they were come up, they came and stood by the conduit of the upper pool, which is in the highway of the fuller’s field."],["2 Kings 18:18","And when they had called to the king, there came out to them Eliakim the son of Hilkiah, which was over the household, and Shebna the scribe, and Joah the son of Asaph the recorder."],["2 Kings 18:19","And Rabshakeh said unto them, Speak ye now to Hezekiah, Thus saith the great king, the king of Assyria, What confidence is this wherein thou trustest?"]]},{"ref":"2 Kings 18:28–32","verses":[["2 Kings 18:28","Then Rabshakeh stood and cried with a loud voice in the Jews’ language, and spake, saying, Hear the word of the great king, the king of Assyria:"],["2 Kings 18:29","Thus saith the king, Let not Hezekiah deceive you: for he shall not be able to deliver you out of his hand:"],["2 Kings 18:30","Neither let Hezekiah make you trust in the LORD, saying, The LORD will surely deliver us, and this city shall not be delivered into the hand of the king of Assyria."],["2 Kings 18:31","Hearken not to Hezekiah: for thus saith the king of Assyria, Make an agreement with me by a present, and come out to me, and then eat ye every man of his own vine, and every one of his fig tree, and drink ye every one the waters of his cistern:"],["2 Kings 18:32","Until I come and take you away to a land like your own land, a land of corn and wine, a land of bread and vineyards, a land of oil olive and of honey, that ye may live, and not die: and hearken not unto Hezekiah, when he persuadeth you, saying, The LORD will deliver us."]]},{"ref":"2 Kings 19:4","verses":[["2 Kings 19:4","It may be the LORD thy God will hear all the words of Rabshakeh, whom the king of Assyria his master hath sent to reproach the living God; and will reprove the words which the LORD thy God hath heard: wherefore lift up thy prayer for the remnant that are left."]]}]},{"a":"hezekiah_1512","b":"manasseh_1930","type":"family","why":"Manasseh was Hezekiah's son and reigned in his stead, and built again the high places Hezekiah had destroyed.","refs":[{"ref":"2 Kings 20:21","verses":[["2 Kings 20:21","And Hezekiah slept with his fathers: and Manasseh his son reigned in his stead."]]},{"ref":"2 Kings 21:3","verses":[["2 Kings 21:3","For he built up again the high places which Hezekiah his father had destroyed; and he reared up altars for Baal, and made a grove, as did Ahab king of Israel; and worshipped all the host of heaven, and served them."]]}]},{"a":"hilkiah_1524","b":"josiah_1730","type":"served","why":"Hilkiah the high priest carried out King Josiah's commands: he found the book of the law, went to inquire of the LORD for the king, and brought the vessels of Baal out of the temple at the king's command.","refs":[{"ref":"2 Kings 22:3–8","verses":[["2 Kings 22:3","And it came to pass in the eighteenth year of king Josiah, that the king sent Shaphan the son of Azaliah, the son of Meshullam, the scribe, to the house of the LORD, saying,"],["2 Kings 22:4","Go up to Hilkiah the high priest, that he may sum the silver which is brought into the house of the LORD, which the keepers of the door have gathered of the people:"],["2 Kings 22:5","And let them deliver it into the hand of the doers of the work, that have the oversight of the house of the LORD: and let them give it to the doers of the work which is in the house of the LORD, to repair the breaches of the house,"],["2 Kings 22:6","Unto carpenters, and builders, and masons, and to buy timber and hewn stone to repair the house."],["2 Kings 22:7","Howbeit there was no reckoning made with them of the money that was delivered into their hand, because they dealt faithfully."],["2 Kings 22:8","And Hilkiah the high priest said unto Shaphan the scribe, I have found the book of the law in the house of the LORD. And Hilkiah gave the book to Shaphan, and he read it."]]},{"ref":"2 Kings 22:12–14","verses":[["2 Kings 22:12","And the king commanded Hilkiah the priest, and Ahikam the son of Shaphan, and Achbor the son of Michaiah, and Shaphan the scribe, and Asahiah a servant of the king’s, saying,"],["2 Kings 22:13","Go ye, enquire of the LORD for me, and for the people, and for all Judah, concerning the words of this book that is found: for great is the wrath of the LORD that is kindled against us, because our fathers have not hearkened unto the words of this book, to do according unto all that which is written concerning us."],["2 Kings 22:14","So Hilkiah the priest, and Ahikam, and Achbor, and Shaphan, and Asahiah, went unto Huldah the prophetess, the wife of Shallum the son of Tikvah, the son of Harhas, keeper of the wardrobe; (now she dwelt in Jerusalem in the college;) and they communed with her."]]},{"ref":"2 Kings 23:4","verses":[["2 Kings 23:4","And the king commanded Hilkiah the high priest, and the priests of the second order, and the keepers of the door, to bring forth out of the temple of the LORD all the vessels that were made for Baal, and for the grove, and for all the host of heaven: and he burned them without Jerusalem in the fields of Kidron, and carried the ashes of them unto Bethel."]]}]},{"a":"hiram_1532","b":"solomon_2762","type":"worked_together","why":"Hiram and Solomon made a league together; Solomon's builders and Hiram's builders hewed the stones and timber for the house, and Hiram's shipmen went with Solomon's servants to Ophir.","refs":[{"ref":"1 Kings 5:1–12","verses":[["1 Kings 5:1","And Hiram king of Tyre sent his servants unto Solomon; for he had heard that they had anointed him king in the room of his father: for Hiram was ever a lover of David."],["1 Kings 5:2","And Solomon sent to Hiram, saying,"],["1 Kings 5:3","Thou knowest how that David my father could not build an house unto the name of the LORD his God for the wars which were about him on every side, until the LORD put them under the soles of his feet."],["1 Kings 5:4","But now the LORD my God hath given me rest on every side, so that there is neither adversary nor evil occurrent."],["1 Kings 5:5","And, behold, I purpose to build an house unto the name of the LORD my God, as the LORD spake unto David my father, saying, Thy son, whom I will set upon thy throne in thy room, he shall build an house unto my name."],["1 Kings 5:6","Now therefore command thou that they hew me cedar trees out of Lebanon; and my servants shall be with thy servants: and unto thee will I give hire for thy servants according to all that thou shalt appoint: for thou knowest that there is not among us any that can skill to hew timber like unto the Sidonians."],["1 Kings 5:7","And it came to pass, when Hiram heard the words of Solomon, that he rejoiced greatly, and said, Blessed be the LORD this day, which hath given unto David a wise son over this great people."],["1 Kings 5:8","And Hiram sent to Solomon, saying, I have considered the things which thou sentest to me for: and I will do all thy desire concerning timber of cedar, and concerning timber of fir."],["1 Kings 5:9","My servants shall bring them down from Lebanon unto the sea: and I will convey them by sea in floats unto the place that thou shalt appoint me, and will cause them to be discharged there, and thou shalt receive them: and thou shalt accomplish my desire, in giving food for my household."],["1 Kings 5:10","So Hiram gave Solomon cedar trees and fir trees according to all his desire."],["1 Kings 5:11","And Solomon gave Hiram twenty thousand measures of wheat for food to his household, and twenty measures of pure oil: thus gave Solomon to Hiram year by year."],["1 Kings 5:12","And the LORD gave Solomon wisdom, as he promised him: and there was peace between Hiram and Solomon; and they two made a league together."]]},{"ref":"1 Kings 5:18","verses":[["1 Kings 5:18","And Solomon’s builders and Hiram’s builders did hew them, and the stonesquarers: so they prepared timber and stones to build the house."]]},{"ref":"1 Kings 9:26–28","verses":[["1 Kings 9:26","And king Solomon made a navy of ships in Eziongeber, which is beside Eloth, on the shore of the Red sea, in the land of Edom."],["1 Kings 9:27","And Hiram sent in the navy his servants, shipmen that had knowledge of the sea, with the servants of Solomon."],["1 Kings 9:28","And they came to Ophir, and fetched from thence gold, four hundred and twenty talents, and brought it to king Solomon."]]}]},{"a":"hoshea_1559","b":"pekah_2299","type":"enemies","why":"Hoshea the son of Elah made a conspiracy against Pekah, smote him, slew him, and reigned in his stead.","refs":[{"ref":"2 Kings 15:30","verses":[["2 Kings 15:30","And Hoshea the son of Elah made a conspiracy against Pekah the son of Remaliah, and smote him, and slew him, and reigned in his stead, in the twentieth year of Jotham the son of Uzziah."]]}]},{"a":"jehoiachin_791","b":"jehoiakim_1085","type":"family","why":"Jehoiachin was Jehoiakim's son and reigned in his stead.","refs":[{"ref":"2 Kings 24:6","verses":[["2 Kings 24:6","So Jehoiakim slept with his fathers: and Jehoiachin his son reigned in his stead."]]}]},{"a":"jehoiachin_791","b":"nebuchadnezzar_2167","type":"enemies","why":"Nebuchadnezzar came against Jerusalem and besieged it, and Jehoiachin went out to him, and Nebuchadnezzar took him and carried him away to Babylon.","refs":[{"ref":"2 Kings 24:10–15","verses":[["2 Kings 24:10","At that time the servants of Nebuchadnezzar king of Babylon came up against Jerusalem, and the city was besieged."],["2 Kings 24:11","And Nebuchadnezzar king of Babylon came against the city, and his servants did besiege it."],["2 Kings 24:12","And Jehoiachin the king of Judah went out to the king of Babylon, he, and his mother, and his servants, and his princes, and his officers: and the king of Babylon took him in the eighth year of his reign."],["2 Kings 24:13","And he carried out thence all the treasures of the house of the LORD, and the treasures of the king’s house, and cut in pieces all the vessels of gold which Solomon king of Israel had made in the temple of the LORD, as the LORD had said."],["2 Kings 24:14","And he carried away all Jerusalem, and all the princes, and all the mighty men of valour, even ten thousand captives, and all the craftsmen and smiths: none remained, save the poorest sort of the people of the land."],["2 Kings 24:15","And he carried away Jehoiachin to Babylon, and the king’s mother, and the king’s wives, and his officers, and the mighty of the land, those carried he into captivity from Jerusalem to Babylon."]]}]},{"a":"jehoiachin_791","b":"zedekiah_1950","type":"family","why":"The king of Babylon made Mattaniah, Jehoiachin's father's brother, king in his stead, and changed his name to Zedekiah.","refs":[{"ref":"2 Kings 24:17","verses":[["2 Kings 24:17","And the king of Babylon made Mattaniah his father’s brother king in his stead, and changed his name to Zedekiah."]]}]},{"a":"jehoiada_793","b":"joash_1632","type":"helped","why":"Jehoiada's wife hid Joash six years in the house of God; then Jehoiada set a guard about him, and Jehoiada and his sons made him king and anointed him.","refs":[{"ref":"2 Chronicles 22:11–12","verses":[["2 Chronicles 22:11","But Jehoshabeath, the daughter of the king, took Joash the son of Ahaziah, and stole him from among the king’s sons that were slain, and put him and his nurse in a bedchamber. So Jehoshabeath, the daughter of king Jehoram, the wife of Jehoiada the priest, (for she was the sister of Ahaziah,) hid him from Athaliah, so that she slew him not."],["2 Chronicles 22:12","And he was with them hid in the house of God six years: and Athaliah reigned over the land."]]},{"ref":"2 Kings 11:4–8","verses":[["2 Kings 11:4","And the seventh year Jehoiada sent and fetched the rulers over hundreds, with the captains and the guard, and brought them to him into the house of the LORD, and made a covenant with them, and took an oath of them in the house of the LORD, and shewed them the king’s son."],["2 Kings 11:5","And he commanded them, saying, This is the thing that ye shall do; A third part of you that enter in on the sabbath shall even be keepers of the watch of the king’s house;"],["2 Kings 11:6","And a third part shall be at the gate of Sur; and a third part at the gate behind the guard: so shall ye keep the watch of the house, that it be not broken down."],["2 Kings 11:7","And two parts of all you that go forth on the sabbath, even they shall keep the watch of the house of the LORD about the king."],["2 Kings 11:8","And ye shall compass the king round about, every man with his weapons in his hand: and he that cometh within the ranges, let him be slain: and be ye with the king as he goeth out and as he cometh in."]]},{"ref":"2 Chronicles 23:11","verses":[["2 Chronicles 23:11","Then they brought out the king’s son, and put upon him the crown, and gave him the testimony, and made him king. And Jehoiada and his sons anointed him, and said, God save the king."]]}]},{"a":"jehoiada_793","b":"joash_1632","type":"counseled","why":"Joash did that which was right in the sight of the LORD all his days wherein Jehoiada the priest instructed him.","refs":[{"ref":"2 Kings 12:2","verses":[["2 Kings 12:2","And Jehoash did that which was right in the sight of the LORD all his days wherein Jehoiada the priest instructed him."]]},{"ref":"2 Chronicles 24:2","verses":[["2 Chronicles 24:2","And Joash did that which was right in the sight of the LORD all the days of Jehoiada the priest."]]}]},{"a":"jehoiakim_1085","b":"josiah_1730","type":"family","why":"Pharaoh-nechoh made Eliakim the son of Josiah king in the room of Josiah his father, and turned his name to Jehoiakim.","refs":[{"ref":"2 Kings 23:34","verses":[["2 Kings 23:34","And Pharaohnechoh made Eliakim the son of Josiah king in the room of Josiah his father, and turned his name to Jehoiakim, and took Jehoahaz away: and he came to Egypt, and died there."]]}]},{"a":"jehoiakim_1085","b":"nebuchadnezzar_2167","type":"served","why":"Jehoiakim became Nebuchadnezzar's servant three years.","refs":[{"ref":"2 Kings 24:1","verses":[["2 Kings 24:1","In his days Nebuchadnezzar king of Babylon came up, and Jehoiakim became his servant three years: then he turned and rebelled against him."]]}]},{"a":"jehoiakim_1085","b":"nebuchadnezzar_2167","type":"enemies","why":"Jehoiakim turned and rebelled against Nebuchadnezzar, who came up against him and bound him in fetters to carry him to Babylon.","refs":[{"ref":"2 Kings 24:1","verses":[["2 Kings 24:1","In his days Nebuchadnezzar king of Babylon came up, and Jehoiakim became his servant three years: then he turned and rebelled against him."]]},{"ref":"2 Chronicles 36:6","verses":[["2 Chronicles 36:6","Against him came up Nebuchadnezzar king of Babylon, and bound him in fetters, to carry him to Babylon."]]}]},{"a":"jehoram_803","b":"jehoshaphat_808","type":"family","why":"Jehoram was Jehoshaphat's son, and Jehoshaphat gave the kingdom to him because he was the firstborn.","refs":[{"ref":"1 Kings 22:50","verses":[["1 Kings 22:50","And Jehoshaphat slept with his fathers, and was buried with his fathers in the city of David his father: and Jehoram his son reigned in his stead."]]},{"ref":"2 Chronicles 21:1–3","verses":[["2 Chronicles 21:1","Now Jehoshaphat slept with his fathers, and was buried with his fathers in the city of David. And Jehoram his son reigned in his stead."],["2 Chronicles 21:2","And he had brethren the sons of Jehoshaphat, Azariah, and Jehiel, and Zechariah, and Azariah, and Michael, and Shephatiah: all these were the sons of Jehoshaphat king of Israel."],["2 Chronicles 21:3","And their father gave them great gifts of silver, and of gold, and of precious things, with fenced cities in Judah: but the kingdom gave he to Jehoram; because he was the firstborn."]]}]},{"a":"ahab_113","b":"jehoram_803","type":"family","why":"Jehoram walked in the way of the kings of Israel, as did the house of Ahab, for the daughter of Ahab was his wife.","refs":[{"ref":"2 Kings 8:18","verses":[["2 Kings 8:18","And he walked in the way of the kings of Israel, as did the house of Ahab: for the daughter of Ahab was his wife: and he did evil in the sight of the LORD."]]}]},{"a":"jehoshaphat_808","b":"micaiah_2054","type":"crossed_paths","why":"Jehoshaphat asked for a prophet of the LORD, Micaiah was sent for to the two kings as they sat at the gate of Samaria and prophesied there, and Jehoshaphat went to battle despite his word.","refs":[{"ref":"1 Kings 22:7–10","verses":[["1 Kings 22:7","And Jehoshaphat said, Is there not here a prophet of the LORD besides, that we might enquire of him?"],["1 Kings 22:8","And the king of Israel said unto Jehoshaphat, There is yet one man, Micaiah the son of Imlah, by whom we may enquire of the LORD: but I hate him; for he doth not prophesy good concerning me, but evil. And Jehoshaphat said, Let not the king say so."],["1 Kings 22:9","Then the king of Israel called an officer, and said, Hasten hither Micaiah the son of Imlah."],["1 Kings 22:10","And the king of Israel and Jehoshaphat the king of Judah sat each on his throne, having put on their robes, in a void place in the entrance of the gate of Samaria; and all the prophets prophesied before them."]]},{"ref":"1 Kings 22:15–17","verses":[["1 Kings 22:15","So he came to the king. And the king said unto him, Micaiah, shall we go against Ramothgilead to battle, or shall we forbear? And he answered him, Go, and prosper: for the LORD shall deliver it into the hand of the king."],["1 Kings 22:16","And the king said unto him, How many times shall I adjure thee that thou tell me nothing but that which is true in the name of the LORD?"],["1 Kings 22:17","And he said, I saw all Israel scattered upon the hills, as sheep that have not a shepherd: and the LORD said, These have no master: let them return every man to his house in peace."]]},{"ref":"1 Kings 22:29","verses":[["1 Kings 22:29","So the king of Israel and Jehoshaphat the king of Judah went up to Ramothgilead."]]}]},{"a":"jehoshaphat_808","b":"joram_804","type":"helped","why":"Joram asked Jehoshaphat, Wilt thou go with me against Moab to battle? and Jehoshaphat said, I will go up: I am as thou art.","refs":[{"ref":"2 Kings 3:6–9","verses":[["2 Kings 3:6","And king Jehoram went out of Samaria the same time, and numbered all Israel."],["2 Kings 3:7","And he went and sent to Jehoshaphat the king of Judah, saying, The king of Moab hath rebelled against me: wilt thou go with me against Moab to battle? And he said, I will go up: I am as thou art, my people as thy people, and my horses as thy horses."],["2 Kings 3:8","And he said, Which way shall we go up? And he answered, The way through the wilderness of Edom."],["2 Kings 3:9","So the king of Israel went, and the king of Judah, and the king of Edom: and they fetched a compass of seven days’ journey: and there was no water for the host, and for the cattle that followed them."]]}]},{"a":"jehu_817","b":"joram_804","type":"enemies","why":"Jehu conspired against Joram and drew a bow with his full strength and smote Joram between his arms, and had him cast into the field of Naboth.","refs":[{"ref":"2 Kings 9:14","verses":[["2 Kings 9:14","So Jehu the son of Jehoshaphat the son of Nimshi conspired against Joram. (Now Joram had kept Ramothgilead, he and all Israel, because of Hazael king of Syria."]]},{"ref":"2 Kings 9:21–26","verses":[["2 Kings 9:21","And Joram said, Make ready. And his chariot was made ready. And Joram king of Israel and Ahaziah king of Judah went out, each in his chariot, and they went out against Jehu, and met him in the portion of Naboth the Jezreelite."],["2 Kings 9:22","And it came to pass, when Joram saw Jehu, that he said, Is it peace, Jehu? And he answered, What peace, so long as the whoredoms of thy mother Jezebel and her witchcrafts are so many?"],["2 Kings 9:23","And Joram turned his hands, and fled, and said to Ahaziah, There is treachery, O Ahaziah."],["2 Kings 9:24","And Jehu drew a bow with his full strength, and smote Jehoram between his arms, and the arrow went out at his heart, and he sunk down in his chariot."],["2 Kings 9:25","Then said Jehu to Bidkar his captain, Take up, and cast him in the portion of the field of Naboth the Jezreelite: for remember how that, when I and thou rode together after Ahab his father, the LORD laid this burden upon him;"],["2 Kings 9:26","Surely I have seen yesterday the blood of Naboth, and the blood of his sons, saith the LORD; and I will requite thee in this plat, saith the LORD. Now therefore take and cast him into the plat of ground, according to the word of the LORD."]]}]},{"a":"jehu_817","b":"jezebel_1605","type":"enemies","why":"Jehu called to Jezebel's eunuchs, Throw her down, and they threw her down, and he trod her under foot.","refs":[{"ref":"2 Kings 9:30–37","verses":[["2 Kings 9:30","And when Jehu was come to Jezreel, Jezebel heard of it; and she painted her face, and tired her head, and looked out at a window."],["2 Kings 9:31","And as Jehu entered in at the gate, she said, Had Zimri peace, who slew his master?"],["2 Kings 9:32","And he lifted up his face to the window, and said, Who is on my side? who? And there looked out to him two or three eunuchs."],["2 Kings 9:33","And he said, Throw her down. So they threw her down: and some of her blood was sprinkled on the wall, and on the horses: and he trode her under foot."],["2 Kings 9:34","And when he was come in, he did eat and drink, and said, Go, see now this cursed woman, and bury her: for she is a king’s daughter."],["2 Kings 9:35","And they went to bury her: but they found no more of her than the skull, and the feet, and the palms of her hands."],["2 Kings 9:36","Wherefore they came again, and told him. And he said, This is the word of the LORD, which he spake by his servant Elijah the Tishbite, saying, In the portion of Jezreel shall dogs eat the flesh of Jezebel:"],["2 Kings 9:37","And the carcase of Jezebel shall be as dung upon the face of the field in the portion of Jezreel; so that they shall not say, This is Jezebel."]]}]},{"a":"ahab_113","b":"jehu_817","type":"served","why":"Jehu was among the men who rode after Ahab, and the LORD told Jehu to smite the house of Ahab his master.","refs":[{"ref":"2 Kings 9:7","verses":[["2 Kings 9:7","And thou shalt smite the house of Ahab thy master, that I may avenge the blood of my servants the prophets, and the blood of all the servants of the LORD, at the hand of Jezebel."]]},{"ref":"2 Kings 9:25","verses":[["2 Kings 9:25","Then said Jehu to Bidkar his captain, Take up, and cast him in the portion of the field of Naboth the Jezreelite: for remember how that, when I and thou rode together after Ahab his father, the LORD laid this burden upon him;"]]}]},{"a":"jeroboam_872","b":"solomon_2762","type":"served","why":"Jeroboam was Solomon's servant, and Solomon made him ruler over all the charge of the house of Joseph.","refs":[{"ref":"1 Kings 11:26","verses":[["1 Kings 11:26","And Jeroboam the son of Nebat, an Ephrathite of Zereda, Solomon’s servant, whose mother’s name was Zeruah, a widow woman, even he lifted up his hand against the king."]]},{"ref":"1 Kings 11:28","verses":[["1 Kings 11:28","And the man Jeroboam was a mighty man of valour: and Solomon seeing the young man that he was industrious, he made him ruler over all the charge of the house of Joseph."]]}]},{"a":"jeroboam_872","b":"solomon_2762","type":"enemies","why":"Jeroboam lifted up his hand against the king, and Solomon sought to kill him, and he fled into Egypt until Solomon died.","refs":[{"ref":"1 Kings 11:26–27","verses":[["1 Kings 11:26","And Jeroboam the son of Nebat, an Ephrathite of Zereda, Solomon’s servant, whose mother’s name was Zeruah, a widow woman, even he lifted up his hand against the king."],["1 Kings 11:27","And this was the cause that he lifted up his hand against the king: Solomon built Millo, and repaired the breaches of the city of David his father."]]},{"ref":"1 Kings 11:40","verses":[["1 Kings 11:40","Solomon sought therefore to kill Jeroboam. And Jeroboam arose, and fled into Egypt, unto Shishak king of Egypt, and was in Egypt until the death of Solomon."]]}]},{"a":"jeroboam_872","b":"rehoboam_2412","type":"enemies","why":"When Rehoboam refused to lighten the yoke, Israel rebelled and made Jeroboam king, and there was war between Rehoboam and Jeroboam all their days.","refs":[{"ref":"1 Kings 12:3–20","verses":[["1 Kings 12:3","That they sent and called him. And Jeroboam and all the congregation of Israel came, and spake unto Rehoboam, saying,"],["1 Kings 12:4","Thy father made our yoke grievous: now therefore make thou the grievous service of thy father, and his heavy yoke which he put upon us, lighter, and we will serve thee."],["1 Kings 12:5","And he said unto them, Depart yet for three days, then come again to me. And the people departed."],["1 Kings 12:6","And king Rehoboam consulted with the old men, that stood before Solomon his father while he yet lived, and said, How do ye advise that I may answer this people?"],["1 Kings 12:7","And they spake unto him, saying, If thou wilt be a servant unto this people this day, and wilt serve them, and answer them, and speak good words to them, then they will be thy servants for ever."],["1 Kings 12:8","But he forsook the counsel of the old men, which they had given him, and consulted with the young men that were grown up with him, and which stood before him:"],["1 Kings 12:9","And he said unto them, What counsel give ye that we may answer this people, who have spoken to me, saying, Make the yoke which thy father did put upon us lighter?"],["1 Kings 12:10","And the young men that were grown up with him spake unto him, saying, Thus shalt thou speak unto this people that spake unto thee, saying, Thy father made our yoke heavy, but make thou it lighter unto us; thus shalt thou say unto them, My little finger shall be thicker than my father’s loins."],["1 Kings 12:11","And now whereas my father did lade you with a heavy yoke, I will add to your yoke: my father hath chastised you with whips, but I will chastise you with scorpions."],["1 Kings 12:12","So Jeroboam and all the people came to Rehoboam the third day, as the king had appointed, saying, Come to me again the third day."],["1 Kings 12:13","And the king answered the people roughly, and forsook the old men’s counsel that they gave him;"],["1 Kings 12:14","And spake to them after the counsel of the young men, saying, My father made your yoke heavy, and I will add to your yoke: my father also chastised you with whips, but I will chastise you with scorpions."],["1 Kings 12:15","Wherefore the king hearkened not unto the people; for the cause was from the LORD, that he might perform his saying, which the LORD spake by Ahijah the Shilonite unto Jeroboam the son of Nebat."],["1 Kings 12:16","So when all Israel saw that the king hearkened not unto them, the people answered the king, saying, What portion have we in David? neither have we inheritance in the son of Jesse: to your tents, O Israel: now see to thine own house, David. So Israel departed unto their tents."],["1 Kings 12:17","But as for the children of Israel which dwelt in the cities of Judah, Rehoboam reigned over them."],["1 Kings 12:18","Then king Rehoboam sent Adoram, who was over the tribute; and all Israel stoned him with stones, that he died. Therefore king Rehoboam made speed to get him up to his chariot, to flee to Jerusalem."],["1 Kings 12:19","So Israel rebelled against the house of David unto this day."],["1 Kings 12:20","And it came to pass, when all Israel heard that Jeroboam was come again, that they sent and called him unto the congregation, and made him king over all Israel: there was none that followed the house of David, but the tribe of Judah only."]]},{"ref":"1 Kings 14:30","verses":[["1 Kings 14:30","And there was war between Rehoboam and Jeroboam all their days."]]}]},{"a":"jeroboam_873","b":"joash_1633","type":"family","why":"Jeroboam his son reigned in Joash's stead.","refs":[{"ref":"2 Kings 14:16","verses":[["2 Kings 14:16","And Jehoash slept with his fathers, and was buried in Samaria with the kings of Israel; and Jeroboam his son reigned in his stead."]]},{"ref":"2 Kings 14:23","verses":[["2 Kings 14:23","In the fifteenth year of Amaziah the son of Joash king of Judah Jeroboam the son of Joash king of Israel began to reign in Samaria, and reigned forty and one years."]]}]},{"a":"jonah_1689","b":"jeroboam_873","type":"prophecy","why":"Jeroboam restored the coast of Israel from the entering of Hamath unto the sea of the plain, according to the word of the LORD, which he spake by the hand of his servant Jonah.","refs":[{"ref":"2 Kings 14:25","verses":[["2 Kings 14:25","He restored the coast of Israel from the entering of Hamath unto the sea of the plain, according to the word of the LORD God of Israel, which he spake by the hand of his servant Jonah, the son of Amittai, the prophet, which was of Gathhepher."]]}],"fulfilled":[{"ref":"2 Kings 14:25","verses":[["2 Kings 14:25","He restored the coast of Israel from the entering of Hamath unto the sea of the plain, according to the word of the LORD God of Israel, which he spake by the hand of his servant Jonah, the son of Amittai, the prophet, which was of Gathhepher."]]}]},{"a":"jezebel_1605","b":"naboth_2127","type":"enemies","why":"Jezebel wrote letters in Ahab's name to have false witnesses accuse Naboth, and he was stoned so Ahab could take his vineyard.","refs":[{"ref":"1 Kings 21:7–15","verses":[["1 Kings 21:7","And Jezebel his wife said unto him, Dost thou now govern the kingdom of Israel? arise, and eat bread, and let thine heart be merry: I will give thee the vineyard of Naboth the Jezreelite."],["1 Kings 21:8","So she wrote letters in Ahab’s name, and sealed them with his seal, and sent the letters unto the elders and to the nobles that were in his city, dwelling with Naboth."],["1 Kings 21:9","And she wrote in the letters, saying, Proclaim a fast, and set Naboth on high among the people:"],["1 Kings 21:10","And set two men, sons of Belial, before hi
