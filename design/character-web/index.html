7","type":"worked_together","why":"The LORD named Eleazar the priest and Joshua to divide the land, and they distributed the inheritances by lot together.","refs":[{"ref":"Numbers 34:17","verses":[["Numbers 34:17","These are the names of the men which shall divide the land unto you: Eleazar the priest, and Joshua the son of Nun."]]},{"ref":"Joshua 14:1","verses":[["Joshua 14:1","And these are the countries which the children of Israel inherited in the land of Canaan, which Eleazar the priest, and Joshua the son of Nun, and the heads of the fathers of the tribes of the children of Israel, distributed for inheritance to them."]]},{"ref":"Joshua 19:51","verses":[["Joshua 19:51","These are the inheritances, which Eleazar the priest, and Joshua the son of Nun, and the heads of the fathers of the tribes of the children of Israel, divided for an inheritance by lot in Shiloh before the LORD, at the door of the tabernacle of the congregation. So they made an end of dividing the country."]]}]},{"a":"eli_1072","b":"samuel_2469","type":"served","why":"The child Samuel ministered unto the LORD before Eli the priest, ran to Eli when he was called, and Eli taught him to answer the LORD.","refs":[{"ref":"1 Samuel 2:11","verses":[["1 Samuel 2:11","And Elkanah went to Ramah to his house. And the child did minister unto the LORD before Eli the priest."]]},{"ref":"1 Samuel 3:1–10","verses":[["1 Samuel 3:1","And the child Samuel ministered unto the LORD before Eli. And the word of the LORD was precious in those days; there was no open vision."],["1 Samuel 3:2","And it came to pass at that time, when Eli was laid down in his place, and his eyes began to wax dim, that he could not see;"],["1 Samuel 3:3","And ere the lamp of God went out in the temple of the LORD, where the ark of God was, and Samuel was laid down to sleep;"],["1 Samuel 3:4","That the LORD called Samuel: and he answered, Here am I."],["1 Samuel 3:5","And he ran unto Eli, and said, Here am I; for thou calledst me. And he said, I called not; lie down again. And he went and lay down."],["1 Samuel 3:6","And the LORD called yet again, Samuel. And Samuel arose and went to Eli, and said, Here am I; for thou didst call me. And he answered, I called not, my son; lie down again."],["1 Samuel 3:7","Now Samuel did not yet know the LORD, neither was the word of the LORD yet revealed unto him."],["1 Samuel 3:8","And the LORD called Samuel again the third time. And he arose and went to Eli, and said, Here am I; for thou didst call me. And Eli perceived that the LORD had called the child."],["1 Samuel 3:9","Therefore Eli said unto Samuel, Go, lie down: and it shall be, if he call thee, that thou shalt say, Speak, LORD; for thy servant heareth. So Samuel went and lay down in his place."],["1 Samuel 3:10","And the LORD came, and stood, and called as at other times, Samuel, Samuel. Then Samuel answered, Speak; for thy servant heareth."]]},{"ref":"1 Samuel 3:15–18","verses":[["1 Samuel 3:15","And Samuel lay until the morning, and opened the doors of the house of the LORD. And Samuel feared to shew Eli the vision."],["1 Samuel 3:16","Then Eli called Samuel, and said, Samuel, my son. And he answered, Here am I."],["1 Samuel 3:17","And he said, What is the thing that the LORD hath said unto thee? I pray thee hide it not from me: God do so to thee, and more also, if thou hide any thing from me of all the things that he said unto thee."],["1 Samuel 3:18","And Samuel told him every whit, and hid nothing from him. And he said, It is the LORD: let him do what seemeth him good."]]}]},{"a":"eli_1072","b":"hannah_1400","type":"blessed","why":"Eli told Hannah the God of Israel would grant her petition, and later blessed Elkanah and her, and the LORD gave her Samuel and then five more children.","refs":[{"ref":"1 Samuel 1:12–20","verses":[["1 Samuel 1:12","And it came to pass, as she continued praying before the LORD, that Eli marked her mouth."],["1 Samuel 1:13","Now Hannah, she spake in her heart; only her lips moved, but her voice was not heard: therefore Eli thought she had been drunken."],["1 Samuel 1:14","And Eli said unto her, How long wilt thou be drunken? put away thy wine from thee."],["1 Samuel 1:15","And Hannah answered and said, No, my lord, I am a woman of a sorrowful spirit: I have drunk neither wine nor strong drink, but have poured out my soul before the LORD."],["1 Samuel 1:16","Count not thine handmaid for a daughter of Belial: for out of the abundance of my complaint and grief have I spoken hitherto."],["1 Samuel 1:17","Then Eli answered and said, Go in peace: and the God of Israel grant thee thy petition that thou hast asked of him."],["1 Samuel 1:18","And she said, Let thine handmaid find grace in thy sight. So the woman went her way, and did eat, and her countenance was no more sad."],["1 Samuel 1:19","And they rose up in the morning early, and worshipped before the LORD, and returned, and came to their house to Ramah: and Elkanah knew Hannah his wife; and the LORD remembered her."],["1 Samuel 1:20","Wherefore it came to pass, when the time was come about after Hannah had conceived, that she bare a son, and called his name Samuel, saying, Because I have asked him of the LORD."]]},{"ref":"1 Samuel 2:20–21","verses":[["1 Samuel 2:20","And Eli blessed Elkanah and his wife, and said, The LORD give thee seed of this woman for the loan which is lent to the LORD. And they went unto their own home."],["1 Samuel 2:21","And the LORD visited Hannah, so that she conceived, and bare three sons and two daughters. And the child Samuel grew before the LORD."]]}]},{"a":"david_994","b":"gad_1263","type":"counseled","why":"The prophet Gad, David's seer, told David to depart into Judah, brought him the LORD's word after the census, and told him to build an altar on Araunah's threshing floor.","refs":[{"ref":"1 Samuel 22:5","verses":[["1 Samuel 22:5","And the prophet Gad said unto David, Abide not in the hold; depart, and get thee into the land of Judah. Then David departed, and came into the forest of Hareth."]]},{"ref":"2 Samuel 24:11–14","verses":[["2 Samuel 24:11","For when David was up in the morning, the word of the LORD came unto the prophet Gad, David’s seer, saying,"],["2 Samuel 24:12","Go and say unto David, Thus saith the LORD, I offer thee three things; choose thee one of them, that I may do it unto thee."],["2 Samuel 24:13","So Gad came to David, and told him, and said unto him, Shall seven years of famine come unto thee in thy land? or wilt thou flee three months before thine enemies, while they pursue thee? or that there be three days’ pestilence in thy land? now advise, and see what answer I shall return to him that sent me."],["2 Samuel 24:14","And David said unto Gad, I am in a great strait: let us fall now into the hand of the LORD; for his mercies are great: and let me not fall into the hand of man."]]},{"ref":"2 Samuel 24:18–19","verses":[["2 Samuel 24:18","And Gad came that day to David, and said unto him, Go up, rear an altar unto the LORD in the threshingfloor of Araunah the Jebusite."],["2 Samuel 24:19","And David, according to the saying of Gad, went up as the LORD commanded."]]}]},{"a":"gideon_1314","b":"jotham_1734","type":"family","why":"Jotham was the youngest son of Jerubbaal, and he spoke of how my father fought for you.","refs":[{"ref":"Judges 9:5","verses":[["Judges 9:5","And he went unto his father’s house at Ophrah, and slew his brethren the sons of Jerubbaal, being threescore and ten persons, upon one stone: notwithstanding yet Jotham the youngest son of Jerubbaal was left; for he hid himself."]]},{"ref":"Judges 9:16–17","verses":[["Judges 9:16","Now therefore, if ye have done truly and sincerely, in that ye have made Abimelech king, and if ye have dealt well with Jerubbaal and his house, and have done unto him according to the deserving of his hands;"],["Judges 9:17","(For my father fought for you, and adventured his life far, and delivered you out of the hand of Midian:"]]}]},{"a":"goliath_1327","b":"saul_2478","type":"enemies","why":"Goliath defied the armies of Israel, calling them servants to Saul, and Saul and all Israel were dismayed and greatly afraid.","refs":[{"ref":"1 Samuel 17:8–11","verses":[["1 Samuel 17:8","And he stood and cried unto the armies of Israel, and said unto them, Why are ye come out to set your battle in array? am not I a Philistine, and ye servants to Saul? choose you a man for you, and let him come down to me."],["1 Samuel 17:9","If he be able to fight with me, and to kill me, then will we be your servants: but if I prevail against him, and kill him, then shall ye be our servants, and serve us."],["1 Samuel 17:10","And the Philistine said, I defy the armies of Israel this day; give me a man, that we may fight together."],["1 Samuel 17:11","When Saul and all Israel heard those words of the Philistine, they were dismayed, and greatly afraid."]]}]},{"a":"hannah_1400","b":"samuel_2469","type":"family","why":"Hannah bore a son and called him Samuel, lent him to the LORD at Shiloh, and made him a little coat every year.","refs":[{"ref":"1 Samuel 1:20","verses":[["1 Samuel 1:20","Wherefore it came to pass, when the time was come about after Hannah had conceived, that she bare a son, and called his name Samuel, saying, Because I have asked him of the LORD."]]},{"ref":"1 Samuel 1:24–28","verses":[["1 Samuel 1:24","And when she had weaned him, she took him up with her, with three bullocks, and one ephah of flour, and a bottle of wine, and brought him unto the house of the LORD in Shiloh: and the child was young."],["1 Samuel 1:25","And they slew a bullock, and brought the child to Eli."],["1 Samuel 1:26","And she said, Oh my lord, as thy soul liveth, my lord, I am the woman that stood by thee here, praying unto the LORD."],["1 Samuel 1:27","For this child I prayed; and the LORD hath given me my petition which I asked of him:"],["1 Samuel 1:28","Therefore also I have lent him to the LORD; as long as he liveth he shall be lent to the LORD. And he worshipped the LORD there."]]},{"ref":"1 Samuel 2:19","verses":[["1 Samuel 2:19","Moreover his mother made him a little coat, and brought it to him from year to year, when she came up with her husband to offer the yearly sacrifice."]]}]},{"a":"hushai_1577","b":"zadok_2973","type":"worked_together","why":"David told Hushai to report all he heard to Zadok and Abiathar the priests, and Hushai told them Ahithophel's counsel so that it was sent to David.","refs":[{"ref":"2 Samuel 15:35–36","verses":[["2 Samuel 15:35","And hast thou not there with thee Zadok and Abiathar the priests? therefore it shall be, that what thing soever thou shalt hear out of the king’s house, thou shalt tell it to Zadok and Abiathar the priests."],["2 Samuel 15:36","Behold, they have there with them their two sons, Ahimaaz Zadok’s son, and Jonathan Abiathar’s son; and by them ye shall send unto me every thing that ye can hear."]]},{"ref":"2 Samuel 17:15–16","verses":[["2 Samuel 17:15","Then said Hushai unto Zadok and to Abiathar the priests, Thus and thus did Ahithophel counsel Absalom and the elders of Israel; and thus and thus have I counselled."],["2 Samuel 17:16","Now therefore send quickly, and tell David, saying, Lodge not this night in the plains of the wilderness, but speedily pass over; lest the king be swallowed up, and all the people that are with him."]]}]},{"a":"abiathar_20","b":"hushai_1577","type":"worked_together","why":"David told Hushai to report all he heard to Zadok and Abiathar the priests, and Hushai told them Ahithophel's counsel so that it was sent to David.","refs":[{"ref":"2 Samuel 15:35–36","verses":[["2 Samuel 15:35","And hast thou not there with thee Zadok and Abiathar the priests? therefore it shall be, that what thing soever thou shalt hear out of the king’s house, thou shalt tell it to Zadok and Abiathar the priests."],["2 Samuel 15:36","Behold, they have there with them their two sons, Ahimaaz Zadok’s son, and Jonathan Abiathar’s son; and by them ye shall send unto me every thing that ye can hear."]]},{"ref":"2 Samuel 17:15–16","verses":[["2 Samuel 17:15","Then said Hushai unto Zadok and to Abiathar the priests, Thus and thus did Ahithophel counsel Absalom and the elders of Israel; and thus and thus have I counselled."],["2 Samuel 17:16","Now therefore send quickly, and tell David, saying, Lodge not this night in the plains of the wilderness, but speedily pass over; lest the king be swallowed up, and all the people that are with him."]]}]},{"a":"david_994","b":"ish-bosheth_622","type":"rivals","why":"Ish-bosheth reigned over Israel while David reigned over Judah, and there was long war between the house of Saul and the house of David.","refs":[{"ref":"2 Samuel 2:8–11","verses":[["2 Samuel 2:8","But Abner the son of Ner, captain of Saul’s host, took Ishbosheth the son of Saul, and brought him over to Mahanaim;"],["2 Samuel 2:9","And made him king over Gilead, and over the Ashurites, and over Jezreel, and over Ephraim, and over Benjamin, and over all Israel."],["2 Samuel 2:10","Ishbosheth Saul’s son was forty years old when he began to reign over Israel, and reigned two years. But the house of Judah followed David."],["2 Samuel 2:11","And the time that David was king in Hebron over the house of Judah was seven years and six months."]]},{"ref":"2 Samuel 3:1","verses":[["2 Samuel 3:1","Now there was long war between the house of Saul and the house of David: but David waxed stronger and stronger, and the house of Saul waxed weaker and weaker."]]}]},{"a":"ish-bosheth_622","b":"michal_2073","type":"family","why":"Michal was Saul's daughter and Ish-bosheth was Saul's son, and Ish-bosheth sent and took her from Phaltiel when David demanded her.","refs":[{"ref":"2 Samuel 3:13–15","verses":[["2 Samuel 3:13","And he said, Well; I will make a league with thee: but one thing I require of thee, that is, Thou shalt not see my face, except thou first bring Michal Saul’s daughter, when thou comest to see my face."],["2 Samuel 3:14","And David sent messengers to Ishbosheth Saul’s son, saying, Deliver me my wife Michal, which I espoused to me for an hundred foreskins of the Philistines."],["2 Samuel 3:15","And Ishbosheth sent, and took her from her husband, even from Phaltiel the son of Laish."]]}]},{"a":"ish-bosheth_622","b":"saul_2478","type":"family","why":"Ish-bosheth was the son of Saul, made king over Israel after his father died.","refs":[{"ref":"2 Samuel 2:8–10","verses":[["2 Samuel 2:8","But Abner the son of Ner, captain of Saul’s host, took Ishbosheth the son of Saul, and brought him over to Mahanaim;"],["2 Samuel 2:9","And made him king over Gilead, and over the Ashurites, and over Jezreel, and over Ephraim, and over Benjamin, and over all Israel."],["2 Samuel 2:10","Ishbosheth Saul’s son was forty years old when he began to reign over Israel, and reigned two years. But the house of Judah followed David."]]}]},{"a":"jesse_903","b":"samuel_2469","type":"crossed_paths","why":"Samuel came to Jesse in Bethlehem, sanctified him and his sons, and had Jesse's sons pass before him until David was brought and anointed.","refs":[{"ref":"1 Samuel 16:1–13","verses":[["1 Samuel 16:1","And the LORD said unto Samuel, How long wilt thou mourn for Saul, seeing I have rejected him from reigning over Israel? fill thine horn with oil, and go, I will send thee to Jesse the Bethlehemite: for I have provided me a king among his sons."],["1 Samuel 16:2","And Samuel said, How can I go? if Saul hear it, he will kill me. And the LORD said, Take an heifer with thee, and say, I am come to sacrifice to the LORD."],["1 Samuel 16:3","And call Jesse to the sacrifice, and I will shew thee what thou shalt do: and thou shalt anoint unto me him whom I name unto thee."],["1 Samuel 16:4","And Samuel did that which the LORD spake, and came to Bethlehem. And the elders of the town trembled at his coming, and said, Comest thou peaceably?"],["1 Samuel 16:5","And he said, Peaceably: I am come to sacrifice unto the LORD: sanctify yourselves, and come with me to the sacrifice. And he sanctified Jesse and his sons, and called them to the sacrifice."],["1 Samuel 16:6","And it came to pass, when they were come, that he looked on Eliab, and said, Surely the LORD’S anointed is before him."],["1 Samuel 16:7","But the LORD said unto Samuel, Look not on his countenance, or on the height of his stature; because I have refused him: for the LORD seeth not as man seeth; for man looketh on the outward appearance, but the LORD looketh on the heart."],["1 Samuel 16:8","Then Jesse called Abinadab, and made him pass before Samuel. And he said, Neither hath the LORD chosen this."],["1 Samuel 16:9","Then Jesse made Shammah to pass by. And he said, Neither hath the LORD chosen this."],["1 Samuel 16:10","Again, Jesse made seven of his sons to pass before Samuel. And Samuel said unto Jesse, The LORD hath not chosen these."],["1 Samuel 16:11","And Samuel said unto Jesse, Are here all thy children? And he said, There remaineth yet the youngest, and, behold, he keepeth the sheep. And Samuel said unto Jesse, Send and fetch him: for we will not sit down till he come hither."],["1 Samuel 16:12","And he sent, and brought him in. Now he was ruddy, and withal of a beautiful countenance, and goodly to look to. And the LORD said, Arise, anoint him: for this is he."],["1 Samuel 16:13","Then Samuel took the horn of oil, and anointed him in the midst of his brethren: and the Spirit of the LORD came upon David from that day forward. So Samuel rose up, and went to Ramah."]]}]},{"a":"joab_1617","b":"uriah_2898","type":"served","why":"Uriah served in Joab's army and spoke of my lord Joab, and at David's order Joab assigned him to a place where he knew valiant men were, and Uriah died.","refs":[{"ref":"2 Samuel 11:11","verses":[["2 Samuel 11:11","And Uriah said unto David, The ark, and Israel, and Judah, abide in tents; and my lord Joab, and the servants of my lord, are encamped in the open fields; shall I then go into mine house, to eat and to drink, and to lie with my wife? as thou livest, and as thy soul liveth, I will not do this thing."]]},{"ref":"2 Samuel 11:14–17","verses":[["2 Samuel 11:14","And it came to pass in the morning, that David wrote a letter to Joab, and sent it by the hand of Uriah."],["2 Samuel 11:15","And he wrote in the letter, saying, Set ye Uriah in the forefront of the hottest battle, and retire ye from him, that he may be smitten, and die."],["2 Samuel 11:16","And it came to pass, when Joab observed the city, that he assigned Uriah unto a place where he knew that valiant men were."],["2 Samuel 11:17","And the men of the city went out, and fought with Joab: and there fell some of the people of the servants of David; and Uriah the Hittite died also."]]}]},{"a":"joab_1617","b":"sheba_2570","type":"enemies","why":"Joab pursued Sheba and besieged him in Abel, and the city cut off Sheba's head and cast it out to Joab.","refs":[{"ref":"2 Samuel 20:13–22","verses":[["2 Samuel 20:13","When he was removed out of the highway, all the people went on after Joab, to pursue after Sheba the son of Bichri."],["2 Samuel 20:14","And he went through all the tribes of Israel unto Abel, and to Bethmaachah, and all the Berites: and they were gathered together, and went also after him."],["2 Samuel 20:15","And they came and besieged him in Abel of Bethmaachah, and they cast up a bank against the city, and it stood in the trench: and all the people that were with Joab battered the wall, to throw it down."],["2 Samuel 20:16","Then cried a wise woman out of the city, Hear, hear; say, I pray you, unto Joab, Come near hither, that I may speak with thee."],["2 Samuel 20:17","And when he was come near unto her, the woman said, Art thou Joab? And he answered, I am he. Then she said unto him, Hear the words of thine handmaid. And he answered, I do hear."],["2 Samuel 20:18","Then she spake, saying, They were wont to speak in old time, saying, They shall surely ask counsel at Abel: and so they ended the matter."],["2 Samuel 20:19","I am one of them that are peaceable and faithful in Israel: thou seekest to destroy a city and a mother in Israel: why wilt thou swallow up the inheritance of the LORD?"],["2 Samuel 20:20","And Joab answered and said, Far be it, far be it from me, that I should swallow up or destroy."],["2 Samuel 20:21","The matter is not so: but a man of mount Ephraim, Sheba the son of Bichri by name, hath lifted up his hand against the king, even against David: deliver him only, and I will depart from the city. And the woman said unto Joab, Behold, his head shall be thrown to thee over the wall."],["2 Samuel 20:22","Then the woman went unto all the people in her wisdom. And they cut off the head of Sheba the son of Bichri, and cast it out to Joab. And he blew a trumpet, and they retired from the city, every man to his tent. And Joab returned to Jerusalem unto the king."]]}]},{"a":"jonathan_1692","b":"saul_2478","type":"family","why":"Jonathan was Saul's son; he stood up for David to his father, and Saul cast a javelin at him, and in their death they were not divided.","refs":[{"ref":"1 Samuel 14:49","verses":[["1 Samuel 14:49","Now the sons of Saul were Jonathan, and Ishui, and Melchishua: and the names of his two daughters were these; the name of the firstborn Merab, and the name of the younger Michal:"]]},{"ref":"1 Samuel 20:30–33","verses":[["1 Samuel 20:30","Then Saul’s anger was kindled against Jonathan, and he said unto him, Thou son of the perverse rebellious woman, do not I know that thou hast chosen the son of Jesse to thine own confusion, and unto the confusion of thy mother’s nakedness?"],["1 Samuel 20:31","For as long as the son of Jesse liveth upon the ground, thou shalt not be established, nor thy kingdom. Wherefore now send and fetch him unto me, for he shall surely die."],["1 Samuel 20:32","And Jonathan answered Saul his father, and said unto him, Wherefore shall he be slain? what hath he done?"],["1 Samuel 20:33","And Saul cast a javelin at him to smite him: whereby Jonathan knew that it was determined of his father to slay David."]]},{"ref":"2 Samuel 1:23","verses":[["2 Samuel 1:23","Saul and Jonathan were lovely and pleasant in their lives, and in their death they were not divided: they were swifter than eagles, they were stronger than lions."]]}]},{"a":"jonathan_1692","b":"mephibosheth_1999","type":"family","why":"Jonathan, Saul's son, had a son that was lame of his feet, named Mephibosheth.","refs":[{"ref":"2 Samuel 4:4","verses":[["2 Samuel 4:4","And Jonathan, Saul’s son, had a son that was lame of his feet. He was five years old when the tidings came of Saul and Jonathan out of Jezreel, and his nurse took him up, and fled: and it came to pass, as she made haste to flee, that he fell, and became lame. And his name was Mephibosheth."]]},{"ref":"2 Samuel 9:3–6","verses":[["2 Samuel 9:3","And the king said, Is there not yet any of the house of Saul, that I may shew the kindness of God unto him? And Ziba said unto the king, Jonathan hath yet a son, which is lame on his feet."],["2 Samuel 9:4","And the king said unto him, Where is he? And Ziba said unto the king, Behold, he is in the house of Machir, the son of Ammiel, in Lodebar."],["2 Samuel 9:5","Then king David sent, and fetched him out of the house of Machir, the son of Ammiel, from Lodebar."],["2 Samuel 9:6","Now when Mephibosheth, the son of Jonathan, the son of Saul, was come unto David, he fell on his face, and did reverence. And David said, Mephibosheth. And he answered, Behold thy servant!"]]}]},{"a":"joshua_1727","b":"rahab_2388","type":"helped","why":"Joshua saved Rahab and her father's household alive when Jericho fell, because she hid the messengers he sent to spy out the city.","refs":[{"ref":"Joshua 2:1","verses":[["Joshua 2:1","And Joshua the son of Nun sent out of Shittim two men to spy secretly, saying, Go view the land, even Jericho. And they went, and came into an harlot’s house, named Rahab, and lodged there."]]},{"ref":"Joshua 6:17","verses":[["Joshua 6:17","And the city shall be accursed, even it, and all that are therein, to the LORD: only Rahab the harlot shall live, she and all that are with her in the house, because she hid the messengers that we sent."]]},{"ref":"Joshua 6:22–25","verses":[["Joshua 6:22","But Joshua had said unto the two men that had spied out the country, Go into the harlot’s house, and bring out thence the woman, and all that she hath, as ye sware unto her."],["Joshua 6:23","And the young men that were spies went in, and brought out Rahab, and her father, and her mother, and her brethren, and all that she had; and they brought out all her kindred, and left them without the camp of Israel."],["Joshua 6:24","And they burnt the city with fire, and all that was therein: only the silver, and the gold, and the vessels of brass and of iron, they put into the treasury of the house of the LORD."],["Joshua 6:25","And Joshua saved Rahab the harlot alive, and her father’s household, and all that she had; and she dwelleth in Israel even unto this day; because she hid the messengers, which Joshua sent to spy out Jericho."]]}]},{"a":"manoah_1933","b":"samson_2468","type":"family","why":"Manoah's wife bore a son and called him Samson, and Samson was buried in the burying place of Manoah his father.","refs":[{"ref":"Judges 13:24","verses":[["Judges 13:24","And the woman bare a son, and called his name Samson: and the child grew, and the LORD blessed him."]]},{"ref":"Judges 14:2–4","verses":[["Judges 14:2","And he came up, and told his father and his mother, and said, I have seen a woman in Timnath of the daughters of the Philistines: now therefore get her for me to wife."],["Judges 14:3","Then his father and his mother said unto him, Is there never a woman among the daughters of thy brethren, or among all my people, that thou goest to take a wife of the uncircumcised Philistines? And Samson said unto his father, Get her for me; for she pleaseth me well."],["Judges 14:4","But his father and his mother knew not that it was of the LORD, that he sought an occasion against the Philistines: for at that time the Philistines had dominion over Israel."]]},{"ref":"Judges 16:31","verses":[["Judges 16:31","Then his brethren and all the house of his father came down, and took him, and brought him up, and buried him between Zorah and Eshtaol in the buryingplace of Manoah his father. And he judged Israel twenty years."]]}]},{"a":"michal_2073","b":"saul_2478","type":"family","why":"Michal was Saul's daughter; Saul gave her to David to be a snare to him, and later gave her to Phalti.","refs":[{"ref":"1 Samuel 18:20–21","verses":[["1 Samuel 18:20","And Michal Saul’s daughter loved David: and they told Saul, and the thing pleased him."],["1 Samuel 18:21","And Saul said, I will give him her, that she may be a snare to him, and that the hand of the Philistines may be against him. Wherefore Saul said to David, Thou shalt this day be my son in law in the one of the twain."]]},{"ref":"1 Samuel 19:17","verses":[["1 Samuel 19:17","And Saul said unto Michal, Why hast thou deceived me so, and sent away mine enemy, that he is escaped? And Michal answered Saul, He said unto me, Let me go; why should I kill thee?"]]},{"ref":"1 Samuel 25:44","verses":[["1 Samuel 25:44","But Saul had given Michal his daughter, David’s wife, to Phalti the son of Laish, which was of Gallim."]]}]},{"a":"naomi_2147","b":"ruth_2450","type":"family","why":"Ruth the Moabitess was Naomi's daughter in law, the wife of her son.","refs":[{"ref":"Ruth 1:4","verses":[["Ruth 1:4","And they took them wives of the women of Moab; the name of the one was Orpah, and the name of the other Ruth: and they dwelled there about ten years."]]},{"ref":"Ruth 1:22","verses":[["Ruth 1:22","So Naomi returned, and Ruth the Moabitess, her daughter in law, with her, which returned out of the country of Moab: and they came to Bethlehem in the beginning of barley harvest."]]}]},{"a":"naomi_2147","b":"ruth_2450","type":"loved","why":"Ruth clave unto Naomi and vowed, whither thou goest I will go, and the women said Ruth loved Naomi and was better to her than seven sons.","refs":[{"ref":"Ruth 1:14–17","verses":[["Ruth 1:14","And they lifted up their voice, and wept again: and Orpah kissed her mother in law; but Ruth clave unto her."],["Ruth 1:15","And she said, Behold, thy sister in law is gone back unto her people, and unto her gods: return thou after thy sister in law."],["Ruth 1:16","And Ruth said, Intreat me not to leave thee, or to return from following after thee: for whither thou goest, I will go; and where thou lodgest, I will lodge: thy people shall be my people, and thy God my God:"],["Ruth 1:17","Where thou diest, will I die, and there will I be buried: the LORD do so to me, and more also, if ought but death part thee and me."]]},{"ref":"Ruth 4:15","verses":[["Ruth 4:15","And he shall be unto thee a restorer of thy life, and a nourisher of thine old age: for thy daughter in law, which loveth thee, which is better to thee than seven sons, hath born him."]]}]},{"a":"samuel_2469","b":"saul_2478","type":"anointed","why":"Samuel poured a vial of oil on Saul's head and anointed him captain over the LORD's inheritance.","refs":[{"ref":"1 Samuel 10:1","verses":[["1 Samuel 10:1","Then Samuel took a vial of oil, and poured it upon his head, and kissed him, and said, Is it not because the LORD hath anointed thee to be captain over his inheritance?"]]}]},{"a":"samuel_2469","b":"saul_2478","type":"rebuked","why":"Samuel rebuked Saul for offering the burnt offering and for sparing Amalek, and told him the LORD had rejected him from being king.","refs":[{"ref":"1 Samuel 13:13–14","verses":[["1 Samuel 13:13","And Samuel said to Saul, Thou hast done foolishly: thou hast not kept the commandment of the LORD thy God, which he commanded thee: for now would the LORD have established thy kingdom upon Israel for ever."],["1 Samuel 13:14","But now thy kingdom shall not continue: the LORD hath sought him a man after his own heart, and the LORD hath commanded him to be captain over his people, because thou hast not kept that which the LORD commanded thee."]]},{"ref":"1 Samuel 15:22–28","verses":[["1 Samuel 15:22","And Samuel said, Hath the LORD as great delight in burnt offerings and sacrifices, as in obeying the voice of the LORD? Behold, to obey is better than sacrifice, and to hearken than the fat of rams."],["1 Samuel 15:23","For rebellion is as the sin of witchcraft, and stubbornness is as iniquity and idolatry. Because thou hast rejected the word of the LORD, he hath also rejected thee from being king."],["1 Samuel 15:24","And Saul said unto Samuel, I have sinned: for I have transgressed the commandment of the LORD, and thy words: because I feared the people, and obeyed their voice."],["1 Samuel 15:25","Now therefore, I pray thee, pardon my sin, and turn again with me, that I may worship the LORD."],["1 Samuel 15:26","And Samuel said unto Saul, I will not return with thee: for thou hast rejected the word of the LORD, and the LORD hath rejected thee from being king over Israel."],["1 Samuel 15:27","And as Samuel turned about to go away, he laid hold upon the skirt of his mantle, and it rent."],["1 Samuel 15:28","And Samuel said unto him, The LORD hath rent the kingdom of Israel from thee this day, and hath given it to a neighbour of thine, that is better than thou."]]}]},{"a":"david_994","b":"tamar_2822","type":"family","why":"Tamar was the sister of David's sons, the king's daughter, and David sent her to Amnon's house.","refs":[{"ref":"1 Chronicles 3:9","verses":[["1 Chronicles 3:9","These were all the sons of David, beside the sons of the concubines, and Tamar their sister."]]},{"ref":"2 Samuel 13:7","verses":[["2 Samuel 13:7","Then David sent home to Tamar, saying, Go now to thy brother Amnon’s house, and dress him meat."]]},{"ref":"2 Samuel 13:18","verses":[["2 Samuel 13:18","And she had a garment of divers colours upon her: for with such robes were the king’s daughters that were virgins apparelled. Then his servant brought her out, and bolted the door after her."]]}]},{"a":"eglon_1037","b":"ehud_1039","type":"enemies","why":"Eglon oppressed Israel, and Ehud brought him a present, then thrust a dagger into his belly and killed him.","refs":[{"ref":"Judges 3:12–14","verses":[["Judges 3:12","And the children of Israel did evil again in the sight of the LORD: and the LORD strengthened Eglon the king of Moab against Israel, because they had done evil in the sight of the LORD."],["Judges 3:13","And he gathered unto him the children of Ammon and Amalek, and went and smote Israel, and possessed the city of palm trees."],["Judges 3:14","So the children of Israel served Eglon the king of Moab eighteen years."]]},{"ref":"Judges 3:15–22","verses":[["Judges 3:15","But when the children of Israel cried unto the LORD, the LORD raised them up a deliverer, Ehud the son of Gera, a Benjamite, a man lefthanded: and by him the children of Israel sent a present unto Eglon the king of Moab."],["Judges 3:16","But Ehud made him a dagger which had two edges, of a cubit length; and he did gird it under his raiment upon his right thigh."],["Judges 3:17","And he brought the present unto Eglon king of Moab: and Eglon was a very fat man."],["Judges 3:18","And when he had made an end to offer the present, he sent away the people that bare the present."],["Judges 3:19","But he himself turned again from the quarries that were by Gilgal, and said, I have a secret errand unto thee, O king: who said, Keep silence. And all that stood by him went out from him."],["Judges 3:20","And Ehud came unto him; and he was sitting in a summer parlour, which he had for himself alone. And Ehud said, I have a message from God unto thee. And he arose out of his seat."],["Judges 3:21","And Ehud put forth his left hand, and took the dagger from his right thigh, and thrust it into his belly:"],["Judges 3:22","And the haft also went in after the blade; and the fat closed upon the blade, so that he could not draw the dagger out of his belly; and the dirt came out."]]}]},{"a":"jonathan_1691","b":"micah_2049","type":"served","why":"Micah consecrated the young Levite, who became his priest and dwelt in his house for wages, food and clothing.","refs":[{"ref":"Judges 17:9–13","verses":[["Judges 17:9","And Micah said unto him, Whence comest thou? And he said unto him, I am a Levite of Bethlehemjudah, and I go to sojourn where I may find a place."],["Judges 17:10","And Micah said unto him, Dwell with me, and be unto me a father and a priest, and I will give thee ten shekels of silver by the year, and a suit of apparel, and thy victuals. So the Levite went in."],["Judges 17:11","And the Levite was content to dwell with the man; and the young man was unto him as one of his sons."],["Judges 17:12","And Micah consecrated the Levite; and the young man became his priest, and was in the house of Micah."],["Judges 17:13","Then said Micah, Now know I that the LORD will do me good, seeing I have a Levite to my priest."]]}]},{"a":"jonathan_1691","b":"micah_2049","type":"betrayed","why":"When the Danites came, the priest's heart was glad and he took Micah's ephod, teraphim and graven image and went with them, and Micah cried, ye have taken away my gods which I made, and the priest.","refs":[{"ref":"Judges 18:18–20","verses":[["Judges 18:18","And these went into Micah’s house, and fetched the carved image, the ephod, and the teraphim, and the molten image. Then said the priest unto them, What do ye?"],["Judges 18:19","And they said unto him, Hold thy peace, lay thine hand upon thy mouth, and go with us, and be to us a father and a priest: is it better for thee to be a priest unto the house of one man, or that thou be a priest unto a tribe and a family in Israel?"],["Judges 18:20","And the priest’s heart was glad, and he took the ephod, and the teraphim, and the graven image, and went in the midst of the people."]]},{"ref":"Judges 18:22–24","verses":[["Judges 18:22","And when they were a good way from the house of Micah, the men that were in the houses near to Micah’s house were gathered together, and overtook the children of Dan."],["Judges 18:23","And they cried unto the children of Dan. And they turned their faces, and said unto Micah, What aileth thee, that thou comest with such a company?"],["Judges 18:24","And he said, Ye have taken away my gods which I made, and the priest, and ye are gone away: and what have I more? and what is this that ye say unto me, What aileth thee?"]]}]},{"a":"gilead_1318","b":"jephthah_839","type":"family","why":"Gilead begat Jephthah, the son of an harlot.","refs":[{"ref":"Judges 11:1–2","verses":[["Judges 11:1","Now Jephthah the Gileadite was a mighty man of valour, and he was the son of an harlot: and Gilead begat Jephthah."],["Judges 11:2","And Gilead’s wife bare him sons; and his wife’s sons grew up, and they thrust out Jephthah, and said unto him, Thou shalt not inherit in our father’s house; for thou art the son of a strange woman."]]}]},{"a":"jael_689","b":"sisera_2757","type":"enemies","why":"Jael took Sisera into her tent and, while he slept, smote the nail into his temples and killed him.","refs":[{"ref":"Judges 4:17–21","verses":[["Judges 4:17","Howbeit Sisera fled away on his feet to the tent of Jael the wife of Heber the Kenite: for there was peace between Jabin the king of Hazor and the house of Heber the Kenite."],["Judges 4:18","And Jael went out to meet Sisera, and said unto him, Turn in, my lord, turn in to me; fear not. And when he had turned in unto her into the tent, she covered him with a mantle."],["Judges 4:19","And he said unto her, Give me, I pray thee, a little water to drink; for I am thirsty. And she opened a bottle of milk, and gave him drink, and covered him."],["Judges 4:20","Again he said unto her, Stand in the door of the tent, and it shall be, when any man doth come and enquire of thee, and say, Is there any man here? that thou shalt say, No."],["Judges 4:21","Then Jael Heber’s wife took a nail of the tent, and took an hammer in her hand, and went softly unto him, and smote the nail into his temples, and fastened it into the ground: for he was fast asleep and weary. So he died."]]},{"ref":"Judges 5:24–27","verses":[["Judges 5:24","Blessed above women shall Jael the wife of Heber the Kenite be, blessed shall she be above women in the tent."],["Judges 5:25","He asked water, and she gave him milk; she brought forth butter in a lordly dish."],["Judges 5:26","She put her hand to the nail, and her right hand to the workmen’s hammer; and with the hammer she smote Sisera, she smote off his head, when she had pierced and stricken through his temples."],["Judges 5:27","At her feet he bowed, he fell, he lay down: at her feet he bowed, he fell: where he bowed, there he fell down dead."]]}]},{"a":"barak_401","b":"jael_689","type":"crossed_paths","why":"Jael went out to meet Barak as he pursued Sisera and showed him the man he sought, lying dead in her tent.","refs":[{"ref":"Judges 4:22","verses":[["Judges 4:22","And, behold, as Barak pursued Sisera, Jael came out to meet him, and said unto him, Come, and I will shew thee the man whom thou seekest. And when he came into her tent, behold, Sisera lay dead, and the nail was in his temples."]]}]},{"a":"deborah_997","b":"jael_689","type":"blessed","why":"In the song Deborah sang to the LORD, she blessed Jael above women for killing Sisera.","refs":[{"ref":"Judges 5:1–3","verses":[["Judges 5:1","Then sang Deborah and Barak the son of Abinoam on that day, saying,"],["Judges 5:2","Praise ye the LORD for the avenging of Israel, when the people willingly offered themselves."],["Judges 5:3","Hear, O ye kings; give ear, O ye princes; I, even I, will sing unto the LORD; I will sing praise to the LORD God of Israel."]]},{"ref":"Judges 5:24–27","verses":[["Judges 5:24","Blessed above women shall Jael the wife of Heber the Kenite be, blessed shall she be above women in the tent."],["Judges 5:25","He asked water, and she gave him milk; she brought forth butter in a lordly dish."],["Judges 5:26","She put her hand to the nail, and her right hand to the workmen’s hammer; and with the hammer she smote Sisera, she smote off his head, when she had pierced and stricken through his temples."],["Judges 5:27","At her feet he bowed, he fell, he lay down: at her feet he bowed, he fell: where he bowed, there he fell down dead."]]}]},{"a":"caleb_537","b":"othniel_2259","type":"family","why":"Othniel the son of Kenaz, Caleb's younger brother, took Kirjath-sepher, and Caleb gave him Achsah his daughter to wife.","refs":[{"ref":"Judges 1:12–13","verses":[["Judges 1:12","And Caleb said, He that smiteth Kirjathsepher, and taketh it, to him will I give Achsah my daughter to wife."],["Judges 1:13","And Othniel the son of Kenaz, Caleb’s younger brother, took it: and he gave him Achsah his daughter to wife."]]},{"ref":"Joshua 15:16–17","verses":[["Joshua 15:16","And Caleb said, He that smiteth Kirjathsepher, and taketh it, to him will I give Achsah my daughter to wife."],["Joshua 15:17","And Othniel the son of Kenaz, the brother of Caleb, took it: and he gave him Achsah his daughter to wife."]]}]},{"a":"abiathar_20","b":"adonijah_97","type":"helped","why":"Abiathar the priest followed Adonijah and helped him in his bid to be king, and was at his feast when they cried, God save king Adonijah.","refs":[{"ref":"1 Kings 1:7","verses":[["1 Kings 1:7","And he conferred with Joab the son of Zeruiah, and with Abiathar the priest: and they following Adonijah helped him."]]},{"ref":"1 Kings 1:25","verses":[["1 Kings 1:25","For he is gone down this day, and hath slain oxen and fat cattle and sheep in abundance, and hath called all the king’s sons, and the captains of the host, and Abiathar the priest; and, behold, they eat and drink before him, and say, God save king Adonijah."]]}]},{"a":"abiathar_20","b":"solomon_2762","type":"judged","why":"Solomon told Abiathar he was worthy of death for siding with Adonijah, but spared him and thrust him out from being priest.","refs":[{"ref":"1 Kings 2:22","verses":[["1 Kings 2:22","And king Solomon answered and said unto his mother, And why dost thou ask Abishag the Shunammite for Adonijah? ask for him the kingdom also; for he is mine elder brother; even for him, and for Abiathar the priest, and for Joab the son of Zeruiah."]]},{"ref":"1 Kings 2:26–27","verses":[["1 Kings 2:26","And unto Abiathar the priest said the king, Get thee to Anathoth, unto thine own fields; for thou art worthy of death: but I will not at this time put thee to death, because thou barest the ark of the Lord GOD before David my father, and because thou hast been afflicted in all wherein my father was afflicted."],["1 Kings 2:27","So Solomon thrust out Abiathar from being priest unto the LORD; that he might fulfil the word of the LORD, which he spake concerning the house of Eli in Shiloh."]]}]},{"a":"abijah_38","b":"rehoboam_2412","type":"family","why":"Abijah was Rehoboam's son, and Rehoboam made him chief among his brethren to make him king after him.","refs":[{"ref":"1 Kings 14:31","verses":[["1 Kings 14:31","And Rehoboam slept with his fathers, and was buried with his fathers in the city of David. And his mother’s name was Naamah an Ammonitess. And Abijam his son reigned in his stead."]]},{"ref":"2 Chronicles 11:22","verses":[["2 Chronicles 11:22","And Rehoboam made Abijah the son of Maachah the chief, to be ruler among his brethren: for he thought to make him king."]]}]},{"a":"abijah_38","b":"jeroboam_872","type":"enemies","why":"There was war between Abijah and Jeroboam, and God smote Jeroboam and all Israel before Abijah, so that Jeroboam never recovered strength in Abijah's days.","refs":[{"ref":"1 Kings 15:7","verses":[["1 Kings 15:7","Now the rest of the acts of Abijam, and all that he did, are they not written in the book of the chronicles of the kings of Judah? And there was war between Abijam and Jeroboam."]]},{"ref":"2 Chronicles 13:3–20","verses":[["2 Chronicles 13:3","And Abijah set the battle in array with an army of valiant men of war, even four hundred thousand chosen men: Jeroboam also set the battle in array against him with eight hundred thousand chosen men, being mighty men of valour."],["2 Chronicles 13:4","And Abijah stood up upon mount Zemaraim, which is in mount Ephraim, and said, Hear me, thou Jeroboam, and all Israel;"],["2 Chronicles 13:5","Ought ye not to know that the LORD God of Israel gave the kingdom over Israel to David for ever, even to him and to his sons by a covenant of salt?"],["2 Chronicles 13:6","Yet Jeroboam the son of Nebat, the servant of Solomon the son of David, is risen up, and hath rebelled against his lord."],["2 Chronicles 13:7","And there are gathered unto him vain men, the children of Belial, and have strengthened themselves against Rehoboam the son of Solomon, when Rehoboam was young and tenderhearted, and could not withstand them."],["2 Chronicles 13:8","And now ye think to withstand the kingdom of the LORD in the hand of the sons of David; and ye be a great multitude, and there are with you golden calves, which Jeroboam made you for gods."],["2 Chronicles 13:9","Have ye not cast out the priests of the LORD, the sons of Aaron, and the Levites, and have made you priests after the manner of the nations of other lands? so that whosoever cometh to consecrate himself with a young bullock and seven rams, the same may be a priest of them that are no gods."],["2 Chronicles 13:10","But as for us, the LORD is our God, and we have not forsaken him; and the priests, which minister unto the LORD, are the sons of Aaron, and the Levites wait upon their business:"],["2 Chronicles 13:11","And they burn unto the LORD every morning and every evening burnt sacrifices and sweet incense: the shewbread also set they in order upon the pure table; and the candlestick of gold with the lamps thereof, to burn every evening: for we keep the charge of the LORD our God; but ye have forsaken him."],["2 Chronicles 13:12","And, behold, God himself is with us for our captain, and his priests with sounding trumpets to cry alarm against you. O children of Israel, fight ye not against the LORD God of your fathers; for ye shall not prosper."],["2 Chronicles 13:13","But Jeroboam caused an ambushment to come about behind them: so they were before Judah, and the ambushment was behind them."],["2 Chronicles 13:14","And when Judah looked back, behold, the battle was before and behind: and they cried unto the LORD, and the priests sounded with the trumpets."],["2 Chronicles 13:15","Then the men of Judah gave a shout: and as the men of Judah shouted, it came to pass, that God smote Jeroboam and all Israel before Abijah and Judah."],["2 Chronicles 13:16","And the children of Israel fled before Judah: and God delivered them into their hand."],["2 Chronicles 13:17","And Abijah and his people slew them with a great slaughter: so there fell down slain of Israel five hundred thousand chosen men."],["2 Chronicles 13:18","Thus the children of Israel were brought under at that time, and the children of Judah prevailed, because they relied upon the LORD God of their fathers."],["2 Chronicles 13:19","And Abijah pursued after Jeroboam, and took cities from him, Bethel with the towns thereof, and Jeshanah with the towns thereof, and Ephrain with the towns thereof."],["2 Chronicles 13:20","Neither did Jeroboam recover strength again in the days of Abijah: and the LORD struck him, and he died."]]}]},{"a":"abijah_38","b":"asa_318","type":"family","why":"Asa was Abijah's son and reigned in his stead.","refs":[{"ref":"1 Kings 15:8","verses":[["1 Kings 15:8","And Abijam slept with his fathers; and they buried him in the city of David: and Asa his son reigned in his stead."]]},{"ref":"2 Chronicles 14:1","verses":[["2 Chronicles 14:1","So Abijah slept with his fathers, and they buried him in the city of David: and Asa his son reigned in his stead. In his days the land was quiet ten years."]]}]},{"a":"adonijah_97","b":"solomon_2762","type":"family","why":"Solomon called Adonijah \"mine elder brother.\"","refs":[{"ref":"1 Kings 2:22","verses":[["1 Kings 2:22","And king Solomon answered and said unto his mother, And why dost thou ask Abishag the Shunammite for Adonijah? ask for him the kingdom also; for he is mine elder brother; even for him, and for Abiathar the priest, and for Joab the son of Zeruiah."]]}]},{"a":"adonijah_97","b":"solomon_2762","type":"rivals","why":"Adonijah tried to make himself king, but the kingdom went to his brother Solomon, as Adonijah himself said; when he then asked for Abishag, Solomon saw it as asking for the kingdom and had him put to death.","refs":[{"ref":"1 Kings 1:5","verses":[["1 Kings 1:5","Then Adonijah the son of Haggith exalted himself, saying, I will be king: and he prepared him chariots and horsemen, and fifty men to run before him."]]},{"ref":"1 Kings 1:50–53","verses":[["1 Kings 1:50","And Adonijah feared because of Solomon, and arose, and went, and caught hold on the horns of the altar."],["1 Kings 1:51","And it was told Solomon, saying, Behold, Adonijah feareth king Solomon: for, lo, he hath caught hold on the horns of the altar, saying, Let king Solomon swear unto me to day that he will not slay his servant with the sword."],["1 Kings 1:52","And Solomon said, If he will shew himself a worthy man, there shall not an hair of him fall to the earth: but if wickedness shall be found in him, he shall die."],["1 Kings 1:53","So king Solomon sent, and they brought him down from the altar. And he came and bowed himself to king Solomon: and Solomon said unto him, Go to thine house."]]},{"ref":"1 Kings 2:15–25","verses":[["1 Kings 2:15","And he said, Thou knowest that the kingdom was mine, and that all Israel set their faces on me, that I should reign: howbeit the kingdom is turned about, and is become my brother’s: for it was his from the LORD."],["1 Kings 2:16","And now I ask one petition of thee, deny me not. And she said unto him, Say on."],["1 Kings 2:17","And he said, Speak, I pray thee, unto Solomon the king, (for he will not say thee nay,) that he give me Abishag the Shunammite to wife."],["1 Kings 2:18","And Bathsheba said, Well; I will speak for thee unto the king."],["1 Kings 2:19","Bathsheba therefore went unto king Solomon, to speak unto him for Adonijah. And the king rose up to meet her, and bowed himself unto her, and sat down on his throne, and caused a seat to be set for the king’s mother; and she sat on his right hand."],["1 Kings 2:20","Then she said, I desire one small petition of thee; I pray thee, say me not nay. And the king said unto her, Ask on, my mother: for I will not say thee nay."],["1 Kings 2:21","And she said, Let Abishag the Shunammite be given to Adonijah thy brother to wife."],["1 Kings 2:22","And king Solomon answered and said unto his mother, And why dost thou ask Abishag the Shunammite for Adonijah? ask for him the kingdom also; for he is mine elder brother; even for him, and for Abiathar the priest, and for Joab the son of Zeruiah."],["1 Kings 2:23","Then king Solomon sware by the LORD, saying, God do so to me, and more also, if Adonijah have not spoken this word against his own life."],["1 Kings 2:24","Now therefore, as the LORD liveth, which hath established me, and set me on the throne of David my father, and who hath made me an house, as he promised, Adonijah shall be put to death this day."],["1 Kings 2:25","And king Solomon sent by the hand of Benaiah the son of Jehoiada; and he fell upon him that he died."]]}]},{"a":"adonijah_97","b":"benaiah_439","type":"put_to_death","why":"When Solomon ordered Adonijah's death, Benaiah fell upon him and killed him.","refs":[{"ref":"1 Kings 2:23–25","verses":[["1 Kings 2:23","Then king Solomon sware by the LORD, saying, God do so to me, and more also, if Adonijah have not spoken this word against his own life."],["1 Kings 2:24","Now therefore, as the LORD liveth, which hath established me, and set me on the throne of David my father, and who hath made me an house, as he promised, Adonijah shall be put to death this day."],["1 Kings 2:25","And king Solomon sent by the hand of Benaiah the son of Jehoiada; and he fell upon him that he died."]]}]},{"a":"adonijah_97","b":"joab_1617","type":"helped","why":"Joab followed Adonijah and helped him in his bid to be king; scripture says Joab had turned after Adonijah.","refs":[{"ref":"1 Kings 1:7","verses":[["1 Kings 1:7","And he conferred with Joab the son of Zeruiah, and with Abiathar the priest: and they following Adonijah helped him."]]},{"ref":"1 Kings 1:19","verses":[["1 Kings 1:19","And he hath slain oxen and fat cattle and sheep in abundance, and hath called all the sons of the king, and Abiathar the priest, and Joab the captain of the host: but Solomon thy servant hath he not called."]]},{"ref":"1 Kings 2:28","verses":[["1 Kings 2:28","Then tidings came to Joab: for Joab had turned after Adonijah, though he turned not after Absalom. And Joab fled unto the tabernacle of the LORD, and caught hold on the horns of the altar."]]}]},{"a":"ahab_113","b":"elijah_1131","type":"rebuked","why":"Elijah confronted Ahab for forsaking the commandments of the LORD and following Baalim, and condemned him for killing Naboth and taking his vineyard.","refs":[{"ref":"1 Kings 18:17–18","verses":[["1 Kings 18:17","And it came to pass, when Ahab saw Elijah, that Ahab said unto him, Art thou he that troubleth Israel?"],["1 Kings 18:18","And he answered, I have not troubled Israel; but thou, and thy father’s house, in that ye have forsaken the commandments of the LORD, and thou hast followed Baalim."]]},{"ref":"1 Kings 21:17–24","verses":[["1 Kings 21:17","And the word of the LORD came to Elijah the Tishbite, saying,"],["1 Kings 21:18","Arise, go down to meet Ahab king of Israel, which is in Samaria: behold, he is in the vineyard of Naboth, whither he is gone down to possess it."],["1 Kings 21:19","And thou shalt speak unto him, saying, Thus saith the LORD, Hast thou killed, and also taken possession? And thou shalt speak unto him, saying, Thus saith the LORD, In the place where dogs licked the blood of Naboth shall dogs lick thy blood, even thine."],["1 Kings 21:20","And Ahab said to Elijah, Hast thou found me, O mine enemy? And he answered, I have found thee: because thou hast sold thyself to work evil in the sight of the LORD."],["1 Kings 21:21","Behold, I will bring evil upon thee, and will take away thy posterity, and will cut off from Ahab him that pisseth against the wall, and him that is shut up and left in Israel,"],["1 Kings 21:22","And will make thine house like the house of Jeroboam the son of Nebat, and like the house of Baasha the son of Ahijah, for the provocation wherewith thou hast provoked me to anger, and made Israel to sin."],["1 Kings 21:23","And of Jezebel also spake the LORD, saying, The dogs shall eat Jezebel by the wall of Jezreel."],["1 Kings 21:24","Him that dieth of Ahab in the city the dogs shall eat; and him that dieth in the field shall the fowls of the air eat."]]}]},{"a":"ahab_113","b":"elijah_1131","type":"enemies","why":"Ahab sought Elijah in every nation and kingdom, and when Elijah came to him over Naboth's vineyard, Ahab said, Hast thou found me, O mine enemy?","refs":[{"ref":"1 Kings 18:10","verses":[["1 Kings 18:10","As the LORD thy God liveth, there is no nation or kingdom, whither my lord hath not sent to seek thee: and when they said, He is not there; he took an oath of the kingdom and nation, that they found thee not."]]},{"ref":"1 Kings 21:20","verses":[["1 Kings 21:20","And Ahab said to Elijah, Hast thou found me, O mine enemy? And he answered, I have found thee: because thou hast sold thyself to work evil in the sight of the LORD."]]}]},{"a":"ahab_113","b":"jezebel_1605","type":"married","why":"Ahab took Jezebel to wife, and she stirred him up to work wickedness in the sight of the LORD.","refs":[{"ref":"1 Kings 16:31","verses":[["1 Kings 16:31","And it came to pass, as if it had been a light thing for him to walk in the sins of Jeroboam the son of Nebat, that he took to wife Jezebel the daughter of Ethbaal king of the Zidonians, and went and served Baal, and worshipped him."]]},{"ref":"1 Kings 21:25","verses":[["1 Kings 21:25","But there was none like unto Ahab, which did sell himself to work wickedness in the sight of the LORD, whom Jezebel his wife stirred up."]]}]},{"a":"ahab_113","b":"naboth_2127","type":"enemies","why":"When Naboth would not give up his vineyard, he was put to death and Ahab went down to take possession of it, and the LORD said to Ahab, Hast thou killed, and also taken possession?","refs":[{"ref":"1 Kings 21:1–4","verses":[["1 Kings 21:1","And it came to pass after these things, that Naboth the Jezreelite had a vineyard, which was in Jezreel, hard by the palace of Ahab king of Samaria."],["1 Kings 21:2","And Ahab spake unto Naboth, saying, Give me thy vineyard, that I may have it for a garden of herbs, because it is near unto my house: and I will give thee for it a better vineyard than it; or, if it seem good to thee, I will give thee the worth of it in money."],["1 Kings 21:3","And Naboth said to Ahab, The LORD forbid it me, that I should give the inheritance of my fathers unto thee."],["1 Kings 21:4","And Ahab came into his house heavy and displeased because of the word which Naboth the Jezreelite had spoken to him: for he had said, I will not give thee the inheritance of my fathers. And he laid him down upon his bed, and turned away his face, and would eat no bread."]]},{"ref":"1 Kings 21:15–19","verses":[["1 Kings 21:15","And it came to pass, when Jezebel heard that Naboth was stoned, and was dead, that Jezebel said to Ahab, Arise, take possession of the vineyard of Naboth the Jezreelite, which he refused to give thee for money: for Naboth is not alive, but dead."],["1 Kings 21:16","And it came to pass, when Ahab heard that Naboth was dead, that Ahab rose up to go down to the vineyard of Naboth the Jezreelite, to take possession of it."],["1 Kings 21:17","And the word of the LORD came to Elijah the Tishbite, saying,"],["1 Kings 21:18","Arise, go down to meet Ahab king of Israel, which is in Samaria: behold, he is in the vineyard of Naboth, whither he is gone down to possess it."],["1 Kings 21:19","And thou shalt speak unto him, saying, Thus saith the LORD, Hast thou killed, and also taken possession? And thou shalt speak unto him, saying, Thus saith the LORD, In the place where dogs licked the blood of Naboth shall dogs lick thy blood, even thine."]]}]},{"a":"ahab_113","b":"micaiah_2054","type":"enemies","why":"Ahab said he hated Micaiah because he did not prophesy good concerning him but evil, and he had Micaiah put in prison and fed with the bread of affliction.","refs":[{"ref":"1 Kings 22:8","verses":[["1 Kings 22:8","And the king of Israel said unto Jehoshaphat, There is yet one man, Micaiah the son of Imlah, by whom we may enquire of the LORD: but I hate him; for he doth not prophesy good concerning me, but evil. And Jehoshaphat said, Let not the king say so."]]},{"ref":"1 Kings 22:26–27","verses":[["1 Kings 22:26","And the king of Israel said, Take Micaiah, and carry him back unto Amon the governor of the city, and to Joash the king’s son;"],["1 Kings 22:27","And say, Thus saith the king, Put this fellow in the prison, and feed him with bread of affliction and with water of affliction, until I come in peace."]]}]},{"a":"ahab_113","b":"jehoshaphat_808","type":"family","why":"Scripture says Jehoshaphat joined affinity with Ahab, that is, became kin to him by marriage.","refs":[{"ref":"2 Chronicles 18:1","verses":[["2 Chronicles 18:1","Now Jehoshaphat had riches and honour in abundance, and joined affinity with Ahab."]]}]},{"a":"ahab_113","b":"jehoshaphat_808","type":"helped","why":"Jehoshaphat joined Ahab, saying, I am as thou art, and went with him to battle at Ramoth-gilead, and the seer asked him, Shouldest thou help the ungodly?","refs":[{"ref":"2 Chronicles 18:1–3","verses":[["2 Chronicles 18:1","Now Jehoshaphat had riches and honour in abundance, and joined affinity with Ahab."],["2 Chronicles 18:2","And after certain years he went down to Ahab to Samaria. And Ahab killed sheep and oxen for him in abundance, and for the people that he had with him, and persuaded him to go up with him to Ramothgilead."],["2 Chronicles 18:3","And Ahab king of Israel said unto Jehoshaphat king of Judah, Wilt thou go with me to Ramothgilead? And he answered him, I am as thou art, and my people as thy people; and we will be with thee in the war."]]},{"ref":"1 Kings 22:29–33","verses":[["1 Kings 22:29","So the king of Israel and Jehoshaphat the king of Judah went up to Ramothgilead."],["1 Kings 22:30","And the king of Israel said unto Jehoshaphat, I will disguise myself, and enter into the battle; but put thou on thy robes. And the king of Israel disguised himself, and went into the battle."],["1 Kings 22:31","But the king of Syria commanded his thirty and two captains that had rule over his chariots, saying, Fight neither with small nor great, save only with the king of Israel."],["1 Kings 22:32","And it came to pass, when the captains of the chariots saw Jehoshaphat, that they said, Surely it is the king of Israel. And they turned aside to fight against him: and Jehoshaphat cried out."],["1 Kings 22:33","And it came to pass, when the captains of the chariots perceived that it was not the king of Israel, that they turned back from pursuing him."]]},{"ref":"2 Chronicles 19:1–2","verses":[["2 Chronicles 19:1","And Jehoshaphat the king of Judah returned to his house in peace to Jerusalem."],["2 Chronicles 19:2","And Jehu the son of Hanani the seer went out to meet him, and said to king Jehoshaphat, Shouldest thou help the ungodly, and love them that hate the LORD? therefore is wrath upon thee from before the LORD."]]}]},{"a":"ahab_113","b":"ahaziah_120","type":"family","why":"Ahaziah was Ahab's son, reigned in his stead, and walked in the way of his father.","refs":[{"ref":"1 Kings 22:40","verses":[["1 Kings 22:40","So Ahab slept with his fathers; and Ahaziah his son reigned in his stead."]]},{"ref":"1 Kings 22:51–52","verses":[["1 Kings 22:51","Ahaziah the son of Ahab began to reign over Israel in Samaria the seventeenth year of Jehoshaphat king of Judah, and reigned two years over Israel."],["1 Kings 22:52","And he did evil in the sight of the LORD, and walked in the way of his father, and in the way of his mother, and in the way of Jeroboam the son of Nebat, who made Israel to sin:"]]}]},{"a":"ahab_113","b":"joram_804","type":"family","why":"Jehoram was the son of Ahab and reigned over Israel.","refs":[{"ref":"2 Kings 3:1–2","verses":[["2 Kings 3:1","Now Jehoram the son of Ahab began to reign over Israel in Samaria the eighteenth year of Jehoshaphat king of Judah, and reigned twelve years."],["2 Kings 3:2","And he wrought evil in the sight of the LORD; but not like his father, and like his mother: for he put away the image of Baal that his father had made."]]}]},{"a":"ahaz_118","b":"hezekiah_1512","type":"family","why":"Hezekiah was Ahaz's son and reigned in his stead.","refs":[{"ref":"2 Kings 16:20","verses":[["2 Kings 16:20","And Ahaz slept with his fathers, and was buried with his fathers in the city of David: and Hezekiah his son reigned in his stead."]]},{"ref":"2 Kings 18:1","verses":[["2 Kings 18:1","Now it came to pass in the third year of Hoshea son of Elah king of Israel, that Hezekiah the son of Ahaz king of Judah began to reign."]]}]},{"a":"ahaz_118","b":"jotham_1735","type":"family","why":"Ahaz was Jotham's son and reigned in his stead.","refs":[{"ref":"2 Kings 15:38","verses":[["2 Kings 15:38","And Jotham slept with his fathers, and was buried with his fathers in the city of David his father: and Ahaz his son reigned in his stead."]]}]},{"a":"ahaz_118","b":"pekah_2299","type":"enemies","why":"Pekah king of Israel came up to Jerusalem to war against Ahaz and besieged him, and slew a hundred and twenty thousand in Judah in one day.","refs":[{"ref":"2 Kings 16:5","verses":[["2 Kings 16:5","Then Rezin king of Syria and Pekah son of Remaliah king of Israel came up to Jerusalem to war: and they besieged Ahaz, but could not overcome him."]]},{"ref":"2 Chronicles 28:5–6","verses":[["2 Chronicles 28:5","Wherefore the LORD his God delivered him into the hand of the king of Syria; and they smote him, and carried away a great multitude of them captives, and brought them to Damascus. And he was also delivered into the hand of the king of Israel, who smote him with a great slaughter."],["2 Chronicles 28:6","For Pekah the son of Remaliah slew in Judah an hundred and twenty thousand in one day, which were all valiant men; because they had forsaken the LORD God of their fathers."]]}]},{"a":"elijah_1131","b":"ahaziah_120","type":"prophecy","why":"Elijah told Ahaziah that because he sent to ask Baal-zebub, as if there were no God in Israel, he would not come down from his bed but would surely die, and he died according to the word of the LORD which Elijah had spoken.","refs":[{"ref":"2 Kings 1:16","verses":[["2 Kings 1:16","And he said unto him, Thus saith the LORD, Forasmuch as thou hast sent messengers to enquire of Baalzebub the god of Ekron, is it not because there is no God in Israel to enquire of his word? therefore thou shalt not come down off that bed on which thou art gone up, but shalt surely die."]]}],"fulfilled":[{"ref":"2 Kings 1:17","verses":[["2 Kings 1:17","So he died according to the word of the LORD which Elijah had spoken. And Jehoram reigned in his stead in the second year of Jehoram the son of Jehoshaphat king of Judah; because he had no son."]]}]},{"a":"ahaziah_120","b":"jehoshaphat_808","type":"worked_together","why":"Jehoshaphat joined himself with Ahaziah to make ships to go to Tarshish, and the LORD broke the works because he had joined himself with Ahaziah.","refs":[{"ref":"2 Chronicles 20:35–37","verses":[["2 Chronicles 20:35","And after this did Jehoshaphat king of Judah join himself with Ahaziah king of Israel, who did very wickedly:"],["2 Chronicles 20:36","And he joined himself with him to make ships to go to Tarshish: and they made the ships in Eziongeber."],["2 Chronicles 20:37","Then Eliezer the son of Dodavah of Mareshah prophesied against Jehoshaphat, saying, Because thou hast joined thyself with Ahaziah, the LORD hath broken thy works. And the ships were broken, that they were not able to go to Tarshish."]]}]},{"a":"ahijah_135","b":"jeroboam_872","type":"prophecy","why":"Ahijah tore his new garment into twelve pieces and told Jeroboam the LORD would give him ten tribes, and later told Jeroboam's wife the LORD would cut off his house; both came to pass according to the saying of the LORD by Ahijah.","refs":[{"ref":"1 Kings 11:29–39","verses":[["1 Kings 11:29","And it came to pass at that time when Jeroboam went out of Jerusalem, that the prophet Ahijah the Shilonite found him in the way; and he had clad himself with a new garment; and they two were alone in the field:"],["1 Kings 11:30","And Ahijah caught the new garment that was on him, and rent it in twelve pieces:"],["1 Kings 11:31","And he said to Jeroboam, Take thee ten pieces: for thus saith the LORD, the God of Israel, Behold, I will rend the kingdom out of the hand of Solomon, and will give ten tribes to thee:"],["1 Kings 11:32","(But he shall have one tribe for my servant David’s sake, and for Jerusalem’s sake, the city which I have chosen out of all the tribes of Israel:)"],["1 Kings 11:33","Because that they have forsaken me, and have worshipped Ashtoreth the goddess of the Zidonians, Chemosh the god of the Moabites, and Milcom the god of the children of Ammon, and have not walked in my ways, to do that which is right in mine eyes, and to keep my statutes and my judgments, as did David his father."],["1 Kings 11:34","Howbeit I will not take the whole kingdom out of his hand: but I will make him prince all the days of his life for David my servant’s sake, whom I chose, because he kept my commandments and my statutes:"],["1 Kings 11:35","But I will take the kingdom out of his son’s hand, and will give it unto thee, even ten tribes."],["1 Kings 11:36","And unto his son will I give one tribe, that David my servant may have a light alway before me in Jerusalem, the city which I have chosen me to put my name there."],["1 Kings 11:37","And I will take thee, and thou shalt reign according to all that thy soul desireth, and shalt be king over Israel."],["1 Kings 11:38","And it shall be, if thou wilt hearken unto all that I command thee, and wilt walk in my ways, and do that is right in my sight, to keep my statutes and my commandments, as David my servant did; that I will be with thee, and build thee a sure house, as I built for David, and will give Israel unto thee."],["1 Kings 11:39","And I will for this afflict the seed of David, but not for ever."]]},{"ref":"1 Kings 14:7–14","verses":[["1 Kings 14:7","Go, tell Jeroboam, Thus saith the LORD God of Israel, Forasmuch as I exalted thee from among the people, and made thee prince over my people Israel,"],["1 Kings 14:8","And rent the kingdom away from the house of David, and gave it thee: and yet thou hast not been as my servant David, who kept my commandments, and who followed me with all his heart, to do that only which was right in mine eyes;"],["1 Kings 14:9","But hast done evil above all that were before thee: for thou hast gone and made thee other gods, and molten images, to provoke me to anger, and hast cast me behind thy back:"],["1 Kings 14:10","Therefore, behold, I will bring evil upon the house of Jeroboam, and will cut off from Jeroboam him that pisseth against the wall, and him that is shut up and left in Israel, and will take away the remnant of the house of Jeroboam, as a man taketh away dung, till it be all gone."],["1 Kings 14:11","Him that dieth of Jeroboam in the city shall the dogs eat; and him that dieth in the field shall the fowls of the air eat: for the LORD hath spoken it."],["1 Kings 14:12","Arise thou therefore, get thee to thine own house: and when thy feet enter into the city, the child shall die."],["1 Kings 14:13","And all Israel shall mourn for him, and bury him: for he only of Jeroboam shall come to the grave, because in him there is found some good thing toward the LORD God of Israel in the house of Jeroboam."],["1 Kings 14:14","Moreover the LORD shall raise him up a king over Israel, who shall cut off the house of Jeroboam that day: but what? even now."]]}],"fulfilled":[{"ref":"1 Kings 12:15","verses":[["1 Kings 12:15","Wherefore the king hearkened not unto the people; for the cause was from the LORD, that he might perform his saying, which the LORD spake by Ahijah the Shilonite unto Jeroboam the son of Nebat."]]},{"ref":"1 Kings 15:29–30","verses":[["1 Kings 15:29","And it came to pass, when he reigned, that he smote all the house of Jeroboam; he left not to Jeroboam any that breathed, until he had destroyed him, according unto the saying of the LORD, which he spake by his servant Ahijah the Shilonite:"],["1 Kings 15:30","Because of the sins of Jeroboam which he sinned, and which he made Israel sin, by his provocation wherewith he provoked the LORD God of Israel to anger."]]}]},{"a":"ahikam_141","b":"gedaliah_1287","type":"family","why":"Gedaliah was the son of Ahikam.","refs":[{"ref":"2 Kings 25:22","verses":[["2 Kings 25:22","And as for the people that remained in the land of Judah, whom Nebuchadnezzar king of Babylon had left, even over them he made Gedaliah the son of Ahikam, the son of Shaphan, ruler."]]}]},{"a":"amaziah_214","b":"joash_1632","type":"family","why":"Amaziah was the son of Joash king of Judah and reigned in his stead.","refs":[{"ref":"2 Kings 12:21","verses":[["2 Kings 12:21","For Jozachar the son of Shimeath, and Jehozabad the son of Shomer, his servants, smote him, and he died; and they buried him with his fathers in the city of David: and Amaziah his son reigned in his stead."]]},{"ref":"2 Kings 14:1","verses":[["2 Kings 14:1","In the second year of Joash son of Jehoahaz king of Israel reigned Amaziah the son of Joash king of Judah."]]}]},{"a":"amaziah_214","b":"joash_1633","type":"enemies","why":"Amaziah challenged Joash king of Israel, and Joash went up, smote Judah, took Amaziah at Beth-shemesh, broke down the wall of Jerusalem and took the treasures.","refs":[{"ref":"2 Kings 14:8–14","verses":[["2 Kings 14:8","Then Amaziah sent messengers to Jehoash, the son of Jehoahaz son of Jehu, king of Israel, saying, Come, let us look one another in the face."],["2 Kings 14:9","And Jehoash the king of Israel sent to Amaziah king of Judah, saying, The thistle that was in Lebanon sent to the cedar that was in Lebanon, saying, Give thy daughter to my son to wife: and there passed by a wild beast that was in Lebanon, and trode down the thistle."],["2 Kings 14:10","Thou hast indeed smitten Edom, and thine heart hath lifted thee up: glory of this, and tarry at home: for why shouldest thou meddle to thy hurt, that thou shouldest fall, even thou, and Judah with thee?"],["2 Kings 14:11","But Amaziah would not hear. Therefore Jehoash king of Israel went up; and he and Amaziah king of Judah looked one another in the face at Bethshemesh, which belongeth to Judah."],["2 Kings 14:12","And Judah was put to the worse before Israel; and they fled every man to their tents."],["2 Kings 14:13","And Jehoash king of Israel took Amaziah king of Judah, the son of Jehoash the son of Ahaziah, at Bethshemesh, and came to Jerusalem, and brake down the wall of Jerusalem from the gate of Ephraim unto the corner gate, four hundred cubits."],["2 Kings 14:14","And he took all the gold and silver, and all the vessels that were found in the house of the LORD, and in the treasures of the king’s house, and hostages, and returned to Samaria."]]}]},{"a":"amaziah_214","b":"uzziah_375","type":"family","why":"The people made Uzziah king in the room of his father Amaziah.","refs":[{"ref":"2 Chronicles 26:1","verses":[["2 Chronicles 26:1","Then all the people of Judah took Uzziah, who was sixteen years old, and made him king in the room of his father Amaziah."]]},{"ref":"2 Chronicles 26:4","verses":[["2 Chronicles 26:4","And he did that which was right in the sight of the LORD, according to all that his father Amaziah did."]]}]},{"a":"asa_318","b":"jehoshaphat_808","type":"family","why":"Jehoshaphat was Asa's son, reigned in his stead, and walked in all the ways of Asa his father.","refs":[{"ref":"1 Kings 15:24","verses":[["1 Kings 15:24","And Asa slept with his fathers, and was buried with his fathers in the city of David his father: and Jehoshaphat his son reigned in his stead."]]},{"ref":"1 Kings 22:41–43","verses":[["1 Kings 22:41","And Jehoshaphat the son of Asa began to reign over Judah in the fourth year of Ahab king of Israel."],["1 Kings 22:42","Jehoshaphat was thirty and five years old when he began to reign; and he reigned twenty and five years in Jerusalem. And his mother’s name was Azubah the daughter of Shilhi."],["1 Kings 22:43","And he walked in all the ways of Asa his father; he turned not aside from it, doing that which was right in the eyes of the LORD: nevertheless the high places were not taken away; for the people offered and burnt incense yet in the high places."]]}]},{"a":"athaliah_359","b":"joash_1632","type":"enemies","why":"Athaliah set out to destroy all the seed royal, and Joash was stolen away and hidden from her six years; when he was made king, she cried Treason and was slain.","refs":[{"ref":"2 Kings 11:1–3","verses":[["2 Kings 11:1","And when Athaliah the mother of Ahaziah saw that her son was dead, she arose and destroyed all the seed royal."],["2 Kings 11:2","But Jehosheba, the daughter of king Joram, sister of Ahaziah, took Joash the son of Ahaziah, and stole him from among the king’s sons which were slain; and they hid him, even him and his nurse, in the bedchamber from Athaliah, so that he was not slain."],["2 Kings 11:3","And he was with her hid in the house of the LORD six years. And Athaliah did reign over the land."]]},{"ref":"2 Kings 11:12–16","verses":[["2 Kings 11:12","And he brought forth the king’s son, and put the crown upon him, and gave him the testimony; and they made him king, and anointed him; and they clapped their hands, and said, God save the king."],["2 Kings 11:13","And when Athaliah heard the noise of the guard and of the people, she came to the people into the temple of the LORD."],["2 Kings 11:14","And when she looked, behold, the king stood by a pillar, as the manner was, and the princes and the trumpeters by the king, and all the people of the land rejoiced, and blew with trumpets: and Athaliah rent her clothes, and cried, Treason, Treason."],["2 Kings 11:15","But Jehoiada the priest commanded the captains of the hundreds, the officers of the host, and said unto them, Have her forth without the ranges: and him that followeth her kill with the sword. For the priest had said, Let her not be slain in the house of the LORD."],["2 Kings 11:16","And they laid hands on her; and she went by the way by the which the horses came into the king’s house: and there was she slain."]]}]},{"a":"athaliah_359","b":"jehoiada_793","type":"enemies","why":"Jehoiada's wife hid Joash from Athaliah so that she slew him not; in the seventh year Jehoiada made him king and commanded the captains to take Athaliah out and slay her.","refs":[{"ref":"2 Chronicles 22:11–12","verses":[["2 Chronicles 22:11","But Jehoshabeath, the daughter of the king, took Joash the son of Ahaziah, and stole him from among the king’s sons that were slain, and put him and his nurse in a bedchamber. So Jehoshabeath, the daughter of king Jehoram, the wife of Jehoiada the priest, (for she was the sister of Ahaziah,) hid him from Athaliah, so that she slew him not."],["2 Chronicles 22:12","And he was with them hid in the house of God six years: and Athaliah reigned over the land."]]},{"ref":"2 Kings 11:4","verses":[["2 Kings 11:4","And the seventh year Jehoiada sent and fetched the rulers over hundreds, with the captains and the guard, and brought them to him into the house of the LORD, and made a covenant with them, and took an oath of them in the house of the LORD, and shewed them the king’s son."]]},{"ref":"2 Kings 11:15–16","verses":[["2 Kings 11:15","But Jehoiada the priest commanded the captains of the hundreds, the officers of the host, and said unto them, Have her forth without the ranges: and him that followeth her kill with the sword. For the priest had said, Let her not be slain in the house of the LORD."],["2 Kings 11:16","And they laid hands on her; and she went by the way by the which the horses came into the king’s house: and there was she slain."]]}]},{"a":"bathsheba_416","b":"solomon_2762","type":"family","why":"Bathsheba bore Solomon to David, and when he was king Solomon rose to meet her, bowed to her, and set a seat for the king's mother on his right hand.","refs":[{"ref":"2 Samuel 12:24","verses":[["2 Samuel 12:24","And David comforted Bathsheba his wife, and went in unto her, and lay with her: and she bare a son, and he called his name Solomon: and the LORD loved him."]]},{"ref":"1 Kings 2:19","verses":[["1 Kings 2:19","Bathsheba therefore went unto king Solomon, to speak unto him for Adonijah. And the king rose up to meet her, and bowed himself unto her, and sat down on his throne, and caused a seat to be set for the king’s mother; and she sat on his right hand."]]}]},{"a":"bathsheba_416","b":"nathan_2153","type":"counseled","why":"Nathan told Bathsheba, Let me give thee counsel, that thou mayest save thine own life, and the life of thy son Solomon, and sent her in to King David.","refs":[{"ref":"1 Kings 1:11–14","verses":[["1 Kings 1:11","Wherefore Nathan spake unto Bathsheba the mother of Solomon, saying, Hast thou not heard that Adonijah the son of Haggith doth reig
