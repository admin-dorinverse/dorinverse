For, lo, as soon as the voice of thy salutation sounded in mine ears, the babe leaped in my womb for joy."],["Luke 1:45","And blessed is she that believed: for there shall be a performance of those things which were told her from the Lord."]]}]},{"a":"elisabeth_1152","b":"john_1676","type":"family","why":"Elisabeth bore John and named him.","refs":[{"ref":"Luke 1:57–60","verses":[["Luke 1:57","Now Elisabeth’s full time came that she should be delivered; and she brought forth a son."],["Luke 1:58","And her neighbours and her cousins heard how the Lord had shewed great mercy upon her; and they rejoiced with her."],["Luke 1:59","And it came to pass, that on the eighth day they came to circumcise the child; and they called him Zacharias, after the name of his father."],["Luke 1:60","And his mother answered and said, Not so; but he shall be called John."]]}]},{"a":"felix_1257","b":"paul_2479","type":"judged","why":"The governor Felix heard Paul's case against his accusers, then deferred it and kept Paul bound for two years.","refs":[{"ref":"Acts 23:33–35","verses":[["Acts 23:33","Who, when they came to Caesarea, and delivered the epistle to the governor, presented Paul also before him."],["Acts 23:34","And when the governor had read the letter, he asked of what province he was. And when he understood that he was of Cilicia;"],["Acts 23:35","I will hear thee, said he, when thine accusers are also come. And he commanded him to be kept in Herod’s judgment hall."]]},{"ref":"Acts 24:1–27","verses":[["Acts 24:1","And after five days Ananias the high priest descended with the elders, and with a certain orator named Tertullus, who informed the governor against Paul."],["Acts 24:2","And when he was called forth, Tertullus began to accuse him, saying, Seeing that by thee we enjoy great quietness, and that very worthy deeds are done unto this nation by thy providence,"],["Acts 24:3","We accept it always, and in all places, most noble Felix, with all thankfulness."],["Acts 24:4","Notwithstanding, that I be not further tedious unto thee, I pray thee that thou wouldest hear us of thy clemency a few words."],["Acts 24:5","For we have found this man a pestilent fellow, and a mover of sedition among all the Jews throughout the world, and a ringleader of the sect of the Nazarenes:"],["Acts 24:6","Who also hath gone about to profane the temple: whom we took, and would have judged according to our law."],["Acts 24:7","But the chief captain Lysias came upon us, and with great violence took him away out of our hands,"],["Acts 24:8","Commanding his accusers to come unto thee: by examining of whom thyself mayest take knowledge of all these things, whereof we accuse him."],["Acts 24:9","And the Jews also assented, saying that these things were so."],["Acts 24:10","Then Paul, after that the governor had beckoned unto him to speak, answered, Forasmuch as I know that thou hast been of many years a judge unto this nation, I do the more cheerfully answer for myself:"],["Acts 24:11","Because that thou mayest understand, that there are yet but twelve days since I went up to Jerusalem for to worship."],["Acts 24:12","And they neither found me in the temple disputing with any man, neither raising up the people, neither in the synagogues, nor in the city:"],["Acts 24:13","Neither can they prove the things whereof they now accuse me."],["Acts 24:14","But this I confess unto thee, that after the way which they call heresy, so worship I the God of my fathers, believing all things which are written in the law and in the prophets:"],["Acts 24:15","And have hope toward God, which they themselves also allow, that there shall be a resurrection of the dead, both of the just and unjust."],["Acts 24:16","And herein do I exercise myself, to have always a conscience void of offence toward God, and toward men."],["Acts 24:17","Now after many years I came to bring alms to my nation, and offerings."],["Acts 24:18","Whereupon certain Jews from Asia found me purified in the temple, neither with multitude, nor with tumult."],["Acts 24:19","Who ought to have been here before thee, and object, if they had ought against me."],["Acts 24:20","Or else let these same here say, if they have found any evil doing in me, while I stood before the council,"],["Acts 24:21","Except it be for this one voice, that I cried standing among them, Touching the resurrection of the dead I am called in question by you this day."],["Acts 24:22","And when Felix heard these things, having more perfect knowledge of that way, he deferred them, and said, When Lysias the chief captain shall come down, I will know the uttermost of your matter."],["Acts 24:23","And he commanded a centurion to keep Paul, and to let him have liberty, and that he should forbid none of his acquaintance to minister or come unto him."],["Acts 24:24","And after certain days, when Felix came with his wife Drusilla, which was a Jewess, he sent for Paul, and heard him concerning the faith in Christ."],["Acts 24:25","And as he reasoned of righteousness, temperance, and judgment to come, Felix trembled, and answered, Go thy way for this time; when I have a convenient season, I will call for thee."],["Acts 24:26","He hoped also that money should have been given him of Paul, that he might loose him: wherefore he sent for him the oftener, and communed with him."],["Acts 24:27","But after two years Porcius Festus came into Felix’ room: and Felix, willing to shew the Jews a pleasure, left Paul bound."]]}]},{"a":"gamaliel_1277","b":"paul_2479","type":"followed","why":"Paul was brought up at the feet of Gamaliel and taught by him according to the law.","refs":[{"ref":"Acts 22:3","verses":[["Acts 22:3","I am verily a man which am a Jew, born in Tarsus, a city in Cilicia, yet brought up in this city at the feet of Gamaliel, and taught according to the perfect manner of the law of the fathers, and was zealous toward God, as ye all are this day."]]}]},{"a":"herod_1504","b":"jesus_905","type":"enemies","why":"Herod sought to destroy the child Jesus and killed the children of Bethlehem to do it.","refs":[{"ref":"Matthew 2:13–16","verses":[["Matthew 2:13","And when they were departed, behold, the angel of the Lord appeareth to Joseph in a dream, saying, Arise, and take the young child and his mother, and flee into Egypt, and be thou there until I bring thee word: for Herod will seek the young child to destroy him."],["Matthew 2:14","When he arose, he took the young child and his mother by night, and departed into Egypt:"],["Matthew 2:15","And was there until the death of Herod: that it might be fulfilled which was spoken of the Lord by the prophet, saying, Out of Egypt have I called my son."],["Matthew 2:16","Then Herod, when he saw that he was mocked of the wise men, was exceeding wroth, and sent forth, and slew all the children that were in Bethlehem, and in all the coasts thereof, from two years old and under, according to the time which he had diligently enquired of the wise men."]]}]},{"a":"herod_1505","b":"john_1676","type":"rebuked","why":"John reproved Herod for taking Herodias, his brother Philip's wife, and for all the evil he had done.","refs":[{"ref":"Luke 3:19–20","verses":[["Luke 3:19","But Herod the tetrarch, being reproved by him for Herodias his brother Philip’s wife, and for all the evils which Herod had done,"],["Luke 3:20","Added yet this above all, that he shut up John in prison."]]},{"ref":"Matthew 14:3–4","verses":[["Matthew 14:3","For Herod had laid hold on John, and bound him, and put him in prison for Herodias’ sake, his brother Philip’s wife."],["Matthew 14:4","For John said unto him, It is not lawful for thee to have her."]]}]},{"a":"herod_1505","b":"john_1676","type":"enemies","why":"Herod imprisoned John, would have put him to death, and finally had him beheaded.","refs":[{"ref":"Matthew 14:3–5","verses":[["Matthew 14:3","For Herod had laid hold on John, and bound him, and put him in prison for Herodias’ sake, his brother Philip’s wife."],["Matthew 14:4","For John said unto him, It is not lawful for thee to have her."],["Matthew 14:5","And when he would have put him to death, he feared the multitude, because they counted him as a prophet."]]},{"ref":"Mark 6:17–28","verses":[["Mark 6:17","For Herod himself had sent forth and laid hold upon John, and bound him in prison for Herodias’ sake, his brother Philip’s wife: for he had married her."],["Mark 6:18","For John had said unto Herod, It is not lawful for thee to have thy brother’s wife."],["Mark 6:19","Therefore Herodias had a quarrel against him, and would have killed him; but she could not:"],["Mark 6:20","For Herod feared John, knowing that he was a just man and an holy, and observed him; and when he heard him, he did many things, and heard him gladly."],["Mark 6:21","And when a convenient day was come, that Herod on his birthday made a supper to his lords, high captains, and chief estates of Galilee;"],["Mark 6:22","And when the daughter of the said Herodias came in, and danced, and pleased Herod and them that sat with him, the king said unto the damsel, Ask of me whatsoever thou wilt, and I will give it thee."],["Mark 6:23","And he sware unto her, Whatsoever thou shalt ask of me, I will give it thee, unto the half of my kingdom."],["Mark 6:24","And she went forth, and said unto her mother, What shall I ask? And she said, The head of John the Baptist."],["Mark 6:25","And she came in straightway with haste unto the king, and asked, saying, I will that thou give me by and by in a charger the head of John the Baptist."],["Mark 6:26","And the king was exceeding sorry; yet for his oath’s sake, and for their sakes which sat with him, he would not reject her."],["Mark 6:27","And immediately the king sent an executioner, and commanded his head to be brought: and he went and beheaded him in the prison,"],["Mark 6:28","And brought his head in a charger, and gave it to the damsel: and the damsel gave it to her mother."]]}]},{"a":"herod_1505","b":"jesus_905","type":"enemies","why":"Herod sought to kill Jesus, and at his trial he mocked him and set him at nought; scripture names him among those gathered against Jesus.","refs":[{"ref":"Luke 13:31–32","verses":[["Luke 13:31","The same day there came certain of the Pharisees, saying unto him, Get thee out, and depart hence: for Herod will kill thee."],["Luke 13:32","And he said unto them, Go ye, and tell that fox, Behold, I cast out devils, and I do cures to day and to morrow, and the third day I shall be perfected."]]},{"ref":"Luke 23:6–12","verses":[["Luke 23:6","When Pilate heard of Galilee, he asked whether the man were a Galilaean."],["Luke 23:7","And as soon as he knew that he belonged unto Herod’s jurisdiction, he sent him to Herod, who himself also was at Jerusalem at that time."],["Luke 23:8","And when Herod saw Jesus, he was exceeding glad: for he was desirous to see him of a long season, because he had heard many things of him; and he hoped to have seen some miracle done by him."],["Luke 23:9","Then he questioned with him in many words; but he answered him nothing."],["Luke 23:10","And the chief priests and scribes stood and vehemently accused him."],["Luke 23:11","And Herod with his men of war set him at nought, and mocked him, and arrayed him in a gorgeous robe, and sent him again to Pilate."],["Luke 23:12","And the same day Pilate and Herod were made friends together: for before they were at enmity between themselves."]]},{"ref":"Acts 4:27","verses":[["Acts 4:27","For of a truth against thy holy child Jesus, whom thou hast anointed, both Herod, and Pontius Pilate, with the Gentiles, and the people of Israel, were gathered together,"]]}]},{"a":"herod_1505","b":"pilate_2365","type":"enemies","why":"Scripture says Pilate and Herod were at enmity between themselves before Jesus' trial.","refs":[{"ref":"Luke 23:12","verses":[["Luke 23:12","And the same day Pilate and Herod were made friends together: for before they were at enmity between themselves."]]}]},{"a":"herod_1505","b":"pilate_2365","type":"friends","why":"The day Pilate sent Jesus to Herod and Herod sent him back, Pilate and Herod were made friends together.","refs":[{"ref":"Luke 23:6–12","verses":[["Luke 23:6","When Pilate heard of Galilee, he asked whether the man were a Galilaean."],["Luke 23:7","And as soon as he knew that he belonged unto Herod’s jurisdiction, he sent him to Herod, who himself also was at Jerusalem at that time."],["Luke 23:8","And when Herod saw Jesus, he was exceeding glad: for he was desirous to see him of a long season, because he had heard many things of him; and he hoped to have seen some miracle done by him."],["Luke 23:9","Then he questioned with him in many words; but he answered him nothing."],["Luke 23:10","And the chief priests and scribes stood and vehemently accused him."],["Luke 23:11","And Herod with his men of war set him at nought, and mocked him, and arrayed him in a gorgeous robe, and sent him again to Pilate."],["Luke 23:12","And the same day Pilate and Herod were made friends together: for before they were at enmity between themselves."]]}]},{"a":"herod_1506","b":"james_717","type":"enemies","why":"Herod killed James the brother of John with the sword.","refs":[{"ref":"Acts 12:1–2","verses":[["Acts 12:1","Now about that time Herod the king stretched forth his hands to vex certain of the church."],["Acts 12:2","And he killed James the brother of John with the sword."]]}]},{"a":"herod_1506","b":"peter_2745","type":"enemies","why":"Herod imprisoned Peter meaning to bring him out to the people, and the Lord delivered Peter out of Herod's hand.","refs":[{"ref":"Acts 12:1–11","verses":[["Acts 12:1","Now about that time Herod the king stretched forth his hands to vex certain of the church."],["Acts 12:2","And he killed James the brother of John with the sword."],["Acts 12:3","And because he saw it pleased the Jews, he proceeded further to take Peter also. (Then were the days of unleavened bread.)"],["Acts 12:4","And when he had apprehended him, he put him in prison, and delivered him to four quaternions of soldiers to keep him; intending after Easter to bring him forth to the people."],["Acts 12:5","Peter therefore was kept in prison: but prayer was made without ceasing of the church unto God for him."],["Acts 12:6","And when Herod would have brought him forth, the same night Peter was sleeping between two soldiers, bound with two chains: and the keepers before the door kept the prison."],["Acts 12:7","And, behold, the angel of the Lord came upon him, and a light shined in the prison: and he smote Peter on the side, and raised him up, saying, Arise up quickly. And his chains fell off from his hands."],["Acts 12:8","And the angel said unto him, Gird thyself, and bind on thy sandals. And so he did. And he saith unto him, Cast thy garment about thee, and follow me."],["Acts 12:9","And he went out, and followed him; and wist not that it was true which was done by the angel; but thought he saw a vision."],["Acts 12:10","When they were past the first and the second ward, they came unto the iron gate that leadeth unto the city; which opened to them of his own accord: and they went out, and passed on through one street; and forthwith the angel departed from him."],["Acts 12:11","And when Peter was come to himself, he said, Now I know of a surety, that the Lord hath sent his angel, and hath delivered me out of the hand of Herod, and from all the expectation of the people of the Jews."]]}]},{"a":"james_717","b":"john_1677","type":"family","why":"James and John were brothers, the sons of Zebedee.","refs":[{"ref":"Matthew 4:21–22","verses":[["Matthew 4:21","And going on from thence, he saw other two brethren, James the son of Zebedee, and John his brother, in a ship with Zebedee their father, mending their nets; and he called them."],["Matthew 4:22","And they immediately left the ship and their father, and followed him."]]}]},{"a":"james_717","b":"jesus_905","type":"apostle","why":"Jesus chose James as one of his twelve apostles.","refs":[{"ref":"Matthew 10:2","verses":[["Matthew 10:2","Now the names of the twelve apostles are these; The first, Simon, who is called Peter, and Andrew his brother; James the son of Zebedee, and John his brother;"]]}]},{"a":"james_717","b":"jesus_905","type":"followed","why":"James was one of Jesus' disciples and followed him.","refs":[{"ref":"Matthew 4:21–22","verses":[["Matthew 4:21","And going on from thence, he saw other two brethren, James the son of Zebedee, and John his brother, in a ship with Zebedee their father, mending their nets; and he called them."],["Matthew 4:22","And they immediately left the ship and their father, and followed him."]]}]},{"a":"james_717","b":"peter_2745","type":"worked_together","why":"James and John were partners with Simon in fishing.","refs":[{"ref":"Luke 5:10","verses":[["Luke 5:10","And so was also James, and John, the sons of Zebedee, which were partners with Simon. And Jesus said unto Simon, Fear not; from henceforth thou shalt catch men."]]}]},{"a":"james_719","b":"jesus_905","type":"family","why":"James was named among Jesus' brothers and is called the Lord's brother.","refs":[{"ref":"Matthew 13:55","verses":[["Matthew 13:55","Is not this the carpenter’s son? is not his mother called Mary? and his brethren, James, and Joses, and Simon, and Judas?"]]},{"ref":"Galatians 1:19","verses":[["Galatians 1:19","But other of the apostles saw I none, save James the Lord’s brother."]]}]},{"a":"james_719","b":"mary_1938","type":"family","why":"The people of Nazareth named Mary as Jesus' mother and James among his brothers.","refs":[{"ref":"Matthew 13:55","verses":[["Matthew 13:55","Is not this the carpenter’s son? is not his mother called Mary? and his brethren, James, and Joses, and Simon, and Judas?"]]},{"ref":"Mark 6:3","verses":[["Mark 6:3","Is not this the carpenter, the son of Mary, the brother of James, and Joses, and of Juda, and Simon? and are not his sisters here with us? And they were offended at him."]]}]},{"a":"james_719","b":"peter_2745","type":"worked_together","why":"James and Peter led the Jerusalem church together, both called pillars by Paul and both speaking at the council.","refs":[{"ref":"Galatians 2:9","verses":[["Galatians 2:9","And when James, Cephas, and John, who seemed to be pillars, perceived the grace that was given unto me, they gave to me and Barnabas the right hands of fellowship; that we should go unto the heathen, and they unto the circumcision."]]},{"ref":"Acts 12:17","verses":[["Acts 12:17","But he, beckoning unto them with the hand to hold their peace, declared unto them how the Lord had brought him out of the prison. And he said, Go shew these things unto James, and to the brethren. And he departed, and went into another place."]]},{"ref":"Acts 15:7–21","verses":[["Acts 15:7","And when there had been much disputing, Peter rose up, and said unto them, Men and brethren, ye know how that a good while ago God made choice among us, that the Gentiles by my mouth should hear the word of the gospel, and believe."],["Acts 15:8","And God, which knoweth the hearts, bare them witness, giving them the Holy Ghost, even as he did unto us;"],["Acts 15:9","And put no difference between us and them, purifying their hearts by faith."],["Acts 15:10","Now therefore why tempt ye God, to put a yoke upon the neck of the disciples, which neither our fathers nor we were able to bear?"],["Acts 15:11","But we believe that through the grace of the Lord Jesus Christ we shall be saved, even as they."],["Acts 15:12","Then all the multitude kept silence, and gave audience to Barnabas and Paul, declaring what miracles and wonders God had wrought among the Gentiles by them."],["Acts 15:13","And after they had held their peace, James answered, saying, Men and brethren, hearken unto me:"],["Acts 15:14","Simeon hath declared how God at the first did visit the Gentiles, to take out of them a people for his name."],["Acts 15:15","And to this agree the words of the prophets; as it is written,"],["Acts 15:16","After this I will return, and will build again the tabernacle of David, which is fallen down; and I will build again the ruins thereof, and I will set it up:"],["Acts 15:17","That the residue of men might seek after the Lord, and all the Gentiles, upon whom my name is called, saith the Lord, who doeth all these things."],["Acts 15:18","Known unto God are all his works from the beginning of the world."],["Acts 15:19","Wherefore my sentence is, that we trouble not them, which from among the Gentiles are turned to God:"],["Acts 15:20","But that we write unto them, that they abstain from pollutions of idols, and from fornication, and from things strangled, and from blood."],["Acts 15:21","For Moses of old time hath in every city them that preach him, being read in the synagogues every sabbath day."]]}]},{"a":"james_719","b":"paul_2479","type":"worked_together","why":"James gave Paul the right hand of fellowship, that Paul should go to the heathen and they to the circumcision, and later Paul reported his work among the Gentiles to James.","refs":[{"ref":"Galatians 2:9","verses":[["Galatians 2:9","And when James, Cephas, and John, who seemed to be pillars, perceived the grace that was given unto me, they gave to me and Barnabas the right hands of fellowship; that we should go unto the heathen, and they unto the circumcision."]]},{"ref":"Acts 21:17–26","verses":[["Acts 21:17","And when we were come to Jerusalem, the brethren received us gladly."],["Acts 21:18","And the day following Paul went in with us unto James; and all the elders were present."],["Acts 21:19","And when he had saluted them, he declared particularly what things God had wrought among the Gentiles by his ministry."],["Acts 21:20","And when they heard it, they glorified the Lord, and said unto him, Thou seest, brother, how many thousands of Jews there are which believe; and they are all zealous of the law:"],["Acts 21:21","And they are informed of thee, that thou teachest all the Jews which are among the Gentiles to forsake Moses, saying that they ought not to circumcise their children, neither to walk after the customs."],["Acts 21:22","What is it therefore? the multitude must needs come together: for they will hear that thou art come."],["Acts 21:23","Do therefore this that we say to thee: We have four men which have a vow on them;"],["Acts 21:24","Them take, and purify thyself with them, and be at charges with them, that they may shave their heads: and all may know that those things, whereof they were informed concerning thee, are nothing; but that thou thyself also walkest orderly, and keepest the law."],["Acts 21:25","As touching the Gentiles which believe, we have written and concluded that they observe no such thing, save only that they keep themselves from things offered to idols, and from blood, and from strangled, and from fornication."],["Acts 21:26","Then Paul took the men, and the next day purifying himself with them entered into the temple, to signify the accomplishment of the days of purification, until that an offering should be offered for every one of them."]]}]},{"a":"jesus_905","b":"peter_2745","type":"apostle","why":"Jesus chose Peter as one of his twelve apostles.","refs":[{"ref":"Matthew 10:2","verses":[["Matthew 10:2","Now the names of the twelve apostles are these; The first, Simon, who is called Peter, and Andrew his brother; James the son of Zebedee, and John his brother;"]]}]},{"a":"jesus_905","b":"peter_2745","type":"followed","why":"Peter was one of Jesus' disciples and followed him.","refs":[{"ref":"Matthew 4:18–20","verses":[["Matthew 4:18","And Jesus, walking by the sea of Galilee, saw two brethren, Simon called Peter, and Andrew his brother, casting a net into the sea: for they were fishers."],["Matthew 4:19","And he saith unto them, Follow me, and I will make you fishers of men."],["Matthew 4:20","And they straightway left their nets, and followed him."]]}]},{"a":"jesus_905","b":"john_1677","type":"apostle","why":"Jesus chose John as one of his twelve apostles.","refs":[{"ref":"Matthew 10:2","verses":[["Matthew 10:2","Now the names of the twelve apostles are these; The first, Simon, who is called Peter, and Andrew his brother; James the son of Zebedee, and John his brother;"]]}]},{"a":"jesus_905","b":"john_1677","type":"followed","why":"John was one of Jesus' disciples and followed him.","refs":[{"ref":"Matthew 4:21–22","verses":[["Matthew 4:21","And going on from thence, he saw other two brethren, James the son of Zebedee, and John his brother, in a ship with Zebedee their father, mending their nets; and he called them."],["Matthew 4:22","And they immediately left the ship and their father, and followed him."]]}]},{"a":"john_1676","b":"jesus_905","type":"prophecy","why":"John foretold one coming after him who was mightier than he, and then pointed to Jesus as the one of whom he had spoken.","refs":[{"ref":"Matthew 3:11","verses":[["Matthew 3:11","I indeed baptize you with water unto repentance: but he that cometh after me is mightier than I, whose shoes I am not worthy to bear: he shall baptize you with the Holy Ghost, and with fire:"]]},{"ref":"John 1:26–27","verses":[["John 1:26","John answered them, saying, I baptize with water: but there standeth one among you, whom ye know not;"],["John 1:27","He it is, who coming after me is preferred before me, whose shoe’s latchet I am not worthy to unloose."]]}],"fulfilled":[{"ref":"John 1:29–34","verses":[["John 1:29","The next day John seeth Jesus coming unto him, and saith, Behold the Lamb of God, which taketh away the sin of the world."],["John 1:30","This is he of whom I said, After me cometh a man which is preferred before me: for he was before me."],["John 1:31","And I knew him not: but that he should be made manifest to Israel, therefore am I come baptizing with water."],["John 1:32","And John bare record, saying, I saw the Spirit descending from heaven like a dove, and it abode upon him."],["John 1:33","And I knew him not: but he that sent me to baptize with water, the same said unto me, Upon whom thou shalt see the Spirit descending, and remaining on him, the same is he which baptizeth with the Holy Ghost."],["John 1:34","And I saw, and bare record that this is the Son of God."]]}]},{"a":"jesus_905","b":"philip_2344","type":"apostle","why":"Jesus chose Philip as one of his twelve apostles.","refs":[{"ref":"Matthew 10:3","verses":[["Matthew 10:3","Philip, and Bartholomew; Thomas, and Matthew the publican; James the son of Alphaeus, and Lebbaeus, whose surname was Thaddaeus;"]]}]},{"a":"jesus_905","b":"philip_2344","type":"followed","why":"Philip was one of Jesus' disciples and followed him.","refs":[{"ref":"John 1:43","verses":[["John 1:43","The day following Jesus would go forth into Galilee, and findeth Philip, and saith unto him, Follow me."]]}]},{"a":"jesus_905","b":"matthew_1971","type":"apostle","why":"Jesus chose Matthew as one of his twelve apostles.","refs":[{"ref":"Matthew 10:3","verses":[["Matthew 10:3","Philip, and Bartholomew; Thomas, and Matthew the publican; James the son of Alphaeus, and Lebbaeus, whose surname was Thaddaeus;"]]}]},{"a":"jesus_905","b":"matthew_1971","type":"followed","why":"Matthew was one of Jesus' disciples and followed him.","refs":[{"ref":"Matthew 9:9","verses":[["Matthew 9:9","And as Jesus passed forth from thence, he saw a man, named Matthew, sitting at the receipt of custom: and he saith unto him, Follow me. And he arose, and followed him."]]}]},{"a":"jesus_905","b":"thomas_2851","type":"apostle","why":"Jesus chose Thomas as one of his twelve apostles.","refs":[{"ref":"Matthew 10:3","verses":[["Matthew 10:3","Philip, and Bartholomew; Thomas, and Matthew the publican; James the son of Alphaeus, and Lebbaeus, whose surname was Thaddaeus;"]]}]},{"a":"jesus_905","b":"thomas_2851","type":"followed","why":"Thomas was one of Jesus’ twelve disciples and followed him, saying he would go with him to die.","refs":[{"ref":"Matthew 10:1–3","verses":[["Matthew 10:1","And when he had called unto him his twelve disciples, he gave them power against unclean spirits, to cast them out, and to heal all manner of sickness and all manner of disease."],["Matthew 10:2","Now the names of the twelve apostles are these; The first, Simon, who is called Peter, and Andrew his brother; James the son of Zebedee, and John his brother;"],["Matthew 10:3","Philip, and Bartholomew; Thomas, and Matthew the publican; James the son of Alphaeus, and Lebbaeus, whose surname was Thaddaeus;"]]},{"ref":"John 11:16","verses":[["John 11:16","Then said Thomas, which is called Didymus, unto his fellowdisciples, Let us also go, that we may die with him."]]}]},{"a":"jesus_905","b":"pilate_2365","type":"judged","why":"Pilate tried Jesus; he found no evil in him, yet he scourged him and delivered him to be crucified.","refs":[{"ref":"Matthew 27:11–26","verses":[["Matthew 27:11","And Jesus stood before the governor: and the governor asked him, saying, Art thou the King of the Jews? And Jesus said unto him, Thou sayest."],["Matthew 27:12","And when he was accused of the chief priests and elders, he answered nothing."],["Matthew 27:13","Then said Pilate unto him, Hearest thou not how many things they witness against thee?"],["Matthew 27:14","And he answered him to never a word; insomuch that the governor marvelled greatly."],["Matthew 27:15","Now at that feast the governor was wont to release unto the people a prisoner, whom they would."],["Matthew 27:16","And they had then a notable prisoner, called Barabbas."],["Matthew 27:17","Therefore when they were gathered together, Pilate said unto them, Whom will ye that I release unto you? Barabbas, or Jesus which is called Christ?"],["Matthew 27:18","For he knew that for envy they had delivered him."],["Matthew 27:19","When he was set down on the judgment seat, his wife sent unto him, saying, Have thou nothing to do with that just man: for I have suffered many things this day in a dream because of him."],["Matthew 27:20","But the chief priests and elders persuaded the multitude that they should ask Barabbas, and destroy Jesus."],["Matthew 27:21","The governor answered and said unto them, Whether of the twain will ye that I release unto you? They said, Barabbas."],["Matthew 27:22","Pilate saith unto them, What shall I do then with Jesus which is called Christ? They all say unto him, Let him be crucified."],["Matthew 27:23","And the governor said, Why, what evil hath he done? But they cried out the more, saying, Let him be crucified."],["Matthew 27:24","When Pilate saw that he could prevail nothing, but that rather a tumult was made, he took water, and washed his hands before the multitude, saying, I am innocent of the blood of this just person: see ye to it."],["Matthew 27:25","Then answered all the people, and said, His blood be on us, and on our children."],["Matthew 27:26","Then released he Barabbas unto them: and when he had scourged Jesus, he delivered him to be crucified."]]}]},{"a":"jesus_905","b":"mary_1938","type":"family","why":"Mary was Jesus' mother; she brought him forth and stood by his cross.","refs":[{"ref":"Luke 2:4–7","verses":[["Luke 2:4","And Joseph also went up from Galilee, out of the city of Nazareth, into Judaea, unto the city of David, which is called Bethlehem; (because he was of the house and lineage of David:)"],["Luke 2:5","To be taxed with Mary his espoused wife, being great with child."],["Luke 2:6","And so it was, that, while they were there, the days were accomplished that she should be delivered."],["Luke 2:7","And she brought forth her firstborn son, and wrapped him in swaddling clothes, and laid him in a manger; because there was no room for them in the inn."]]},{"ref":"John 19:25–27","verses":[["John 19:25","Now there stood by the cross of Jesus his mother, and his mother’s sister, Mary the wife of Cleophas, and Mary Magdalene."],["John 19:26","When Jesus therefore saw his mother, and the disciple standing by, whom he loved, he saith unto his mother, Woman, behold thy son!"],["John 19:27","Then saith he to the disciple, Behold thy mother! And from that hour that disciple took her unto his own home."]]}]},{"a":"jesus_905","b":"joseph_1715","type":"family","why":"Joseph took Mary as his wife and named her son Jesus, and with Mary raised him as his father.","refs":[{"ref":"Matthew 1:20–25","verses":[["Matthew 1:20","But while he thought on these things, behold, the angel of the Lord appeared unto him in a dream, saying, Joseph, thou son of David, fear not to take unto thee Mary thy wife: for that which is conceived in her is of the Holy Ghost."],["Matthew 1:21","And she shall bring forth a son, and thou shalt call his name JESUS: for he shall save his people from their sins."],["Matthew 1:22","Now all this was done, that it might be fulfilled which was spoken of the Lord by the prophet, saying,"],["Matthew 1:23","Behold, a virgin shall be with child, and shall bring forth a son, and they shall call his name Emmanuel, which being interpreted is, God with us."],["Matthew 1:24","Then Joseph being raised from sleep did as the angel of the Lord had bidden him, and took unto him his wife:"],["Matthew 1:25","And knew her not till she had brought forth her firstborn son: and he called his name JESUS."]]},{"ref":"Luke 2:41–51","verses":[["Luke 2:41","Now his parents went to Jerusalem every year at the feast of the passover."],["Luke 2:42","And when he was twelve years old, they went up to Jerusalem after the custom of the feast."],["Luke 2:43","And when they had fulfilled the days, as they returned, the child Jesus tarried behind in Jerusalem; and Joseph and his mother knew not of it."],["Luke 2:44","But they, supposing him to have been in the company, went a day’s journey; and they sought him among their kinsfolk and acquaintance."],["Luke 2:45","And when they found him not, they turned back again to Jerusalem, seeking him."],["Luke 2:46","And it came to pass, that after three days they found him in the temple, sitting in the midst of the doctors, both hearing them, and asking them questions."],["Luke 2:47","And all that heard him were astonished at his understanding and answers."],["Luke 2:48","And when they saw him, they were amazed: and his mother said unto him, Son, why hast thou thus dealt with us? behold, thy father and I have sought thee sorrowing."],["Luke 2:49","And he said unto them, How is it that ye sought me? wist ye not that I must be about my Father’s business?"],["Luke 2:50","And they understood not the saying which he spake unto them."],["Luke 2:51","And he went down with them, and came to Nazareth, and was subject unto them: but his mother kept all these sayings in her heart."]]}]},{"a":"jesus_905","b":"martha_1937","type":"loved","why":"Scripture says Jesus loved Martha; she received him into her house.","refs":[{"ref":"John 11:5","verses":[["John 11:5","Now Jesus loved Martha, and her sister, and Lazarus."]]},{"ref":"Luke 10:38–42","verses":[["Luke 10:38","Now it came to pass, as they went, that he entered into a certain village: and a certain woman named Martha received him into her house."],["Luke 10:39","And she had a sister called Mary, which also sat at Jesus’ feet, and heard his word."],["Luke 10:40","But Martha was cumbered about much serving, and came to him, and said, Lord, dost thou not care that my sister hath left me to serve alone? bid her therefore that she help me."],["Luke 10:41","And Jesus answered and said unto her, Martha, Martha, thou art careful and troubled about many things:"],["Luke 10:42","But one thing is needful: and Mary hath chosen that good part, which shall not be taken away from her."]]}]},{"a":"jesus_905","b":"mary_1939","type":"loved","why":"Scripture says Jesus loved Mary; she sat at his feet to hear his word and anointed his feet with costly ointment.","refs":[{"ref":"John 11:5","verses":[["John 11:5","Now Jesus loved Martha, and her sister, and Lazarus."]]},{"ref":"Luke 10:38–42","verses":[["Luke 10:38","Now it came to pass, as they went, that he entered into a certain village: and a certain woman named Martha received him into her house."],["Luke 10:39","And she had a sister called Mary, which also sat at Jesus’ feet, and heard his word."],["Luke 10:40","But Martha was cumbered about much serving, and came to him, and said, Lord, dost thou not care that my sister hath left me to serve alone? bid her therefore that she help me."],["Luke 10:41","And Jesus answered and said unto her, Martha, Martha, thou art careful and troubled about many things:"],["Luke 10:42","But one thing is needful: and Mary hath chosen that good part, which shall not be taken away from her."]]},{"ref":"John 12:1–8","verses":[["John 12:1","Then Jesus six days before the passover came to Bethany, where Lazarus was which had been dead, whom he raised from the dead."],["John 12:2","There they made him a supper; and Martha served: but Lazarus was one of them that sat at the table with him."],["John 12:3","Then took Mary a pound of ointment of spikenard, very costly, and anointed the feet of Jesus, and wiped his feet with her hair: and the house was filled with the odour of the ointment."],["John 12:4","Then saith one of his disciples, Judas Iscariot, Simon’s son, which should betray him,"],["John 12:5","Why was not this ointment sold for three hundred pence, and given to the poor?"],["John 12:6","This he said, not that he cared for the poor; but because he was a thief, and had the bag, and bare what was put therein."],["John 12:7","Then said Jesus, Let her alone: against the day of my burying hath she kept this."],["John 12:8","For the poor always ye have with you; but me ye have not always."]]}]},{"a":"jesus_905","b":"lazarus_1812","type":"loved","why":"Scripture says Jesus loved Lazarus.","refs":[{"ref":"John 11:1–5","verses":[["John 11:1","Now a certain man was sick, named Lazarus, of Bethany, the town of Mary and her sister Martha."],["John 11:2","It was that Mary which anointed the Lord with ointment, and wiped his feet with her hair, whose brother Lazarus was sick.)"],["John 11:3","Therefore his sisters sent unto him, saying, Lord, behold, he whom thou lovest is sick."],["John 11:4","When Jesus heard that, he said, This sickness is not unto death, but for the glory of God, that the Son of God might be glorified thereby."],["John 11:5","Now Jesus loved Martha, and her sister, and Lazarus."]]}]},{"a":"jesus_905","b":"lazarus_1812","type":"healed","why":"Jesus raised Lazarus from the dead after four days in the grave.","refs":[{"ref":"John 11:38–44","verses":[["John 11:38","Jesus therefore again groaning in himself cometh to the grave. It was a cave, and a stone lay upon it."],["John 11:39","Jesus said, Take ye away the stone. Martha, the sister of him that was dead, saith unto him, Lord, by this time he stinketh: for he hath been dead four days."],["John 11:40","Jesus saith unto her, Said I not unto thee, that, if thou wouldest believe, thou shouldest see the glory of God?"],["John 11:41","Then they took away the stone from the place where the dead was laid. And Jesus lifted up his eyes, and said, Father, I thank thee that thou hast heard me."],["John 11:42","And I knew that thou hearest me always: but because of the people which stand by I said it, that they may believe that thou hast sent me."],["John 11:43","And when he thus had spoken, he cried with a loud voice, Lazarus, come forth."],["John 11:44","And he that was dead came forth, bound hand and foot with graveclothes: and his face was bound about with a napkin. Jesus saith unto them, Loose him, and let him go."]]}]},{"a":"jesus_905","b":"mary_1943","type":"healed","why":"Jesus cast seven devils out of Mary Magdalene.","refs":[{"ref":"Luke 8:1–3","verses":[["Luke 8:1","And it came to pass afterward, that he went throughout every city and village, preaching and shewing the glad tidings of the kingdom of God: and the twelve were with him,"],["Luke 8:2","And certain women, which had been healed of evil spirits and infirmities, Mary called Magdalene, out of whom went seven devils,"],["Luke 8:3","And Joanna the wife of Chuza Herod’s steward, and Susanna, and many others, which ministered unto him of their substance."]]},{"ref":"Mark 16:9","verses":[["Mark 16:9","Now when Jesus was risen early the first day of the week, he appeared first to Mary Magdalene, out of whom he had cast seven devils."]]}]},{"a":"jesus_905","b":"mary_1943","type":"followed","why":"Mary Magdalene followed Jesus from Galilee and ministered to him, and was the first he appeared to when risen.","refs":[{"ref":"Matthew 27:55–56","verses":[["Matthew 27:55","And many women were there beholding afar off, which followed Jesus from Galilee, ministering unto him:"],["Matthew 27:56","Among which was Mary Magdalene, and Mary the mother of James and Joses, and the mother of Zebedee’s children."]]},{"ref":"John 20:11–18","verses":[["John 20:11","But Mary stood without at the sepulchre weeping: and as she wept, she stooped down, and looked into the sepulchre,"],["John 20:12","And seeth two angels in white sitting, the one at the head, and the other at the feet, where the body of Jesus had lain."],["John 20:13","And they say unto her, Woman, why weepest thou? She saith unto them, Because they have taken away my Lord, and I know not where they have laid him."],["John 20:14","And when she had thus said, she turned herself back, and saw Jesus standing, and knew not that it was Jesus."],["John 20:15","Jesus saith unto her, Woman, why weepest thou? whom seekest thou? She, supposing him to be the gardener, saith unto him, Sir, if thou have borne him hence, tell me where thou hast laid him, and I will take him away."],["John 20:16","Jesus saith unto her, Mary. She turned herself, and saith unto him, Rabboni; which is to say, Master."],["John 20:17","Jesus saith unto her, Touch me not; for I am not yet ascended to my Father: but go to my brethren, and say unto them, I ascend unto my Father, and your Father; and to my God, and your God."],["John 20:18","Mary Magdalene came and told the disciples that she had seen the Lord, and that he had spoken these things unto her."]]}]},{"a":"moses_2108","b":"jesus_905","type":"prophecy","why":"Moses foretold a prophet like himself whom the people must hear, and Peter preached that Jesus is that prophet; Jesus said Moses wrote of him.","refs":[{"ref":"Deuteronomy 18:15–19","verses":[["Deuteronomy 18:15","The LORD thy God will raise up unto thee a Prophet from the midst of thee, of thy brethren, like unto me; unto him ye shall hearken;"],["Deuteronomy 18:16","According to all that thou desiredst of the LORD thy God in Horeb in the day of the assembly, saying, Let me not hear again the voice of the LORD my God, neither let me see this great fire any more, that I die not."],["Deuteronomy 18:17","And the LORD said unto me, They have well spoken that which they have spoken."],["Deuteronomy 18:18","I will raise them up a Prophet from among their brethren, like unto thee, and will put my words in his mouth; and he shall speak unto them all that I shall command him."],["Deuteronomy 18:19","And it shall come to pass, that whosoever will not hearken unto my words which he shall speak in my name, I will require it of him."]]}],"fulfilled":[{"ref":"Acts 3:20–23","verses":[["Acts 3:20","And he shall send Jesus Christ, which before was preached unto you:"],["Acts 3:21","Whom the heaven must receive until the times of restitution of all things, which God hath spoken by the mouth of all his holy prophets since the world began."],["Acts 3:22","For Moses truly said unto the fathers, A prophet shall the Lord your God raise up unto you of your brethren, like unto me; him shall ye hear in all things whatsoever he shall say unto you."],["Acts 3:23","And it shall come to pass, that every soul, which will not hear that prophet, shall be destroyed from among the people."]]},{"ref":"John 5:46","verses":[["John 5:46","For had ye believed Moses, ye would have believed me: for he wrote of me."]]}]},{"a":"jesus_905","b":"nicodemus_2204","type":"helped","why":"Nicodemus spoke up for Jesus in the council, and after the crucifixion he brought spices and helped bury his body.","refs":[{"ref":"John 7:50–51","verses":[["John 7:50","Nicodemus saith unto them, (he that came to Jesus by night, being one of them,)"],["John 7:51","Doth our law judge any man, before it hear him, and know what he doeth?"]]},{"ref":"John 19:38–42","verses":[["John 19:38","And after this Joseph of Arimathaea, being a disciple of Jesus, but secretly for fear of the Jews, besought Pilate that he might take away the body of Jesus: and Pilate gave him leave. He came therefore, and took the body of Jesus."],["John 19:39","And there came also Nicodemus, which at the first came to Jesus by night, and brought a mixture of myrrh and aloes, about an hundred pound weight."],["John 19:40","Then took they the body of Jesus, and wound it in linen clothes with the spices, as the manner of the Jews is to bury."],["John 19:41","Now in the place where he was crucified there was a garden; and in the garden a new sepulchre, wherein was never man yet laid."],["John 19:42","There laid they Jesus therefore because of the Jews’ preparation day; for the sepulchre was nigh at hand."]]}]},{"a":"jesus_905","b":"zacchaeus_2961","type":"saved","why":"Jesus stayed at Zacchaeus's house and said, This day is salvation come to this house.","refs":[{"ref":"Luke 19:5–10","verses":[["Luke 19:5","And when Jesus came to the place, he looked up, and saw him, and said unto him, Zacchaeus, make haste, and come down; for to day I must abide at thy house."],["Luke 19:6","And he made haste, and came down, and received him joyfully."],["Luke 19:7","And when they saw it, they all murmured, saying, That he was gone to be guest with a man that is a sinner."],["Luke 19:8","And Zacchaeus stood, and said unto the Lord; Behold, Lord, the half of my goods I give to the poor; and if I have taken any thing from any man by false accusation, I restore him fourfold."],["Luke 19:9","And Jesus said unto him, This day is salvation come to this house, forsomuch as he also is a son of Abraham."],["Luke 19:10","For the Son of man is come to seek and to save that which was lost."]]}]},{"a":"jesus_905","b":"simeon_2742","type":"prophesied","why":"Simeon took the child Jesus in his arms, blessed God for him as His salvation, and said this child is set for the fall and rising again of many in Israel.","refs":[{"ref":"Luke 2:25–35","verses":[["Luke 2:25","And, behold, there was a man in Jerusalem, whose name was Simeon; and the same man was just and devout, waiting for the consolation of Israel: and the Holy Ghost was upon him."],["Luke 2:26","And it was revealed unto him by the Holy Ghost, that he should not see death, before he had seen the Lord’s Christ."],["Luke 2:27","And he came by the Spirit into the temple: and when the parents brought in the child Jesus, to do for him after the custom of the law,"],["Luke 2:28","Then took he him up in his arms, and blessed God, and said,"],["Luke 2:29","Lord, now lettest thou thy servant depart in peace, according to thy word:"],["Luke 2:30","For mine eyes have seen thy salvation,"],["Luke 2:31","Which thou hast prepared before the face of all people;"],["Luke 2:32","A light to lighten the Gentiles, and the glory of thy people Israel."],["Luke 2:33","And Joseph and his mother marvelled at those things which were spoken of him."],["Luke 2:34","And Simeon blessed them, and said unto Mary his mother, Behold, this child is set for the fall and rising again of many in Israel; and for a sign which shall be spoken against;"],["Luke 2:35","Yea, a sword shall pierce through thy own soul also,) that the thoughts of many hearts may be revealed."]]}]},{"a":"jesus_905","b":"paul_2479","type":"enemies","why":"Saul breathed out threatenings and slaughter against the disciples, and Jesus told him, \"I am Jesus whom thou persecutest.\"","refs":[{"ref":"Acts 9:1–6","verses":[["Acts 9:1","And Saul, yet breathing out threatenings and slaughter against the disciples of the Lord, went unto the high priest,"],["Acts 9:2","And desired of him letters to Damascus to the synagogues, that if he found any of this way, whether they were men or women, he might bring them bound unto Jerusalem."],["Acts 9:3","And as he journeyed, he came near Damascus: and suddenly there shined round about him a light from heaven:"],["Acts 9:4","And he fell to the earth, and heard a voice saying unto him, Saul, Saul, why persecutest thou me?"],["Acts 9:5","And he said, Who art thou, Lord? And the Lord said, I am Jesus whom thou persecutest: it is hard for thee to kick against the pricks."],["Acts 9:6","And he trembling and astonished said, Lord, what wilt thou have me to do? And the Lord said unto him, Arise, and go into the city, and it shall be told thee what thou must do."]]}]},{"a":"jesus_905","b":"paul_2479","type":"served","why":"Jesus appeared to Paul to make him a minister and witness, and Paul calls himself a servant of Jesus Christ.","refs":[{"ref":"Acts 26:15–18","verses":[["Acts 26:15","And I said, Who art thou, Lord? And he said, I am Jesus whom thou persecutest."],["Acts 26:16","But rise, and stand upon thy feet: for I have appeared unto thee for this purpose, to make thee a minister and a witness both of these things which thou hast seen, and of those things in the which I will appear unto thee;"],["Acts 26:17","Delivering thee from the people, and from the Gentiles, unto whom now I send thee,"],["Acts 26:18","To open their eyes, and to turn them from darkness to light, and from the power of Satan unto God, that they may receive forgiveness of sins, and inheritance among them which are sanctified by faith that is in me."]]},{"ref":"Romans 1:1","verses":[["Romans 1:1","Paul, a servant of Jesus Christ, called to be an apostle, separated unto the gospel of God,"]]}]},{"a":"jesus_905","b":"stephen_2802","type":"followed","why":"Stephen was chosen from among the disciples, and as he was stoned he saw Jesus at the right hand of God and prayed, Lord Jesus, receive my spirit.","refs":[{"ref":"Acts 6:1–5","verses":[["Acts 6:1","And in those days, when the number of the disciples was multiplied, there arose a murmuring of the Grecians against the Hebrews, because their widows were neglected in the daily ministration."],["Acts 6:2","Then the twelve called the multitude of the disciples unto them, and said, It is not reason that we should leave the word of God, and serve tables."],["Acts 6:3","Wherefore, brethren, look ye out among you seven men of honest report, full of the Holy Ghost and wisdom, whom we may appoint over this business."],["Acts 6:4","But we will give ourselves continually to prayer, and to the ministry of the word."],["Acts 6:5","And the saying pleased the whole multitude: and they chose Stephen, a man full of faith and of the Holy Ghost, and Philip, and Prochorus, and Nicanor, and Timon, and Parmenas, and Nicolas a proselyte of Antioch:"]]},{"ref":"Acts 7:55–60","verses":[["Acts 7:55","But he, being full of the Holy Ghost, looked up stedfastly into heaven, and saw the glory of God, and Jesus standing on the right hand of God,"],["Acts 7:56","And said, Behold, I see the heavens opened, and the Son of man standing on the right hand of God."],["Acts 7:57","Then they cried out with a loud voice, and stopped their ears, and ran upon him with one accord,"],["Acts 7:58","And cast him out of the city, and stoned him: and the witnesses laid down their clothes at a young man’s feet, whose name was Saul."],["Acts 7:59","And they stoned Stephen, calling upon God, and saying, Lord Jesus, receive my spirit."],["Acts 7:60","And he kneeled down, and cried with a loud voice, Lord, lay not this sin to their charge. And when he had said this, he fell asleep."]]},{"ref":"Acts 22:20","verses":[["Acts 22:20","And when the blood of thy martyr Stephen was shed, I also was standing by, and consenting unto his death, and kept the raiment of them that slew him."]]}]},{"a":"john_1676","b":"zacharias_2971","type":"family","why":"Zacharias was John's father; the angel promised him the son and he named him John.","refs":[{"ref":"Luke 1:13","verses":[["Luke 1:13","But the angel said unto him, Fear not, Zacharias: for thy prayer is heard; and thy wife Elisabeth shall bear thee a son, and thou shalt call his name John."]]},{"ref":"Luke 1:59–63","verses":[["Luke 1:59","And it came to pass, that on the eighth day they came to circumcise the child; and they called him Zacharias, after the name of his father."],["Luke 1:60","And his mother answered and said, Not so; but he shall be called John."],["Luke 1:61","And they said unto her, There is none of thy kindred that is called by this name."],["Luke 1:62","And they made signs to his father, how he would have him called."],["Luke 1:63","And he asked for a writing table, and wrote, saying, His name is John. And they marvelled all."]]}]},{"a":"john_1677","b":"peter_2745","type":"worked_together","why":"John and Peter were fishing partners, and later went up to the temple together, healed the lame man, and were sent together to Samaria.","refs":[{"ref":"Luke 5:10","verses":[["Luke 5:10","And so was also James, and John, the sons of Zebedee, which were partners with Simon. And Jesus said unto Simon, Fear not; from henceforth thou shalt catch men."]]},{"ref":"Acts 3:1–11","verses":[["Acts 3:1","Now Peter and John went up together into the temple at the hour of prayer, being the ninth hour."],["Acts 3:2","And a certain man lame from his mother’s womb was carried, whom they laid daily at the gate of the temple which is called Beautiful, to ask alms of them that entered into the temple;"],["Acts 3:3","Who seeing Peter and John about to go into the temple asked an alms."],["Acts 3:4","And Peter, fastening his eyes upon him with John, said, Look on us."],["Acts 3:5","And he gave heed unto them, expecting to receive something of them."],["Acts 3:6","Then Peter said, Silver and gold have I none; but such as I have give I thee: In the name of Jesus Christ of Nazareth rise up and walk."],["Acts 3:7","And he took him by the right hand, and lifted him up: and immediately his feet and ankle bones received strength."],["Acts 3:8","And he leaping up stood, and walked, and entered with them into the temple, walking, and leaping, and praising God."],["Acts 3:9","And all the people saw him walking and praising God:"],["Acts 3:10","And they knew that it was he which sat for alms at the Beautiful gate of the temple: and they were filled with wonder and amazement at that which had happened unto him."],["Acts 3:11","And as the lame man which was healed held Peter and John, all the people ran together unto them in the porch that is called Solomon’s, greatly wondering."]]},{"ref":"Acts 8:14–17","verses":[["Acts 8:14","Now when the apostles which were at Jerusalem heard that Samaria had received the word of God, they sent unto them Peter and John:"],["Acts 8:15","Who, when they were come down, prayed for them, that they might receive the Holy Ghost:"],["Acts 8:16","For as yet he was fallen upon none of them: only they were baptized in the name of the Lord Jesus.)"],["Acts 8:17","Then laid they their hands on them, and they received the Holy Ghost."]]}]},{"a":"joseph_1715","b":"mary_1938","type":"married","why":"Joseph took Mary as his wife as the angel commanded.","refs":[{"ref":"Matthew 1:18–25","verses":[["Matthew 1:18","Now the birth of Jesus Christ was on this wise: When as his mother Mary was espoused to Joseph, before they came together, she was found with child of the Holy Ghost."],["Matthew 1:19","Then Joseph her husband, being a just man, and not willing to make her a publick example, was minded to put her away privily."],["Matthew 1:20","But while he thought on these things, behold, the angel of the Lord appeared unto him in a dream, saying, Joseph, thou son of David, fear not to take unto thee Mary thy wife: for that which is conceived in her is of the Holy Ghost."],["Matthew 1:21","And she shall bring forth a son, and thou shalt call his name JESUS: for he shall save his people from their sins."],["Matthew 1:22","Now all this was done, that it might be fulfilled which was spoken of the Lord by the prophet, saying,"],["Matthew 1:23","Behold, a virgin shall be with child, and shall bring forth a son, and they shall call his name Emmanuel, which being interpreted is, God with us."],["Matthew 1:24","Then Joseph being raised from sleep did as the angel of the Lord had bidden him, and took unto him his wife:"],["Matthew 1:25","And knew her not till she had brought forth her firstborn son: and he called his name JESUS."]]}]},{"a":"joseph_1715","b":"simeon_2742","type":"blessed","why":"Simeon blessed Joseph and Mary when they brought the child Jesus to the temple.","refs":[{"ref":"Luke 2:27–34","verses":[["Luke 2:27","And he came by the Spirit into the temple: and when the parents brought in the child Jesus, to do for him after the custom of the law,"],["Luke 2:28","Then took he him up in his arms, and blessed God, and said,"],["Luke 2:29","Lord, now lettest thou thy servant depart in peace, according to thy word:"],["Luke 2:30","For mine eyes have seen thy salvation,"],["Luke 2:31","Which thou hast prepared before the face of all people;"],["Luke 2:32","A light to lighten the Gentiles, and the glory of thy people Israel."],["Luke 2:33","And Joseph and his mother marvelled at those things which were spoken of him."],["Luke 2:34","And Simeon blessed them, and said unto Mary his mother, Behold, this child is set for the fall and rising again of many in Israel; and for a sign which shall be spoken against;"]]}]},{"a":"jesus_905","b":"judas_1760","type":"apostle","why":"Jesus chose Judas Iscariot as one of his twelve apostles.","refs":[{"ref":"Matthew 10:4","verses":[["Matthew 10:4","Simon the Canaanite, and Judas Iscariot, who also betrayed him."]]}]},{"a":"jesus_905","b":"judas_1760","type":"followed","why":"Judas was one of Jesus' disciples and followed him.","refs":[{"ref":"Matthew 10:1–4","verses":[["Matthew 10:1","And when he had called unto him his twelve disciples, he gave them power against unclean spirits, to cast them out, and to heal all manner of sickness and all manner of disease."],["Matthew 10:2","Now the names of the twelve apostles are these; The first, Simon, who is called Peter, and Andrew his brother; James the son of Zebedee, and John his brother;"],["Matthew 10:3","Philip, and Bartholomew; Thomas, and Matthew the publican; James the son of Alphaeus, and Lebbaeus, whose surname was Thaddaeus;"],["Matthew 10:4","Simon the Canaanite, and Judas Iscariot, who also betrayed him."]]}]},{"a":"jesus_905","b":"judas_1760","type":"betrayed","why":"Judas betrayed Jesus to the chief priests for thirty pieces of silver and gave him up with a kiss.","refs":[{"ref":"Matthew 26:14–16","verses":[["Matthew 26:14","Then one of the twelve, called Judas Iscariot, went unto the chief priests,"],["Matthew 26:15","And said unto them, What will ye give me, and I will deliver him unto you? And they covenanted with him for thirty pieces of silver."],["Matthew 26:16","And from that time he sought opportunity to betray him."]]},{"ref":"Matthew 26:47–50","verses":[["Matthew 26:47","And while he yet spake, lo, Judas, one of the twelve, came, and with him a great multitude with swords and staves, from the chief priests and elders of the people."],["Matthew 26:48","Now he that betrayed him gave them a sign, saying, Whomsoever I shall kiss, that same is he: hold him fast."],["Matthew 26:49","And forthwith he came to Jesus, and said, Hail, master; and kissed him."],["Matthew 26:50","And Jesus said unto him, Friend, wherefore art thou come? Then came they, and laid hands on Jesus, and took him."]]}]},{"a":"lazarus_1812","b":"martha_1937","type":"family","why":"Martha and Mary were Lazarus's sisters.","refs":[{"ref":"John 11:1–3","verses":[["John 11:1","Now a certain man was sick, named Lazarus, of Bethany, the town of Mary and her sister Martha."],["John 11:2","It was that Mary which anointed the Lord with ointment, and wiped his feet with her hair, whose brother Lazarus was sick.)"],["John 11:3","Therefore his sisters sent unto him, saying, Lord, behold, he whom thou lovest is sick."]]}]},{"a":"lazarus_1812","b":"mary_1939","type":"family","why":"Mary, who anointed the Lord, was Lazarus's sister.","refs":[{"ref":"John 11:1–3","verses":[["John 11:1","Now a certain man was sick, named Lazarus, of Bethany, the town of Mary and her sister Martha."],["John 11:2","It was that Mary which anointed the Lord with ointment, and wiped his feet with her hair, whose brother Lazarus was sick.)"],["John 11:3","Therefore his sisters sent unto him, saying, Lord, behold, he whom thou lovest is sick."]]}]},{"a":"lydia_1837","b":"paul_2479","type":"helped","why":"Lydia, baptized after hearing Paul, took Paul and his company into her house, and they returned there after their release from prison.","refs":[{"ref":"Acts 16:13–15","verses":[["Acts 16:13","And on the sabbath we went out of the city by a river side, where prayer was wont to be made; and we sat down, and spake unto the women which resorted thither."],["Acts 16:14","And a certain woman named Lydia, a seller of purple, of the city of Thyatira, which worshipped God, heard us: whose heart the Lord opened, that she attended unto the things which were spoken of Paul."],["Acts 16:15","And when she was baptized, and her household, she besought us, saying, If ye have judged me to be faithful to the Lord, come into my house, and abide there. And she constrained us."]]},{"ref":"Acts 16:40","verses":[["Acts 16:40","And they went out of the prison, and entered into the house of Lydia: and when they had seen the brethren, they comforted them, and departed."]]}]},{"a":"mark_1679","b":"paul_2479","type":"worked_together","why":"Mark went out with Paul and Barnabas, and later Paul called him a fellow labourer and profitable to him for the ministry.","refs":[{"ref":"Acts 12:25","verses":[["Acts 12:25","And Barnabas and Saul returned from Jerusalem, when they had fulfilled their ministry, and took with them John, whose surname was Mark."]]},{"ref":"Philemon 1:24","verses":[["Philemon 1:24","Marcus, Aristarchus, Demas, Lucas, my fellowlabourers."]]},{"ref":"2 Timothy 4:11","verses":[["2 Timothy 4:11","Only Luke is with me. Take Mark, and bring him with thee: for he is profitable to me for the ministry."]]}]},{"a":"martha_1937","b":"mary_1939","type":"family","why":"Martha and Mary were sisters.","refs":[{"ref":"Luke 10:38–39","verses":[["Luke 10:38","Now it came to pass, as they went, that he entered into a certain village: and a certain woman named Martha received him into her house."],["Luke 10:39","And she had a sister called Mary, which also sat at Jesus’ feet, and heard his word."]]},{"ref":"John 11:1","verses":[["John 11:1","Now a certain man was sick, named Lazarus, of Bethany, the town of Mary and her sister Martha."]]}]},{"a":"mary_1938","b":"simeon_2742","type":"blessed","why":"Simeon blessed Mary and Joseph in the temple and told Mary a sword would pierce her own soul.","refs":[{"ref":"Luke 2:33–35","verses":[["Luke 2:33","And Joseph and his mother marvelled at those things which were spoken of him."],["Luke 2:34","And Simeon blessed them, and said unto Mary his mother, Behold, this child is set for the fall and rising again of many in Israel; and for a sign which shall be spoken against;"],["Luke 2:35","Yea, a sword shall pierce through thy own soul also,) that the thoughts of many hearts may be revealed."]]}]},{"a":"paul_2479","b":"silas_2740","type":"worked_together","why":"Paul chose Silas and they went out together, were beaten and imprisoned together at Philippi, and sang praises in prison.","refs":[{"ref":"Acts 15:40","verses":[["Acts 15:40","And Paul chose Silas, and departed, being recommended by the brethren unto the grace of God."]]},{"ref":"Acts 16:19–25","verses":[["Acts 16:19","And when her masters saw that the hope of their gains was gone, they caught Paul and Silas, and drew them into the marketplace unto the rulers,"],["Acts 16:20","And brought them to the magistrates, saying, These men, being Jews, do exceedingly trouble our city,"],["Acts 16:21","And teach customs, which are not lawful for us to receive, neither to observe, being Romans."],["Acts 16:22","And the multitude rose up together against them: and the magistrates rent off their clothes, and commanded to beat them."],["Acts 16:23","And when they had laid many stripes upon them, they cast them into prison, charging the jailor to keep them safely:"],["Acts 16:24","Who, having received such a charge, thrust them into the inner prison, and made their feet fast in the stocks."],["Acts 16:25","And at midnight Paul and Silas prayed, and sang praises unto God: and the prisoners heard them."]]}]},{"a":"paul_2479","b":"timotheus_2863","type":"followed","why":"Timothy fully knew Paul's doctrine and manner of life, and Paul calls him his own son in the faith.","refs":[{"ref":"2 Timothy 3:10","verses":[["2 Timothy 3:10","But thou hast fully known my doctrine, manner of life, purpose, faith, longsuffering, charity, patience,"]]},{"ref":"1 Timothy 1:2","verses":[["1 Timothy 1:2","Unto Timothy, my own son in the faith: Grace, mercy, and peace, from God our Father and Jesus Christ our Lord."]]}]},{"a":"paul_2479","b":"timotheus_2863","type":"worked_together","why":"Paul took Timothy with him, and Timothy served with Paul in the gospel as his workfellow.","refs":[{"ref":"Acts 16:1–3","verses":[["Acts 16:1","Then came he to Derbe and Lystra: and, behold, a certain disciple was there, named Timotheus, the son of a certain woman, which was a Jewess, and believed; but his father was a Greek:"],["Acts 16:2","Which was well reported of by the brethren that were at Lystra and Iconium."],["Acts 16:3","Him would Paul have to go forth with him; and took and circumcised him because of the Jews which were in those quarters: for they knew all that his father was a Greek."]]},{"ref":"Philippians 2:22","verses":[["Philippians 2:22","But ye know the proof of him, that, as a son with the father, he hath served with me in the gospel."]]},{"ref":"Romans 16:21","verses":[["Romans 16:21","Timotheus my workfellow, and Lucius, and Jason, and Sosipater, my kinsmen, salute you."]]}]},{"a":"paul_2479","b":"stephen_2802","type":"enemies","why":"Saul kept the clothes of those who stoned Stephen and consented to his death.","refs":[{"ref":"Acts 7:58–8:1","verses":[["Acts 7:58","And cast him out of the city, and stoned him: and the witnesses laid down their clothes at a young man’s feet, whose name was Saul."],["Acts 7:59","And they stoned Stephen, calling upon God, and saying, Lord Jesus, receive my spirit."],["Acts 7:60","And he kneeled down, and cried with a loud voice, Lord, lay not this sin to their charge. And when he had said this, he fell asleep."],["Acts 8:1","And Saul was consenting unto his death. And at that time there was a great persecution against the church which was at Jerusalem; and they were all scattered abroad throughout the regions of Judaea and Samaria, except the apostles."]]},{"ref":"Acts 22:20","verses":[["Acts 22:20","And when the blood of thy martyr Stephen was shed, I also was standing by, and consenting unto his death, and kept the raiment of them that slew him."]]}]},{"a":"paul_2479","b":"portius_2367","type":"judged","why":"Festus sat on the judgment seat and heard Paul's case, and when Paul appealed to Caesar, Festus sent him to Caesar.","refs":[{"ref":"Acts 25:1–12","verses":[["Acts 25:1","Now when Festus was come into the province, after three days he ascended from Caesarea to Jerusalem."],["Acts 25:2","Then the high priest and the chief of the Jews informed him against Paul, and besought him,"],["Acts 25:3","And desired favour against him, that he would send for him to Jerusalem, laying wait in the way to kill him."],["Acts 25:4","But Festus answered, that Paul should be kept at Caesarea, and that he himself would depart shortly thither."],["Acts 25:5","Let them therefore, said he, which among you are able, go down with me, and accuse this man, if there be any wickedness in him."],["Acts 25:6","And when he had tarried among them more than ten days, he went down unto Caesarea; and the next day sitting on the judgment seat commanded Paul to be brought."],["Acts 25:7","And when he was come, the Jews which came down from Jerusalem stood round about, and laid many and grievous complaints against Paul, which they could not prove."],["Acts 25:8","While he answered for himself, Neither against the law of the Jews, neither against the temple, nor yet against Caesar, have I offended any thing at all."],["Acts 25:9","But Festus, willing to do the Jews a pleasure, answered Paul, and said, Wilt thou go up to Jerusalem, and there be judged of these things before me?"],["Acts 25:10","Then said Paul, I stand at Caesar’s judgment seat, where I ought to be judged: to the Jews have I done no wrong, as thou very well knowest."],["Acts 25:11","For if I be an offender, or have committed any thing worthy of death, I refuse not to die: but if there be none of these things whereof these accuse me, no man may deliver me unto them. I appeal unto Caesar."],["Acts 25:12","Then Festus, when he had conferred with the council, answered, Hast thou appealed unto Caesar? unto Caesar shalt thou go."]]}]},{"a":"paul_2479","b":"philip_2347","type":"helped","why":"Philip the evangelist took Paul and his company into his house at Caesarea for many days.","refs":[{"ref":"Acts 21:8–10","verses":[["Acts 21:8","And the next day we that were of Paul’s company departed, and came unto Caesarea: and we entered into the house of Philip the evangelist, which was one of the seven; and abode with him."],["Acts 21:9","And the same man had four daughters, virgins, which did prophesy."],["Acts 21:10","And as we tarried there many days, there came down from Judaea a certain prophet, named Agabus."]]}]},{"a":"peter_2745","b":"simon_2752","type":"rebuked","why":"Peter rebuked Simon for trying to buy the gift of God with money and told him to repent.","refs":[{"ref":"Acts 8:18–24","verses":[["Acts 8:18","And when Simon saw that through laying on of the apostles’ hands the Holy Ghost was given, he offered them money,"],["Acts 8:19","Saying, Give me also this power, that on whomsoever I lay hands, he may receive the Holy Ghost."],["Acts 8:20","But Peter said unto him, Thy money perish with thee, because thou hast thought that the gift of God may be purchased with money."],["Acts 8:21","Thou hast neither part nor lot in this matter: for thy heart is not right in the sight of God."],["Acts 8:22","Repent therefore of this thy wickedness, and pray God, if perhaps the thought of thine heart may be forgiven thee."],["Acts 8:23","For I perceive that thou art in the gall of bitterness, and in the bond of iniquity."],["Acts 8:24","Then answered Simon, and said, Pray ye to the Lord for me, that none of these things which ye have spoken come upon me."]]}]},{"a":"philip_2347","b":"stephen_2802","type":"worked_together","why":"Stephen and Philip were both chosen among the seven and appointed to the same business.","refs":[{"ref":"Acts 6:3–6","verses":[["Acts 6:3","Wherefore, brethren, look ye out among you seven men of honest report, full of the Holy Ghost and wisdom, whom we may appoint over this business."],["Acts 6:4","But we will give ourselves continually to prayer, and to the ministry of the word."],["Acts 6:5","And the saying pleased the whole multitude: and they chose Stephen, a man full of faith and of the Holy Ghost, and Philip, and Prochorus, and Nicanor, and Timon, and Parmenas, and Nicolas a proselyte of Antioch:"],["Acts 6:6","Whom they set before the apostles: and when they had prayed, they laid their hands on them."]]}]},{"a":"philip_2347","b":"simon_2752","type":"followed","why":"Simon believed Philip's preaching, was baptized, and continued with Philip.","refs":[{"ref":"Acts 8:5–13","verses":[["Acts 8:5","Then Philip went down to the city of Samaria, and preached Christ unto them."],["Acts 8:6","And the people with one accord gave heed unto those things which Philip spake, hearing and seeing the miracles which he did."],["Acts 8:7","For unclean spirits, crying with loud voice, came out of many that were possessed with them: and many taken with palsies, and that were lame, were healed."],["Acts 8:8","And there was great joy in that city."],["Acts 8:9","But there was a certain man, called Simon, which beforetime in the same city used sorcery, and bewitched the people of Samaria, giving out that himself was some great one:"],["Acts 8:10","To whom they all gave heed, from the least to the greatest, saying, This man is the great power of God."],["Acts 8:11","And to him they had regard, because that of long time he had bewitched them with sorceries."],["Acts 8:12","But when they believed Philip preaching the things concerning the kingdom of God, and the name of Jesus Christ, they were baptized, both men and women."],["Acts 8:13","Then Simon himself believed also: and when he was baptized, he continued with Philip, and wondered, beholding the miracles and signs which were done."]]}]},{"a":"silas_2740","b":"timotheus_2863","type":"worked_together","why":"Silas and Timothy stayed on together at Berea and then came together to Paul at Corinth.","refs":[{"ref":"Acts 17:14–15","verses":[["Acts 17:14","And then immediately the brethren sent away Paul to go as it were to the sea: but Silas and Timotheus abode there still."],["Acts 17:15","And they that conducted Paul brought him unto Athens: and receiving a commandment unto Silas and Timotheus for to come to him with all speed, they departed."]]},{"ref":"Acts 18:5","verses":[["Acts 18:5","And when Silas and Timotheus were come from Macedonia, Paul was pressed in the spirit, and testified to the Jews that Jesus was Christ."]]}]},{"a":"bartholomew_405","b":"jesus_905","type":"apostle","why":"Jesus chose Bartholomew as one of his twelve apostles.","refs":[{"ref":"Luke 6:13–14","verses":[["Luke 6:13","And when it was day, he called unto him his disciples: and of them he chose twelve, whom also he named apostles;"],["Luke 6:14","Simon, (whom he also named Peter,) and Andrew his brother, James and John, Philip and Bartholomew,"]]}]},{"a":"bartholomew_405","b":"jesus_905","type":"followed","why":"Bartholomew was one of Jesus' disciples and followed him.","refs":[{"ref":"Matthew 10:1–3","verses":[["Matthew 10:1","And when he had called unto him his twelve disciples, he gave them power against unclean spirits, to cast them out, and to heal all manner of sickness and all manner of disease."],["Matthew 10:2","Now the names of the twelve apostles are these; The first, Simon, who is called Peter, and Andrew his brother; James the son of Zebedee, and John his brother;"],["Matthew 10:3","Philip, and Bartholomew; Thomas, and Matthew the publican; James the son of Alphaeus, and Lebbaeus, whose surname was Thaddaeus;"]]}]},{"a":"james_718","b":"jesus_905","type":"apostle","why":"Jesus chose James the son of Alphaeus as one of his twelve apostles.","refs":[{"ref":"Luke 6:13–15","verses":[["Luke 6:13","And when it was day, he called unto him his disciples: and of them he chose twelve, whom also he named apostles;"],["Luke 6:14","Simon, (whom he also named Peter,) and Andrew his brother, James and John, Philip and Bartholomew,"],["Luke 6:15","Matthew and Thomas, James the son of Alphaeus, and Simon called Zelotes,"]]}]},{"a":"james_718","b":"jesus_905","type":"followed","why":"James the son of Alphaeus was one of Jesus' disciples and followed him.","refs":[{"ref":"Matthew 10:1–3","verses":[["Matthew 10:1","And when he had called unto him his twelve disciples, he gave them power against unclean spirits, to cast them out, and to heal all manner of sickness and all manner of disease."],["Matthew 10:2","Now the names of the twelve apostles are these; The first, Simon, who is called Peter, and Andrew his brother; James the son of Zebedee, and John his brother;"],["Matthew 10:3","Philip, and Bartholomew; Thomas, and Matthew the publican; James the son of Alphaeus, and Lebbaeus, whose surname was Thaddaeus;"]]}]},{"a":"jesus_905","b":"lebbaeus_1815","type":"apostle","why":"Jesus chose Thaddaeus as one of his twelve apostles.","refs":[{"ref":"Mark 3:16–18","verses":[["Mark 3:16","And Simon he surnamed Peter;"],["Mark 3:17","And James the son of Zebedee, and John the brother of James; and he surnamed them Boanerges, which is, The sons of thunder:"],["Mark 3:18","And Andrew, and Philip, and Bartholomew, and Matthew, and Thomas, and James the son of Alphaeus, and Thaddaeus, and Simon the Canaanite,"]]}]},{"a":"jesus_905","b":"lebbaeus_1815","type":"followed","why":"Thaddaeus was one of Jesus' disciples and followed him.","refs":[{"ref":"Matthew 10:1–3","verses":[["Matthew 10:1","And when he had called unto him his twelve disciples, he gave them power against unclean spirits, to cast them out, and to heal all manner of sickness and all manner of disease."],["Matthew 10:2","Now the names of the twelve apostles are these; The first, Simon, who is called Peter, and Andrew his brother; James the son of Zebedee, and John his brother;"],["Matthew 10:3","Philip, and Bartholomew; Thomas, and Matthew the publican; James the son of Alphaeus, and Lebbaeus, whose surname was Thaddaeus;"]]}]},{"a":"jesus_905","b":"simon_2746","type":"apostle","why":"Jesus chose Simon Zelotes as one of his twelve apostles.","refs":[{"ref":"Luke 6:13–15","verses":[["Luke 6:13","And when it was day, he called unto him his disciples: and of them he chose twelve, whom also he named apostles;"],["Luke 6:14","Simon, (whom he also named Peter,) and Andrew his brother, James and John, Philip and Bartholomew,"],["Luke 6:15","Matthew and Thomas, James the son of Alphaeus, and Simon called Zelotes,"]]}]},{"a":"jesus_905","b":"simon_2746","type":"followed","why":"Simon Zelotes was one of Jesus' disciples and followed him.","refs":[{"ref":"Matthew 10:1–4","verses":[["Matthew 10:1","And when he had called unto him his twelve disciples, he gave them power against unclean spirits, to cast them out, and to heal all manner of sickness and all manner of disease."],["Matthew 10:2","Now the names of the twelve apostles are these; The first, Simon, who is called Peter, and Andrew his brother; James the son of Zebedee, and John his brother;"],["Matthew 10:3","Philip, and Bartholomew; Thomas, and Matthew the publican; James the son of Alphaeus, and Lebbaeus, whose surname was Thaddaeus;"],["Matthew 10:4","Simon the Canaanite, and Judas Iscariot, who also betrayed him."]]}]},{"a":"jesus_905","b":"joseph_1716","type":"followed","why":"Joseph of Arimathaea was Jesus' disciple, and he buried Jesus' body in his own new tomb.","refs":[{"ref":"Matthew 27:57–60","verses":[["Matthew 27:57","When the even was come, there came a rich man of Arimathaea, named Joseph, who also himself was Jesus’ disciple:"],["Matthew 27:58","He went to Pilate, and begged the body of Jesus. Then Pilate commanded the body to be delivered."],["Matthew 27:59","And when Joseph had taken the body, he wrapped it in a clean linen cloth,"],["Matthew 27:60","And laid it in his own new tomb, which he had hewn out in the rock: and he rolled a great stone to the door of the sepulchre, and departed."]]},{"ref":"John 19:38","verses":[["John 19:38","And after this Joseph of Arimathaea, being a disciple of Jesus, but secretly for fear of the Jews, besought Pilate that he might take away the body of Jesus: and Pilate gave him leave. He came therefore, and took the body of Jesus."]]}]},{"a":"joseph_1716","b":"nicodemus_2204","type":"worked_together","why":"Joseph and Nicodemus took Jesus' body together, wound it in linen with Nicodemus's spices, and laid it in the tomb.","refs":[{"ref":"John 19:38–42","verses":[["John 19:38","And after
