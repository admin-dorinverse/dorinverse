el 3:19","Then was Nebuchadnezzar full of fury, and the form of his visage was changed against Shadrach, Meshach, and Abednego: therefore he spake, and commanded that they should heat the furnace one seven times more than it was wont to be heated."],["Daniel 3:20","And he commanded the most mighty men that were in his army to bind Shadrach, Meshach, and Abednego, and to cast them into the burning fiery furnace."],["Daniel 3:21","Then these men were bound in their coats, their hosen, and their hats, and their other garments, and were cast into the midst of the burning fiery furnace."]]}]},{"a":"nebuchadnezzar_2167","b":"zedekiah_1950","type":"betrayed","why":"Nebuchadnezzar made Zedekiah king and made him swear by God, but Zedekiah rebelled against him.","refs":[{"ref":"2 Kings 24:17","verses":[["2 Kings 24:17","And the king of Babylon made Mattaniah his father’s brother king in his stead, and changed his name to Zedekiah."]]},{"ref":"2 Chronicles 36:13","verses":[["2 Chronicles 36:13","And he also rebelled against king Nebuchadnezzar, who had made him swear by God: but he stiffened his neck, and hardened his heart from turning unto the LORD God of Israel."]]}]},{"a":"nebuchadnezzar_2167","b":"zedekiah_1950","type":"enemies","why":"Nebuchadnezzar besieged Jerusalem, and Zedekiah was brought to him at Riblah, where his sons were slain before his eyes and his eyes put out.","refs":[{"ref":"2 Kings 25:1–7","verses":[["2 Kings 25:1","And it came to pass in the ninth year of his reign, in the tenth month, in the tenth day of the month, that Nebuchadnezzar king of Babylon came, he, and all his host, against Jerusalem, and pitched against it; and they built forts against it round about."],["2 Kings 25:2","And the city was besieged unto the eleventh year of king Zedekiah."],["2 Kings 25:3","And on the ninth day of the fourth month the famine prevailed in the city, and there was no bread for the people of the land."],["2 Kings 25:4","And the city was broken up, and all the men of war fled by night by the way of the gate between two walls, which is by the king’s garden: (now the Chaldees were against the city round about:) and the king went the way toward the plain."],["2 Kings 25:5","And the army of the Chaldees pursued after the king, and overtook him in the plains of Jericho: and all his army were scattered from him."],["2 Kings 25:6","So they took the king, and brought him up to the king of Babylon to Riblah; and they gave judgment upon him."],["2 Kings 25:7","And they slew the sons of Zedekiah before his eyes, and put out the eyes of Zedekiah, and bound him with fetters of brass, and carried him to Babylon."]]}]},{"a":"nehemiah_2172","b":"sanballat_2470","type":"enemies","why":"Sanballat mocked the rebuilding, conspired to fight against Jerusalem, and sought to draw Nehemiah out to do him mischief; Nehemiah counts him among 'our enemies.'","refs":[{"ref":"Nehemiah 4:7–8","verses":[["Nehemiah 4:7","But it came to pass, that when Sanballat, and Tobiah, and the Arabians, and the Ammonites, and the Ashdodites, heard that the walls of Jerusalem were made up, and that the breaches began to be stopped, then they were very wroth,"],["Nehemiah 4:8","And conspired all of them together to come and to fight against Jerusalem, and to hinder it."]]},{"ref":"Nehemiah 6:1–2","verses":[["Nehemiah 6:1","Now it came to pass, when Sanballat, and Tobiah, and Geshem the Arabian, and the rest of our enemies, heard that I had builded the wall, and that there was no breach left therein; (though at that time I had not set up the doors upon the gates;)"],["Nehemiah 6:2","That Sanballat and Geshem sent unto me, saying, Come, let us meet together in some one of the villages in the plain of Ono. But they thought to do me mischief."]]},{"ref":"Nehemiah 6:12–14","verses":[["Nehemiah 6:12","And, lo, I perceived that God had not sent him; but that he pronounced this prophecy against me: for Tobiah and Sanballat had hired him."],["Nehemiah 6:13","Therefore was he hired, that I should be afraid, and do so, and sin, and that they might have matter for an evil report, that they might reproach me."],["Nehemiah 6:14","My God, think thou upon Tobiah and Sanballat according to these their works, and on the prophetess Noadiah, and the rest of the prophets, that would have put me in fear."]]}]},{"a":"nehemiah_2172","b":"tobiah_2872","type":"enemies","why":"Tobiah was grieved at Nehemiah's coming, conspired against the work, and with Sanballat hired a prophet to make Nehemiah afraid; Nehemiah counts him among 'our enemies.'","refs":[{"ref":"Nehemiah 2:10","verses":[["Nehemiah 2:10","When Sanballat the Horonite, and Tobiah the servant, the Ammonite, heard of it, it grieved them exceedingly that there was come a man to seek the welfare of the children of Israel."]]},{"ref":"Nehemiah 6:1","verses":[["Nehemiah 6:1","Now it came to pass, when Sanballat, and Tobiah, and Geshem the Arabian, and the rest of our enemies, heard that I had builded the wall, and that there was no breach left therein; (though at that time I had not set up the doors upon the gates;)"]]},{"ref":"Nehemiah 6:12–14","verses":[["Nehemiah 6:12","And, lo, I perceived that God had not sent him; but that he pronounced this prophecy against me: for Tobiah and Sanballat had hired him."],["Nehemiah 6:13","Therefore was he hired, that I should be afraid, and do so, and sin, and that they might have matter for an evil report, that they might reproach me."],["Nehemiah 6:14","My God, think thou upon Tobiah and Sanballat according to these their works, and on the prophetess Noadiah, and the rest of the prophets, that would have put me in fear."]]},{"ref":"Nehemiah 13:7–8","verses":[["Nehemiah 13:7","And I came to Jerusalem, and understood of the evil that Eliashib did for Tobiah, in preparing him a chamber in the courts of the house of God."],["Nehemiah 13:8","And it grieved me sore: therefore I cast forth all the household stuff of Tobiah out of the chamber."]]}]},{"a":"sanballat_2470","b":"tobiah_2872","type":"worked_together","why":"Sanballat and Tobiah together scorned the rebuilding, conspired together against Jerusalem, and together hired a prophet against Nehemiah.","refs":[{"ref":"Nehemiah 2:19","verses":[["Nehemiah 2:19","But when Sanballat the Horonite, and Tobiah the servant, the Ammonite, and Geshem the Arabian, heard it, they laughed us to scorn, and despised us, and said, What is this thing that ye do? will ye rebel against the king?"]]},{"ref":"Nehemiah 4:7–8","verses":[["Nehemiah 4:7","But it came to pass, that when Sanballat, and Tobiah, and the Arabians, and the Ammonites, and the Ashdodites, heard that the walls of Jerusalem were made up, and that the breaches began to be stopped, then they were very wroth,"],["Nehemiah 4:8","And conspired all of them together to come and to fight against Jerusalem, and to hinder it."]]},{"ref":"Nehemiah 6:12–14","verses":[["Nehemiah 6:12","And, lo, I perceived that God had not sent him; but that he pronounced this prophecy against me: for Tobiah and Sanballat had hired him."],["Nehemiah 6:13","Therefore was he hired, that I should be afraid, and do so, and sin, and that they might have matter for an evil report, that they might reproach me."],["Nehemiah 6:14","My God, think thou upon Tobiah and Sanballat according to these their works, and on the prophetess Noadiah, and the rest of the prophets, that would have put me in fear."]]}]},{"a":"zechariah_3016","b":"zerubbabel_3054","type":"counseled","why":"Zechariah brought the word of the LORD to Zerubbabel, 'Not by might, nor by power, but by my spirit,' and said his hands would finish the house.","refs":[{"ref":"Zechariah 4:6–10","verses":[["Zechariah 4:6","Then he answered and spake unto me, saying, This is the word of the LORD unto Zerubbabel, saying, Not by might, nor by power, but by my spirit, saith the LORD of hosts."],["Zechariah 4:7","Who art thou, O great mountain? before Zerubbabel thou shalt become a plain: and he shall bring forth the headstone thereof with shoutings, crying, Grace, grace unto it."],["Zechariah 4:8","Moreover the word of the LORD came unto me, saying,"],["Zechariah 4:9","The hands of Zerubbabel have laid the foundation of this house; his hands shall also finish it; and thou shalt know that the LORD of hosts hath sent me unto you."],["Zechariah 4:10","For who hath despised the day of small things? for they shall rejoice, and shall see the plummet in the hand of Zerubbabel with those seven; they are the eyes of the LORD, which run to and fro through the whole earth."]]},{"ref":"Ezra 5:1–2","verses":[["Ezra 5:1","Then the prophets, Haggai the prophet, and Zechariah the son of Iddo, prophesied unto the Jews that were in Judah and Jerusalem in the name of the God of Israel, even unto them."],["Ezra 5:2","Then rose up Zerubbabel the son of Shealtiel, and Jeshua the son of Jozadak, and began to build the house of God which is at Jerusalem: and with them were the prophets of God helping them."]]}]},{"a":"eliphaz_1145","b":"job_1639","type":"friends","why":"Eliphaz was one of Job's three friends who came to mourn with him and comfort him, and in the end Job prayed for his friends.","refs":[{"ref":"Job 2:11–13","verses":[["Job 2:11","Now when Job’s three friends heard of all this evil that was come upon him, they came every one from his own place; Eliphaz the Temanite, and Bildad the Shuhite, and Zophar the Naamathite: for they had made an appointment together to come to mourn with him and to comfort him."],["Job 2:12","And when they lifted up their eyes afar off, and knew him not, they lifted up their voice, and wept; and they rent every one his mantle, and sprinkled dust upon their heads toward heaven."],["Job 2:13","So they sat down with him upon the ground seven days and seven nights, and none spake a word unto him: for they saw that his grief was very great."]]},{"ref":"Job 42:7–10","verses":[["Job 42:7","And it was so, that after the LORD had spoken these words unto Job, the LORD said to Eliphaz the Temanite, My wrath is kindled against thee, and against thy two friends: for ye have not spoken of me the thing that is right, as my servant Job hath."],["Job 42:8","Therefore take unto you now seven bullocks and seven rams, and go to my servant Job, and offer up for yourselves a burnt offering; and my servant Job shall pray for you: for him will I accept: lest I deal with you after your folly, in that ye have not spoken of me the thing which is right, like my servant Job."],["Job 42:9","So Eliphaz the Temanite and Bildad the Shuhite and Zophar the Naamathite went, and did according as the LORD commanded them: the LORD also accepted Job."],["Job 42:10","And the LORD turned the captivity of Job, when he prayed for his friends: also the LORD gave Job twice as much as he had before."]]}]},{"a":"bildad_499","b":"job_1639","type":"friends","why":"Bildad was one of Job's three friends who came to mourn with him and comfort him, and in the end Job prayed for his friends.","refs":[{"ref":"Job 2:11–13","verses":[["Job 2:11","Now when Job’s three friends heard of all this evil that was come upon him, they came every one from his own place; Eliphaz the Temanite, and Bildad the Shuhite, and Zophar the Naamathite: for they had made an appointment together to come to mourn with him and to comfort him."],["Job 2:12","And when they lifted up their eyes afar off, and knew him not, they lifted up their voice, and wept; and they rent every one his mantle, and sprinkled dust upon their heads toward heaven."],["Job 2:13","So they sat down with him upon the ground seven days and seven nights, and none spake a word unto him: for they saw that his grief was very great."]]},{"ref":"Job 42:7–10","verses":[["Job 42:7","And it was so, that after the LORD had spoken these words unto Job, the LORD said to Eliphaz the Temanite, My wrath is kindled against thee, and against thy two friends: for ye have not spoken of me the thing that is right, as my servant Job hath."],["Job 42:8","Therefore take unto you now seven bullocks and seven rams, and go to my servant Job, and offer up for yourselves a burnt offering; and my servant Job shall pray for you: for him will I accept: lest I deal with you after your folly, in that ye have not spoken of me the thing which is right, like my servant Job."],["Job 42:9","So Eliphaz the Temanite and Bildad the Shuhite and Zophar the Naamathite went, and did according as the LORD commanded them: the LORD also accepted Job."],["Job 42:10","And the LORD turned the captivity of Job, when he prayed for his friends: also the LORD gave Job twice as much as he had before."]]}]},{"a":"job_1639","b":"zophar_3105","type":"friends","why":"Zophar was one of Job's three friends who came to mourn with him and comfort him, and in the end Job prayed for his friends.","refs":[{"ref":"Job 2:11–13","verses":[["Job 2:11","Now when Job’s three friends heard of all this evil that was come upon him, they came every one from his own place; Eliphaz the Temanite, and Bildad the Shuhite, and Zophar the Naamathite: for they had made an appointment together to come to mourn with him and to comfort him."],["Job 2:12","And when they lifted up their eyes afar off, and knew him not, they lifted up their voice, and wept; and they rent every one his mantle, and sprinkled dust upon their heads toward heaven."],["Job 2:13","So they sat down with him upon the ground seven days and seven nights, and none spake a word unto him: for they saw that his grief was very great."]]},{"ref":"Job 42:7–10","verses":[["Job 42:7","And it was so, that after the LORD had spoken these words unto Job, the LORD said to Eliphaz the Temanite, My wrath is kindled against thee, and against thy two friends: for ye have not spoken of me the thing that is right, as my servant Job hath."],["Job 42:8","Therefore take unto you now seven bullocks and seven rams, and go to my servant Job, and offer up for yourselves a burnt offering; and my servant Job shall pray for you: for him will I accept: lest I deal with you after your folly, in that ye have not spoken of me the thing which is right, like my servant Job."],["Job 42:9","So Eliphaz the Temanite and Bildad the Shuhite and Zophar the Naamathite went, and did according as the LORD commanded them: the LORD also accepted Job."],["Job 42:10","And the LORD turned the captivity of Job, when he prayed for his friends: also the LORD gave Job twice as much as he had before."]]}]},{"a":"elihu_1130","b":"job_1639","type":"rebuked","why":"Elihu's wrath was kindled against Job because he justified himself rather than God, and he told Job, 'in this thou art not just.'","refs":[{"ref":"Job 32:2","verses":[["Job 32:2","Then was kindled the wrath of Elihu the son of Barachel the Buzite, of the kindred of Ram: against Job was his wrath kindled, because he justified himself rather than God."]]},{"ref":"Job 33:8–12","verses":[["Job 33:8","Surely thou hast spoken in mine hearing, and I have heard the voice of thy words, saying,"],["Job 33:9","I am clean without transgression, I am innocent; neither is there iniquity in me."],["Job 33:10","Behold, he findeth occasions against me, he counteth me for his enemy,"],["Job 33:11","He putteth my feet in the stocks, he marketh all my paths."],["Job 33:12","Behold, in this thou art not just: I will answer thee, that God is greater than man."]]},{"ref":"Job 34:35–37","verses":[["Job 34:35","Job hath spoken without knowledge, and his words were without wisdom."],["Job 34:36","My desire is that Job may be tried unto the end because of his answers for wicked men."],["Job 34:37","For he addeth rebellion unto his sin, he clappeth his hands among us, and multiplieth his words against God."]]}]},{"a":"bildad_499","b":"eliphaz_1145","type":"friends","why":"Bildad and Eliphaz were two of Job's three friends; they came together by appointment to comfort Job, and the LORD called Bildad and Zophar Eliphaz's \"two friends.\"","refs":[{"ref":"Job 2:11","verses":[["Job 2:11","Now w to my servant Job, and offer up for yourselves a burnt offering; and my servant Job shall pray for you: for him will I accept: lest I deal with you after your folly, in that ye have not spoken of me the thing which is right, like my servant Job."],["Job 42:9","So Eliphaz the Temanite and Bildad the Shuhite and Zophar the Naamathite went, and did according as the LORD commanded them: the LORD also accepted Job."]]}]},{"a":"bildad_499","b":"zophar_3105","type":"friends","why":"Bildad and Zophar were two of Job's three friends; they came together by appointment to comfort Job, and the LORD called them Eliphaz's \"two friends.\"","refs":[{"ref":"Job 2:11","verses":[["Job 2:11","Now when Job’s three friends heard of all this evil that was come upon him, they came every one from his own place; Eliphaz the Temanite, and Bildad the Shuhite, and Zophar the Naamathite: for they had made an appointment together to come to mourn with him and to comfort him."]]},{"ref":"Job 42:7–9","verses":[["Job 42:7","And it was so, that after the LORD had spoken these words unto Job, the LORD said to Eliphaz the Temanite, My wrath is kindled against thee, and against thy two friends: for ye have not spoken of me the thing that is right, as my servant Job hath."],["Job 42:8","Therefore take unto you now seven bullocks and seven rams, and go to my servant Job, and offer up for yourselves a burnt offering; and my servant Job shall pray for you: for him will I accept: lest I deal with you after your folly, in that ye have not spoken of me the thing which is right, like my servant Job."],["Job 42:9","So Eliphaz the Temanite and Bildad the Shuhite and Zophar the Naamathite went, and did according as the LORD commanded them: the LORD also accepted Job."]]}]},{"a":"elihu_1130","b":"eliphaz_1145","type":"rebuked","why":"Elihu's wrath was kindled against Job's three friends because they had found no answer and yet had condemned Job.","refs":[{"ref":"Job 32:1–3","verses":[["Job 32:1","So these three men ceased to answer Job, because he was righteous in his own eyes."],["Job 32:2","Then was kindled the wrath of Elihu the son of Barachel the Buzite, of the kindred of Ram: against Job was his wrath kindled, because he justified himself rather than God."],["Job 32:3","Also against his three friends was his wrath kindled, because they had found no answer, and yet had condemned Job."]]},{"ref":"Job 32:11–12","verses":[["Job 32:11","Behold, I waited for your words; I gave ear to your reasons, whilst ye searched out what to say."],["Job 32:12","Yea, I attended unto you, and, behold, there was none of you that convinced Job, or that answered his words:"]]}]},{"a":"bildad_499","b":"elihu_1130","type":"rebuked","why":"Elihu's wrath was kindled against Job's three friends because they had found no answer and yet had condemned Job.","refs":[{"ref":"Job 32:1–3","verses":[["Job 32:1","So these three men ceased to answer Job, because he was righteous in his own eyes."],["Job 32:2","Then was kindled the wrath of Elihu the son of Barachel the Buzite, of the kindred of Ram: against Job was his wrath kindled, because he justified himself rather than God."],["Job 32:3","Also against his three friends was his wrath kindled, because they had found no answer, and yet had condemned Job."]]},{"ref":"Job 32:11–12","verses":[["Job 32:11","Behold, I waited for your words; I gave ear to your reasons, whilst ye searched out what to say."],["Job 32:12","Yea, I attended unto you, and, behold, there was none of you that convinced Job, or that answered his words:"]]}]},{"a":"elihu_1130","b":"zophar_3105","type":"rebuked","why":"Elihu's wrath was kindled against Job's three friends because they had found no answer and yet had condemned Job.","refs":[{"ref":"Job 32:1–3","verses":[["Job 32:1","So these three men ceased to answer Job, because he was righteous in his own eyes."],["Job 32:2","Then was kindled the wrath of Elihu the son of Barachel the Buzite, of the kindred of Ram: against Job was his wrath kindled, because he justified himself rather than God."],["Job 32:3","Also against his three friends was his wrath kindled, because they had found no answer, and yet had condemned Job."]]},{"ref":"Job 32:11–12","verses":[["Job 32:11","Behold, I waited for your words; I gave ear to your reasons, whilst ye searched out what to say."],["Job 32:12","Yea, I attended unto you, and, behold, there was none of you that convinced Job, or that answered his words:"]]}]},{"a":"malachi_1899","b":"john_1676","type":"prophecy","why":"Malachi foretold the messenger who would prepare the way and the coming of Elijah, and Jesus said John the Baptist is that messenger and that Elijah.","refs":[{"ref":"Malachi 3:1","verses":[["Malachi 3:1","Behold, I will send my messenger, and he shall prepare the way before me: and the Lord, whom ye seek, shall suddenly come to his temple, even the messenger of the covenant, whom ye delight in: behold, he shall come, saith the LORD of hosts."]]},{"ref":"Malachi 4:5–6","verses":[["Malachi 4:5","Behold, I will send you Elijah the prophet before the coming of the great and dreadful day of the LORD:"],["Malachi 4:6","And he shall turn the heart of the fathers to the children, and the heart of the children to their fathers, lest I come and smite the earth with a curse."]]}],"fulfilled":[{"ref":"Matthew 11:10–14","verses":[["Matthew 11:10","For this is he, of whom it is written, Behold, I send my messenger before thy face, which shall prepare thy way before thee."],["Matthew 11:11","Verily I say unto you, Among them that are born of women there hath not risen a greater than John the Baptist: notwithstanding he that is least in the kingdom of heaven is greater than he."],["Matthew 11:12","And from the days of John the Baptist until now the kingdom of heaven suffereth violence, and the violent take it by force."],["Matthew 11:13","For all the prophets and the law prophesied until John."],["Matthew 11:14","And if ye will receive it, this is Elias, which was for to come."]]},{"ref":"Luke 1:17","verses":[["Luke 1:17","And he shall go before him in the spirit and power of Elias, to turn the hearts of the fathers to the children, and the disobedient to the wisdom of the just; to make ready a people prepared for the Lord."]]}]},{"a":"isaiah_617","b":"john_1676","type":"prophecy","why":"Isaiah foretold the voice crying in the wilderness, and scripture says John the Baptist is the one Isaiah spoke of.","refs":[{"ref":"Isaiah 40:3","verses":[["Isaiah 40:3","The voice of him that crieth in the wilderness, Prepare ye the way of the LORD, make straight in the desert a highway for our God."]]}],"fulfilled":[{"ref":"Matthew 3:1–3","verses":[["Matthew 3:1","In those days came John the Baptist, preaching in the wilderness of Judaea,"],["Matthew 3:2","And saying, Repent ye: for the kingdom of heaven is at hand."],["Matthew 3:3","For this is he that was spoken of by the prophet Esaias, saying, The voice of one crying in the wilderness, Prepare ye the way of the Lord, make his paths straight."]]},{"ref":"John 1:23","verses":[["John 1:23","He said, I am the voice of one crying in the wilderness, Make straight the way of the Lord, as said the prophet Esaias."]]}]},{"a":"isaiah_617","b":"jesus_905","type":"prophecy","why":"Isaiah foretold the Spirit-anointed preacher and the suffering servant, and scripture says these words were fulfilled in Jesus.","refs":[{"ref":"Isaiah 61:1–2","verses":[["Isaiah 61:1","The Spirit of the Lord GOD is upon me; because the LORD hath anointed me to preach good tidings unto the meek; he hath sent me to bind up the brokenhearted, to proclaim liberty to the captives, and the opening of the prison to them that are bound;"],["Isaiah 61:2","To proclaim the acceptable year of the LORD, and the day of vengeance of our God; to comfort all that mourn;"]]},{"ref":"Isaiah 53:4","verses":[["Isaiah 53:4","Surely he hath borne our griefs, and carried our sorrows: yet we did esteem him stricken, smitten of God, and afflicted."]]},{"ref":"Isaiah 53:7–8","verses":[["Isaiah 53:7","He was oppressed, and he was afflicted, yet he opened not his mouth: he is brought as a lamb to the slaughter, and as a sheep before her shearers is dumb, so he openeth not his mouth."],["Isaiah 53:8","He was taken from prison and from judgment: and who shall declare his generation? for he was cut off out of the land of the living: for the transgression of my people was he stricken."]]}],"fulfilled":[{"ref":"Luke 4:17–21","verses":[["Luke 4:17","And there was delivered unto him the book of the prophet Esaias. And when he had opened the book, he found the place where it was written,"],["Luke 4:18","The Spirit of the Lord is upon me, because he hath anointed me to preach the gospel to the poor; he hath sent me to heal the brokenhearted, to preach deliverance to the captives, and recovering of sight to the blind, to set at liberty them that are bruised,"],["Luke 4:19","To preach the acceptable year of the Lord."],["Luke 4:20","And he closed the book, and he gave it again to the minister, and sat down. And the eyes of all them that were in the synagogue were fastened on him."],["Luke 4:21","And he began to say unto them, This day is this scripture fulfilled in your ears."]]},{"ref":"Matthew 8:16–17","verses":[["Matthew 8:16","When the even was come, they brought unto him many that were possessed with devils: and he cast out the spirits with his word, and healed all that were sick:"],["Matthew 8:17","That it might be fulfilled which was spoken by Esaias the prophet, saying, Himself took our infirmities, and bare our sicknesses."]]},{"ref":"Acts 8:30–35","verses":[["Acts 8:30","And Philip ran thither to him, and heard him read the prophet Esaias, and said, Understandest thou what thou readest?"],["Acts 8:31","And he said, How can I, except some man should guide me? And he desired Philip that he would come up and sit with him."],["Acts 8:32","The place of the scripture which he read was this, He was led as a sheep to the slaughter; and like a lamb dumb before his shearer, so opened he not his mouth:"],["Acts 8:33","In his humiliation his judgment was taken away: and who shall declare his generation? for his life is taken from the earth."],["Acts 8:34","And the eunuch answered Philip, and said, I pray thee, of whom speaketh the prophet this? of himself, or of some other man?"],["Acts 8:35","Then Philip opened his mouth, and began at the same scripture, and preached unto him Jesus."]]}]},{"a":"jehoiachin_791","b":"jeremiah_853","type":"prophesied","why":"Jeremiah spoke the LORD's word against Coniah (Jehoiachin): he would be given into Nebuchadrezzar's hand, cast out with his mother to die in another land, and written childless as to the throne of David.","refs":[{"ref":"Jeremiah 22:24–30","verses":[["Jeremiah 22:24","As I live, saith the LORD, though Coniah the son of Jehoiakim king of Judah were the signet upon my right hand, yet would I pluck thee thence;"],["Jeremiah 22:25","And I will give thee into the hand of them that seek thy life, and into the hand of them whose face thou fearest, even into the hand of Nebuchadrezzar king of Babylon, and into the hand of the Chaldeans."],["Jeremiah 22:26","And I will cast thee out, and thy mother that bare thee, into another country, where ye were not born; and there shall ye die."],["Jeremiah 22:27","But to the land whereunto they desire to return, thither shall they not return."],["Jeremiah 22:28","Is this man Coniah a despised broken idol? is he a vessel wherein is no pleasure? wherefore are they cast out, he and his seed, and are cast into a land which they know not?"],["Jeremiah 22:29","O earth, earth, earth, hear the word of the LORD."],["Jeremiah 22:30","Thus saith the LORD, Write ye this man childless, a man that shall not prosper in his days: for no man of his seed shall prosper, sitting upon the throne of David, and ruling any more in Judah."]]}]},{"a":"jeremiah_853","b":"herod_1504","type":"prophecy","why":"Jeremiah spoke of Rachel weeping for her children, and Matthew says Herod's slaughter of the children of Bethlehem fulfilled it.","refs":[{"ref":"Jeremiah 31:15","verses":[["Jeremiah 31:15","Thus saith the LORD; A voice was heard in Ramah, lamentation, and bitter weeping; Rahel weeping for her children refused to be comforted for her children, because they were not."]]}],"fulfilled":[{"ref":"Matthew 2:16–18","verses":[["Matthew 2:16","Then Herod, when he saw that he was mocked of the wise men, was exceeding wroth, and sent forth, and slew all the children that were in Bethlehem, and in all the coasts thereof, from two years old and under, according to the time which he had diligently enquired of the wise men."],["Matthew 2:17","Then was fulfilled that which was spoken by Jeremy the prophet, saying,"],["Matthew 2:18","In Rama was there a voice heard, lamentation, and weeping, and great mourning, Rachel weeping for her children, and would not be comforted, because they are not."]]}]},{"a":"david_994","b":"judas_1760","type":"prophecy","why":"David wrote in the psalms 'let their habitation be desolate' and 'let another take his office,' and Peter said the Holy Ghost spoke these by David concerning Judas.","refs":[{"ref":"Psalm 69:25","verses":[["Psalm 69:25","Let their habitation be desolate; and let none dwell in their tents."]]},{"ref":"Psalm 109:8","verses":[["Psalm 109:8","Let his days be few; and let another take his office."]]}],"fulfilled":[{"ref":"Acts 1:16–20","verses":[["Acts 1:16","Men and brethren, this scripture must needs have been fulfilled, which the Holy Ghost by the mouth of David spake before concerning Judas, which was guide to them that took Jesus."],["Acts 1:17","For he was numbered with us, and had obtained part of this ministry."],["Acts 1:18","Now this man purchased a field with the reward of iniquity; and falling headlong, he burst asunder in the midst, and all his bowels gushed out."],["Acts 1:19","And it was known unto all the dwellers at Jerusalem; insomuch as that field is called in their proper tongue, Aceldama, that is to say, The field of blood."],["Acts 1:20","For it is written in the book of Psalms, Let his habitation be desolate, and let no man dwell therein: and his bishoprick let another take."]]}]},{"a":"david_994","b":"jesus_905","type":"family","why":"Scripture calls Jesus Christ 'the son of David' and says He was made of the seed of David according to the flesh.","refs":[{"ref":"Matthew 1:1","verses":[["Matthew 1:1","The book of the generation of Jesus Christ, the son of David, the son of Abraham."]]},{"ref":"Romans 1:3","verses":[["Romans 1:3","Concerning his Son Jesus Christ our Lord, which was made of the seed of David according to the flesh;"]]}]},{"a":"david_994","b":"jesus_905","type":"prophecy","why":"David wrote that God would not suffer His Holy One to see corruption, and Peter said David, being a prophet, spoke of the resurrection of Christ.","refs":[{"ref":"Psalm 16:8–11","verses":[["Psalm 16:8","I have set the LORD always before me: because he is at my right hand, I shall not be moved."],["Psalm 16:9","Therefore my heart is glad, and my glory rejoiceth: my flesh also shall rest in hope."],["Psalm 16:10","For thou wilt not leave my soul in hell; neither wilt thou suffer thine Holy One to see corruption."],["Psalm 16:11","Thou wilt shew me the path of life: in thy presence is fulness of joy; at thy right hand there are pleasures for evermore."]]},{"ref":"Psalm 110:1","verses":[["Psalm 110:1","The LORD said unto my Lord, Sit thou at my right hand, until I make thine enemies thy footstool."]]}],"fulfilled":[{"ref":"Acts 2:25–31","verses":[["Acts 2:25","For David speaketh concerning him, I foresaw the Lord always before my face, for he is on my right hand, that I should not be moved:"],["Acts 2:26","Therefore did my heart rejoice, and my tongue was glad; moreover also my flesh shall rest in hope:"],["Acts 2:27","Because thou wilt not leave my soul in hell, neither wilt thou suffer thine Holy One to see corruption."],["Acts 2:28","Thou hast made known to me the ways of life; thou shalt make me full of joy with thy countenance."],["Acts 2:29","Men and brethren, let me freely speak unto you of the patriarch David, that he is both dead and buried, and his sepulchre is with us unto this day."],["Acts 2:30","Therefore being a prophet, and knowing that God had sworn with an oath to him, that of the fruit of his loins, according to the flesh, he would raise up Christ to sit on his throne;"],["Acts 2:31","He seeing this before spake of the resurrection of Christ, that his soul was not left in hell, neither his flesh did see corruption."]]},{"ref":"Matthew 22:41–45","verses":[["Matthew 22:41","While the Pharisees were gathered together, Jesus asked them,"],["Matthew 22:42","Saying, What think ye of Christ? whose son is he? They say unto him, The Son of David."],["Matthew 22:43","He saith unto them, How then doth David in spirit call him Lord, saying,"],["Matthew 22:44","The LORD said unto my Lord, Sit thou on my right hand, till I make thine enemies thy footstool?"],["Matthew 22:45","If David then call him Lord, how is he his son?"]]}]},{"a":"azariah_545","b":"shadrach_1398","type":"friends","why":"Abednego and Shadrach were both Daniel's companions; they were set over the province of Babylon together, refused together to worship the golden image, and were cast into the furnace together and delivered.","refs":[{"ref":"Daniel 2:17–18","verses":[["Daniel 2:17","Then Daniel went to his house, and made the thing known to Hananiah, Mishael, and Azariah, his companions:"],["Daniel 2:18","That they would desire mercies of the God of heaven concerning this secret; that Daniel and his fellows should not perish with the rest of the wise men of Babylon."]]},{"ref":"Daniel 2:49","verses":[["Daniel 2:49","Then Daniel requested of the king, and he set Shadrach, Meshach, and Abednego, over the affairs of the province of Babylon: but Daniel sat in the gate of the king."]]},{"ref":"Daniel 3:16–27","verses":[["Daniel 3:16","Shadrach, Meshach, and Abednego, answered and said to the king, O Nebuchadnezzar, we are not careful to answer thee in this matter."],["Daniel 3:17","If it be so, our God whom we serve is able to deliver us from the burning fiery furnace, and he will deliver us out of thine hand, O king."],["Daniel 3:18","But if not, be it known unto thee, O king, that we will not serve thy gods, nor worship the golden image which thou hast set up."],["Daniel 3:19","Then was Nebuchadnezzar full of fury, and the form of his visage was changed against Shadrach, Meshach, and Abednego: therefore he spake, and commanded that they should heat the furnace one seven times more than it was wont to be heated."],["Daniel 3:20","And he commanded the most mighty men that were in his army to bind Shadrach, Meshach, and Abednego, and to cast them into the burning fiery furnace."],["Daniel 3:21","Then these men were bound in their coats, their hosen, and their hats, and their other garments, and were cast into the midst of the burning fiery furnace."],["Daniel 3:22","Therefore because the king’s commandment was urgent, and the furnace exceeding hot, the flame of the fire slew those men that took up Shadrach, Meshach, and Abednego."],["Daniel 3:23","And these three men, Shadrach, Meshach, and Abednego, fell down bound into the midst of the burning fiery furnace."],["Daniel 3:24","Then Nebuchadnezzar the king was astonied, and rose up in haste, and spake, and said unto his counsellors, Did not we cast three men bound into the midst of the fire? They answered and said unto the king, True, O king."],["Daniel 3:25","He answered and said, Lo, I see four men loose, walking in the midst of the fire, and they have no hurt; and the form of the fourth is like the Son of God."],["Daniel 3:26","Then Nebuchadnezzar came near to the mouth of the burning fiery furnace, and spake, and said, Shadrach, Meshach, and Abednego, ye servants of the most high God, come forth, and come hither. Then Shadrach, Meshach, and Abednego, came forth of the midst of the fire."],["Daniel 3:27","And the princes, governors, and captains, and the king’s counsellors, being gathered together, saw these men, upon whose bodies the fire had no power, nor was an hair of their head singed, neither were their coats changed, nor the smell of fire had passed on them."]]}]},{"a":"azariah_545","b":"meshach_2092","type":"friends","why":"Abednego and Meshach were both Daniel's companions; they were set over the province of Babylon together, refused together to worship the golden image, and were cast into the furnace together and delivered.","refs":[{"ref":"Daniel 2:17–18","verses":[["Daniel 2:17","Then Daniel went to his house, and made the thing known to Hananiah, Mishael, and Azariah, his companions:"],["Daniel 2:18","That they would desire mercies of the God of heaven concerning this secret; that Daniel and his fellows should not perish with the rest of the wise men of Babylon."]]},{"ref":"Daniel 2:49","verses":[["Daniel 2:49","Then Daniel requested of the king, and he set Shadrach, Meshach, and Abednego, over the affairs of the province of Babylon: but Daniel sat in the gate of the king."]]},{"ref":"Daniel 3:16–27","verses":[["Daniel 3:16","Shadrach, Meshach, and Abednego, answered and said to the king, O Nebuchadnezzar, we are not careful to answer thee in this matter."],["Daniel 3:17","If it be so, our God whom we serve is able to deliver us from the burning fiery furnace, and he will deliver us out of thine hand, O king."],["Daniel 3:18","But if not, be it known unto thee, O king, that we will not serve thy gods, nor worship the golden image which thou hast set up."],["Daniel 3:19","Then was Nebuchadnezzar full of fury, and the form of his visage was changed against Shadrach, Meshach, and Abednego: therefore he spake, and commanded that they should heat the furnace one seven times more than it was wont to be heated."],["Daniel 3:20","And he commanded the most mighty men that were in his army to bind Shadrach, Meshach, and Abednego, and to cast them into the burning fiery furnace."],["Daniel 3:21","Then these men were bound in their coats, their hosen, and their hats, and their other garments, and were cast into the midst of the burning fiery furnace."],["Daniel 3:22","Therefore because the king’s commandment was urgent, and the furnace exceeding hot, the flame of the fire slew those men that took up Shadrach, Meshach, and Abednego."],["Daniel 3:23","And these three men, Shadrach, Meshach, and Abednego, fell down bound into the midst of the burning fiery furnace."],["Daniel 3:24","Then Nebuchadnezzar the king was astonied, and rose up in haste, and spake, and said unto his counsellors, Did not we cast three men bound into the midst of the fire? They answered and said unto the king, True, O king."],["Daniel 3:25","He answered and said, Lo, I see four men loose, walking in the midst of the fire, and they have no hurt; and the form of the fourth is like the Son of God."],["Daniel 3:26","Then Nebuchadnezzar came near to the mouth of the burning fiery furnace, and spake, and said, Shadrach, Meshach, and Abednego, ye servants of the most high God, come forth, and come hither. Then Shadrach, Meshach, and Abednego, came forth of the midst of the fire."],["Daniel 3:27","And the princes, governors, and captains, and the king’s counsellors, being gathered together, saw these men, upon whose bodies the fire had no power, nor was an hair of their head singed, neither were their coats changed, nor the smell of fire had passed on them."]]}]},{"a":"azariah_545","b":"daniel_975","type":"friends","why":"Daniel called Azariah (Abednego) one of his companions; they were taken captive together, and Daniel asked him to pray with him for mercy over the king's dream.","refs":[{"ref":"Daniel 1:6–7","verses":[["Daniel 1:6","Now among these were of the children of Judah, Daniel, Hananiah, Mishael, and Azariah:"],["Daniel 1:7","Unto whom the prince of the eunuchs gave names: for he gave unto Daniel the name of Belteshazzar; and to Hananiah, of Shadrach; and to Mishael, of Meshach; and to Azariah, of Abednego."]]},{"ref":"Daniel 2:17–18","verses":[["Daniel 2:17","Then Daniel went to his house, and made the thing known to Hananiah, Mishael, and Azariah, his companions:"],["Daniel 2:18","That they would desire mercies of the God of heaven concerning this secret; that Daniel and his fellows should not perish with the rest of the wise men of Babylon."]]}]},{"a":"azariah_545","b":"nebuchadnezzar_2167","type":"served","why":"Nebuchadnezzar set Abednego over the affairs of the province of Babylon and, after the furnace, promoted him.","refs":[{"ref":"Daniel 2:49","verses":[["Daniel 2:49","Then Daniel requested of the king, and he set Shadrach, Meshach, and Abednego, over the affairs of the province of Babylon: but Daniel sat in the gate of the king."]]},{"ref":"Daniel 3:30","verses":[["Daniel 3:30","Then the king promoted Shadrach, Meshach, and Abednego, in the province of Babylon."]]}]},{"a":"azariah_545","b":"nebuchadnezzar_2167","type":"enemies","why":"When Abednego would not serve his gods, Nebuchadnezzar in fury had him bound and cast into the burning fiery furnace.","refs":[{"ref":"Daniel 3:12–21","verses":[["Daniel 3:12","There are certain Jews whom thou hast set over the affairs of the province of Babylon, Shadrach, Meshach, and Abednego; these men, O king, have not regarded thee: they serve not thy gods, nor worship the golden image which thou hast set up."],["Daniel 3:13","Then Nebuchadnezzar in his rage and fury commanded to bring Shadrach, Meshach, and Abednego. Then they brought these men before the king."],["Daniel 3:14","Nebuchadnezzar spake and said unto them, Is it true, O Shadrach, Meshach, and Abednego, do not ye serve my gods, nor worship the golden image which I have set up?"],["Daniel 3:15","Now if ye be ready that at what time ye hear the sound of the cornet, flute, harp, sackbut, psaltery, and dulcimer, and all kinds of musick, ye fall down and worship the image which I have made; well: but if ye worship not, ye shall be cast the same hour into the midst of a burning fiery furnace; and who is that God that shall deliver you out of my hands?"],["Daniel 3:16","Shadrach, Meshach, and Abednego, answered and said to the king, O Nebuchadnezzar, we are not careful to answer thee in this matter."],["Daniel 3:17","If it be so, our God whom we serve is able to deliver us from the burning fiery furnace, and he will deliver us out of thine hand, O king."],["Daniel 3:18","But if not, be it known unto thee, O king, that we will not serve thy gods, nor worship the golden image which thou hast set up."],["Daniel 3:19","Then was Nebuchadnezzar full of fury, and the form of his visage was changed against Shadrach, Meshach, and Abednego: therefore he spake, and commanded that they should heat the furnace one seven times more than it was wont to be heated."],["Daniel 3:20","And he commanded the most mighty men that were in his army to bind Shadrach, Meshach, and Abednego, and to cast them into the burning fiery furnace."],["Daniel 3:21","Then these men were bound in their coats, their hosen, and their hats, and their other garments, and were cast into the midst of the burning fiery furnace."]]}]},{"a":"joel_1660","b":"peter_2745","type":"prophecy","why":"Joel foretold God pouring out His Spirit on all flesh, and when Peter and the disciples were filled with the Holy Ghost, Peter said this was what Joel had spoken.","refs":[{"ref":"Joel 2:28–32","verses":[["Joel 2:28","And it shall come to pass afterward, that I will pour out my spirit upon all flesh; and your sons and your daughters shall prophesy, your old men shall dream dreams, your young men shall see visions:"],["Joel 2:29","And also upon the servants and upon the handmaids in those days will I pour out my spirit."],["Joel 2:30","And I will shew wonders in the heavens and in the earth, blood, and fire, and pillars of smoke."],["Joel 2:31","The sun shall be turned into darkness, and the moon into blood, before the great and the terrible day of the LORD come."],["Joel 2:32","And it shall come to pass, that whosoever shall call on the name of the LORD shall be delivered: for in mount Zion and in Jerusalem shall be deliverance, as the LORD hath said, and in the remnant whom the LORD shall call."]]}],"fulfilled":[{"ref":"Acts 2:1–4","verses":[["Acts 2:1","And when the day of Pentecost was fully come, they were all with one accord in one place."],["Acts 2:2","And suddenly there came a sound from heaven as of a rushing mighty wind, and it filled all the house where they were sitting."],["Acts 2:3","And there appeared unto them cloven tongues like as of fire, and it sat upon each of them."],["Acts 2:4","And they were all filled with the Holy Ghost, and began to speak with other tongues, as the Spirit gave them utterance."]]},{"ref":"Acts 2:14–18","verses":[["Acts 2:14","But Peter, standing up with the eleven, lifted up his voice, and said unto them, Ye men of Judaea, and all ye that dwell at Jerusalem, be this known unto you, and hearken to my words:"],["Acts 2:15","For these are not drunken, as ye suppose, seeing it is but the third hour of the day."],["Acts 2:16","But this is that which was spoken by the prophet Joel;"],["Acts 2:17","And it shall come to pass in the last days, saith God, I will pour out of my Spirit upon all flesh: and your sons and your daughters shall prophesy, and your young men shall see visions, and your old men shall dream dreams:"],["Acts 2:18","And on my servants and on my handmaidens I will pour out in those days of my Spirit; and they shall prophesy:"]]}]},{"a":"agrippa_111","b":"paul_2479","type":"judged","why":"Paul answered for himself before King Agrippa, who heard him and said Paul might have been set at liberty if he had not appealed to Caesar.","refs":[{"ref":"Acts 25:22–23","verses":[["Acts 25:22","Then Agrippa said unto Festus, I would also hear the man myself. To morrow, said he, thou shalt hear him."],["Acts 25:23","And on the morrow, when Agrippa was come, and Bernice, with great pomp, and was entered into the place of hearing, with the chief captains, and principal men of the city, at Festus’ commandment Paul was brought forth."]]},{"ref":"Acts 26:1–3","verses":[["Acts 26:1","Then Agrippa said unto Paul, Thou art permitted to speak for thyself. Then Paul stretched forth the hand, and answered for himself:"],["Acts 26:2","I think myself happy, king Agrippa, because I shall answer for myself this day before thee touching all the things whereof I am accused of the Jews:"],["Acts 26:3","Especially because I know thee to be expert in all customs and questions which are among the Jews: wherefore I beseech thee to hear me patiently."]]},{"ref":"Acts 26:30–32","verses":[["Acts 26:30","And when he had thus spoken, the king rose up, and the governor, and Bernice, and they that sat with them:"],["Acts 26:31","And when they were gone aside, they talked between themselves, saying, This man doeth nothing worthy of death or of bonds."],["Acts 26:32","Then said Agrippa unto Festus, This man might have been set at liberty, if he had not appealed unto Caesar."]]}]},{"a":"agrippa_111","b":"portius_2367","type":"counseled","why":"Festus laid Paul's case before King Agrippa and brought Paul before him so that he would have something to write to Caesar, and Agrippa told Festus that Paul might have been set at liberty.","refs":[{"ref":"Acts 25:13–14","verses":[["Acts 25:13","And after certain days king Agrippa and Bernice came unto Caesarea to salute Festus."],["Acts 25:14","And when they had been there many days, Festus declared Paul’s cause unto the king, saying, There is a certain man left in bonds by Felix:"]]},{"ref":"Acts 25:22–27","verses":[["Acts 25:22","Then Agrippa said unto Festus, I would also hear the man myself. To morrow, said he, thou shalt hear him."],["Acts 25:23","And on the morrow, when Agrippa was come, and Bernice, with great pomp, and was entered into the place of hearing, with the chief captains, and principal men of the city, at Festus’ commandment Paul was brought forth."],["Acts 25:24","And Festus said, King Agrippa, and all men which are here present with us, ye see this man, about whom all the multitude of the Jews have dealt with me, both at Jerusalem, and also here, crying that he ought not to live any longer."],["Acts 25:25","But when I found that he had committed nothing worthy of death, and that he himself hath appealed to Augustus, I have determined to send him."],["Acts 25:26","Of whom I have no certain thing to write unto my lord. Wherefore I have brought him forth before you, and specially before thee, O king Agrippa, that, after examination had, I might have somewhat to write."],["Acts 25:27","For it seemeth to me unreasonable to send a prisoner, and not withal to signify the crimes laid against him."]]},{"ref":"Acts 26:30–32","verses":[["Acts 26:30","And when he had thus spoken, the king rose up, and the governor, and Bernice, and they that sat with them:"],["Acts 26:31","And when they were gone aside, they talked between themselves, saying, This man doeth nothing worthy of death or of bonds."],["Acts 26:32","Then said Agrippa unto Festus, This man might have been set at liberty, if he had not appealed unto Caesar."]]}]},{"a":"ananias_258","b":"peter_2745","type":"rebuked","why":"Peter confronted Ananias for lying to the Holy Ghost about the price of his land, and Ananias fell down dead.","refs":[{"ref":"Acts 5:1–6","verses":[["Acts 5:1","But a certain man named Ananias, with Sapphira his wife, sold a possession,"],["Acts 5:2","And kept back part of the price, his wife also being privy to it, and brought a certain part, and laid it at the apostles’ feet."],["Acts 5:3","But Peter said, Ananias, why hath Satan filled thine heart to lie to the Holy Ghost, and to keep back part of the price of the land?"],["Acts 5:4","Whiles it remained, was it not thine own? and after it was sold, was it not in thine own power? why hast thou conceived this thing in thine heart? thou hast not lied unto men, but unto God."],["Acts 5:5","And Ananias hearing these words fell down, and gave up the ghost: and great fear came on all them that heard these things."],["Acts 5:6","And the young men arose, wound him up, and carried him out, and buried him."]]}]},{"a":"ananias_259","b":"paul_2479","type":"healed","why":"Ananias laid his hands on the blinded Saul at the Lord's command, and Saul received his sight and was baptized.","refs":[{"ref":"Acts 9:10–19","verses":[["Acts 9:10","And there was a certain disciple at Damascus, named Ananias; and to him said the Lord in a vision, Ananias. And he said, Behold, I am here, Lord."],["Acts 9:11","And the Lord said unto him, Arise, and go into the street which is called Straight, and enquire in the house of Judas for one called Saul, of Tarsus: for, behold, he prayeth,"],["Acts 9:12","And hath seen in a vision a man named Ananias coming in, and putting his hand on him, that he might receive his sight."],["Acts 9:13","Then Ananias answered, Lord, I have heard by many of this man, how much evil he hath done to thy saints at Jerusalem:"],["Acts 9:14","And here he hath authority from the chief priests to bind all that call on thy name."],["Acts 9:15","But the Lord said unto him, Go thy way: for he is a chosen vessel unto me, to bear my name before the Gentiles, and kings, and the children of Israel:"],["Acts 9:16","For I will shew him how great things he must suffer for my name’s sake."],["Acts 9:17","And Ananias went his way, and entered into the house; and putting his hands on him said, Brother Saul, the Lord, even Jesus, that appeared unto thee in the way as thou camest, hath sent me, that thou mightest receive thy sight, and be filled with the Holy Ghost."],["Acts 9:18","And immediately there fell from his eyes as it had been scales: and he received sight forthwith, and arose, and was baptized."],["Acts 9:19","And when he had received meat, he was strengthened. Then was Saul certain days with the disciples which were at Damascus."]]},{"ref":"Acts 22:12–16","verses":[["Acts 22:12","And one Ananias, a devout man according to the law, having a good report of all the Jews which dwelt there,"],["Acts 22:13","Came unto me, and stood, and said unto me, Brother Saul, receive thy sight. And the same hour I looked up upon him."],["Acts 22:14","And he said, The God of our fathers hath chosen thee, that thou shouldest know his will, and see that Just One, and shouldest hear the voice of his mouth."],["Acts 22:15","For thou shalt be his witness unto all men of what thou hast seen and heard."],["Acts 22:16","And now why tarriest thou? arise, and be baptized, and wash away thy sins, calling on the name of the Lord."]]}]},{"a":"ananias_259","b":"jesus_905","type":"followed","why":"Ananias was a disciple at Damascus; the Lord Jesus spoke to him in a vision and sent him to Saul, and he went.","refs":[{"ref":"Acts 9:10–17","verses":[["Acts 9:10","And there was a certain disciple at Damascus, named Ananias; and to him said the Lord in a vision, Ananias. And he said, Behold, I am here, Lord."],["Acts 9:11","And the Lord said unto him, Arise, and go into the street which is called Straight, and enquire in the house of Judas for one called Saul, of Tarsus: for, behold, he prayeth,"],["Acts 9:12","And hath seen in a vision a man named Ananias coming in, and putting his hand on him, that he might receive his sight."],["Acts 9:13","Then Ananias answered, Lord, I have heard by many of this man, how much evil he hath done to thy saints at Jerusalem:"],["Acts 9:14","And here he hath authority from the chief priests to bind all that call on thy name."],["Acts 9:15","But the Lord said unto him, Go thy way: for he is a chosen vessel unto me, to bear my name before the Gentiles, and kings, and the children of Israel:"],["Acts 9:16","For I will shew him how great things he must suffer for my name’s sake."],["Acts 9:17","And Ananias went his way, and entered into the house; and putting his hands on him said, Brother Saul, the Lord, even Jesus, that appeared unto thee in the way as thou camest, hath sent me, that thou mightest receive thy sight, and be filled with the Holy Ghost."]]}]},{"a":"andrew_264","b":"peter_2745","type":"family","why":"Andrew was Simon Peter's brother, and he brought Peter to Jesus.","refs":[{"ref":"John 1:40–42","verses":[["John 1:40","One of the two which heard John speak, and followed him, was Andrew, Simon Peter’s brother."],["John 1:41","He first findeth his own brother Simon, and saith unto him, We have found the Messias, which is, being interpreted, the Christ."],["John 1:42","And he brought him to Jesus. And when Jesus beheld him, he said, Thou art Simon the son of Jona: thou shalt be called Cephas, which is by interpretation, A stone."]]},{"ref":"Matthew 4:18","verses":[["Matthew 4:18","And Jesus, walking by the sea of Galilee, saw two brethren, Simon called Peter, and Andrew his brother, casting a net into the sea: for they were fishers."]]}]},{"a":"andrew_264","b":"jesus_905","type":"apostle","why":"Jesus chose Andrew as one of his twelve apostles.","refs":[{"ref":"Matthew 10:2","verses":[["Matthew 10:2","Now the names of the twelve apostles are these; The first, Simon, who is called Peter, and Andrew his brother; James the son of Zebedee, and John his brother;"]]}]},{"a":"andrew_264","b":"jesus_905","type":"followed","why":"Andrew was one of Jesus' disciples and followed him.","refs":[{"ref":"John 1:35–40","verses":[["John 1:35","Again the next day after John stood, and two of his disciples;"],["John 1:36","And looking upon Jesus as he walked, he saith, Behold the Lamb of God!"],["John 1:37","And the two disciples heard him speak, and they followed Jesus."],["John 1:38","Then Jesus turned, and saw them following, and saith unto them, What seek ye? They said unto him, Rabbi, (which is to say, being interpreted, Master,) where dwellest thou?"],["John 1:39","He saith unto them, Come and see. They came and saw where he dwelt, and abode with him that day: for it was about the tenth hour."],["John 1:40","One of the two which heard John speak, and followed him, was Andrew, Simon Peter’s brother."]]},{"ref":"Matthew 4:18–20","verses":[["Matthew 4:18","And Jesus, walking by the sea of Galilee, saw two brethren, Simon called Peter, and Andrew his brother, casting a net into the sea: for they were fishers."],["Matthew 4:19","And he saith unto them, Follow me, and I will make you fishers of men."],["Matthew 4:20","And they straightway left their nets, and followed him."]]}]},{"a":"andrew_264","b":"john_1676","type":"followed","why":"Andrew was one of John the Baptist's two disciples who heard him call Jesus the Lamb of God.","refs":[{"ref":"John 1:35–40","verses":[["John 1:35","Again the next day after John stood, and two of his disciples;"],["John 1:36","And looking upon Jesus as he walked, he saith, Behold the Lamb of God!"],["John 1:37","And the two disciples heard him speak, and they followed Jesus."],["John 1:38","Then Jesus turned, and saw them following, and saith unto them, What seek ye? They said unto him, Rabbi, (which is to say, being interpreted, Master,) where dwellest thou?"],["John 1:39","He saith unto them, Come and see. They came and saw where he dwelt, and abode with him that day: for it was about the tenth hour."],["John 1:40","One of the two which heard John speak, and followed him, was Andrew, Simon Peter’s brother."]]}]},{"a":"apollos_276","b":"aquila_279","type":"counseled","why":"Aquila and Priscilla took Apollos aside and expounded the way of God to him more perfectly.","refs":[{"ref":"Acts 18:24–26","verses":[["Acts 18:24","And a certain Jew named Apollos, born at Alexandria, an eloquent man, and mighty in the scriptures, came to Ephesus."],["Acts 18:25","This man was instructed in the way of the Lord; and being fervent in the spirit, he spake and taught diligently the things of the Lord, knowing only the baptism of John."],["Acts 18:26","And he began to speak boldly in the synagogue: whom when Aquila and Priscilla had heard, they took him unto them, and expounded unto him the way of God more perfectly."]]}]},{"a":"apollos_276","b":"priscilla_2370","type":"counseled","why":"Priscilla and Aquila took Apollos aside and expounded the way of God to him more perfectly.","refs":[{"ref":"Acts 18:24–26","verses":[["Acts 18:24","And a certain Jew named Apollos, born at Alexandria, an eloquent man, and mighty in the scriptures, came to Ephesus."],["Acts 18:25","This man was instructed in the way of the Lord; and being fervent in the spirit, he spake and taught diligently the things of the Lord, knowing only the baptism of John."],["Acts 18:26","And he began to speak boldly in the synagogue: whom when Aquila and Priscilla had heard, they took him unto them, and expounded unto him the way of God more perfectly."]]}]},{"a":"aquila_279","b":"priscilla_2370","type":"married","why":"Priscilla was Aquila's wife.","refs":[{"ref":"Acts 18:2","verses":[["Acts 18:2","And found a certain Jew named Aquila, born in Pontus, lately come from Italy, with his wife Priscilla; (because that Claudius had commanded all Jews to depart from Rome:) and came unto them."]]}]},{"a":"aquila_279","b":"paul_2479","type":"worked_together","why":"Paul lived and worked with Aquila as a fellow tentmaker, and called him and Priscilla his helpers in Christ Jesus who had laid down their necks for his life.","refs":[{"ref":"Acts 18:1–3","verses":[["Acts 18:1","After these things Paul departed from Athens, and came to Corinth;"],["Acts 18:2","And found a certain Jew named Aquila, born in Pontus, lately come from Italy, with his wife Priscilla; (because that Claudius had commanded all Jews to depart from Rome:) and came unto them."],["Acts 18:3","And because he was of the same craft, he abode with them, and wrought: for by their occupation they were tentmakers."]]},{"ref":"Acts 18:18–19","verses":[["Acts 18:18","And Paul after this tarried there yet a good while, and then took his leave of the brethren, and sailed thence into Syria, and with him Priscilla and Aquila; having shorn his head in Cenchrea: for he had a vow."],["Acts 18:19","And he came to Ephesus, and left them there: but he himself entered into the synagogue, and reasoned with the Jews."]]},{"ref":"Romans 16:3–4","verses":[["Romans 16:3","Greet Priscilla and Aquila my helpers in Christ Jesus:"],["Romans 16:4","Who have for my life laid down their own necks: unto whom not only I give thanks, but also all the churches of the Gentiles."]]}]},{"a":"barnabas_1722","b":"paul_2479","type":"worked_together","why":"Barnabas brought Saul to Antioch, where they taught together for a year, and the Holy Ghost sent them out together to preach.","refs":[{"ref":"Acts 11:25–26","verses":[["Acts 11:25","Then departed Barnabas to Tarsus, for to seek Saul:"],["Acts 11:26","And when he had found him, he brought him unto Antioch. And it came to pass, that a whole year they assembled themselves with the church, and taught much people. And the disciples were called Christians first in Antioch."]]},{"ref":"Acts 13:1–4","verses":[["Acts 13:1","Now there were in the church that was at Antioch certain prophets and teachers; as Barnabas, and Simeon that was called Niger, and Lucius of Cyrene, and Manaen, which had been brought up with Herod the tetrarch, and Saul."],["Acts 13:2","As they ministered to the Lord, and fasted, the Holy Ghost said, Separate me Barnabas and Saul for the work whereunto I have called them."],["Acts 13:3","And when they had fasted and prayed, and laid their hands on them, they sent them away."],["Acts 13:4","So they, being sent forth by the Holy Ghost, departed unto Seleucia; and from thence they sailed to Cyprus."]]}]},{"a":"barnabas_1722","b":"mark_1679","type":"family","why":"Mark was Barnabas's sister's son.","refs":[{"ref":"Colossians 4:10","verses":[["Colossians 4:10","Aristarchus my fellowprisoner saluteth you, and Marcus, sister’s son to Barnabas, (touching whom ye received commandments: if he come unto you, receive him;)"]]}]},{"a":"barnabas_1722","b":"mark_1679","type":"worked_together","why":"Barnabas took Mark with him in the work, and when Paul would not take Mark again, Barnabas took him and sailed to Cyprus.","refs":[{"ref":"Acts 12:25","verses":[["Acts 12:25","And Barnabas and Saul returned from Jerusalem, when they had fulfilled their ministry, and took with them John, whose surname was Mark."]]},{"ref":"Acts 15:37–39","verses":[["Acts 15:37","And Barnabas determined to take with them John, whose surname was Mark."],["Acts 15:38","But Paul thought not good to take him with them, who departed from them from Pamphylia, and went not with them to the work."],["Acts 15:39","And the contention was so sharp between them, that they departed asunder one from the other: and so Barnabas took Mark, and sailed unto Cyprus;"]]}]},{"a":"bartimaeus_406","b":"jesus_905","type":"healed","why":"Jesus gave blind Bartimaeus his sight, saying his faith had made him whole.","refs":[{"ref":"Mark 10:46–52","verses":[["Mark 10:46","And they came to Jericho: and as he went out of Jericho with his disciples and a great number of people, blind Bartimaeus, the son of Timaeus, sat by the highway side begging."],["Mark 10:47","And when he heard that it was Jesus of Nazareth, he began to cry out, and say, Jesus, thou Son of David, have mercy on me."],["Mark 10:48","And many charged him that he should hold his peace: but he cried the more a great deal, Thou Son of David, have mercy on me."],["Mark 10:49","And Jesus stood still, and commanded him to be called. And they call the blind man, saying unto him, Be of good comfort, rise; he calleth thee."],["Mark 10:50","And he, casting away his garment, rose, and came to Jesus."],["Mark 10:51","And Jesus answered and said unto him, What wilt thou that I should do unto thee? The blind man said unto him, Lord, that I might receive my sight."],["Mark 10:52","And Jesus said unto him, Go thy way; thy faith hath made thee whole. And immediately he received his sight, and followed Jesus in the way."]]}]},{"a":"caiaphas_532","b":"jesus_905","type":"enemies","why":"Caiaphas counselled that Jesus should die, hosted the plot to kill him, and condemned him for blasphemy at his trial.","refs":[{"ref":"John 11:47–53","verses":[["John 11:47","Then gathered the chief priests and the Pharisees a council, and said, What do we? for this man doeth many miracles."],["John 11:48","If we let him thus alone, all men will believe on him: and the Romans shall come and take away both our place and nation."],["John 11:49","And one of them, named Caiaphas, being the high priest that same year, said unto them, Ye know nothing at all,"],["John 11:50","Nor consider that it is expedient for us, that one man should die for the people, and that the whole nation perish not."],["John 11:51","And this spake he not of himself: but being high priest that year, he prophesied that Jesus should die for that nation;"],["John 11:52","And not for that nation only, but that also he should gather together in one the children of God that were scattered abroad."],["John 11:53","Then from that day forth they took counsel together for to put him to death."]]},{"ref":"Matthew 26:3–4","verses":[["Matthew 26:3","Then assembled together the chief priests, and the scribes, and the elders of the people, unto the palace of the high priest, who was called Caiaphas,"],["Matthew 26:4","And consulted that they might take Jesus by subtilty, and kill him."]]},{"ref":"Matthew 26:57–66","verses":[["Matthew 26:57","And they that had laid hold on Jesus led him away to Caiaphas the high priest, where the scribes and the elders were assembled."],["Matthew 26:58","But Peter followed him afar off unto the high priest’s palace, and went in, and sat with the servants, to see the end."],["Matthew 26:59","Now the chief priests, and elders, and all the council, sought false witness against Jesus, to put him to death;"],["Matthew 26:60","But found none: yea, though many false witnesses came, yet found they none. At the last came two false witnesses,"],["Matthew 26:61","And said, This fellow said, I am able to destroy the temple of God, and to build it in three days."],["Matthew 26:62","And the high priest arose, and said unto him, Answerest thou nothing? what is it which these witness against thee?"],["Matthew 26:63","But Jesus held his peace. And the high priest answered and said unto him, I adjure thee by the living God, that thou tell us whether thou be the Christ, the Son of God."],["Matthew 26:64","Jesus saith unto him, Thou hast said: nevertheless I say unto you, Hereafter shall ye see the Son of man sitting on the right hand of power, and coming in the clouds of heaven."],["Matthew 26:65","Then the high priest rent his clothes, saying, He hath spoken blasphemy; what further need have we of witnesses? behold, now ye have heard his blasphemy."],["Matthew 26:66","What think ye? They answered and said, He is guilty of death."]]}]},{"a":"caiaphas_532","b":"peter_2745","type":"judged","why":"Caiaphas sat with the council that set Peter in their midst, questioned him about the healing of the lame man, threatened him and let him go.","refs":[{"ref":"Acts 4:5–21","verses":[["Acts 4:5","And it came to pass on the morrow, that their rulers, and elders, and scribes,"],["Acts 4:6","And Annas the high priest, and Caiaphas, and John, and Alexander, and as many as were of the kindred of the high priest, were gathered together at Jerusalem."],["Acts 4:7","And when they had set them in the midst, they asked, By what power, or by what name, have ye done this?"],["Acts 4:8","Then Peter, filled with the Holy Ghost, said unto them, Ye rulers of the people, and elders of Israel,"],["Acts 4:9","If we this day be examined of the good deed done to the impotent man, by what means he is made whole;"],["Acts 4:10","Be it known unto you all, and to all the people of Israel, that by the name of Jesus Christ of Nazareth, whom ye crucified, whom God raised from the dead, even by him doth this man stand here before you whole."],["Acts 4:11","This is the stone which was set at nought of you builders, which is become the head of the corner."],["Acts 4:12","Neither is there salvation in any other: for there is none other name under heaven given among men, whereby we must be saved."],["Acts 4:13","Now when they saw the boldness of Peter and John, and perceived that they were unlearned and ignorant men, they marvelled; and they took knowledge of them, that they had been with Jesus."],["Acts 4:14","And beholding the man which was healed standing with them, they could say nothing against it."],["Acts 4:15","But when they had commanded them to go aside out of the council, they conferred among themselves,"],["Acts 4:16","Saying, What shall we do to these men? for that indeed a notable miracle hath been done by them is manifest to all them that dwell in Jerusalem; and we cannot deny it."],["Acts 4:17","But that it spread no further among the people, let us straitly threaten them, that they speak henceforth to no man in this name."],["Acts 4:18","And they called them, and commanded them not to speak at all nor teach in the name of Jesus."],["Acts 4:19","But Peter and John answered and said unto them, Whether it be right in the sight of God to hearken unto you more than unto God, judge ye."],["Acts 4:20","For we cannot but speak the things which we have seen and heard."],["Acts 4:21","So when they had further threatened them, they let them go, finding nothing how they might punish them, because of the people: for all men glorified God for that which was done."]]}]},{"a":"cornelius_956","b":"peter_2745","type":"saved","why":"An angel told Cornelius to send for Peter, who would tell him words whereby he and his house would be saved, and Peter preached Christ to them and had them baptized.","refs":[{"ref":"Acts 10:24–48","verses":[["Acts 10:24","And the morrow after they entered into Caesarea. And Cornelius waited for them, and had called together his kinsmen and near friends."],["Acts 10:25","And as Peter was coming in, Cornelius met him, and fell down at his feet, and worshipped him."],["Acts 10:26","But Peter took him up, saying, Stand up; I myself also am a man."],["Acts 10:27","And as he talked with him, he went in, and found many that were come together."],["Acts 10:28","And he said unto them, Ye know how that it is an unlawful thing for a man that is a Jew to keep company, or come unto one of another nation; but God hath shewed me that I should not call any man common or unclean."],["Acts 10:29","Therefore came I unto you without gainsaying, as soon as I was sent for: I ask therefore for what intent ye have sent for me?"],["Acts 10:30","And Cornelius said, Four days ago I was fasting until this hour; and at the ninth hour I prayed in my house, and, behold, a man stood before me in bright clothing,"],["Acts 10:31","And said, Cornelius, thy prayer is heard, and thine alms are had in remembrance in the sight of God."],["Acts 10:32","Send therefore to Joppa, and call hither Simon, whose surname is Peter; he is lodged in the house of one Simon a tanner by the sea side: who, when he cometh, shall speak unto thee."],["Acts 10:33","Immediately therefore I sent to thee; and thou hast well done that thou art come. Now therefore are we all here present before God, to hear all things that are commanded thee of God."],["Acts 10:34","Then Peter opened his mouth, and said, Of a truth I perceive that God is no respecter of persons:"],["Acts 10:35","But in every nation he that feareth him, and worketh righteousness, is accepted with him."],["Acts 10:36","The word which God sent unto the children of Israel, preaching peace by Jesus Christ: (he is Lord of all:)"],["Acts 10:37","That word, I say, ye know, which was published throughout all Judaea, and began from Galilee, after the baptism which John preached;"],["Acts 10:38","How God anointed Jesus of Nazareth with the Holy Ghost and with power: who went about doing good, and healing all that were oppressed of the devil; for God was with him."],["Acts 10:39","And we are witnesses of all things which he did both in the land of the Jews, and in Jerusalem; whom they slew and hanged on a tree:"],["Acts 10:40","Him God raised up the third day, and shewed him openly;"],["Acts 10:41","Not to all the people, but unto witnesses chosen before of God, even to us, who did eat and drink with him after he rose from the dead."],["Acts 10:42","And he commanded us to preach unto the people, and to testify that it is he which was ordained of God to be the Judge of quick and dead."],["Acts 10:43","To him give all the prophets witness, that through his name whosoever believeth in him shall receive remission of sins."],["Acts 10:44","While Peter yet spake these words, the Holy Ghost fell on all them which heard the word."],["Acts 10:45","And they of the circumcision which believed were astonished, as many as came with Peter, because that on the Gentiles also was poured out the gift of the Holy Ghost."],["Acts 10:46","For they heard them speak with tongues, and magnify God. Then answered Peter,"],["Acts 10:47","Can any man forbid water, that these should not be baptized, which have received the Holy Ghost as well as we?"],["Acts 10:48","And he commanded them to be baptized in the name of the Lord. Then prayed they him to tarry certain days."]]},{"ref":"Acts 11:13–14","verses":[["Acts 11:13","And he shewed us how he had seen an angel in his house, which stood and said unto him, Send men to Joppa, and call for Simon, whose surname is Peter;"],["Acts 11:14","Who shall tell thee words, whereby thou and all thy house shall be saved."]]}]},{"a":"demetrius_1007","b":"paul_2479","type":"enemies","why":"Demetrius stirred up the craftsmen and the city of Ephesus against Paul because his preaching was turning people from their idols.","refs":[{"ref":"Acts 19:23–29","verses":[["Acts 19:23","And the same time there arose no small stir about that way."],["Acts 19:24","For a certain man named Demetrius, a silversmith, which made silver shrines for Diana, brought no small gain unto the craftsmen;"],["Acts 19:25","Whom he called together with the workmen of like occupation, and said, Sirs, ye know that by this craft we have our wealth."],["Acts 19:26","Moreover ye see and hear, that not alone at Ephesus, but almost throughout all Asia, this Paul hath persuaded and turned away much people, saying that they be no gods, which are made with hands:"],["Acts 19:27","So that not only this our craft is in danger to be set at nought; but also that the temple of the great goddess Diana should be despised, and her magnificence should be destroyed, whom all Asia and the world worshippeth."],["Acts 19:28","And when they heard these sayings, they were full of wrath, and cried out, saying, Great is Diana of the Ephesians."],["Acts 19:29","And the whole city was filled with confusion: and having caught Gaius and Aristarchus, men of Macedonia, Paul’s companions in travel, they rushed with one accord into the theatre."]]}]},{"a":"dorcas_2810","b":"peter_2745","type":"healed","why":"Peter prayed and raised Dorcas from the dead at Joppa.","refs":[{"ref":"Acts 9:36–41","verses":[["Acts 9:36","Now there was at Joppa a certain disciple named Tabitha, which by interpretation is called Dorcas: this woman was full of good works and almsdeeds which she did."],["Acts 9:37","And it came to pass in those days, that she was sick, and died: whom when they had washed, they laid her in an upper chamber."],["Acts 9:38","And forasmuch as Lydda was nigh to Joppa, and the disciples had heard that Peter was there, they sent unto him two men, desiring him that he would not delay to come to them."],["Acts 9:39","Then Peter arose and went with them. When he was come, they brought him into the upper chamber: and all the widows stood by him weeping, and shewing the coats and garments which Dorcas made, while she was with them."],["Acts 9:40","But Peter put them all forth, and kneeled down, and prayed; and turning him to the body said, Tabitha, arise. And she opened her eyes: and when she saw Peter, she sat up."],["Acts 9:41","And he gave her his hand, and lifted her up, and when he had called the saints and widows, presented her alive."]]}]},{"a":"elijah_1131","b":"jesus_905","type":"crossed_paths","why":"Elijah appeared with Moses on the mount of transfiguration and talked with Jesus about his coming death at Jerusalem.","refs":[{"ref":"Matthew 17:1–4","verses":[["Matthew 17:1","And after six days Jesus taketh Peter, James, and John his brother, and bringeth them up into an high mountain apart,"],["Matthew 17:2","And was transfigured before them: and his face did shine as the sun, and his raiment was white as the light."],["Matthew 17:3","And, behold, there appeared unto them Moses and Elias talking with him."],["Matthew 17:4","Then answered Peter, and said unto Jesus, Lord, it is good for us to be here: if thou wilt, let us make here three tabernacles; one for thee, and one for Moses, and one for Elias."]]},{"ref":"Luke 9:28–33","verses":[["Luke 9:28","And it came to pass about an eight days after these sayings, he took Peter and John and James, and went up into a mountain to pray."],["Luke 9:29","And as he prayed, the fashion of his countenance was altered, and his raiment was white and glistering."],["Luke 9:30","And, behold, there talked with him two men, which were Moses and Elias:"],["Luke 9:31","Who appeared in glory, and spake of his decease which he should accomplish at Jerusalem."],["Luke 9:32","But Peter and they that were with him were heavy with sleep: and when they were awake, they saw his glory, and the two men that stood with him."],["Luke 9:33","And it came to pass, as they departed from him, Peter said unto Jesus, Master, it is good for us to be here: and let us make three tabernacles; one for thee, and one for Moses, and one for Elias: not knowing what he said."]]}]},{"a":"elisabeth_1152","b":"zacharias_2971","type":"married","why":"Elisabeth was Zacharias's wife, and God gave them John in their old age.","refs":[{"ref":"Luke 1:5–7","verses":[["Luke 1:5","There was in the days of Herod, the king of Judaea, a certain priest named Zacharias, of the course of Abia: and his wife was of the daughters of Aaron, and her name was Elisabeth."],["Luke 1:6","And they were both righteous before God, walking in all the commandments and ordinances of the Lord blameless."],["Luke 1:7","And they had no child, because that Elisabeth was barren, and they both were now well stricken in years."]]},{"ref":"Luke 1:13","verses":[["Luke 1:13","But the angel said unto him, Fear not, Zacharias: for thy prayer is heard; and thy wife Elisabeth shall bear thee a son, and thou shalt call his name John."]]}]},{"a":"elisabeth_1152","b":"mary_1938","type":"family","why":"The angel called Elisabeth Mary's cousin.","refs":[{"ref":"Luke 1:36","verses":[["Luke 1:36","And, behold, thy cousin Elisabeth, she hath also conceived a son in her old age: and this is the sixth month with her, who was called barren."]]}]},{"a":"elisabeth_1152","b":"mary_1938","type":"blessed","why":"Filled with the Holy Ghost, Elisabeth blessed Mary and the fruit of her womb when Mary visited her.","refs":[{"ref":"Luke 1:39–45","verses":[["Luke 1:39","And Mary arose in those days, and went into the hill country with haste, into a city of Juda;"],["Luke 1:40","And entered into the house of Zacharias, and saluted Elisabeth."],["Luke 1:41","And it came to pass, that, when Elisabeth heard the salutation of Mary, the babe leaped in her womb; and Elisabeth was filled with the Holy Ghost:"],["Luke 1:42","And she spake out with a loud voice, and said, Blessed art thou among women, and blessed is the fruit of thy womb."],["Luke 1:43","And whence is this to me, that the mother of my Lord should come to me?"],["Luke 1:44","
