k well. And also, behold, he cometh forth to meet thee: and when he seeth thee, he will be glad in his heart."]]},{"ref":"Exodus 6:20","verses":[["Exodus 6:20","And Amram took him Jochebed his father’s sister to wife; and she bare him Aaron and Moses: and the years of the life of Amram were an hundred and thirty and seven years."]]}]},{"a":"aaron_1","b":"moses_2108","type":"worked_together","why":"The LORD sent Aaron to speak for Moses, and together they stood before Pharaoh and brought Israel out of Egypt.","refs":[{"ref":"Exodus 4:27–31","verses":[["Exodus 4:27","And the LORD said to Aaron, Go into the wilderness to meet Moses. And he went, and met him in the mount of God, and kissed him."],["Exodus 4:28","And Moses told Aaron all the words of the LORD who had sent him, and all the signs which he had commanded him."],["Exodus 4:29","And Moses and Aaron went and gathered together all the elders of the children of Israel:"],["Exodus 4:30","And Aaron spake all the words which the LORD had spoken unto Moses, and did the signs in the sight of the people."],["Exodus 4:31","And the people believed: and when they heard that the LORD had visited the children of Israel, and that he had looked upon their affliction, then they bowed their heads and worshipped."]]},{"ref":"Exodus 7:1–6","verses":[["Exodus 7:1","And the LORD said unto Moses, See, I have made thee a god to Pharaoh: and Aaron thy brother shall be thy prophet."],["Exodus 7:2","Thou shalt speak all that I command thee: and Aaron thy brother shall speak unto Pharaoh, that he send the children of Israel out of his land."],["Exodus 7:3","And I will harden Pharaoh’s heart, and multiply my signs and my wonders in the land of Egypt."],["Exodus 7:4","But Pharaoh shall not hearken unto you, that I may lay my hand upon Egypt, and bring forth mine armies, and my people the children of Israel, out of the land of Egypt by great judgments."],["Exodus 7:5","And the Egyptians shall know that I am the LORD, when I stretch forth mine hand upon Egypt, and bring out the children of Israel from among them."],["Exodus 7:6","And Moses and Aaron did as the LORD commanded them, so did they."]]},{"ref":"Exodus 6:26–27","verses":[["Exodus 6:26","These are that Aaron and Moses, to whom the LORD said, Bring out the children of Israel from the land of Egypt according to their armies."],["Exodus 6:27","These are they which spake to Pharaoh king of Egypt, to bring out the children of Israel from Egypt: these are that Moses and Aaron."]]}]},{"a":"aaron_1","b":"pharaoh_2331","type":"enemies","why":"Pharaoh refused the LORD's word that Moses and Aaron brought him, drove them from his presence, and chased Israel with his army.","refs":[{"ref":"Exodus 5:1–4","verses":[["Exodus 5:1","And afterward Moses and Aaron went in, and told Pharaoh, Thus saith the LORD God of Israel, Let my people go, that they may hold a feast unto me in the wilderness."],["Exodus 5:2","And Pharaoh said, Who is the LORD, that I should obey his voice to let Israel go? I know not the LORD, neither will I let Israel go."],["Exodus 5:3","And they said, The God of the Hebrews hath met with us: let us go, we pray thee, three days’ journey into the desert, and sacrifice unto the LORD our God; lest he fall upon us with pestilence, or with the sword."],["Exodus 5:4","And the king of Egypt said unto them, Wherefore do ye, Moses and Aaron, let the people from their works? get you unto your burdens."]]},{"ref":"Exodus 10:8–11","verses":[["Exodus 10:8","And Moses and Aaron were brought again unto Pharaoh: and he said unto them, Go, serve the LORD your God: but who are they that shall go?"],["Exodus 10:9","And Moses said, We will go with our young and with our old, with our sons and with our daughters, with our flocks and with our herds will we go; for we must hold a feast unto the LORD."],["Exodus 10:10","And he said unto them, Let the LORD be so with you, as I will let you go, and your little ones: look to it; for evil is before you."],["Exodus 10:11","Not so: go now ye that are men, and serve the LORD; for that ye did desire. And they were driven out from Pharaoh’s presence."]]},{"ref":"Exodus 14:5–9","verses":[["Exodus 14:5","And it was told the king of Egypt that the people fled: and the heart of Pharaoh and of his servants was turned against the people, and they said, Why have we done this, that we have let Israel go from serving us?"],["Exodus 14:6","And he made ready his chariot, and took his people with him:"],["Exodus 14:7","And he took six hundred chosen chariots, and all the chariots of Egypt, and captains over every one of them."],["Exodus 14:8","And the LORD hardened the heart of Pharaoh king of Egypt, and he pursued after the children of Israel: and the children of Israel went out with an high hand."],["Exodus 14:9","But the Egyptians pursued after them, all the horses and chariots of Pharaoh, and his horsemen, and his army, and overtook them encamping by the sea, beside Pihahiroth, before Baalzephon."]]}]},{"a":"aaron_1","b":"miriam_2087","type":"family","why":"Miriam was Aaron's sister, a daughter of Amram and Jochebed.","refs":[{"ref":"Exodus 15:20","verses":[["Exodus 15:20","And Miriam the prophetess, the sister of Aaron, took a timbrel in her hand; and all the women went out after her with timbrels and with dances."]]},{"ref":"Numbers 26:59","verses":[["Numbers 26:59","And the name of Amram’s wife was Jochebed, the daughter of Levi, whom her mother bare to Levi in Egypt: and she bare unto Amram Aaron and Moses, and Miriam their sister."]]}]},{"a":"aaron_1","b":"eleazar_1062","type":"family","why":"Eleazar was Aaron's son, and Aaron's priestly garments were put on him when Aaron died.","refs":[{"ref":"Exodus 6:23","verses":[["Exodus 6:23","And Aaron took him Elisheba, daughter of Amminadab, sister of Naashon, to wife; and she bare him Nadab, and Abihu, Eleazar, and Ithamar."]]},{"ref":"Numbers 20:25–28","verses":[["Numbers 20:25","Take Aaron and Eleazar his son, and bring them up unto mount Hor:"],["Numbers 20:26","And strip Aaron of his garments, and put them upon Eleazar his son: and Aaron shall be gathered unto his people, and shall die there."],["Numbers 20:27","And Moses did as the LORD commanded: and they went up into mount Hor in the sight of all the congregation."],["Numbers 20:28","And Moses stripped Aaron of his garments, and put them upon Eleazar his son; and Aaron died there in the top of the mount: and Moses and Eleazar came down from the mount."]]}]},{"a":"aaron_1","b":"korah_1795","type":"rivals","why":"Korah and his company rose against Aaron seeking the priesthood, and the LORD chose Aaron when both offered incense before Him.","refs":[{"ref":"Numbers 16:1–11","verses":[["Numbers 16:1","Now Korah, the son of Izhar, the son of Kohath, the son of Levi, and Dathan and Abiram, the sons of Eliab, and On, the son of Peleth, sons of Reuben, took men:"],["Numbers 16:2","And they rose up before Moses, with certain of the children of Israel, two hundred and fifty princes of the assembly, famous in the congregation, men of renown:"],["Numbers 16:3","And they gathered themselves together against Moses and against Aaron, and said unto them, Ye take too much upon you, seeing all the congregation are holy, every one of them, and the LORD is among them: wherefore then lift ye up yourselves above the congregation of the LORD?"],["Numbers 16:4","And when Moses heard it, he fell upon his face:"],["Numbers 16:5","And he spake unto Korah and unto all his company, saying, Even to morrow the LORD will shew who are his, and who is holy; and will cause him to come near unto him: even him whom he hath chosen will he cause to come near unto him."],["Numbers 16:6","This do; Take you censers, Korah, and all his company;"],["Numbers 16:7","And put fire therein, and put incense in them before the LORD to morrow: and it shall be that the man whom the LORD doth choose, he shall be holy: ye take too much upon you, ye sons of Levi."],["Numbers 16:8","And Moses said unto Korah, Hear, I pray you, ye sons of Levi:"],["Numbers 16:9","Seemeth it but a small thing unto you, that the God of Israel hath separated you from the congregation of Israel, to bring you near to himself to do the service of the tabernacle of the LORD, and to stand before the congregation to minister unto them?"],["Numbers 16:10","And he hath brought thee near to him, and all thy brethren the sons of Levi with thee: and seek ye the priesthood also?"],["Numbers 16:11","For which cause both thou and all thy company are gathered together against the LORD: and what is Aaron, that ye murmur against him?"]]},{"ref":"Numbers 16:16–18","verses":[["Numbers 16:16","And Moses said unto Korah, Be thou and all thy company before the LORD, thou, and they, and Aaron, to morrow:"],["Numbers 16:17","And take every man his censer, and put incense in them, and bring ye before the LORD every man his censer, two hundred and fifty censers; thou also, and Aaron, each of you his censer."],["Numbers 16:18","And they took every man his censer, and put fire in them, and laid incense thereon, and stood in the door of the tabernacle of the congregation with Moses and Aaron."]]},{"ref":"Numbers 16:40","verses":[["Numbers 16:40","To be a memorial unto the children of Israel, that no stranger, which is not of the seed of Aaron, come near to offer incense before the LORD; that he be not as Korah, and as his company: as the LORD said to him by the hand of Moses."]]}]},{"a":"abel_13","b":"cain_533","type":"family","why":"Abel was Cain's younger brother, both born to Eve.","refs":[{"ref":"Genesis 4:1–2","verses":[["Genesis 4:1","And Adam knew Eve his wife; and she conceived, and bare Cain, and said, I have gotten a man from the LORD."],["Genesis 4:2","And she again bare his brother Abel. And Abel was a keeper of sheep, but Cain was a tiller of the ground."]]}]},{"a":"abel_13","b":"cain_533","type":"enemies","why":"Cain rose up against his brother Abel in the field and killed him, because his own works were evil and his brother's righteous.","refs":[{"ref":"Genesis 4:8–11","verses":[["Genesis 4:8","And Cain talked with Abel his brother: and it came to pass, when they were in the field, that Cain rose up against Abel his brother, and slew him."],["Genesis 4:9","And the LORD said unto Cain, Where is Abel thy brother? And he said, I know not: Am I my brother’s keeper?"],["Genesis 4:10","And he said, What hast thou done? the voice of thy brother’s blood crieth unto me from the ground."],["Genesis 4:11","And now art thou cursed from the earth, which hath opened her mouth to receive thy brother’s blood from thy hand;"]]},{"ref":"1 John 3:12","verses":[["1 John 3:12","Not as Cain, who was of that wicked one, and slew his brother. And wherefore slew he him? Because his own works were evil, and his brother’s righteous."]]}]},{"a":"abel_13","b":"adam_78","type":"family","why":"Adam and Eve had Cain and then his brother Abel; after Abel was killed, Seth was born to Adam in his place.","refs":[{"ref":"Genesis 4:1–2","verses":[["Genesis 4:1","And Adam knew Eve his wife; and she conceived, and bare Cain, and said, I have gotten a man from the LORD."],["Genesis 4:2","And she again bare his brother Abel. And Abel was a keeper of sheep, but Cain was a tiller of the ground."]]},{"ref":"Genesis 4:25","verses":[["Genesis 4:25","And Adam knew his wife again; and she bare a son, and called his name Seth: For God, said she, hath appointed me another seed instead of Abel, whom Cain slew."]]}]},{"a":"abel_13","b":"eve_1231","type":"family","why":"Eve bore Abel after Cain, and later named Seth as another seed in place of Abel.","refs":[{"ref":"Genesis 4:1–2","verses":[["Genesis 4:1","And Adam knew Eve his wife; and she conceived, and bare Cain, and said, I have gotten a man from the LORD."],["Genesis 4:2","And she again bare his brother Abel. And Abel was a keeper of sheep, but Cain was a tiller of the ground."]]},{"ref":"Genesis 4:25","verses":[["Genesis 4:25","And Adam knew his wife again; and she bare a son, and called his name Seth: For God, said she, hath appointed me another seed instead of Abel, whom Cain slew."]]}]},{"a":"abimelech_40","b":"abraham_58","type":"healed","why":"After Abimelech restored Sarah, Abraham prayed to God and God healed Abimelech, his wife and his maidservants.","refs":[{"ref":"Genesis 20:1–18","verses":[["Genesis 20:1","And Abraham journeyed from thence toward the south country, and dwelled between Kadesh and Shur, and sojourned in Gerar."],["Genesis 20:2","And Abraham said of Sarah his wife, She is my sister: and Abimelech king of Gerar sent, and took Sarah."],["Genesis 20:3","But God came to Abimelech in a dream by night, and said to him, Behold, thou art but a dead man, for the woman which thou hast taken; for she is a man’s wife."],["Genesis 20:4","But Abimelech had not come near her: and he said, Lord, wilt thou slay also a righteous nation?"],["Genesis 20:5","Said he not unto me, She is my sister? and she, even she herself said, He is my brother: in the integrity of my heart and innocency of my hands have I done this."],["Genesis 20:6","And God said unto him in a dream, Yea, I know that thou didst this in the integrity of thy heart; for I also withheld thee from sinning against me: therefore suffered I thee not to touch her."],["Genesis 20:7","Now therefore restore the man his wife; for he is a prophet, and he shall pray for thee, and thou shalt live: and if thou restore her not, know thou that thou shalt surely die, thou, and all that are thine."],["Genesis 20:8","Therefore Abimelech rose early in the morning, and called all his servants, and told all these things in their ears: and the men were sore afraid."],["Genesis 20:9","Then Abimelech called Abraham, and said unto him, What hast thou done unto us? and what have I offended thee, that thou hast brought on me and on my kingdom a great sin? thou hast done deeds unto me that ought not to be done."],["Genesis 20:10","And Abimelech said unto Abraham, What sawest thou, that thou hast done this thing?"],["Genesis 20:11","And Abraham said, Because I thought, Surely the fear of God is not in this place; and they will slay me for my wife’s sake."],["Genesis 20:12","And yet indeed she is my sister; she is the daughter of my father, but not the daughter of my mother; and she became my wife."],["Genesis 20:13","And it came to pass, when God caused me to wander from my father’s house, that I said unto her, This is thy kindness which thou shalt shew unto me; at every place whither we shall come, say of me, He is my brother."],["Genesis 20:14","And Abimelech took sheep, and oxen, and menservants, and womenservants, and gave them unto Abraham, and restored him Sarah his wife."],["Genesis 20:15","And Abimelech said, Behold, my land is before thee: dwell where it pleaseth thee."],["Genesis 20:16","And unto Sarah he said, Behold, I have given thy brother a thousand pieces of silver: behold, he is to thee a covering of the eyes, unto all that are with thee, and with all other: thus she was reproved."],["Genesis 20:17","So Abraham prayed unto God: and God healed Abimelech, and his wife, and his maidservants; and they bare children."],["Genesis 20:18","For the LORD had fast closed up all the wombs of the house of Abimelech, because of Sarah Abraham’s wife."]]}]},{"a":"abimelech_40","b":"abraham_58","type":"covenant","why":"Abimelech asked Abraham to swear not to deal falsely with him, and the two made a covenant at Beersheba.","refs":[{"ref":"Genesis 21:22–32","verses":[["Genesis 21:22","And it came to pass at that time, that Abimelech and Phichol the chief captain of his host spake unto Abraham, saying, God is with thee in all that thou doest:"],["Genesis 21:23","Now therefore swear unto me here by God that thou wilt not deal falsely with me, nor with my son, nor with my son’s son: but according to the kindness that I have done unto thee, thou shalt do unto me, and to the land wherein thou hast sojourned."],["Genesis 21:24","And Abraham said, I will swear."],["Genesis 21:25","And Abraham reproved Abimelech because of a well of water, which Abimelech’s servants had violently taken away."],["Genesis 21:26","And Abimelech said, I wot not who hath done this thing: neither didst thou tell me, neither yet heard I of it, but to day."],["Genesis 21:27","And Abraham took sheep and oxen, and gave them unto Abimelech; and both of them made a covenant."],["Genesis 21:28","And Abraham set seven ewe lambs of the flock by themselves."],["Genesis 21:29","And Abimelech said unto Abraham, What mean these seven ewe lambs which thou hast set by themselves?"],["Genesis 21:30","And he said, For these seven ewe lambs shalt thou take of my hand, that they may be a witness unto me, that I have digged this well."],["Genesis 21:31","Wherefore he called that place Beersheba; because there they sware both of them."],["Genesis 21:32","Thus they made a covenant at Beersheba: then Abimelech rose up, and Phichol the chief captain of his host, and they returned into the land of the Philistines."]]}]},{"a":"abimelech_40","b":"isaac_616","type":"covenant","why":"Abimelech came to Isaac and asked for an oath between them, and they swore one to another and parted in peace.","refs":[{"ref":"Genesis 26:26–31","verses":[["Genesis 26:26","Then Abimelech went to him from Gerar, and Ahuzzath one of his friends, and Phichol the chief captain of his army."],["Genesis 26:27","And Isaac said unto them, Wherefore come ye to me, seeing ye hate me, and have sent me away from you?"],["Genesis 26:28","And they said, We saw certainly that the LORD was with thee: and we said, Let there be now an oath betwixt us, even betwixt us and thee, and let us make a covenant with thee;"],["Genesis 26:29","That thou wilt do us no hurt, as we have not touched thee, and as we have done unto thee nothing but good, and have sent thee away in peace: thou art now the blessed of the LORD."],["Genesis 26:30","And he made them a feast, and they did eat and drink."],["Genesis 26:31","And they rose up betimes in the morning, and sware one to another: and Isaac sent them away, and they departed from him in peace."]]}]},{"a":"abraham_58","b":"sarah_2473","type":"married","why":"Sarah was Abraham's wife; she went with him to Canaan and bore him Isaac in his old age.","refs":[{"ref":"Genesis 12:5","verses":[["Genesis 12:5","And Abram took Sarai his wife, and Lot his brother’s son, and all their substance that they had gathered, and the souls that they had gotten in Haran; and they went forth to go into the land of Canaan; and into the land of Canaan they came."]]},{"ref":"Genesis 21:1–3","verses":[["Genesis 21:1","And the LORD visited Sarah as he had said, and the LORD did unto Sarah as he had spoken."],["Genesis 21:2","For Sarah conceived, and bare Abraham a son in his old age, at the set time of which God had spoken to him."],["Genesis 21:3","And Abraham called the name of his son that was born unto him, whom Sarah bare to him, Isaac."]]},{"ref":"Genesis 23:19","verses":[["Genesis 23:19","And after this, Abraham buried Sarah his wife in the cave of the field of Machpelah before Mamre: the same is Hebron in the land of Canaan."]]}]},{"a":"abraham_58","b":"isaac_616","type":"family","why":"Isaac was Abraham's son, born to him in his old age; Abraham bound him on the altar at God's command and later gave him all he had.","refs":[{"ref":"Genesis 21:1–5","verses":[["Genesis 21:1","And the LORD visited Sarah as he had said, and the LORD did unto Sarah as he had spoken."],["Genesis 21:2","For Sarah conceived, and bare Abraham a son in his old age, at the set time of which God had spoken to him."],["Genesis 21:3","And Abraham called the name of his son that was born unto him, whom Sarah bare to him, Isaac."],["Genesis 21:4","And Abraham circumcised his son Isaac being eight days old, as God had commanded him."],["Genesis 21:5","And Abraham was an hundred years old, when his son Isaac was born unto him."]]},{"ref":"Genesis 22:1–14","verses":[["Genesis 22:1","And it came to pass after these things, that God did tempt Abraham, and said unto him, Abraham: and he said, Behold, here I am."],["Genesis 22:2","And he said, Take now thy son, thine only son Isaac, whom thou lovest, and get thee into the land of Moriah; and offer him there for a burnt offering upon one of the mountains which I will tell thee of."],["Genesis 22:3","And Abraham rose up early in the morning, and saddled his ass, and took two of his young men with him, and Isaac his son, and clave the wood for the burnt offering, and rose up, and went unto the place of which God had told him."],["Genesis 22:4","Then on the third day Abraham lifted up his eyes, and saw the place afar off."],["Genesis 22:5","And Abraham said unto his young men, Abide ye here with the ass; and I and the lad will go yonder and worship, and come again to you."],["Genesis 22:6","And Abraham took the wood of the burnt offering, and laid it upon Isaac his son; and he took the fire in his hand, and a knife; and they went both of them together."],["Genesis 22:7","And Isaac spake unto Abraham his father, and said, My father: and he said, Here am I, my son. And he said, Behold the fire and the wood: but where is the lamb for a burnt offering?"],["Genesis 22:8","And Abraham said, My son, God will provide himself a lamb for a burnt offering: so they went both of them together."],["Genesis 22:9","And they came to the place which God had told him of; and Abraham built an altar there, and laid the wood in order, and bound Isaac his son, and laid him on the altar upon the wood."],["Genesis 22:10","And Abraham stretched forth his hand, and took the knife to slay his son."],["Genesis 22:11","And the angel of the LORD called unto him out of heaven, and said, Abraham, Abraham: and he said, Here am I."],["Genesis 22:12","And he said, Lay not thine hand upon the lad, neither do thou any thing unto him: for now I know that thou fearest God, seeing thou hast not withheld thy son, thine only son from me."],["Genesis 22:13","And Abraham lifted up his eyes, and looked, and behold behind him a ram caught in a thicket by his horns: and Abraham went and took the ram, and offered him up for a burnt offering in the stead of his son."],["Genesis 22:14","And Abraham called the name of that place Jehovahjireh: as it is said to this day, In the mount of the LORD it shall be seen."]]},{"ref":"Genesis 25:5","verses":[["Genesis 25:5","And Abraham gave all that he had unto Isaac."]]}]},{"a":"abraham_58","b":"lot_1830","type":"family","why":"Lot was the son of Abraham's brother Haran, and went with Abraham into Canaan.","refs":[{"ref":"Genesis 11:27","verses":[["Genesis 11:27","Now these are the generations of Terah: Terah begat Abram, Nahor, and Haran; and Haran begat Lot."]]},{"ref":"Genesis 12:4–5","verses":[["Genesis 12:4","So Abram departed, as the LORD had spoken unto him; and Lot went with him: and Abram was seventy and five years old when he departed out of Haran."],["Genesis 12:5","And Abram took Sarai his wife, and Lot his brother’s son, and all their substance that they had gathered, and the souls that they had gotten in Haran; and they went forth to go into the land of Canaan; and into the land of Canaan they came."]]}]},{"a":"abraham_58","b":"lot_1830","type":"helped","why":"Abraham armed his servants and brought Lot back when he was taken captive, and God remembered Abraham and sent Lot out of Sodom.","refs":[{"ref":"Genesis 14:12–16","verses":[["Genesis 14:12","And they took Lot, Abram’s brother’s son, who dwelt in Sodom, and his goods, and departed."],["Genesis 14:13","And there came one that had escaped, and told Abram the Hebrew; for he dwelt in the plain of Mamre the Amorite, brother of Eshcol, and brother of Aner: and these were confederate with Abram."],["Genesis 14:14","And when Abram heard that his brother was taken captive, he armed his trained servants, born in his own house, three hundred and eighteen, and pursued them unto Dan."],["Genesis 14:15","And he divided himself against them, he and his servants, by night, and smote them, and pursued them unto Hobah, which is on the left hand of Damascus."],["Genesis 14:16","And he brought back all the goods, and also brought again his brother Lot, and his goods, and the women also, and the people."]]},{"ref":"Genesis 19:29","verses":[["Genesis 19:29","And it came to pass, when God destroyed the cities of the plain, that God remembered Abraham, and sent Lot out of the midst of the overthrow, when he overthrew the cities in the which Lot dwelt."]]}]},{"a":"abraham_58","b":"hagar_1348","type":"married","why":"Sarah gave her maid Hagar to Abraham to be his wife, and Hagar bore him Ishmael.","refs":[{"ref":"Genesis 16:1–4","verses":[["Genesis 16:1","Now Sarai Abram’s wife bare him no children: and she had an handmaid, an Egyptian, whose name was Hagar."],["Genesis 16:2","And Sarai said unto Abram, Behold now, the LORD hath restrained me from bearing: I pray thee, go in unto my maid; it may be that I may obtain children by her. And Abram hearkened to the voice of Sarai."],["Genesis 16:3","And Sarai Abram’s wife took Hagar her maid the Egyptian, after Abram had dwelt ten years in the land of Canaan, and gave her to her husband Abram to be his wife."],["Genesis 16:4","And he went in unto Hagar, and she conceived: and when she saw that she had conceived, her mistress was despised in her eyes."]]},{"ref":"Genesis 16:15","verses":[["Genesis 16:15","And Hagar bare Abram a son: and Abram called his son’s name, which Hagar bare, Ishmael."]]}]},{"a":"abraham_58","b":"ishmael_630","type":"family","why":"Ishmael was Abraham's son, borne to him by Hagar.","refs":[{"ref":"Genesis 16:15–16","verses":[["Genesis 16:15","And Hagar bare Abram a son: and Abram called his son’s name, which Hagar bare, Ishmael."],["Genesis 16:16","And Abram was fourscore and six years old, when Hagar bare Ishmael to Abram."]]},{"ref":"Genesis 17:18–26","verses":[["Genesis 17:18","And Abraham said unto God, O that Ishmael might live before thee!"],["Genesis 17:19","And God said, Sarah thy wife shall bear thee a son indeed; and thou shalt call his name Isaac: and I will establish my covenant with him for an everlasting covenant, and with his seed after him."],["Genesis 17:20","And as for Ishmael, I have heard thee: Behold, I have blessed him, and will make him fruitful, and will multiply him exceedingly; twelve princes shall he beget, and I will make him a great nation."],["Genesis 17:21","But my covenant will I establish with Isaac, which Sarah shall bear unto thee at this set time in the next year."],["Genesis 17:22","And he left off talking with him, and God went up from Abraham."],["Genesis 17:23","And Abraham took Ishmael his son, and all that were born in his house, and all that were bought with his money, every male among the men of Abraham’s house; and circumcised the flesh of their foreskin in the selfsame day, as God had said unto him."],["Genesis 17:24","And Abraham was ninety years old and nine, when he was circumcised in the flesh of his foreskin."],["Genesis 17:25","And Ishmael his son was thirteen years old, when he was circumcised in the flesh of his foreskin."],["Genesis 17:26","In the selfsame day was Abraham circumcised, and Ishmael his son."]]}]},{"a":"abraham_58","b":"melchisedec_1991","type":"blessed","why":"Melchisedec, priest of the most high God, blessed Abraham, and Abraham gave him tithes of all.","refs":[{"ref":"Genesis 14:18–20","verses":[["Genesis 14:18","And Melchizedek king of Salem brought forth bread and wine: and he was the priest of the most high God."],["Genesis 14:19","And he blessed him, and said, Blessed be Abram of the most high God, possessor of heaven and earth:"],["Genesis 14:20","And blessed be the most high God, which hath delivered thine enemies into thy hand. And he gave him tithes of all."]]},{"ref":"Hebrews 7:1–2","verses":[["Hebrews 7:1","For this Melchisedec, king of Salem, priest of the most high God, who met Abraham returning from the slaughter of the kings, and blessed him;"],["Hebrews 7:2","To whom also Abraham gave a tenth part of all; first being by interpretation King of righteousness, and after that also King of Salem, which is, King of peace;"]]}]},{"a":"adam_78","b":"eve_1231","type":"married","why":"God made the woman from Adam and brought her to him; Adam called his wife Eve, and she bore him children.","refs":[{"ref":"Genesis 2:22–24","verses":[["Genesis 2:22","And the rib, which the LORD God had taken from man, made he a woman, and brought her unto the man."],["Genesis 2:23","And Adam said, This is now bone of my bones, and flesh of my flesh: she shall be called Woman, because she was taken out of Man."],["Genesis 2:24","Therefore shall a man leave his father and his mother, and shall cleave unto his wife: and they shall be one flesh."]]},{"ref":"Genesis 3:20","verses":[["Genesis 3:20","And Adam called his wife’s name Eve; because she was the mother of all living."]]},{"ref":"Genesis 4:1","verses":[["Genesis 4:1","And Adam knew Eve his wife; and she conceived, and bare Cain, and said, I have gotten a man from the LORD."]]}]},{"a":"adam_78","b":"cain_533","type":"family","why":"Adam knew Eve his wife, and she bore Cain.","refs":[{"ref":"Genesis 4:1","verses":[["Genesis 4:1","And Adam knew Eve his wife; and she conceived, and bare Cain, and said, I have gotten a man from the LORD."]]}]},{"a":"balaam_593","b":"balak_387","type":"counseled","why":"Balak sent for Balaam and consulted him, and Balaam answered him and taught Balak to cast a stumblingblock before Israel.","refs":[{"ref":"Numbers 22:5–6","verses":[["Numbers 22:5","He sent messengers therefore unto Balaam the son of Beor to Pethor, which is by the river of the land of the children of his people, to call him, saying, Behold, there is a people come out from Egypt: behold, they cover the face of the earth, and they abide over against me:"],["Numbers 22:6","Come now therefore, I pray thee, curse me this people; for they are too mighty for me: peradventure I shall prevail, that we may smite them, and that I may drive them out of the land: for I wot that he whom thou blessest is blessed, and he whom thou cursest is cursed."]]},{"ref":"Micah 6:5","verses":[["Micah 6:5","O my people, remember now what Balak king of Moab consulted, and what Balaam the son of Beor answered him from Shittim unto Gilgal; that ye may know the righteousness of the LORD."]]},{"ref":"Revelation 2:14","verses":[["Revelation 2:14","But I have a few things against thee, because thou hast there them that hold the doctrine of Balaam, who taught Balac to cast a stumblingblock before the children of Israel, to eat things sacrificed unto idols, and to commit fornication."]]}]},{"a":"benjamin_463","b":"joseph_1710","type":"family","why":"Joseph and Benjamin were the two sons of Rachel, and Joseph wept over his brother when he saw him in Egypt.","refs":[{"ref":"Genesis 35:24","verses":[["Genesis 35:24","The sons of Rachel; Joseph, and Benjamin:"]]},{"ref":"Genesis 43:29–30","verses":[["Genesis 43:29","And he lifted up his eyes, and saw his brother Benjamin, his mother’s son, and said, Is this your younger brother, of whom ye spake unto me? And he said, God be gracious unto thee, my son."],["Genesis 43:30","And Joseph made haste; for his bowels did yearn upon his brother: and he sought where to weep; and he entered into his chamber, and wept there."]]},{"ref":"Genesis 45:14","verses":[["Genesis 45:14","And he fell upon his brother Benjamin’s neck, and wept; and Benjamin wept upon his neck."]]}]},{"a":"benjamin_463","b":"israel_682","type":"family","why":"Benjamin was Jacob's youngest son, born to Rachel.","refs":[{"ref":"Genesis 35:16–18","verses":[["Genesis 35:16","And they journeyed from Bethel; and there was but a little way to come to Ephrath: and Rachel travailed, and she had hard labour."],["Genesis 35:17","And it came to pass, when she was in hard labour, that the midwife said unto her, Fear not; thou shalt have this son also."],["Genesis 35:18","And it came to pass, as her soul was in departing, (for she died) that she called his name Benoni: but his father called him Benjamin."]]},{"ref":"Genesis 35:24","verses":[["Genesis 35:24","The sons of Rachel; Joseph, and Benjamin:"]]}]},{"a":"benjamin_463","b":"israel_682","type":"loved","why":"Jacob loved Benjamin, the child of his old age, and held him back from Egypt, for his life was bound up in the lad's life.","refs":[{"ref":"Genesis 42:4","verses":[["Genesis 42:4","But Benjamin, Joseph’s brother, Jacob sent not with his brethren; for he said, Lest peradventure mischief befall him."]]},{"ref":"Genesis 44:20","verses":[["Genesis 44:20","And we said unto my lord, We have a father, an old man, and a child of his old age, a little one; and his brother is dead, and he alone is left of his mother, and his father loveth him."]]},{"ref":"Genesis 44:30","verses":[["Genesis 44:30","Now therefore when I come to thy servant my father, and the lad be not with us; seeing that his life is bound up in the lad’s life;"]]}]},{"a":"benjamin_463","b":"rachel_2386","type":"family","why":"Rachel bore Benjamin and died in childbirth, naming him Benoni; his father called him Benjamin.","refs":[{"ref":"Genesis 35:16–19","verses":[["Genesis 35:16","And they journeyed from Bethel; and there was but a little way to come to Ephrath: and Rachel travailed, and she had hard labour."],["Genesis 35:17","And it came to pass, when she was in hard labour, that the midwife said unto her, Fear not; thou shalt have this son also."],["Genesis 35:18","And it came to pass, as her soul was in departing, (for she died) that she called his name Benoni: but his father called him Benjamin."],["Genesis 35:19","And Rachel died, and was buried in the way to Ephrath, which is Bethlehem."]]}]},{"a":"cain_533","b":"eve_1231","type":"family","why":"Eve bore Cain and said, I have gotten a man from the LORD.","refs":[{"ref":"Genesis 4:1","verses":[["Genesis 4:1","And Adam knew Eve his wife; and she conceived, and bare Cain, and said, I have gotten a man from the LORD."]]}]},{"a":"caleb_537","b":"joshua_1727","type":"worked_together","why":"Joshua and Caleb together tore their clothes and urged the people to go up into the land, and of the spies only they lived, because they wholly followed the LORD.","refs":[{"ref":"Numbers 14:6–9","verses":[["Numbers 14:6","And Joshua the son of Nun, and Caleb the son of Jephunneh, which were of them that searched the land, rent their clothes:"],["Numbers 14:7","And they spake unto all the company of the children of Israel, saying, The land, which we passed through to search it, is an exceeding good land."],["Numbers 14:8","If the LORD delight in us, then he will bring us into this land, and give it us; a land which floweth with milk and honey."],["Numbers 14:9","Only rebel not ye against the LORD, neither fear ye the people of the land; for they are bread for us: their defence is departed from them, and the LORD is with us: fear them not."]]},{"ref":"Numbers 14:38","verses":[["Numbers 14:38","But Joshua the son of Nun, and Caleb the son of Jephunneh, which were of the men that went to search the land, lived still."]]},{"ref":"Numbers 32:12","verses":[["Numbers 32:12","Save Caleb the son of Jephunneh the Kenezite, and Joshua the son of Nun: for they have wholly followed the LORD."]]}]},{"a":"dan_973","b":"rachel_2386","type":"family","why":"Rachel gave Bilhah to Jacob so that she might have children by her, and when Dan was born Rachel said God had given her a son and named him.","refs":[{"ref":"Genesis 30:3–6","verses":[["Genesis 30:3","And she said, Behold my maid Bilhah, go in unto her; and she shall bear upon my knees, that I may also have children by her."],["Genesis 30:4","And she gave him Bilhah her handmaid to wife: and Jacob went in unto her."],["Genesis 30:5","And Bilhah conceived, and bare Jacob a son."],["Genesis 30:6","And Rachel said, God hath judged me, and hath also heard my voice, and hath given me a son: therefore called she his name Dan."]]}]},{"a":"dan_973","b":"israel_682","type":"family","why":"Bilhah bore Jacob a son, Dan.","refs":[{"ref":"Genesis 30:4–6","verses":[["Genesis 30:4","And she gave him Bilhah her handmaid to wife: and Jacob went in unto her."],["Genesis 30:5","And Bilhah conceived, and bare Jacob a son."],["Genesis 30:6","And Rachel said, God hath judged me, and hath also heard my voice, and hath given me a son: therefore called she his name Dan."]]},{"ref":"Genesis 35:25","verses":[["Genesis 35:25","And the sons of Bilhah, Rachel’s handmaid; Dan, and Naphtali:"]]}]},{"a":"daughter_of_pharaoh_988","b":"moses_2108","type":"family","why":"Pharaoh's daughter drew Moses out of the water with compassion, and he became her son and was named by her.","refs":[{"ref":"Exodus 2:5–10","verses":[["Exodus 2:5","And the daughter of Pharaoh came down to wash herself at the river; and her maidens walked along by the river’s side; and when she saw the ark among the flags, she sent her maid to fetch it."],["Exodus 2:6","And when she had opened it, she saw the child: and, behold, the babe wept. And she had compassion on him, and said, This is one of the Hebrews’ children."],["Exodus 2:7","Then said his sister to Pharaoh’s daughter, Shall I go and call to thee a nurse of the Hebrew women, that she may nurse the child for thee?"],["Exodus 2:8","And Pharaoh’s daughter said to her, Go. And the maid went and called the child’s mother."],["Exodus 2:9","And Pharaoh’s daughter said unto her, Take this child away, and nurse it for me, and I will give thee thy wages. And the woman took the child, and nursed it."],["Exodus 2:10","And the child grew, and she brought him unto Pharaoh’s daughter, and he became her son. And she called his name Moses: and she said, Because I drew him out of the water."]]},{"ref":"Hebrews 11:24","verses":[["Hebrews 11:24","By faith Moses, when he was come to years, refused to be called the son of Pharaoh’s daughter;"]]}]},{"a":"daughter_of_pharaoh_988","b":"pharaoh_2330","type":"family","why":"She was the daughter of Pharaoh, the king who ordered every Hebrew son cast into the river.","refs":[{"ref":"Exodus 1:22","verses":[["Exodus 1:22","And Pharaoh charged all his people, saying, Every son that is born ye shall cast into the river, and every daughter ye shall save alive."]]},{"ref":"Exodus 2:5","verses":[["Exodus 2:5","And the daughter of Pharaoh came down to wash herself at the river; and her maidens walked along by the river’s side; and when she saw the ark among the flags, she sent her maid to fetch it."]]}]},{"a":"dinah_1012","b":"simeon_2741","type":"family","why":"Simeon and Levi were Dinah's brothers, and they took their swords and slew the men of Shechem because their sister was defiled.","refs":[{"ref":"Genesis 34:25–31","verses":[["Genesis 34:25","And it came to pass on the third day, when they were sore, that two of the sons of Jacob, Simeon and Levi, Dinah’s brethren, took each man his sword, and came upon the city boldly, and slew all the males."],["Genesis 34:26","And they slew Hamor and Shechem his son with the edge of the sword, and took Dinah out of Shechem’s house, and went out."],["Genesis 34:27","The sons of Jacob came upon the slain, and spoiled the city, because they had defiled their sister."],["Genesis 34:28","They took their sheep, and their oxen, and their asses, and that which was in the city, and that which was in the field,"],["Genesis 34:29","And all their wealth, and all their little ones, and their wives took they captive, and spoiled even all that was in the house."],["Genesis 34:30","And Jacob said to Simeon and Levi, Ye have troubled me to make me to stink among the inhabitants of the land, among the Canaanites and the Perizzites: and I being few in number, they shall gather themselves together against me, and slay me; and I shall be destroyed, I and my house."],["Genesis 34:31","And they said, Should he deal with our sister as with an harlot?"]]}]},{"a":"dinah_1012","b":"israel_682","type":"family","why":"Dinah was Jacob's daughter, born to Leah.","refs":[{"ref":"Genesis 30:21","verses":[["Genesis 30:21","And afterwards she bare a daughter, and called her name Dinah."]]},{"ref":"Genesis 34:1","verses":[["Genesis 34:1","And Dinah the daughter of Leah, which she bare unto Jacob, went out to see the daughters of the land."]]}]},{"a":"dinah_1012","b":"leah_1813","type":"family","why":"Leah bore Dinah to Jacob.","refs":[{"ref":"Genesis 30:21","verses":[["Genesis 30:21","And afterwards she bare a daughter, and called her name Dinah."]]},{"ref":"Genesis 34:1","verses":[["Genesis 34:1","And Dinah the daughter of Leah, which she bare unto Jacob, went out to see the daughters of the land."]]}]},{"a":"eleazar_1062","b":"moses_2108","type":"worked_together","why":"Moses and Eleazar the priest together numbered Israel, heard the people's cases, and divided the spoil as the LORD commanded.","refs":[{"ref":"Numbers 26:1–4","verses":[["Numbers 26:1","And it came to pass after the plague, that the LORD spake unto Moses and unto Eleazar the son of Aaron the priest, saying,"],["Numbers 26:2","Take the sum of all the congregation of the children of Israel, from twenty years old and upward, throughout their fathers’ house, all that are able to go to war in Israel."],["Numbers 26:3","And Moses and Eleazar the priest spake with them in the plains of Moab by Jordan near Jericho, saying,"],["Numbers 26:4","Take the sum of the people, from twenty years old and upward; as the LORD commanded Moses and the children of Israel, which went forth out of the land of Egypt."]]},{"ref":"Numbers 27:1–2","verses":[["Numbers 27:1","Then came the daughters of Zelophehad, the son of Hepher, the son of Gilead, the son of Machir, the son of Manasseh, of the families of Manasseh the son of Joseph: and these are the names of his daughters; Mahlah, Noah, and Hoglah, and Milcah, and Tirzah."],["Numbers 27:2","And they stood before Moses, and before Eleazar the priest, and before the princes and all the congregation, by the door of the tabernacle of the congregation, saying,"]]},{"ref":"Numbers 31:13","verses":[["Numbers 31:13","And Moses, and Eleazar the priest, and all the princes of the congregation, went forth to meet them without the camp."]]},{"ref":"Numbers 31:25–27","verses":[["Numbers 31:25","And the LORD spake unto Moses, saying,"],["Numbers 31:26","Take the sum of the prey that was taken, both of man and of beast, thou, and Eleazar the priest, and the chief fathers of the congregation:"],["Numbers 31:27","And divide the prey into two parts; between them that took the war upon them, who went out to battle, and between all the congregation:"]]}]},{"a":"eleazar_1062","b":"phinehas_2349","type":"family","why":"Eleazar married one of the daughters of Putiel, and she bore him Phinehas.","refs":[{"ref":"Exodus 6:25","verses":[["Exodus 6:25","And Eleazar Aaron’s son took him one of the daughters of Putiel to wife; and she bare him Phinehas: these are the heads of the fathers of the Levites according to their families."]]},{"ref":"Numbers 25:7","verses":[["Numbers 25:7","And when Phinehas, the son of Eleazar, the son of Aaron the priest, saw it, he rose up from among the congregation, and took a javelin in his hand;"]]}]},{"a":"enoch_1192","b":"methuselah_2042","type":"family","why":"Enoch begat Methuselah and walked with God after his birth.","refs":[{"ref":"Genesis 5:21–22","verses":[["Genesis 5:21","And Enoch lived sixty and five years, and begat Methuselah:"],["Genesis 5:22","And Enoch walked with God after he begat Methuselah three hundred years, and begat sons and daughters:"]]}]},{"a":"ephraim_1206","b":"joseph_1710","type":"family","why":"Ephraim was Joseph's second son, born in Egypt and named by Joseph.","refs":[{"ref":"Genesis 41:50–52","verses":[["Genesis 41:50","And unto Joseph were born two sons before the years of famine came, which Asenath the daughter of Potipherah priest of On bare unto him."],["Genesis 41:51","And Joseph called the name of the firstborn Manasseh: For God, said he, hath made me forget all my toil, and all my father’s house."],["Genesis 41:52","And the name of the second called he Ephraim: For God hath caused me to be fruitful in the land of my affliction."]]},{"ref":"Genesis 48:1","verses":[["Genesis 48:1","And it came to pass after these things, that one told Joseph, Behold, thy father is sick: and he took with him his two sons, Manasseh and Ephraim."]]}]},{"a":"ephraim_1206","b":"israel_682","type":"family","why":"Jacob told Joseph that Ephraim and Manasseh, born in Egypt, were his own, as Reuben and Simeon.","refs":[{"ref":"Genesis 48:5","verses":[["Genesis 48:5","And now thy two sons, Ephraim and Manasseh, which were born unto thee in the land of Egypt before I came unto thee into Egypt, are mine; as Reuben and Simeon, they shall be mine."]]}]},{"a":"ephraim_1206","b":"israel_682","type":"blessed","why":"Jacob laid his right hand on Ephraim, blessed him in the name of God, and set him before Manasseh.","refs":[{"ref":"Genesis 48:13–20","verses":[["Genesis 48:13","And Joseph took them both, Ephraim in his right hand toward Israel’s left hand, and Manasseh in his left hand toward Israel’s right hand, and brought them near unto him."],["Genesis 48:14","And Israel stretched out his right hand, and laid it upon Ephraim’s head, who was the younger, and his left hand upon Manasseh’s head, guiding his hands wittingly; for Manasseh was the firstborn."],["Genesis 48:15","And he blessed Joseph, and said, God, before whom my fathers Abraham and Isaac did walk, the God which fed me all my life long unto this day,"],["Genesis 48:16","The Angel which redeemed me from all evil, bless the lads; and let my name be named on them, and the name of my fathers Abraham and Isaac; and let them grow into a multitude in the midst of the earth."],["Genesis 48:17","And when Joseph saw that his father laid his right hand upon the head of Ephraim, it displeased him: and he held up his father’s hand, to remove it from Ephraim’s head unto Manasseh’s head."],["Genesis 48:18","And Joseph said unto his father, Not so, my father: for this is the firstborn; put thy right hand upon his head."],["Genesis 48:19","And his father refused, and said, I know it, my son, I know it: he also shall become a people, and he also shall be great: but truly his younger brother shall be greater than he, and his seed shall become a multitude of nations."],["Genesis 48:20","And he blessed them that day, saying, In thee shall Israel bless, saying, God make thee as Ephraim and as Manasseh: and he set Ephraim before Manasseh."]]}]},{"a":"ephraim_1206","b":"manasseh_1928","type":"family","why":"Manasseh and Ephraim were the two sons born to Joseph in Egypt.","refs":[{"ref":"Genesis 41:50–52","verses":[["Genesis 41:50","And unto Joseph were born two sons before the years of famine came, which Asenath the daughter of Potipherah priest of On bare unto him."],["Genesis 41:51","And Joseph called the name of the firstborn Manasseh: For God, said he, hath made me forget all my toil, and all my father’s house."],["Genesis 41:52","And the name of the second called he Ephraim: For God hath caused me to be fruitful in the land of my affliction."]]},{"ref":"Genesis 46:20","verses":[["Genesis 46:20","And unto Joseph in the land of Egypt were born Manasseh and Ephraim, which Asenath the daughter of Potipherah priest of On bare unto him."]]}]},{"a":"esau_1216","b":"israel_682","type":"family","why":"Esau and Jacob were twin sons of Isaac and Rebekah.","refs":[{"ref":"Genesis 25:21–26","verses":[["Genesis 25:21","And Isaac intreated the LORD for his wife, because she was barren: and the LORD was intreated of him, and Rebekah his wife conceived."],["Genesis 25:22","And the children struggled together within her; and she said, If it be so, why am I thus? And she went to enquire of the LORD."],["Genesis 25:23","And the LORD said unto her, Two nations are in thy womb, and two manner of people shall be separated from thy bowels; and the one people shall be stronger than the other people; and the elder shall serve the younger."],["Genesis 25:24","And when her days to be delivered were fulfilled, behold, there were twins in her womb."],["Genesis 25:25","And the first came out red, all over like an hairy garment; and they called his name Esau."],["Genesis 25:26","And after that came his brother out, and his hand took hold on Esau’s heel; and his name was called Jacob: and Isaac was threescore years old when she bare them."]]}]},{"a":"esau_1216","b":"israel_682","type":"rivals","why":"Jacob took Esau's birthright and then his blessing, and Esau hated him for it.","refs":[{"ref":"Genesis 25:29–34","verses":[["Genesis 25:29","And Jacob sod pottage: and Esau came from the field, and he was faint:"],["Genesis 25:30","And Esau said to Jacob, Feed me, I pray thee, with that same red pottage; for I am faint: therefore was his name called Edom."],["Genesis 25:31","And Jacob said, Sell me this day thy birthright."],["Genesis 25:32","And Esau said, Behold, I am at the point to die: and what profit shall this birthright do to me?"],["Genesis 25:33","And Jacob said, Swear to me this day; and he sware unto him: and he sold his birthright unto Jacob."],["Genesis 25:34","Then Jacob gave Esau bread and pottage of lentiles; and he did eat and drink, and rose up, and went his way: thus Esau despised his birthright."]]},{"ref":"Genesis 27:30–41","verses":[["Genesis 27:30","And it came to pass, as soon as Isaac had made an end of blessing Jacob, and Jacob was yet scarce gone out from the presence of Isaac his father, that Esau his brother came in from his hunting."],["Genesis 27:31","And he also had made savoury meat, and brought it unto his father, and said unto his father, Let my father arise, and eat of his son’s venison, that thy soul may bless me."],["Genesis 27:32","And Isaac his father said unto him, Who art thou? And he said, I am thy son, thy firstborn Esau."],["Genesis 27:33","And Isaac trembled very exceedingly, and said, Who? where is he that hath taken venison, and brought it me, and I have eaten of all before thou camest, and have blessed him? yea, and he shall be blessed."],["Genesis 27:34","And when Esau heard the words of his father, he cried with a great and exceeding bitter cry, and said unto his father, Bless me, even me also, O my father."],["Genesis 27:35","And he said, Thy brother came with subtilty, and hath taken away thy blessing."],["Genesis 27:36","And he said, Is not he rightly named Jacob? for he hath supplanted me these two times: he took away my birthright; and, behold, now he hath taken away my blessing. And he said, Hast thou not reserved a blessing for me?"],["Genesis 27:37","And Isaac answered and said unto Esau, Behold, I have made him thy lord, and all his brethren have I given to him for servants; and with corn and wine have I sustained him: and what shall I do now unto thee, my son?"],["Genesis 27:38","And Esau said unto his father, Hast thou but one blessing, my father? bless me, even me also, O my father. And Esau lifted up his voice, and wept."],["Genesis 27:39","And Isaac his father answered and said unto him, Behold, thy dwelling shall be the fatness of the earth, and of the dew of heaven from above;"],["Genesis 27:40","And by thy sword shalt thou live, and shalt serve thy brother; and it shall come to pass when thou shalt have the dominion, that thou shalt break his yoke from off thy neck."],["Genesis 27:41","And Esau hated Jacob because of the blessing wherewith his father blessed him: and Esau said in his heart, The days of mourning for my father are at hand; then will I slay my brother Jacob."]]}]},{"a":"esau_1216","b":"isaac_616","type":"family","why":"Esau was Isaac's firstborn, one of the twins Rebekah bore him.","refs":[{"ref":"Genesis 25:21–26","verses":[["Genesis 25:21","And Isaac intreated the LORD for his wife, because she was barren: and the LORD was intreated of him, and Rebekah his wife conceived."],["Genesis 25:22","And the children struggled together within her; and she said, If it be so, why am I thus? And she went to enquire of the LORD."],["Genesis 25:23","And the LORD said unto her, Two nations are in thy womb, and two manner of people shall be separated from thy bowels; and the one people shall be stronger than the other people; and the elder shall serve the younger."],["Genesis 25:24","And when her days to be delivered were fulfilled, behold, there were twins in her womb."],["Genesis 25:25","And the first came out red, all over like an hairy garment; and they called his name Esau."],["Genesis 25:26","And after that came his brother out, and his hand took hold on Esau’s heel; and his name was called Jacob: and Isaac was threescore years old when she bare them."]]}]},{"a":"esau_1216","b":"isaac_616","type":"loved","why":"Isaac loved Esau, because he did eat of his venison.","refs":[{"ref":"Genesis 25:27–28","verses":[["Genesis 25:27","And the boys grew: and Esau was a cunning hunter, a man of the field; and Jacob was a plain man, dwelling in tents."],["Genesis 25:28","And Isaac loved Esau, because he did eat of his venison: but Rebekah loved Jacob."]]},{"ref":"Genesis 27:1–4","verses":[["Genesis 27:1","And it came to pass, that when Isaac was old, and his eyes were dim, so that he could not see, he called Esau his eldest son, and said unto him, My son: and he said unto him, Behold, here am I."],["Genesis 27:2","And he said, Behold now, I am old, I know not the day of my death:"],["Genesis 27:3","Now therefore take, I pray thee, thy weapons, thy quiver and thy bow, and go out to the field, and take me some venison;"],["Genesis 27:4","And make me savoury meat, such as I love, and bring it to me, that I may eat; that my soul may bless thee before I die."]]}]},{"a":"esau_1216","b":"rebekah_2401","type":"family","why":"Rebekah bore Esau and Jacob as twins.","refs":[{"ref":"Genesis 25:21–26","verses":[["Genesis 25:21","And Isaac intreated the LORD for his wife, because she was barren: and the LORD was intreated of him, and Rebekah his wife conceived."],["Genesis 25:22","And the children struggled together within her; and she said, If it be so, why am I thus? And she went to enquire of the LORD."],["Genesis 25:23","And the LORD said unto her, Two nations are in thy womb, and two manner of people shall be separated from thy bowels; and the one people shall be stronger than the other people; and the elder shall serve the younger."],["Genesis 25:24","And when her days to be delivered were fulfilled, behold, there were twins in her womb."],["Genesis 25:25","And the first came out red, all over like an hairy garment; and they called his name Esau."],["Genesis 25:26","And after that came his brother out, and his hand took hold on Esau’s heel; and his name was called Jacob: and Isaac was threescore years old when she bare them."]]}]},{"a":"gad_1262","b":"leah_1813","type":"family","why":"Leah gave her maid Zilpah to Jacob as wife, and when Zilpah bore Gad, Leah named him.","refs":[{"ref":"Genesis 30:9–11","verses":[["Genesis 30:9","When Leah saw that she had left bearing, she took Zilpah her maid, and gave her Jacob to wife."],["Genesis 30:10","And Zilpah Leah’s maid bare Jacob a son."],["Genesis 30:11","And Leah said, A troop cometh: and she called his name Gad."]]}]},{"a":"gad_1262","b":"israel_682","type":"family","why":"Zilpah, Leah's maid, bore Jacob a son, Gad.","refs":[{"ref":"Genesis 30:10–11","verses":[["Genesis 30:10","And Zilpah Leah’s maid bare Jacob a son."],["Genesis 30:11","And Leah said, A troop cometh: and she called his name Gad."]]},{"ref":"Genesis 35:26","verses":[["Genesis 35:26","And the sons of Zilpah, Leah’s handmaid; Gad, and Asher: these are the sons of Jacob, which were born to him in Padanaram."]]}]},{"a":"gad_1262","b":"reuben_2429","type":"family","why":"Reuben and Gad were both among the twelve sons of Jacob.","refs":[{"ref":"Genesis 35:22–26","verses":[["Genesis 35:22","And it came to pass, when Israel dwelt in that land, that Reuben went and lay with Bilhah his father’s concubine: and Israel heard it. Now the sons of Jacob were twelve:"],["Genesis 35:23","The sons of Leah; Reuben, Jacob’s firstborn, and Simeon, and Levi, and Judah, and Issachar, and Zebulun:"],["Genesis 35:24","The sons of Rachel; Joseph, and Benjamin:"],["Genesis 35:25","And the sons of Bilhah, Rachel’s handmaid; Dan, and Naphtali:"],["Genesis 35:26","And the sons of Zilpah, Leah’s handmaid; Gad, and Asher: these are the sons of Jacob, which were born to him in Padanaram."]]}]},{"a":"hagar_1348","b":"sarah_2473","type":"served","why":"Hagar was Sarah's Egyptian handmaid, and Sarah was her mistress.","refs":[{"ref":"Genesis 16:1–3","verses":[["Genesis 16:1","Now Sarai Abram’s wife bare him no children: and she had an handmaid, an Egyptian, whose name was Hagar."],["Genesis 16:2","And Sarai said unto Abram, Behold now, the LORD hath restrained me from bearing: I pray thee, go in unto my maid; it may be that I may obtain children by her. And Abram hearkened to the voice of Sarai."],["Genesis 16:3","And Sarai Abram’s wife took Hagar her maid the Egyptian, after Abram had dwelt ten years in the land of Canaan, and gave her to her husband Abram to be his wife."]]},{"ref":"Genesis 16:8–9","verses":[["Genesis 16:8","And he said, Hagar, Sarai’s maid, whence camest thou? and whither wilt thou go? And she said, I flee from the face of my mistress Sarai."],["Genesis 16:9","And the angel of the LORD said unto her, Return to thy mistress, and submit thyself under her hands."]]}]},{"a":"hagar_1348","b":"sarah_2473","type":"rivals","why":"When Hagar conceived she despised her mistress, Sarah dealt hardly with her, and Sarah later had Hagar and her son cast out so he would not be heir with Isaac.","refs":[{"ref":"Genesis 16:4–6","verses":[["Genesis 16:4","And he went in unto Hagar, and she conceived: and when she saw that she had conceived, her mistress was despised in her eyes."],["Genesis 16:5","And Sarai said unto Abram, My wrong be upon thee: I have given my maid into thy bosom; and when she saw that she had conceived, I was despised in her eyes: the LORD judge between me and thee."],["Genesis 16:6","But Abram said unto Sarai, Behold, thy maid is in thy hand; do to her as it pleaseth thee. And when Sarai dealt hardly with her, she fled from her face."]]},{"ref":"Genesis 21:9–10","verses":[["Genesis 21:9","And Sarah saw the son of Hagar the Egyptian, which she had born unto Abraham, mocking."],["Genesis 21:10","Wherefore she said unto Abraham, Cast out this bondwoman and her son: for the son of this bondwoman shall not be heir with my son, even with Isaac."]]}]},{"a":"hagar_1348","b":"ishmael_630","type":"family","why":"Hagar bore Ishmael to Abraham, and wandered with him in the wilderness when they were sent away.","refs":[{"ref":"Genesis 16:15","verses":[["Genesis 16:15","And Hagar bare Abram a son: and Abram called his son’s name, which Hagar bare, Ishmael."]]},{"ref":"Genesis 21:14–21","verses":[["Genesis 21:14","And Abraham rose up early in the morning, and took bread, and a bottle of water, and gave it unto Hagar, putting it on her shoulder, and the child, and sent her away: and she departed, and wandered in the wilderness of Beersheba."],["Genesis 21:15","And the water was spent in the bottle, and she cast the child under one of the shrubs."],["Genesis 21:16","And she went, and sat her down over against him a good way off, as it were a bowshot: for she said, Let me not see the death of the child. And she sat over against him, and lift up her voice, and wept."],["Genesis 21:17","And God heard the voice of the lad; and the angel of God called to Hagar out of heaven, and said unto her, What aileth thee, Hagar? fear not; for God hath heard the voice of the lad where he is."],["Genesis 21:18","Arise, lift up the lad, and hold him in thine hand; for I will make him a great nation."],["Genesis 21:19","And God opened her eyes, and she saw a well of water; and she went, and filled the bottle with water, and gave the lad drink."],["Genesis 21:20","And God was with the lad; and he grew, and dwelt in the wilderness, and became an archer."],["Genesis 21:21","And he dwelt in the wilderness of Paran: and his mother took him a wife out of the land of Egypt."]]}]},{"a":"ham_1359","b":"noah_2210","type":"family","why":"Ham was one of the three sons of Noah who went forth from the ark.","refs":[{"ref":"Genesis 5:32","verses":[["Genesis 5:32","And Noah was five hundred years old: and Noah begat Shem, Ham, and Japheth."]]},{"ref":"Genesis 9:18–19","verses":[["Genesis 9:18","And the sons of Noah, that went forth of the ark, were Shem, and Ham, and Japheth: and Ham is the father of Canaan."],["Genesis 9:19","These are the three sons of Noah: and of them was the whole earth overspread."]]}]},{"a":"ham_1359","b":"shem_2613","type":"family","why":"Shem and Ham were sons of Noah.","refs":[{"ref":"Genesis 9:18–19","verses":[["Genesis 9:18","And the sons of Noah, that went forth of the ark, were Shem, and Ham, and Japheth: and Ham is the father of Canaan."],["Genesis 9:19","These are the three sons of Noah: and of them was the whole earth overspread."]]}]},{"a":"ham_1359","b":"japheth_726","type":"family","why":"Ham and Japheth were sons of Noah.","refs":[{"ref":"Genesis 9:18–19","verses":[["Genesis 9:18","And the sons of Noah, that went forth of the ark, were Shem, and Ham, and Japheth: and Ham is the father of Canaan."],["Genesis 9:19","These are the three sons of Noah: and of them was the whole earth overspread."]]}]},{"a":"isaac_616","b":"rebekah_2401","type":"married","why":"Isaac took Rebekah, and she became his wife, and he loved her.","refs":[{"ref":"Genesis 24:62–67","verses":[["Genesis 24:62","And Isaac came from the way of the well Lahairoi; for he dwelt in the south country."],["Genesis 24:63","And Isaac went out to meditate in the field at the eventide: and he lifted up his eyes, and saw, and, behold, the camels were coming."],["Genesis 24:64","And Rebekah lifted up her eyes, and when she saw Isaac, she lighted off the camel."],["Genesis 24:65","For she had said unto the servant, What man is this that walketh in the field to meet us? And the servant had said, It is my master: therefore she took a vail, and covered herself."],["Genesis 24:66","And the servant told Isaac all things that he had done."],["Genesis 24:67","And Isaac brought her into his mother Sarah’s tent, and took Rebekah, and she became his wife; and he loved her: and Isaac was comforted after his mother’s death."]]},{"ref":"Genesis 25:20–21","verses":[["Genesis 25:20","And Isaac was forty years old when he took Rebekah to wife, the daughter of Bethuel the Syrian of Padanaram, the sister to Laban the Syrian."],["Genesis 25:21","And Isaac intreated the LORD for his wife, because she was barren: and the LORD was intreated of him, and Rebekah his wife conceived."]]}]},{"a":"isaac_616","b":"israel_682","type":"family","why":"Jacob was one of the twin sons Rebekah bore Isaac.","refs":[{"ref":"Genesis 25:21–26","verses":[["Genesis 25:21","And Isaac intreated the LORD for his wife, because she was barren: and the LORD was intreated of him, and Rebekah his wife conceived."],["Genesis 25:22","And the children struggled together within her; and she said, If it be so, why am I thus? And she went to enquire of the LORD."],["Genesis 25:23","And the LORD said unto her, Two nations are in thy womb, and two manner of people shall be separated from thy bowels; and the one people shall be stronger than the other people; and the elder shall serve the younger."],["Genesis 25:24","And when her days to be delivered were fulfilled, behold, there were twins in her womb."],["Genesis 25:25","And the first came out red, all over like an hairy garment; and they called his name Esau."],["Genesis 25:26","And after that came his brother out, and his hand took hold on Esau’s heel; and his name was called Jacob: and Isaac was threescore years old when she bare them."]]}]},{"a":"isaac_616","b":"israel_682","type":"blessed","why":"Isaac blessed Jacob, who came disguised as Esau, and later blessed him again with the blessing of Abraham.","refs":[{"ref":"Genesis 27:27–29","verses":[["Genesis 27:27","And he came near, and kissed him: and he smelled the smell of his raiment, and blessed him, and said, See, the smell of my son is as the smell of a field which the LORD hath blessed:"],["Genesis 27:28","Therefore God give thee of the dew of heaven, and the fatness of the earth, and plenty of corn and wine:"],["Genesis 27:29","Let people serve thee, and nations bow down to thee: be lord over thy brethren, and let thy mother’s sons bow down to thee: cursed be every one that curseth thee, and blessed be he that blesseth thee."]]},{"ref":"Genesis 28:1–4","verses":[["Genesis 28:1","And Isaac called Jacob, and blessed him, and charged him, and said unto him, Thou shalt not take a wife of the daughters of Canaan."],["Genesis 28:2","Arise, go to Padanaram, to the house of Bethuel thy mother’s father; and take thee a wife from thence of the daughters of Laban thy mother’s brother."],["Genesis 28:3","And God Almighty bless thee, and make thee fruitful, and multiply thee, that thou mayest be a multitude of people;"],["Genesis 28:4","And give thee the blessing of Abraham, to thee, and to thy seed with thee; that thou mayest inherit the land wherein thou art a stranger, which God gave unto Abraham."]]},{"ref":"Hebrews 11:20","verses":[["Hebrews 11:20","By faith Isaac blessed Jacob and Esau concerning things to come."]]}]},{"a":"isaac_616","b":"sarah_2473","type":"family","why":"Sarah bore Isaac to Abraham in his old age, at the set time God had spoken.","refs":[{"ref":"Genesis 21:1–3","verses":[["Genesis 21:1","And the LORD visited Sarah as he had said, and the LORD did unto Sarah as he had spoken."],["Genesis 21:2","For Sarah conceived, and bare Abraham a son in his old age, at the set time of which God had spoken to him."],["Genesis 21:3","And Abraham called the name of his son that was born unto him, whom Sarah bare to him, Isaac."]]}]},{"a":"isaac_616","b":"ishmael_630","type":"family","why":"Isaac and Ishmael were both sons of Abraham, and buried him together.","refs":[{"ref":"Genesis 25:9","verses":[["Genesis 25:9","And his sons Isaac and Ishmael buried him in the cave of Machpelah, in the field of Ephron the son of Zohar the Hittite, which is before Mamre;"]]}]},{"a":"ishmael_630","b":"sarah_2473","type":"rivals","why":"When Sarah saw Ishmael mocking, she had him cast out, saying he would not be heir with her son Isaac.","refs":[{"ref":"Genesis 21:9–12","verses":[["Genesis 21:9","And Sarah saw the son of Hagar the Egyptian, which she had born unto Abraham, mocking."],["Genesis 21:10","Wherefore she said unto Abraham, Cast out this bondwoman and her son: for the son of this bondwoman shall not be heir with my son, even with Isaac."],["Genesis 21:11","And the thing was very grievous in Abraham’s sight because of his son."],["Genesis 21:12","And God said unto Abraham, Let it not be grievous in thy sight because of the lad, and because of thy bondwoman; in all that Sarah hath said unto thee, hearken unto her voice; for in Isaac shall thy seed be called."]]}]},{"a":"israel_682","b":"laban_1803","type":"family","why":"Laban was the brother of Jacob's mother Rebekah, and gave Jacob his daughters Leah and Rachel as wives.","refs":[{"ref":"Genesis 28:2","verses":[["Genesis 28:2","Arise, go to Padanaram, to the house of Bethuel thy mother’s father; and take thee a wife from thence of the daughters of Laban thy mother’s brother."]]},{"ref":"Genesis 29:10–14","verses":[["Genesis 29:10","And it came to pass, when Jacob saw Rachel the daughter of Laban his mother’s brother, and the sheep of Laban his mother’s brother, that Jacob went near, and rolled the stone from the well’s mouth, and watered the flock of Laban his mother’s brother."],["Genesis 29:11","And Jacob kissed Rachel, and lifted up his voice, and wept."],["Genesis 29:12","And Jacob told Rachel that he was her father’s brother, and that he was Rebekah’s son: and she ran and told her father."],["Genesis 29:13","And it came to pass, when Laban heard the tidings of Jacob his sister’s son, that he ran to meet him, and embraced him, and kissed him, and brought him to his house. And he told Laban all these things."],["Genesis 29:14","And Laban said to him, Surely thou art my bone and my flesh. And he abode with him the space of a month."]]},{"ref":"Genesis 29:21–28","verses":[["Genesis 29:21","And Jacob said unto Laban, Give me my wife, for my days are fulfilled, that I may go in unto her."],["Genesis 29:22","And Laban gathered together all the men of the place, and made a feast."],["Genesis 29:23","And it came to pass in the evening, that he took Leah his daughter, and brought her to him; and he went in unto her."],["Genesis 29:24","And Laban gave unto his daughter Leah Zilpah his maid for an handmaid."],["Genesis 29:25","And it came to pass, that in the morning, behold, it was Leah: and he said to Laban, What is this thou hast done unto me? did not I serve with thee for Rachel? wherefore then hast thou beguiled me?"],["Genesis 29:26","And Laban said, It must not be so done in our country, to give the younger before the firstborn."],["Genesis 29:27","Fulfil her week, and we will give thee this also for the service which thou shalt serve with me yet seven other years."],["Genesis 29:28","And Jacob did so, and fulfilled her week: and he gave him Rachel his daughter to wife also."]]}]},{"a":"israel_682","b":"laban_1803","type":"served","why":"Jacob served Laban fourteen years for his daughters and six years for his cattle.","refs":[{"ref":"Genesis 29:18–20","verses":[["Genesis 29:18","And Jacob loved Rachel; and said, I will serve thee seven years for Rachel thy younger daughter."],["Genesis 29:19","And Laban said, It is better that I give her to thee, than that I should give her to another man: abide with me."],["Genesis 29:20","And Jacob served seven years for Rachel; and they seemed unto him but a few days, for the love he had to her."]]},{"ref":"Genesis 31:38–41","verses":[["Genesis 31:38","This twenty years have I been with thee; thy ewes and thy she goats have not cast their young, and the rams of thy flock have I not eaten."],["Genesis 31:39","That which was torn of beasts I brought not unto thee; I bare the loss of it; of my hand didst thou require it, whether stolen by day, or stolen by night."],["Genesis 31:40","Thus I was; in the day the drought consumed me, and the frost by night; and my sleep departed from mine eyes."],["Genesis 31:41","Thus have I been twenty years in thy house; I served thee fourteen years for thy two daughters, and six years for thy cattle: and thou hast changed my wages ten times."]]}]},{"a":"israel_682","b":"rachel_2386","type":"married","why":"Jacob served seven years for Rachel because he loved her, and Laban gave her to him to wife.","refs":[{"ref":"Genesis 29:18–20","verses":[["Genesis 29:18","And Jacob loved Rachel; and said, I will serve thee seven years for Rachel thy younger daughter."],["Genesis 29:19","And Laban said, It is better that I give her to thee, than that I should give her to another man: abide with me."],["Genesis 29:20","And Jacob served seven years for Rachel; and they seemed unto him but a few days, for the love he had to her."]]},{"ref":"Genesis 29:28–30","verses":[["Genesis 29:28","And Jacob did so, and fulfilled her week: and he gave him Rachel his daughter to wife also."],["Genesis 29:29","And Laban gave to Rachel his daughter Bilhah his handmaid to be her maid."],["Genesis 29:30","And he went in also unto Rachel, and he loved also Rachel more than Leah, and served with him yet seven other years."]]}]},{"a":"israel_682","b":"leah_1813","type":"married","why":"Laban gave Leah to Jacob in place of Rachel, and she became his wife and bore him sons.","refs":[{"ref":"Genesis 29:23–25","verses":[["Genesis 29:23","And it came to pass in the evening, that he took Leah his daughter, and brought her to him; and he went in unto her."],["Genesis 29:24","And Laban gave unto his daughter Leah Zilpah his maid for an handmaid."],["Genesis 29:25","And it came to pass, that in the morning, behold, it was Leah: and he said to Laban, What is this thou hast done unto me? did not I serve with thee for Rachel? wherefore then hast thou beguiled me?"]]},{"ref":"Genesis 29:30–35","verses":[["Genesis 29:30","And he went in also unto Rachel, and he loved also Rachel more than Leah, and served with him yet seven other years."],["Genesis 29:31","And when the LORD saw that Leah was hated, he opened her womb: but Rachel was barren."],["Genesis 29:32","And Leah conceived, and bare a son, and she called his name Reuben: for she said, Surely the LORD hath looked upon my affliction; now therefore my husband will love me."],["Genesis 29:33","And she conceived again, and bare a son; and said, Because the LORD hath heard that I was hated, he hath therefore given me this son also: and she called his name Simeon."],["Genesis 29:34","And she conceived again, and bare a son; and said, Now this time will my husband be joined unto me, because I have born him three sons: therefore was his name called Levi."],["Genesis 29:35","And she conceived again, and bare a son: and she said, Now will I praise the LORD: therefore she called his name Judah; and left bearing."]]}]},{"a":"israel_682","b":"joseph_1710","type":"family","why":"Joseph was the son Rachel bore Jacob.","refs":[{"ref":"Genesis 30:22–25","verses":[["Genesis 30:22","And God remembered Rachel, and God hearkened to her, and opened her womb."],["Genesis 30:23","And she conceived, and bare a son; and said, God hath taken away my reproach:"],["Genesis 30:24","And she called his name Joseph; and said, The LORD shall add to me another son."],["Genesis 30:25","And it came to pass, when Rachel had born Joseph, that Jacob said unto Laban, Send me away, that I may go unto mine own place, and to my country."]]}]},{"a":"israel_682","b":"joseph_1710","type":"loved","why":"Israel loved Joseph more than all his children, mourned him as dead, and fell on his neck when he saw him alive.","refs":[{"ref":"Genesis 37:3–4","verses":[["Genesis 37:3","Now Israel loved Joseph more than all his children, because he was the son of his old age: and he made him a coat of many colours."],["Genesis 37:4","And when his brethren saw that their father loved him more than all his brethren, they hated him, and could not speak peaceably unto him."]]},{"ref":"Genesis 37:33–35","verses":[["Genesis 37:33","And he knew it, and said, It is my son’s coat; an evil beast hath devoured him; Joseph is without doubt rent in pieces."],["Genesis 37:34","And Jacob rent his clothes, and put sackcloth upon his loins, and mourned for his son many days."],["Genesis 37:35","And all his sons and all his daughters rose up to comfort him; but he refused to be comforted; and he said, For I will go down into the grave unto my son mourning. Thus his father wept for him."]]},{"ref":"Genesis 46:29–30","verses":[["Genesis 46:29","And Joseph made ready his chariot, and went up to meet Israel his father, to Goshen, and presented himself unto him; and he fell on his neck, and wept on his neck a good while."],["Genesis 46:30","And Israel said unto Joseph, Now let me die, since I have seen thy face, because thou art yet alive."]]}]},{"a":"israel_682","b":"rebekah_2401","type":"family","why":"Rebekah bore Jacob and Esau as twins.","refs":[{"ref":"Genesis 25:21–26","verses":[["Genesis 25:21","And Isaac intreated the LORD for his wife, because she was barren: and the LORD was intreated of him, and Rebekah his wife conceived."],["Genesis 25:22","And the children struggled together within her; and she said, If it be so, why am I thus? And she went to enquire of the LORD."],["Genesis 25:23","And the LORD said unto her, Two nations are in thy womb, and two manner of people shall be separated from thy bowels; and the one people shall be stronger than the other people; and the elder shall serve the younger."],["Genesis 25:24","And when her days to be delivered were fulfilled, behold, there were twins in her womb."],["Genesis 25:25","And the first came out red, all over like an hairy garment; and they called his name Esau."],["Genesis 25:26","And after that came his brother out, and his hand took hold on Esau’s heel; and his name was called Jacob: and Isaac was threescore years old when she bare them."]]}]},{"a":"israel_682","b":"rebekah_2401","type":"loved","why":"Rebekah loved Jacob, had him take Esau's blessing, and sent him away when Esau planned to kill him.","refs":[{"ref":"Genesis 25:28","verses":[["Genesis 25:28","And Isaac loved Esau, because he did eat of his venison: but Rebekah loved Jacob."]]},{"ref":"Genesis 27:6–17","verses":[["Genesis 27:6","And Rebekah spake unto Jacob her son, saying, Behold, I heard thy father speak unto Esau thy brother, saying,"],["Genesis 27:7","Bring me venison, and make me savoury meat, that I may eat, and bless thee before the LORD before my death."],["Genesis 27:8","Now therefore, my son, obey my voice according to that which I command thee."],["Genesis 27:9","Go now to the flock, and fetch me from thence two good kids of the goats; and I will make them savoury meat for thy father, such as he loveth:"],["Genesis 27:10","And thou shalt bring it to thy father, that he may eat, and that he may bless thee before his death."],["Genesis 27:11","And Jacob said to Rebekah his mother, Behold, Esau my brother is a hairy man, and I am a smooth man:"],["Genesis 27:12","My father peradventure will feel me, and I shall seem to him as a deceiver; and I shall bring a curse upon me, and not a blessing."],["Genesis 27:13","And his mother said unto him, Upon me be thy curse, my son: only obey my voice, and go fetch me them."],["Genesis 27:14","And he went, and fetched, and brought them to his mother: and his mother made savoury meat, such as his father loved."],["Genesis 27:15","And Rebekah took goodly raiment of her eldest son Esau, which were with her in the house, and put them upon Jacob her younger son:"],["Genesis 27:16","And she put the skins of the kids of the goats upon his hands, and upon the smooth of his neck:"],["Genesis 27:17","And she gave the savoury meat and the bread, which she had prepared, into the hand of her son Jacob."]]},{"ref":"Genesis 27:42–45","verses":[["Genesis 27:42","And these words of Esau her elder son were told to Rebekah: and she sent and called Jacob her younger son, and said unto him, Behold, thy brother Esau, as touching thee, doth comfort himself, purposing to kill thee."],["Genesis 27:43","Now therefore, my son, obey my voice; and arise, flee thou to Laban my brother to Haran;"],["Genesis 27:44","And tarry with him a few days, until thy brother’s fury turn away;"],["Genesis 27:45","Until thy brother’s anger turn away from thee, and he forget that which thou hast done to him: then I will send, and fetch thee from thence: why should I be deprived also of you both in one day?"]]}]},{"a":"israel_682","b":"pharaoh_2329","type":"blessed","why":"Jacob blessed Pharaoh when Joseph set him before him, and blessed him again as he left.","refs":[{"ref":"Genesis 47:7–10","verses":[["Genesis 47:7","And Joseph brought in Jacob his father, and set him before Pharaoh: and Jacob blessed Pharaoh."],["Genesis 47:8","And Pharaoh said unto Jacob, How old art thou?"],["Genesis 47:9","And Jacob said unto Pharaoh, The days of the years of my pilgrimage are an hundred and thirty years: few and evil have the days of the years of my life been, and have not attained unto the days of the years of the life of my fathers in the days of their pilgrimage."],["Genesis 47:10","And Jacob blessed Pharaoh, and went out from before Pharaoh."]]}]},{"a":"israel_682","b":"judah_1751","type":"family","why":"Judah was the fourth son Leah bore Jacob.","refs":[{"ref":"Genesis 29:35","vers
