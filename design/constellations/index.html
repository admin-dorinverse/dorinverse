<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dorinverse Constellations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Caveat:wght@600;700&display=swap">
<script>/* night-sky background stars are crosses (constellation stars stay dots) */function dvCross(c,x,y,h,ph){/* each cross shrinks into a small round dot, rests, then grows back into a cross; ph = the star's own phase (0-1) so stars run out of step */const ss=v=>v<=0?0:v>=1?1:v*v*(3-2*v),sd=typeof ph==='number'?ph:(x*.0071+y*.0113),now=(typeof performance!=='undefined'?performance.now():Date.now())/7000,u=((now+sd)%1+1)%1,p=u<.4?0:u<.55?ss((u-.4)/.15):u<.8?1:u<.95?1-ss((u-.8)/.15):0,rd=Math.max(1.1,h*.22)*ss(Math.min(1,p*1.5));const k=1-p;if(k>.06){const H=h*k,t=Math.max(.9*Math.min(1,k*1.4),H*.2),w=H*.64,a=-H/2,b=a+H*.27,P=[[-t/2,a],[t/2,a],[t/2,b],[w/2,b],[w/2,b+t],[t/2,b+t],[t/2,-a],[-t/2,-a],[-t/2,b+t],[-w/2,b+t],[-w/2,b],[-t/2,b]];let m=c.getTransform?c.getTransform():null,r=m?Math.atan2(m.b,m.a):0;const co=Math.cos(-r),si=Math.sin(-r);P.forEach((q,i)=>{const px=x+q[0]*co-q[1]*si,py=y+q[0]*si+q[1]*co;i?c.lineTo(px,py):c.moveTo(px,py);});c.closePath();}if(rd>.05){c.moveTo(x+rd,y);c.arc(x,y,rd,0,Math.PI*2,false);c.closePath();}}</script>
<style>:root{
  --ink:#3c3c3c; --cream:#fdf8ec; --cream-line:#e8d9b0; --brown:#5A3A22; --gold:#ffc65c;
  --mist:#c9cbef; --white:#fffaf0;
  --display:"Nunito",-apple-system,BlinkMacSystemFont,sans-serif;
  --body:"Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --c:#ffc65c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--body);color:var(--white);background:#1B1A38;touch-action:none;-webkit-user-select:none;user-select:none}
button{font-family:inherit;cursor:pointer}
img{-webkit-user-drag:none;user-select:none}

/* ---------- sky ---------- */
#sky{position:fixed;inset:0;overflow:hidden;cursor:grab}
#sky.drag{cursor:grabbing}
#skybg{position:absolute;inset:0;background:linear-gradient(180deg,#1B1A38 0%,#2B2550 70%,#4A3A66 100%)}
#skycv{position:absolute;inset:0;width:100%;height:100%;display:block}
#world{position:absolute;left:0;top:0;width:0;height:0;will-change:transform;transition:opacity .5s}
body.nodeview #world{opacity:0}
.wobj{position:absolute;left:0;top:0;will-change:transform}

/* bakery planet */
#planet{width:250px;margin-left:-125px;margin-top:-190px;pointer-events:none}
#planet .rock{position:relative;animation:dvFloat 6s ease-in-out infinite}
#planet .rock2{transform-origin:50% 72%;animation:dvRock 7s ease-in-out infinite alternate}
#planet img.bk{width:100%;display:block;filter:drop-shadow(0 10px 30px rgba(255,190,90,.25))}
@keyframes dvFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes dvRock{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
.chbox{position:absolute;width:28px;left:calc(74% - 14px);top:-1%;opacity:0;pointer-events:none}
.planet-halo{position:absolute;left:50%;top:62%;width:420px;height:420px;margin:-210px 0 0 -210px;border-radius:50%;background:radial-gradient(circle,rgba(255,200,120,.16),rgba(255,200,120,0) 62%);pointer-events:none}

/* constellation labels */
.clabel{position:absolute;left:0;top:0;white-space:nowrap;font-family:var(--display);font-weight:900;font-size:26px;letter-spacing:.5px;color:#fff;transform:translate(-50%,0);pointer-events:none;text-shadow:0 0 12px var(--c),0 0 26px var(--c),0 0 2px #fff;opacity:0;transition:opacity .9s ease}
.clabel.on{opacity:1}

/* rocket */
#rocket{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;z-index:3}
#rocket .rk{position:absolute;left:-30px;top:-62px;width:60px;height:124px;transform-origin:50% 50%}
#rocket svg{overflow:visible}
.flame{transform-origin:30px 100px;animation:flick .09s linear infinite alternate}
@keyframes flick{from{transform:scaleY(1) scaleX(1)}to{transform:scaleY(1.12) scaleX(.92)}}

/* ---------- chrome ---------- */
.glass{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);box-shadow:0 8px 30px rgba(0,0,0,.35)}
#tabs{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:4px;border-radius:999px;z-index:30}
#tabs button{border:0;background:none;color:#e9e9ff;font-weight:900;font-size:14px;padding:8px 18px;border-radius:999px;display:flex;align-items:center;gap:6px;transition:background .3s,color .3s}
#tabs button[aria-selected=true]{background:rgba(255,255,255,.92);color:#1a1c45}
#tabs svg{width:16px;height:16px}
#mapbtn{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));width:84px;height:84px;border-radius:50%;padding:0;z-index:25;overflow:hidden;transform-origin:100% 100%;transition:transform .45s cubic-bezier(.2,.9,.3,1.25),opacity .3s,box-shadow .45s}
#mapbtn.big{transform:scale(1.42);box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.25)}
#mapbtn:active{transform:scale(.94)}
#mapbtn.big:active{transform:scale(1.34)}
#mapbtn canvas{width:100%;height:100%;display:block;border-radius:50%}
#mapbtn::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25),inset 0 0 18px rgba(140,170,255,.35)}

#mappanel{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;padding:16px 16px calc(16px + env(safe-area-inset-bottom));background:rgba(5,6,20,.0);pointer-events:none;transition:background .4s}
#mappanel.open{pointer-events:auto;background:rgba(5,6,20,.45)}
#mappanel .card{width:min(520px,100%);border-radius:28px;padding:16px 16px 12px;transform:translateY(30px) scale(.96);opacity:0;transition:transform .45s cubic-bezier(.2,.9,.3,1.15),opacity .35s;background:rgba(18,20,58,.62)}
#mappanel.open .card{transform:none;opacity:1}
#mappanel h3{margin:0 0 8px 4px;font-weight:900;font-size:18px;letter-spacing:.3px;display:flex;justify-content:space-between;align-items:center}
#mappanel h3 button{background:rgba(255,255,255,.12);border:0;color:#fff;width:34px;height:34px;border-radius:50%;font-size:16px;font-weight:900}
#bigmap{position:relative;width:100%;aspect-ratio:1/1;max-height:62vh;margin:0 auto;border-radius:20px;overflow:hidden;background:radial-gradient(ellipse at 50% 50%,#1d2160 0%,#0d0f2e 70%,#080920 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
#bigmap canvas{position:absolute;inset:0;width:100%;height:100%}
.mpin{position:absolute;transform:translate(-50%,-30%);border:0;background:none;padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff;font-weight:900;font-size:11.5px;letter-spacing:.2px;text-shadow:0 0 8px var(--c)}
.mpin svg{width:38px;height:38px;filter:drop-shadow(0 0 6px var(--c));transition:transform .25s}
.mpin:active svg{transform:scale(.9)}
.mpin.home svg{width:30px;height:30px}

/* ---------- constellation list ---------- */
.screen{position:fixed;inset:0;z-index:20;opacity:0;pointer-events:none;transition:opacity .45s ease}
.screen.on{opacity:1;pointer-events:auto}
#list{background:linear-gradient(180deg,rgba(6,7,24,.55),rgba(6,7,24,.25) 40%,rgba(6,7,24,.55));overflow:hidden}
#list .scroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:calc(70px + env(safe-area-inset-top)) 18px 120px}
.lhead{max-width:560px;margin:0 auto 18px;display:flex;align-items:center;gap:14px}
.lhead svg{width:74px;height:74px;flex:none;filter:drop-shadow(0 0 10px var(--c))}
.lhead h1{margin:0;font-weight:900;font-size:34px;line-height:1;color:#fff;text-shadow:0 0 14px var(--c),0 0 30px var(--c)}
.backbtn{position:fixed;left:14px;top:calc(12px + env(safe-area-inset-top));z-index:31;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center}
.lcard{position:relative;display:block;width:100%;max-width:560px;margin:0 auto 14px;text-align:left;color:#fff;border-radius:24px;padding:18px 18px 16px;
  background:linear-gradient(150deg,color-mix(in srgb,var(--c) 22%,rgba(255,255,255,.06)),rgba(255,255,255,.04) 60%);
  border:1.5px solid color-mix(in srgb,var(--c) 60%,transparent);
  box-shadow:0 0 22px color-mix(in srgb,var(--c) 40%,transparent),inset 0 0 26px color-mix(in srgb,var(--c) 18%,transparent),0 10px 30px rgba(0,0,0,.35);
  backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);
  opacity:0;transform:translateY(18px);transition:transform .2s}
.screen.on .lcard{animation:cardIn .6s cubic-bezier(.2,.9,.3,1.1) forwards}
@keyframes cardIn{to{opacity:1;transform:none}}
.lcard:active{transform:scale(.98)}
.lcard .ref{font-size:13px;font-weight:800;letter-spacing:.4px;color:color-mix(in srgb,var(--c) 70%,#fff)}
.lcard b{display:block;font-weight:900;font-size:21px;line-height:1.15;margin:4px 0 6px}
.lcard p{margin:0;font-size:15px;line-height:1.4;color:rgba(255,255,255,.82);font-weight:600}
.lcard .dots{display:flex;gap:6px;margin-top:12px;align-items:center}
.lcard .dots img{width:26px;height:26px;opacity:.95}
.lcard .dots img.dim{opacity:.8}
.lcard .done{position:absolute;right:14px;top:14px;width:30px;height:30px;border-radius:50%;background:var(--c);color:#1a1c45;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 0 14px var(--c)}
.lcard.test{border-style:dashed}

/* ---------- node (orbit) view ---------- */
#node{background:radial-gradient(ellipse at 85% 50%,color-mix(in srgb,var(--c) 18%,transparent),transparent 55%),linear-gradient(90deg,rgba(6,7,24,.7),rgba(6,7,24,.35))}
#node .nhead{position:absolute;left:68px;right:16px;top:calc(14px + env(safe-area-inset-top));z-index:3}
#node .nhead b{display:block;font-weight:900;font-size:20px;line-height:1.1;text-shadow:0 0 12px var(--c)}
#node .nhead span{font-size:13px;font-weight:800;color:color-mix(in srgb,var(--c) 70%,#fff)}
#orbits{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.bigstar{position:absolute;width:0;height:0;pointer-events:none}
.bigstar .core{position:absolute;left:-46px;top:-46px;width:92px;height:92px;border-radius:50%;background:radial-gradient(circle,#fff 0%,#fff 22%,var(--c) 48%,transparent 72%);animation:starBreath 4s ease-in-out infinite}
.bigstar .halo{position:absolute;left:-220px;top:-220px;width:440px;height:440px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 55%,transparent) 0%,color-mix(in srgb,var(--c) 22%,transparent) 30%,transparent 70%)}
.bigstar .rays{position:absolute;left:-150px;top:-150px;width:300px;height:300px;animation:spin 60s linear infinite;opacity:.85}
.bigstar .rays2{animation-duration:90s;animation-direction:reverse;opacity:.5}
@keyframes starBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes spin{to{transform:rotate(360deg)}}
.cnode{position:absolute;left:0;top:0;width:96px;height:96px;margin:-48px 0 0 -48px;border:0;background:none;padding:0;will-change:transform}
.cnode .glow{position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 70%,transparent) 0%,transparent 68%);opacity:0;transition:opacity .4s}
.cnode img{position:relative;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5));transition:filter .4s,opacity .4s,transform .4s}
.cnode.locked{pointer-events:none}
.cnode.locked img{opacity:.38;filter:grayscale(.55) brightness(.7) drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.cnode.active .glow{opacity:1;animation:pulseGlow 1.6s ease-in-out infinite}
.cnode.active img{animation:pulseImg 1.6s ease-in-out infinite;filter:drop-shadow(0 0 12px var(--c)) drop-shadow(0 0 22px var(--c))}
@keyframes pulseGlow{0%,100%{transform:scale(.9);opacity:.65}50%{transform:scale(1.22);opacity:1}}
@keyframes pulseImg{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.cnode.baked img{filter:drop-shadow(0 0 10px rgba(255,210,140,.5)) drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.steam{position:absolute;left:50%;top:6%;width:0;height:0;pointer-events:none}
.steam i{position:absolute;left:-9px;top:0;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.85);filter:blur(5px);opacity:0;animation:steam 2.6s ease-out infinite}
.steam i:nth-child(2){animation-delay:.85s;left:-16px}
.steam i:nth-child(3){animation-delay:1.7s;left:-2px}
@keyframes steam{0%{transform:translate(0,0) scale(.5);opacity:0}15%{opacity:.75}100%{transform:translate(6px,-62px) scale(1.9);opacity:0}}
.bakeflash{position:absolute;inset:-30px;border-radius:50%;background:radial-gradient(circle,#fff 0%,rgba(255,220,150,.8) 30%,transparent 70%);animation:bflash .9s ease-out forwards;pointer-events:none}
@keyframes bflash{0%{opacity:0;transform:scale(.4)}25%{opacity:1}100%{opacity:0;transform:scale(1.5)}}
.donering{position:absolute;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;border:3px solid var(--c);box-shadow:0 0 16px var(--c),inset 0 0 16px var(--c);opacity:0;animation:ringIn .8s ease-out forwards,ringPulse 2.4s ease-in-out .8s infinite;pointer-events:none}
.donering::after{content:"";position:absolute;inset:22px;border-radius:50%;background:var(--c);box-shadow:0 0 14px var(--c)}
@keyframes ringIn{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
@keyframes ringPulse{0%,100%{box-shadow:0 0 16px var(--c),inset 0 0 16px var(--c)}50%{box-shadow:0 0 30px var(--c),inset 0 0 22px var(--c)}}
#headback{position:absolute;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translate(-50%,40px);opacity:0;pointer-events:none;width:min(440px,calc(100% - 32px));transition:transform .6s cubic-bezier(.2,.9,.3,1.2),opacity .5s;z-index:4}
#headback.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}

/* buttons (prototype 3D style) */
.go{display:block;width:100%;border:0;border-radius:16px;padding:15px 18px;font-weight:900;font-size:17px;letter-spacing:.3px;color:#fff;background:#5c9a2e;box-shadow:0 5px 0 #3f7420;transition:transform .08s,box-shadow .08s}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 #3f7420}
.go.glow{background:var(--c);color:#1a1c45;box-shadow:0 5px 0 color-mix(in srgb,var(--c) 60%,#000),0 0 26px color-mix(in srgb,var(--c) 70%,transparent)}
.go.glow:active{box-shadow:0 1px 0 color-mix(in srgb,var(--c) 60%,#000),0 0 26px color-mix(in srgb,var(--c) 70%,transparent)}
.go[disabled]{opacity:.45;pointer-events:none}

/* ---------- player (lesson) ---------- */
#player{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;background:rgba(8,9,30,.55);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);opacity:0;transition:opacity .35s;pointer-events:none}
#player.on{opacity:1;pointer-events:auto}
.ptop{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 14px 8px}
.ptop .x{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:17px;font-weight:900;flex:none}
.progress{flex:1;display:flex;gap:4px}
.progress i{flex:1;height:8px;border-radius:5px;background:rgba(255,255,255,.14);transition:background .3s}
.progress i.on{background:var(--c);box-shadow:0 0 8px var(--c)}
#stage{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:14px 18px 20px}
#stage .inner{max-width:560px;margin:0 auto}
.pfoot{padding:10px 18px calc(16px + env(safe-area-inset-bottom));max-width:596px;width:100%;margin:0 auto}
.speaker{display:flex;gap:10px;align-items:flex-end;margin-bottom:10px}
.speaker>svg{flex:none}
.pcard{border-radius:22px;padding:16px 18px;background:rgba(255,255,255,.95);color:#2a1d14;font-size:17px;line-height:1.5;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:pop .4s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.pcard .who{font-weight:900;font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:#a0643a;margin-bottom:4px}
.pcard p{margin:0 0 6px}
.cite{font-size:13px;color:#8a6a4a;font-weight:800;margin-top:6px}
.word{background:none;border:0;padding:0 2px;margin:0 -2px;font:inherit;font-weight:800;color:#7a2e9c;border-bottom:3px dotted #b06ad0;border-radius:4px}
.word.seen{border-bottom-style:solid}
.answers{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.ans{text-align:left;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;border-radius:16px;padding:14px 16px;font-size:16.5px;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.25);transition:all .2s}
.ans:active{transform:translateY(2px)}
.ans.right{background:#5c9a2e;border-color:#8fd16a;box-shadow:0 0 18px rgba(140,220,100,.6)}
.ans.wrongpick{background:#c24a42;border-color:#ff8a80}
.ans.dim{opacity:.4}
.feedback{margin-top:14px;border-radius:18px;padding:14px 16px;background:rgba(92,154,46,.25);border:1.5px solid rgba(143,209,106,.6);font-size:16px;font-weight:600;animation:pop .35s}
.feedback.miss{background:rgba(194,74,66,.22);border-color:rgba(255,138,128,.6)}
.feedback b{font-weight:900}
.feedback .expl{margin:6px 0 0;color:rgba(255,255,255,.92)}
.sheet{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.45);animation:fade .25s}
.sheet .in{width:min(560px,100%);background:#fffaf0;color:#2a1d14;border-radius:26px 26px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));animation:up .35s cubic-bezier(.2,.9,.3,1.1)}
.sheet h2{margin:0;font-weight:900}
.sheet .kind{font-size:12px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;color:#a0643a}
.sheet p{font-size:16.5px;line-height:1.5;font-weight:600}
.sheet .note{font-size:13px;color:#8a6a4a;font-weight:700}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
/* verse reveal */
.rv{text-align:center;padding-top:6px}
.rv .tr{width:110px;height:110px;margin:0 auto;position:relative}
.rv .tr img{width:100%;height:100%}
.rv h2{margin:8px 0 0;font-weight:900;font-size:26px}
.rv .tag{display:inline-block;margin:12px 0 8px;padding:4px 12px;border-radius:999px;background:var(--c);color:#1a1c45;font-weight:900;font-size:12px;letter-spacing:1px}
.rv .body{text-align:left;background:rgba(255,255,255,.95);color:#2a1d14;border-radius:20px;padding:16px 18px;font-size:16.5px;line-height:1.6;font-weight:600}
.rv .vn{font-size:11px;font-weight:900;color:#a0643a;vertical-align:super;margin-right:2px}
.rv .src{font-size:12px;color:var(--mist);margin-top:8px;font-weight:700}

/* ---------- transition: head back ---------- */
#fx{position:fixed;inset:0;z-index:70;pointer-events:none}
.flyc{position:absolute;left:0;top:0;width:80px;height:80px;margin:-40px 0 0 -40px;will-change:transform}
.flyc img{width:100%;height:100%}
#whiteout{position:fixed;inset:0;z-index:90;background:radial-gradient(circle at 50% 40%,#fffaf0,#f6e7c8);opacity:0;pointer-events:none;transition:opacity .7s ease}
#whiteout.on{opacity:1}

/* ---------- kitchen ---------- */
#kitchen{z-index:50;background:#FFF8EC;color:var(--ink);overflow:hidden}
.kscroll{position:absolute;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:var(--cream)}
.kinner{max-width:520px;margin:0 auto;padding:14px 18px 40px}
.openbox{position:relative;height:230px;padding-top:70px;display:flex;align-items:center;justify-content:center;margin:0 auto}
.openbox img.ob{width:100%;display:block;filter:drop-shadow(0 12px 18px rgba(90,58,34,.25))}
.openbox .inbox{position:absolute;left:18%;right:18%;top:22%;height:30%;display:flex;justify-content:center;align-items:flex-end;gap:2px}
.openbox .inbox img{width:30%;max-width:62px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.25));animation:settle .6s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes settle{from{transform:translateY(-60px) rotate(-20deg);opacity:0}}
.ksteps{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.kstep{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:2px solid var(--cream-line);border-radius:20px;padding:12px 14px;box-shadow:0 4px 0 var(--cream-line);color:var(--ink);transition:transform .1s}
.kstep:active{transform:translateY(3px);box-shadow:0 1px 0 var(--cream-line)}
.kstep .ic{width:60px;height:60px;flex:none;border-radius:16px;background:#fdf1d6;display:flex;align-items:center;justify-content:center}
.kstep .ic img,.kstep .ic svg{width:48px;height:48px;object-fit:contain}
.kstep b{display:block;font-weight:900;font-size:19px;color:var(--brown)}
.kstep span{font-size:14px;color:#8a6a4a;font-weight:700}
.kstep .st{margin-left:auto;width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:900}
.kstep.done .st{background:#5c9a2e;color:#fff}
.kstep.cur{border-color:#ffc800;box-shadow:0 4px 0 #e0b000,0 0 0 4px rgba(255,200,0,.25);animation:kpulse 1.8s ease-in-out infinite}
@keyframes kpulse{50%{box-shadow:0 4px 0 #e0b000,0 0 0 8px rgba(255,200,0,.12)}}
.kstep.lock{opacity:.5;pointer-events:none}
/* kitchen player (light) */
#kplay{position:fixed;inset:0;z-index:65;background:var(--cream);color:var(--ink);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .45s cubic-bezier(.2,.9,.3,1)}
#kplay.on{transform:none}
#kplay .ptop .x{background:#fff;border:2px solid #e5e5e5;color:var(--brown)}
#kplay .ptop h3{margin:0;flex:1;font-weight:900;font-size:19px;color:var(--brown)}
#kstage{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:8px 18px 20px}
#kstage .inner{max-width:560px;margin:0 auto}
.kcard{background:#fff;border:2px solid var(--cream-line);border-radius:20px;padding:14px 16px;font-size:16.5px;line-height:1.5;font-weight:600}
.kcard .who{font-weight:900;font-size:12.5px;letter-spacing:.6px;text-transform:uppercase;color:#a0643a;margin-bottom:4px}
.bline{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:2px solid var(--cream-line);border-radius:16px;padding:12px;font-size:15.5px;line-height:1.45;font-weight:600;color:var(--ink);box-shadow:0 3px 0 var(--cream-line);transition:all .2s}
.bline .bc{flex:none;width:38px;height:38px}
.bline .bc img{width:100%;height:100%;transition:filter .5s}
.bline.picked{border-color:#c24a42;box-shadow:0 3px 0 #c24a42,0 0 0 3px rgba(194,74,66,.18)}
.bline.picked .bc img,.bline.isburnt .bc img,.bline.found .bc img{filter:brightness(.35) sepia(1) saturate(2) hue-rotate(-20deg)}
.bline.found{border-color:#5c9a2e;box-shadow:0 3px 0 #5c9a2e}
.bline.isburnt{border-color:#c24a42}
.bline .ref{color:#8a6a4a;font-weight:800;font-size:13px}
.bline .fix{display:block;margin-top:6px;font-size:14px;color:#3f7420}
.bline .fix s{color:#c24a42}
.kfb{margin-top:12px;border-radius:16px;padding:12px 14px;background:#eaf6df;border:2px solid #b9df98;font-weight:700}
.kfb.miss{background:#fbe9e7;border-color:#f3b3ad}
.bigidea p{opacity:0;animation:biIn .7s ease forwards;margin:0 0 10px}
@keyframes biIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.cool{position:relative;height:150px;margin:6px auto 4px;width:220px}
.cool img{position:absolute;width:76px;bottom:6px}
.cool .rack{position:absolute;left:0;right:0;bottom:0;height:12px;border-radius:6px;background:repeating-linear-gradient(90deg,#b7b7b7 0 3px,transparent 3px 14px),linear-gradient(#d6d6d6,#9e9e9e);opacity:.9}
.cool .stm{position:absolute;bottom:60px;width:0;height:0}
.cool .stm i{position:absolute;left:-10px;width:20px;height:20px;border-radius:50%;background:rgba(190,190,190,.8);filter:blur(6px);opacity:0;animation:steam 2.8s ease-out infinite}
.cool .stm i:nth-child(2){animation-delay:.9s}.cool .stm i:nth-child(3){animation-delay:1.8s}
.boxstage{position:relative;height:250px;margin:6px auto}
.boxstage .bwrap{position:absolute;left:0;right:0;top:110px}
.boxstage .stamp{position:absolute;left:50%;top:30px;width:120px;transform:translateX(-50%) scale(2.4) rotate(-14deg);opacity:0}
.boxstage .stamp.on{animation:stamp .5s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes stamp{to{opacity:1;transform:translateX(-50%) scale(1) rotate(-14deg)}}
.boxstage .dropc{position:absolute;width:56px;left:50%;top:-60px;opacity:0}
.award{text-align:center;padding:10px 0}
.award svg{width:150px;height:150px;filter:drop-shadow(0 0 20px rgba(255,200,90,.7));animation:awardIn .9s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes awardIn{from{transform:translateY(30px) scale(.5) rotate(-20deg);opacity:0}}
.award h2{margin:6px 0 2px;font-weight:900;color:var(--brown);font-size:26px}
.award p{margin:0 0 4px;color:#8a6a4a;font-weight:700}

/* ---------- armor ---------- */
#armor{background:radial-gradient(ellipse at 50% 42%,rgba(255,210,120,.12),transparent 55%),rgba(6,7,24,.45)}
#armor .ascroll{position:absolute;inset:0;overflow-y:auto;touch-action:pan-y;padding:calc(66px + env(safe-area-inset-top)) 18px 40px}
#armor .ainner{max-width:520px;margin:0 auto;text-align:center}
#armor h1{margin:6px 0 0;font-weight:900;font-size:30px;text-shadow:0 0 18px rgba(255,200,90,.6)}
#armor .sub{font-weight:800;color:#ffd98a;font-size:14px;letter-spacing:.4px}
#suit{width:min(330px,86%);margin:8px auto 0;display:block;overflow:visible}
#suit .pc{transition:opacity .6s}
#suit .ghost{fill:none;stroke:rgba(255,255,255,.28);stroke-width:2;stroke-dasharray:5 6}
#suit .pc.off .real{opacity:0}
#suit .pc.on .ghost{opacity:0}
#suit .pc.new .real{animation:pieceIn 1.6s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes pieceIn{0%{opacity:0;transform:translateY(-120px) scale(1.25)}55%{opacity:1}75%{transform:translateY(6px) scale(.98)}100%{opacity:1;transform:none}}
.burst{position:absolute;pointer-events:none;width:0;height:0}
.burst i{position:absolute;width:6px;height:6px;border-radius:50%;background:#ffe08a;box-shadow:0 0 10px #ffc65c}
.alist{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;text-align:left}
.alist div{border-radius:14px;padding:10px 12px;font-weight:800;font-size:13.5px;line-height:1.25;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.5)}
.alist div.on{color:#fff;background:rgba(255,200,90,.14);border-color:rgba(255,200,90,.5);box-shadow:0 0 14px rgba(255,200,90,.25)}
.alist div small{display:block;font-weight:700;font-size:11.5px;color:inherit;opacity:.8;margin-top:2px}
.alist div.flash{animation:aflash 1.6s ease}
@keyframes aflash{0%,100%{}40%{background:rgba(255,220,120,.5)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}

.bx3s{perspective:1000px;perspective-origin:50% 38%;display:flex;align-items:center;justify-content:center;}
.bx3{position:relative;width:var(--w);height:var(--h);transform-style:preserve-3d;transform:rotateX(var(--rx,-20deg)) rotateY(var(--ry,-30deg));transition:transform .75s cubic-bezier(.2,.8,.2,1);--c:#9a5e23;--cd:#6e4216;--ink:#fff3dc;--ra:#e3a92b;--rb:#f2c14e;--rc:#b8841a;--pp:#2a1a10;--pp2:#1c110a;}
.bx3.drag{transition:none;}
.bx3 .f,.bx3 .in{position:absolute;left:50%;top:50%;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--c);overflow:hidden;}
.bx3 .f{box-shadow:inset 0 0 0 1px rgba(0,0,0,.14);}
.bx3 .f.front,.bx3 .f.back{width:var(--w);height:var(--h);margin:calc(var(--h)/-2) 0 0 calc(var(--w)/-2);border-radius:3px;}
.bx3 .f.front{transform:translateZ(calc(var(--d)/2));}
.bx3 .f.back{transform:rotateY(180deg) translateZ(calc(var(--d)/2));}
.bx3 .f.left,.bx3 .f.right{width:var(--d);height:var(--h);margin:calc(var(--h)/-2) 0 0 calc(var(--d)/-2);border-radius:3px;}
.bx3 .f.left{transform:rotateY(-90deg) translateZ(calc(var(--w)/2));}
.bx3 .f.right{transform:rotateY(90deg) translateZ(calc(var(--w)/2));}
.bx3 .f.bottom{width:var(--w);height:var(--d);margin:calc(var(--d)/-2) 0 0 calc(var(--w)/-2);transform:rotateX(-90deg) translateZ(calc(var(--h)/2));background:var(--cd);}
/* interior + tissue paper */
.bx3 .in{background:var(--pp);background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 9px),repeating-linear-gradient(35deg,rgba(0,0,0,.06) 0 1px,transparent 1px 7px);}
.bx3 .in.ifront,.bx3 .in.iback{width:calc(var(--w) - 4px);height:calc(var(--h) - 4px);margin:calc(var(--h)/-2 + 2px) 0 0 calc(var(--w)/-2 + 2px);}
.bx3 .in.ifront{transform:rotateY(180deg) translateZ(calc(2px - var(--d)/2));}
.bx3 .in.iback{transform:translateZ(calc(2px - var(--d)/2));}
.bx3 .in.ileft,.bx3 .in.iright{width:calc(var(--d) - 4px);height:calc(var(--h) - 4px);margin:calc(var(--h)/-2 + 2px) 0 0 calc(var(--d)/-2 + 2px);}
.bx3 .in.ileft{transform:rotateY(90deg) translateZ(calc(2px - var(--w)/2));}
.bx3 .in.iright{transform:rotateY(-90deg) translateZ(calc(2px - var(--w)/2));}
.bx3 .in.floor{width:calc(var(--w) - 4px);height:calc(var(--d) - 4px);margin:calc(var(--d)/-2 + 2px) 0 0 calc(var(--w)/-2 + 2px);transform:rotateX(90deg) translateZ(calc(2px - var(--h)/2));background:radial-gradient(ellipse at 50% 50%,var(--pp),var(--pp2));transform-style:preserve-3d;overflow:visible;}
.bx3 .in.floor .ck{position:absolute;width:46px;height:46px;transform:translateZ(1px) rotate(var(--r,0deg));filter:drop-shadow(0 2px 2px rgba(0,0,0,.5));}
.bx3 .in.floor .ck svg{width:100%;height:100%;display:block;}
.bx3 .in.floor .ck.drop{animation:bxckdrop .62s cubic-bezier(.3,.6,.3,1.15) both;}
@keyframes bxckdrop{from{transform:translateZ(190px) rotate(calc(var(--r,0deg) - 60deg)) scale(1.15);opacity:0}25%{opacity:1}to{transform:translateZ(1px) rotate(var(--r,0deg)) scale(1)}}
.bx3 .in.floor .pic{position:absolute;left:50%;top:50%;width:62%;height:74%;transform:translate(-50%,-50%) translateZ(2px) rotate(-4deg);border:3px solid #fffaf0;border-bottom-width:12px;background:#fff center/cover no-repeat;box-shadow:0 4px 10px rgba(0,0,0,.5);}
/* lid, hinged at the back edge */
.bx3 .lidw{position:absolute;left:50%;top:50%;width:var(--w);height:var(--d);margin:calc(var(--d)/-2) 0 0 calc(var(--w)/-2);transform-origin:50% 0;transform:translate3d(0,calc((var(--d) - var(--h))/2),calc(var(--d)/-2)) rotateX(var(--lid,90deg));transform-style:preserve-3d;transition:transform .9s cubic-bezier(.5,0,.3,1);}
.bx3 .lidw .lt,.bx3 .lidw .lu{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:4px;overflow:hidden;}
.bx3 .lidw .lt{background:var(--c);transform:translateZ(3px);box-shadow:inset 0 0 0 1px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.22);}
.bx3 .lidw .lu{background:var(--pp2);transform:rotateX(180deg) translateZ(-3px);}
/* lighting */
.bx3 .f::after,.bx3 .lidw .lt::after{content:'';position:absolute;inset:0;pointer-events:none;}
.bx3 .f.front::after{background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0) 40%,rgba(0,0,0,.22));}
.bx3 .f.back::after{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(0,0,0,.34));}
.bx3 .f.left::after{background:linear-gradient(180deg,rgba(0,0,0,.18),rgba(0,0,0,.42));}
.bx3 .f.right::after{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(0,0,0,.3));}
.bx3 .lidw .lt::after{background:linear-gradient(160deg,rgba(255,255,255,.26),rgba(255,255,255,.04) 45%,rgba(0,0,0,.12));}
.bx3 .rib{display:none;position:absolute;left:50%;top:0;bottom:0;width:13%;margin-left:-6.5%;background:linear-gradient(90deg,var(--rc),var(--rb) 35%,var(--ra) 70%,var(--rc));z-index:2;}
.bx3.rib-on .rib{display:block;}
.bx3 .in.floor .ck{width:var(--ck,46px);height:var(--ck,46px)}
.bx3 .in.floor .ck img{width:100%;height:100%;display:block}

.vgnow{font-size:14px;color:#ffc65c}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:rgba(255,255,255,.08);margin:10px 0 6px}
.seg button{border:0;background:none;color:#fff;font-weight:800;font-size:13px;padding:7px 14px;border-radius:999px}

.prhead{display:flex;justify-content:space-between;align-items:center}
.prhead b{font-weight:900;font-size:18px}
.prhead button{border:0;background:none;color:#ffc65c;font-weight:900;font-size:14px}
.pfnote{font-size:12.5px;font-weight:700;color:rgba(255,255,255,.55);margin-top:2px}
.hz{display:flex;gap:14px;overflow-x:auto;padding:12px 2px 4px;touch-action:pan-x;scrollbar-width:none}
.hz::-webkit-scrollbar{display:none}
.frd,.bd{flex:none;width:66px;display:flex;flex-direction:column;align-items:center;gap:5px}

.fav{width:52px;height:52px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:21px;color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.4),0 0 14px rgba(255,255,255,.15)}
.badge{width:56px;height:56px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,var(--c2),var(--c1));box-shadow:0 0 14px color-mix(in srgb,var(--c2) 60%,transparent),inset 0 -4px 0 rgba(0,0,0,.2)}
.badge i{font-style:normal;font-size:26px}
.badge.locked{filter:grayscale(1) brightness(.6);box-shadow:none}
.bd:has(.locked) b{opacity:.5}
.rows{display:flex;flex-direction:column;gap:10px}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}
.lrow b{font-weight:900;font-size:16px}
.lrow span{display:flex;flex-direction:column}
.lrow em{font-style:normal;font-size:12px;font-weight:800;color:#ffc65c}
.lrow.locked em{color:rgba(255,255,255,.5)}
.thero{text-align:center;padding:10px 0}
.thero img,.thero .tart{width:110px;height:110px}
.thero h3{font-weight:900;font-size:24px;margin:6px 0 0;text-shadow:0 0 14px #ffc65c}
.tpath{display:flex;flex-direction:column;align-items:stretch;margin-top:14px}
.tnode{position:relative;display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:20px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}
.tnode.now{border-color:#ffc65c;box-shadow:0 0 20px rgba(255,200,90,.35)}
.tnode.next{opacity:.55}
.tdisc{position:relative;width:60px;height:60px;flex:none;display:flex;align-items:center;justify-content:center}
.tdisc img,.tdisc .tart{width:56px;height:56px}
.tck{position:absolute;right:-4px;bottom:-4px;width:22px;height:22px;border-radius:50%;background:#5c9a2e;color:#fff;font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center}
.tlk{position:absolute;right:-4px;bottom:-4px;font-size:16px}
.tinfo{flex:1;display:flex;flex-direction:column;gap:2px}
.tinfo b{font-weight:900;font-size:17px}
.tinfo>span{display:flex;align-items:center;gap:4px;font-weight:800;font-size:13px;color:rgba(255,255,255,.7)}
.tinfo>span img{width:16px;height:16px}
.tbar{height:8px;border-radius:5px;background:rgba(255,255,255,.15);margin-top:6px;overflow:hidden}
.tbar i{display:block;height:100%;background:#ffc65c;box-shadow:0 0 8px #ffc65c}
.tbn{font-size:12.5px;font-weight:800;color:rgba(255,255,255,.7)}
.tyou{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#ffd27a,#e08a3a);color:#3a2606;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 0 12px #ffc65c}
.tlink{width:3px;height:18px;margin:0 0 0 43px;background:rgba(255,200,90,.4)}

.hcard::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0;background:radial-gradient(120% 70% at 15% 0%,rgba(255,255,255,.13),transparent 55%)}
.hcard .hart>*{filter:drop-shadow(0 8px 10px rgba(0,0,0,.45))}
.hcard .hcta{box-shadow:0 3px 0 color-mix(in srgb,var(--c) 55%,#000),0 6px 10px -2px rgba(0,0,0,.4)}
.tvbtn{box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 8px 16px -6px rgba(0,0,0,.6)}
.gcell,.vbook,.vmrow,.gcard,.stile,.tnode,.lrow,.tvrow{border-top-color:rgba(255,255,255,.26)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 2px 0 rgba(0,0,0,.22),0 16px 26px -14px rgba(0,0,0,.6)}

/* ---------- HUD (top, under the tabs) ---------- */
#hud{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-8px);z-index:24;display:flex;gap:8px;opacity:0;pointer-events:none;transition:opacity .4s,transform .45s cubic-bezier(.2,.9,.3,1.2)}
body.hudon #hud{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.hpill{display:flex;align-items:center;gap:6px;height:38px;padding:0 13px 0 9px;border-radius:999px;color:#fff;
  background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.14);border-top-color:rgba(255,255,255,.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 2px 0 rgba(0,0,0,.25),0 10px 18px -8px rgba(0,0,0,.6);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%)}
.hpill:active{transform:scale(.95)}
.hpill b{font-weight:900;font-size:16px;letter-spacing:.2px}
.chipi{width:22px;height:22px;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.trayw{display:inline-flex;width:30px;height:22px;align-items:center;justify-content:center}
.trayi{width:22px;height:30px;transform:rotate(90deg);filter:drop-shadow(0 2px 2px rgba(0,0,0,.45))}
/* rainbow fire */
.rfire{overflow:visible;filter:drop-shadow(0 0 4px rgba(255,120,200,.7)) drop-shadow(0 0 9px rgba(120,200,255,.55));animation:rfHue 4s linear infinite}
.rfire .f1{transform-origin:50% 95%;animation:rfFlick 1.1s ease-in-out infinite alternate}
.rfire .f0,.rfire .f0b{transform-origin:50% 90%;animation:rfFlick .9s ease-in-out infinite alternate-reverse}
.rfire .f2{transform-origin:50% 95%;animation:rfFlick 0.8s ease-in-out infinite alternate-reverse}
@keyframes rfFlick{0%{transform:scale(1,1) skewX(0)}50%{transform:scale(.94,1.06) skewX(2deg)}100%{transform:scale(1.03,.96) skewX(-2deg)}}
@keyframes rfHue{0%{filter:drop-shadow(0 0 4px rgba(255,120,200,.75)) drop-shadow(0 0 9px rgba(120,200,255,.55))}33%{filter:drop-shadow(0 0 4px rgba(255,200,90,.8)) drop-shadow(0 0 9px rgba(120,255,170,.5))}66%{filter:drop-shadow(0 0 4px rgba(150,120,255,.8)) drop-shadow(0 0 9px rgba(255,110,140,.55))}100%{filter:drop-shadow(0 0 4px rgba(255,120,200,.75)) drop-shadow(0 0 9px rgba(120,200,255,.55))}}

/* ---------- dock (bottom left) ---------- */
#dock{position:fixed;left:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:24;display:flex;gap:2px;padding:6px;border-radius:26px;opacity:0;pointer-events:none;transform:translateY(12px);transition:opacity .4s,transform .45s cubic-bezier(.2,.9,.3,1.2);
  background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(255,255,255,.05));border-top-color:rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 2px 0 rgba(0,0,0,.25),0 14px 24px -10px rgba(0,0,0,.65)}
body.athome #dock{opacity:1;pointer-events:auto;transform:none}
#dock button{width:50px;height:50px;border:0;border-radius:18px;background:none;padding:5px;display:flex;align-items:center;justify-content:center;transition:background .2s}
#dock button:active{background:rgba(255,255,255,.12)}
#dock img,#dock svg{width:40px;height:40px;object-fit:contain;filter:drop-shadow(0 4px 4px rgba(0,0,0,.45))}
#dock [data-d="ticket"] img{width:38px;height:38px;transform:rotate(-6deg)}
@media (max-width:360px){#dock button{width:44px;height:44px}#dock img,#dock svg{width:34px;height:34px}}

/* ---------- toast ---------- */
#htoast{position:fixed;left:50%;top:calc(112px + env(safe-area-inset-top));transform:translate(-50%,-10px);z-index:99;display:flex;align-items:center;gap:6px;padding:9px 16px;border-radius:999px;font-weight:900;font-size:14.5px;color:#1a1c45;background:#fffaf0;box-shadow:0 10px 24px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .3s,transform .4s cubic-bezier(.2,.9,.3,1.3)}
#htoast.show{opacity:1;transform:translate(-50%,0)}
#htoast .chipi,#htoast .trayi{width:18px;height:18px}#htoast .trayi{height:24px}

#adfx{position:fixed;inset:0;z-index:120;background:#0b0c22;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#fff;animation:fade .3s}
.adtop{position:absolute;top:calc(16px + env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;font-weight:900}

/* shop */
.sbal{display:flex;align-items:center;justify-content:center;gap:8px;margin:2px 0 6px}

.cmp td.y,.cmp td.n{text-align:center;width:52px;font-weight:900}.cmp td.y{color:#7dffb4}.cmp td.n{color:rgba(255,255,255,.35)}

.sbtn{display:flex;align-items:center;gap:3px;border:0;border-radius:999px;padding:8px 12px;font-weight:900;font-size:14px;background:#ffc65c;color:#1a1c45;box-shadow:0 3px 0 #b8841a;flex:none}

.slook{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;padding:12px 6px;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-top-color:rgba(255,255,255,.24)}

  background-image:radial-gradient(circle at 10px -4px,transparent 8px,#fffaf0 9px);background-size:20px 100%}

#tabs{top:calc(62px + env(safe-area-inset-top))!important}

.bkin{padding-top:18px!important}

/* ================= COLLECTIONS v2: living shelves ================= */
#coll .ccard{flex-direction:column;min-height:0;margin-bottom:12px;opacity:0;transform:translateY(14px);animation:ccIn .6s cubic-bezier(.2,.9,.3,1.1) forwards;animation-delay:calc(var(--k,0)*90ms)}
@keyframes ccIn{to{opacity:1;transform:none}}
#coll .ccard::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;right:-60px;top:-80px;background:radial-gradient(circle,color-mix(in srgb,var(--c) 32%,transparent),transparent 65%);pointer-events:none;z-index:0;animation:ccOrb 9s ease-in-out infinite alternate}

.ccard .pstage{display:flex;justify-content:center;padding:6px 0 18px}

/* verses v3: recent books on a glowing shelf */
.shelf{position:relative;padding:14px 16px 16px;overflow:visible}
.bglow{position:absolute;left:50%;bottom:22px;width:300px;height:180px;margin-left:-150px;background:radial-gradient(ellipse at 50% 100%,color-mix(in srgb,var(--c) 38%,transparent),transparent 65%);animation:bBreath 4s ease-in-out infinite alternate;pointer-events:none}
@keyframes bBreath{from{opacity:.55}to{opacity:1}}
.brow{position:relative;height:200px;margin-top:-34px;overflow:hidden;-webkit-mask:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);mask:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent)}
.bkslot{position:absolute;bottom:0;width:46px;display:flex;align-items:flex-end;height:100%;transition:left .9s cubic-bezier(.45,.05,.3,1),opacity .8s ease}
.bsp{position:relative;width:46px;height:var(--h);border-radius:7px 7px 3px 3px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(90deg,var(--c2) 0%,var(--c1) 30%,var(--c1) 70%,var(--c2) 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),inset 0 8px 0 -4px rgba(255,255,255,.35),0 10px 16px -8px rgba(0,0,0,.6);
  transform-origin:50% 100%;animation:bBob 5s ease-in-out infinite;animation-delay:calc(var(--i)*-1.2s)}
.bsp.rise{opacity:0;animation:bRise .8s cubic-bezier(.25,1.4,.45,1) forwards,bBob 5s ease-in-out infinite;animation-delay:calc(.15s + var(--i)*.14s),calc(1.2s + var(--i)*-1.2s)}
.bsp::before,.bsp::after{content:"";position:absolute;left:6px;right:6px;height:3px;border-radius:2px;background:rgba(58,38,6,.35)}
.bsp::before{top:12px}.bsp::after{bottom:12px}
.bsp.blank{filter:saturate(.8) brightness(.78)}
@keyframes bRise{from{opacity:0;transform:translateY(40px) scaleY(.5)}to{opacity:1;transform:none}}
@keyframes bBob{50%{translate:0 -3px}}
.bsp em{writing-mode:vertical-rl;transform:rotate(180deg);font-style:normal;font-weight:900;font-size:13px;letter-spacing:.5px;color:#3a2606;white-space:nowrap;max-height:calc(var(--h) - 34px);overflow:hidden;text-overflow:ellipsis}
.bsp u{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}
.bsp u::after{content:"";position:absolute;left:-30%;right:-30%;height:40%;top:-50%;background:linear-gradient(180deg,transparent,rgba(255,255,255,.6),transparent);animation:bShine 6s ease-in-out infinite;animation-delay:calc(1.5s + var(--i)*.25s)}
@keyframes bShine{0%,70%{top:-50%}90%,100%{top:120%}}
.bsp.newest{margin-bottom:6px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.5),0 0 22px color-mix(in srgb,var(--c1) 80%,transparent),0 14px 20px -8px rgba(0,0,0,.6)}
.bmote{position:absolute;bottom:100%;left:var(--x);width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 6px #ffd27a,0 0 12px #ffc65c;opacity:0;animation:mRise 3.3s ease-out infinite;animation-delay:var(--dl);--dx:6px}
.bboard{position:relative;height:10px;margin:0 8px;border-radius:5px;background:linear-gradient(180deg,#d9a35a,#8a5a26);box-shadow:0 0 18px color-mix(in srgb,var(--c) 50%,transparent),0 8px 14px -6px rgba(0,0,0,.7)}
@media (prefers-reduced-motion:reduce){#coll .bsp{opacity:1!important;transform:none!important}}
@keyframes clDraw{to{stroke-dashoffset:0}}

/* characters v2: collectible card fan */
.cfan{position:relative;height:176px;margin:6px 0 10px;perspective:700px}
.ccd{position:absolute;left:50%;top:8px;width:112px;height:150px;margin-left:-56px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;overflow:hidden;
  background:linear-gradient(160deg,#ff9fb6 0%,#d4507a 45%,#6e1f45 100%);border:2px solid rgba(255,255,255,.55);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 14px 24px -10px rgba(0,0,0,.7),0 0 0 4px rgba(255,125,156,.12);
  transition:transform .8s cubic-bezier(.3,1.25,.4,1),filter .6s,box-shadow .6s;opacity:0;animation:ccDeal .7s cubic-bezier(.2,1.3,.4,1) forwards;animation-delay:calc(.15s + var(--d,0s))}

.ccd b{font-weight:900;font-size:16px;line-height:1.1;color:#fff}

.ccd em{font-style:normal;font-weight:900;font-size:10.5px;color:#2a0a14;background:rgba(255,255,255,.85);padding:2px 8px;border-radius:999px;margin-top:5px}

.ccd .ccsh{position:absolute;top:-20%;bottom:-20%;left:-80%;width:50%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg);pointer-events:none}
.ccd.shine .ccsh{animation:ccShine 1.1s ease-in-out .35s}

.ccd.back{background:repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 8px,transparent 8px 16px),linear-gradient(160deg,#3a2140,#1d1230);border:2px dashed rgba(255,125,156,.6)}

.ccd.back small{color:rgba(255,255,255,.5)}

/* places: pins dropping onto a journey map */
.pmap{display:block;width:100%;height:auto;overflow:visible;padding:0 8px 10px}
.pmap .ct{fill:none;stroke:color-mix(in srgb,var(--c) 22%,transparent);stroke-width:1}
.pmap .route{fill:none;stroke:color-mix(in srgb,var(--c) 85%,#fff);stroke-width:2.2;stroke-dasharray:2 7;stroke-linecap:round}
.pmap .rmask{fill:none;stroke:#fff;stroke-width:8;stroke-dasharray:420;stroke-dashoffset:420;animation:clDraw 2.2s ease-in-out .9s forwards}
.pmap .pin{transform-box:fill-box;transform-origin:50% 100%;opacity:0;animation:pDrop .7s cubic-bezier(.3,1.5,.5,1) forwards;animation-delay:calc(.2s + var(--i)*.35s)}
@keyframes pDrop{0%{opacity:0;transform:translateY(-36px) scale(.6)}60%{opacity:1}100%{opacity:1;transform:none}}
.pmap .pulse{fill:none;stroke:var(--c);stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:pPulse 2.2s ease-out 1.4s infinite;opacity:0}
@keyframes pPulse{from{opacity:.9;transform:scale(.4)}to{opacity:0;transform:scale(2.2)}}

/* bakery: glass theme */
#bkscroll{isolation:isolate;background:#FFF8EC;z-index:5}

.bkblobs i{position:absolute;width:62vw;height:62vw;max-width:340px;max-height:340px;border-radius:50%;filter:blur(38px);opacity:.75;animation:bkBlob 16s ease-in-out infinite alternate}
.bkblobs i:nth-child(1){background:#ffd68a;left:-18%;top:22%}
.bkblobs i:nth-child(2){background:#ffb3a1;right:-20%;top:38%;animation-delay:-4s}
.bkblobs i:nth-child(3){background:#a8e6c0;left:-10%;bottom:-12%;animation-delay:-8s}
.bkblobs i:nth-child(4){background:#b9d8ff;right:-14%;bottom:-6%;animation-delay:-12s}
@keyframes bkBlob{50%{transform:translate(8%,-6%) scale(1.12)}100%{transform:translate(-6%,5%) scale(.95)}}
.bkblobs b{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff,0 0 14px rgba(255,214,140,.9);opacity:0;animation:bkMote 7s ease-in-out infinite}
.bkblobs b:nth-of-type(1){left:12%;top:70%}.bkblobs b:nth-of-type(2){left:46%;top:85%;animation-delay:1.2s}.bkblobs b:nth-of-type(3){left:80%;top:60%;animation-delay:2.4s}
.bkblobs b:nth-of-type(4){left:30%;top:48%;animation-delay:3.6s}.bkblobs b:nth-of-type(5){left:66%;top:40%;animation-delay:4.8s}.bkblobs b:nth-of-type(6){left:90%;top:88%;animation-delay:6s}
@keyframes bkMote{0%{opacity:0;transform:translateY(0)}25%{opacity:.9}100%{opacity:0;transform:translateY(-70px)}}
#bkscroll .kinner{position:relative;z-index:1}
#bkscroll .bkbub{background:linear-gradient(160deg,rgba(255,255,255,.82),rgba(255,255,255,.5));border:1.5px solid rgba(255,255,255,.95);
  box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(214,186,140,.35),0 12px 24px -14px rgba(90,58,34,.45);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%)}
#bkscroll .bkopt{overflow:hidden;border:1.5px solid rgba(255,255,255,.95);
  background:radial-gradient(120% 90% at 100% 100%,color-mix(in srgb,var(--b) 38%,transparent),transparent 60%),linear-gradient(160deg,rgba(255,255,255,.78),rgba(255,255,255,.38));
  box-shadow:inset 0 1px 0 #fff,inset 0 -14px 22px -14px color-mix(in srgb,var(--b) 70%,transparent),0 0 0 1px rgba(214,186,140,.35),0 16px 28px -16px rgba(90,58,34,.5);
  backdrop-filter:blur(16px) saturate(170%);-webkit-backdrop-filter:blur(16px) saturate(170%);transition:transform .12s}
#bkscroll .bkopt::before{content:"";position:absolute;left:8%;right:8%;top:5px;height:34%;border-radius:18px 18px 40% 40%;background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,0));pointer-events:none}
#bkscroll .bkopt::after{content:"";position:absolute;top:-20%;bottom:-20%;left:-70%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);transform:skewX(-18deg);animation:bkShine 7s ease-in-out infinite;pointer-events:none}
#bkscroll .bkopt:nth-child(2)::after{animation-delay:1.75s}#bkscroll .bkopt:nth-child(3)::after{animation-delay:3.5s}#bkscroll .bkopt:nth-child(4)::after{animation-delay:5.25s}

#bkscroll .bkopt:active{transform:scale(.97);box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(214,186,140,.35),0 6px 12px -8px rgba(90,58,34,.5)}
#bkscroll .bkart{background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95),color-mix(in srgb,var(--a) 85%,transparent) 50%,color-mix(in srgb,var(--b) 80%,transparent));
  border:1.5px solid rgba(255,255,255,.9);box-shadow:inset 0 2px 0 rgba(255,255,255,.9),inset 0 -6px 10px -4px color-mix(in srgb,var(--b) 80%,#000 10%),0 8px 16px -8px color-mix(in srgb,var(--b) 90%,#000 20%);
  animation:bkBob 4s ease-in-out infinite}

@keyframes bkBob{50%{transform:translateY(-4px) rotate(-2deg)}}
#bkscroll .bkart::after{content:"";position:absolute;left:14%;top:7%;width:46%;height:26%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,0));pointer-events:none}

function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function tone(f,t0,dur,type="sine",vol=.18,slideTo){const a=ac();if(!a||S.muted)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,a.currentTime+t0);if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,a.currentTime+t0+dur);g.gain.setValueAtTime(0,a.currentTime+t0);g.gain.linearRampToValueAtTime(vol,a.currentTime+t0+.01);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+t0+dur);o.connect(g).connect(a.destination);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+dur+.05)}

  wrong(){tone(220,0,.25,"sawtooth",.07,150)},

  collect(){[988,1319,1568,1976].forEach((f,i)=>tone(f,i*.06,.3,"sine",.12))},

  join(){tone(196,0,.1,"square",.1);tone(392,.95,.12,"triangle",.14);[523,659,784,1047].forEach((f,i)=>tone(f,1.05+i*.09,.6,"sine",.13))},
  box(){tone(180,.15,.12,"triangle",.14);[392,523,659,784,1047].forEach((f,i)=>tone(f,.4+i*.1,.5,"sine",.12))},

  splash(){const a=ac();if(!a||S.muted)return;const n=a.createBufferSource(),b=a.createBuffer(1,a.sampleRate*.5,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);n.buffer=b;const f=a.createBiquadFilter();f.type="bandpass";f.frequency.value=900;const g=a.createGain();g.gain.value=.35;n.connect(f).connect(g).connect(a.destination);n.start();tone(260,0,.3,"sine",.12,140)}

/* ---------- constellation shapes (cookie cutters) ---------- */
function build(polys,singles=[]){const pts=[],segs=[];
  polys.forEach(([list,closed])=>{const base=pts.length;list.forEach(p=>pts.push(p));
    for(let i=0;i<list.length-1;i++)segs.push([base+i,base+i+1]);if(closed)segs.push([base+list.length-1,base])});
  singles.forEach(p=>pts.push(p));return {pts,segs}}
function ring(n,fn){return [...Array(n).keys()].map(i=>fn(i/n*Math.PI*2,i))}
const SHAPES={
  dove:()=>build([[[[104,-30],[80,-52],[58,-36],[22,-116],[-4,-40],[-74,-34],[-86,8],[-22,24],[52,12],[86,-8]],true],
                  [[[42,-34],[-26,-104],[-4,-40]],false],[[[104,-30],[130,-6]],false],[[[118,-18],[134,-34]],false]]),
  gingerbread:()=>build([[[[0,-96],[22,-86],[27,-64],[14,-48],[58,-44],[64,-26],[24,-20],[26,22],[46,82],[26,92],[0,44],[-26,92],[-46,82],[-26,22],[-24,-20],[-64,-26],[-58,-44],[-14,-48],[-27,-64],[-22,-86]],true]],

  bell:()=>build([[[[0,-80],[26,-74],[36,-40],[44,16],[72,48],[-72,48],[-44,16],[-36,-40],[-26,-74]],true],[[[0,-80],[0,-98]],false],[[[0,48],[0,74]],false]]),
  flower:()=>{const o=[];for(let k=0;k<5;k++){const a=-Math.PI/2+k*Math.PI*2/5,d=Math.PI/5;
      o.push([Math.cos(a-d)*34,Math.sin(a-d)*34],[Math.cos(a-d*.55)*78,Math.sin(a-d*.55)*78],[Math.cos(a)*92,Math.sin(a)*92],[Math.cos(a+d*.55)*78,Math.sin(a+d*.55)*78])}
    return build([[o,true],[ring(6,a=>[Math.cos(a)*16,Math.sin(a)*16]),true]])},
  star:()=>build([[ring(10,(a,i)=>{const r=i%2?40:96,b=-Math.PI/2+a;return [Math.cos(b)*r,Math.sin(b)*r]}),true]]),
  heart:()=>build([[ring(18,a=>{const t=a;const x=16*Math.pow(Math.sin(t),3),y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));return [x*5.6,y*5.6-6]}),true]])
};

/* ---------- glyph svg (for map, headers) ---------- */
function glyphSVG(c,{size=60,hi=-1,stroke=3}={}){const {pts,segs}=c.g;
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);const minx=Math.min(...xs)-14,maxx=Math.max(...xs)+14,miny=Math.min(...ys)-14,maxy=Math.max(...ys)+14;
  const w=maxx-minx,h=maxy-miny;
  return `<svg viewBox="${minx} ${miny} ${w} ${h}" width="${size}" height="${size}" aria-hidden="true" style="--c:${c.color}">
  ${segs.map(([a,b])=>`<line x1="${pts[a][0]}" y1="${pts[a][1]}" x2="${pts[b][0]}" y2="${pts[b][1]}" stroke="${c.color}" stroke-opacity=".75" stroke-width="${stroke}" stroke-linecap="round"/>`).join("")}
  ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===hi?11:stroke*1.9}" fill="#fff" stroke="${c.color}" stroke-width="${i===hi?5:2}"${i===hi?' class="hist"':''}/>`).join("")}</svg>`}

/* ================= SKY ================= */
const sky=$("#sky"),cv=$("#skycv"),cx=cv.getContext("2d"),world=$("#world");
let W=innerWidth,H=innerHeight,DPR=Math.min(2,devicePixelRatio||1);
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(2,devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;layoutNode()}
addEventListener("resize",resize);
const BOUNDS={x0:-3100,x1:3100,y0:-2900,y1:2750};
const HOMEY=70;const cam={x:0,y:70,vx:0,vy:0},fly={on:false};
let mode="home"; // home | list | node | armor | kitchen

/* night sky stars: the Prototype's three tiled cross layers (same tiles, colors, sizes, drift and twinkle), plus parallax for panning */
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const PLAY=[
 {w:180,h:170,T:100,tw:6,off:0,p:.35,s:[[22,34,8,'#FFE2A3'],[120,90,6.5,'#ffffff']]},
 {w:180,h:170,T:72,tw:8.5,off:3,p:.55,s:[[70,150,9.5,'#FFE2A3'],[160,20,6.5,'#B6ADC9']]},
 {w:240,h:230,T:140,tw:11,off:5,p:.8,s:[[40,110,7.5,'#ffffff'],[190,200,6,'#CFE3FF']]}];
const phash=(a,b,c)=>{let x=Math.sin(a*127.1+b*311.7+c*74.7)*43758.5453;return x-Math.floor(x)};
/* faint star dust (the Prototype's --dv-space dots) on a slow far layer */
const DUST=(()=>{const r=rng(77);return [...Array(140)].map(()=>({x:r()*900,y:r()*900,z:.6+r()*1.1,c:pick(["#FFE2A3","#ffffff","#B6ADC9","#ffffff"]),a:.35+r()*.5}))})();
/* nebula blobs (Prototype colors) spread across the whole sky */
const NEB=(()=>{const r=rng(4242),cols=[["#3b2a7a",.22],["#7a1f3d",.14],["#1d6a6a",.12]];return [...Array(14)].map((_,i)=>({x:lerp(-3600,3600,r()),y:lerp(-3300,3200,r()),r:700+r()*900,c:cols[i%3][0],a:cols[i%3][1]}))})();
const T0=performance.now();
/* glow sprites */
const sprites={};
function sprite(col){if(sprites[col])return sprites[col];const s=document.createElement("canvas");s.width=s.height=96;const g=s.getContext("2d");
  const gr=g.createRadialGradient(48,48,0,48,48,48);gr.addColorStop(0,"#fff");gr.addColorStop(.12,"#fff");gr.addColorStop(.28,col);gr.addColorStop(1,"rgba(0,0,0,0)");
  g.fillStyle=gr;g.fillRect(0,0,96,96);return sprites[col]=s}
/* shooting stars */
const shoots=[];let nextShoot=performance.now()+4000;
/* rocket trail */
const trail=[];

function drawSky(t){
  const c=cx;c.setTransform(DPR,0,0,DPR,0,0);c.clearRect(0,0,W,H);
  const spd=Math.hypot(cam.vx,cam.vy);
  // nebula (far parallax)
  NEB.forEach(n=>{const x=n.x*.15-cam.x*.15+W/2,y=n.y*.15-cam.y*.15+H/2,r=n.r*.6;if(x<-r||x>W+r||y<-r||y>H+r)return;
    const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,n.c);g.addColorStop(1,"rgba(0,0,0,0)");c.globalAlpha=n.a;c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2)});
  // dust
  {const p=.18,ox=((-cam.x*p+W/2)%900+900)%900,oy=((-cam.y*p+H/2)%900+900)%900;
   for(let ty=-900;ty<H+900;ty+=900)for(let tx=-900;tx<W+900;tx+=900)for(const d of DUST){const x=tx+ox+d.x,y=ty+oy+d.y;if(x<0||x>W||y<0||y>H)continue;c.globalAlpha=d.a;c.fillStyle=d.c;c.beginPath();c.arc(x,y,d.z,0,7);c.fill()}}
  // crosses
  const ts=(t-T0)/1000,streak=spd>700?Math.min(1,(spd-700)/1600):0;
  PLAY.forEach((L,li)=>{const f=ts/L.T,ox=-2*L.w*f-cam.x*L.p+W/2,oy=L.h*f-L.h-cam.y*L.p+H/2;
    c.globalAlpha=.75+.25*Math.cos(2*Math.PI*(ts+L.off)/L.tw);
    const c0=Math.floor(-ox/L.w)-1,c1=Math.ceil((W-ox)/L.w),r0=Math.floor(-oy/L.h)-1,r1=Math.ceil((H-oy)/L.h);
    for(let cc=c0;cc<=c1;cc++)for(let rr=r0;rr<=r1;rr++)L.s.forEach((st,si)=>{
      const jx=(phash(cc,rr,li*7+si)-.5)*L.w*.7,jy=(phash(rr,cc,li*5+si+3)-.5)*L.h*.7;
      const x=cc*L.w+st[0]+ox+jx,y=rr*L.h+st[1]+oy+jy;if(x<-10||x>W+10||y<-10||y>H+10)return;
      if(streak){c.strokeStyle=st[3];c.lineWidth=1.6;const k=streak*L.p*.05;c.beginPath();c.moveTo(x,y);c.lineTo(x+cam.vx*k,y+cam.vy*k);c.stroke();return}
      c.fillStyle=st[3];c.shadowColor=st[3];c.shadowBlur=2.4*DPR;c.beginPath();dvCross(c,x,y,st[2],phash(cc,rr,li*2+si));c.fill()})});
  c.shadowBlur=0;
  c.globalAlpha=1;
  // shooting stars
  if(t>nextShoot){nextShoot=t+5000+Math.random()*7000;const a=(.15+Math.random()*.5)*Math.PI;shoots.push({x:Math.random()*W,y:Math.random()*H*.5,vx:Math.cos(a)*900*(Math.random()<.5?-1:1),vy:Math.sin(a)*500,life:0})}
  for(let i=shoots.length-1;i>=0;i--){const s=shoots[i];s.life+=1/60;s.x+=s.vx/60;s.y+=s.vy/60;const al=Math.sin(Math.min(1,s.life/0.9)*Math.PI);
    const g=c.createLinearGradient(s.x,s.y,s.x-s.vx*.12,s.y-s.vy*.12);g.addColorStop(0,`rgba(255,255,255,${al})`);g.addColorStop(1,"rgba(255,255,255,0)");
    c.strokeStyle=g;c.lineWidth=2;c.beginPath();c.moveTo(s.x,s.y);c.lineTo(s.x-s.vx*.12,s.y-s.vy*.12);c.stroke();if(s.life>.9)shoots.splice(i,1)}
  // constellations
  if(mode==="home"||mode==="list")CONS.forEach(C=>{
    const sx=C.x-cam.x+W/2,sy=C.y-cam.y+H/2;
    const vis=sx>-400&&sx<W+400&&sy>-400&&sy<H+400;
    if(vis&&C.prog<1)C.prog=Math.min(1,C.prog+(frame.dt||.016)/2.4);
    if(!vis&&C.prog===0)return;
    if(!vis)return;
    const {pts,segs}=C.g,P=pts.map(p=>[sx+p[0]*SCALE,sy+p[1]*SCALE]);
    const nseg=segs.length,show=C.prog*nseg;
    c.save();c.lineCap="round";
    // glow pass
    c.strokeStyle=C.color;c.globalAlpha=.22;c.lineWidth=9;c.beginPath();
    segs.forEach(([a,b],k)=>{if(k>show)return;const f=Math.min(1,show-k);c.moveTo(P[a][0],P[a][1]);c.lineTo(lerp(P[a][0],P[b][0],f),lerp(P[a][1],P[b][1],f))});c.stroke();
    c.globalAlpha=.75;c.lineWidth=2.2;c.stroke();c.restore();
    pts.forEach((p,k)=>{const appear=clamp(C.prog*1.4-k/pts.length*.9,0,1);if(!appear)return;
      const tw=.8+.2*Math.sin(t/700+k*1.7+C.seed);const big=k===C.big?1.8:1;const r=(16+((k*7+C.seed)%3)*4)*big*tw*appear;
      c.globalAlpha=.95;c.drawImage(sprite(C.color),P[k][0]-r,P[k][1]-r,r*2,r*2);
      c.globalAlpha=1;c.fillStyle="#fff";c.beginPath();c.arc(P[k][0],P[k][1],2.6*big*appear,0,7);c.fill()});
    c.globalAlpha=1;
    if(C.lab){C.lab.style.transform=`translate(${C.x}px,${C.y+SCALE*112}px) translate(-50%,0)`;C.lab.classList.toggle("on",C.prog>.55)}
  });
  // rocket trail particles (screen space from world)
  for(let i=trail.length-1;i>=0;i--){const p=trail[i];p.life-=1/60;if(p.life<=0){trail.splice(i,1);continue}
    p.x+=p.vx/60;p.y+=p.vy/60;const x=p.x-cam.x+W/2,y=p.y-cam.y+H/2;const a=p.life/p.max;
    c.globalAlpha=a*.9;c.fillStyle=p.col;c.beginPath();c.arc(x,y,p.r*(1.4-a*.4),0,7);c.fill()}
  c.globalAlpha=1;
}

function rocketSVG(){return `<svg width="60" height="124" viewBox="0 0 60 124" aria-label="Rocket ship">

function triviaPool(){const out=[];window.LESSONS.forEach(L=>{const b=S.baked[L.id];if(!b)return;L.parts.filter(p=>p.kind==="walk").forEach((p,i)=>{if(b[i])p.cards.filter(c=>c.t==="choice").forEach(c=>out.push(Object.assign({src:L},c)))})});return out}

const HUES={amber:"#ffc65c",berry:"#ff7d9c",sage:"#7dffb4",blue:"#8fd8ff",cocoa:"#e0a46a",lav:"#c9a8ff",glow:"#fff0b8"};
const RMQ=()=>window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
let collRun=0;
const clipTxt=(t,n)=>{t=String(t||"").replace(/\s+/g," ").trim();if(t.length<=n)return t;const c=t.slice(0,n),sp=c.lastIndexOf(" ");return(sp>n*.6?c.slice(0,sp):c).replace(/[,;:]$/,"")+"…"};
const recentVerses=()=>S.revealed.slice(-3).reverse();
const charsGot=()=>CHARS.filter(c=>!c.lock);
const placesGot=()=>PLACES.filter(p=>!p.locked);

/* verses: books with revealed verses slide along the shelf, taking turns */
const SPINE=[["#ffc65c","#f2a93b"],["#ff9d6c","#e0774a"],["#ffe39a","#f2c96a"],["#f2a93b","#c9821f"]];
const BK_SHORT={Thessalonians:"Thess.",Corinthians:"Cor.",Deuteronomy:"Deut.",Lamentations:"Lam.",Ecclesiastes:"Eccl.",Philippians:"Phil.",Colossians:"Col.","Song of Solomon":"Song",Chronicles:"Chron.",Philemon:"Phlm."};
const bkShort=b=>b.length<=11?b:Object.keys(BK_SHORT).reduce((t,k)=>t.replace(k,BK_SHORT[k]),b);
function revealedBooks(){const out=[];for(let i=S.revealed.length-1;i>=0;i--){const b=S.revealed[i].book;if(b&&!out.includes(b))out.push(b)}return out}
function bookLook(b){let h=7;for(const ch of b)h=(h*31+ch.charCodeAt(0))>>>0;return{c:SPINE[h%4],h:122+(h>>4)%26}}
const BLANK_H=[128,140,122,134];
function stShelf(){return `<div class="shelf"><div class="bglow"></div><div class="brow"></div><div class="bboard"></div></div>`}
function runShelf(root,run){if(!root)return;const row=root.querySelector(".brow");const list=revealedBooks(),newest=list[0];
  const cyc=list.map(b=>({b}));const FILL=["Genesis","Judges","Psalms","John","Exodus","Ruth","Matthew"].filter(b=>!list.includes(b));for(let k=0;cyc.length<4;k++)cyc.push({b:FILL[k],blank:k});
  const n=cyc.length,X=j=>`calc(50% - 104px + ${j*54}px)`;
  const make=(it,j,rise)=>{const s=document.createElement("span");s.className="bkslot";s.style.left=X(j);s.dataset.j=j;
    let inner;
    if(it.b){const L=bookLook(it.b),isNew=it.b===newest;inner=`<span class="bsp${isNew?" newest":""}${it.blank!=null?" blank":""}${rise?" rise":""}" style="--i:${j};--h:${L.h}px;--c1:${L.c[0]};--c2:${L.c[1]}">${isNew?'<i class="bmote" style="--x:30%;--dl:0s"></i><i class="bmote" style="--x:60%;--dl:1.1s"></i><i class="bmote" style="--x:45%;--dl:2.2s"></i>':""}<em>${esc(bkShort(it.b))}</em><u></u></span>`}
    else inner=`<span class="bsp blank${rise?" rise":""}" style="--i:${j};--h:${BLANK_H[it.blank%4]}px;--c1:#b98a52;--c2:#8a6236"><u></u></span>`;
    s.innerHTML=inner;row.appendChild(s);return s};
  let start=0;const slots=[0,1,2,3].map(j=>make(cyc[j%n],j,true));
  if(RMQ()||!list.length)return;
  const step=()=>{if(run!==collRun||!root.isConnected)return;
    start=(start-1+n)%n;
    slots.forEach(s=>{const j=+s.dataset.j+1;s.dataset.j=j;s.style.left=X(j);if(j>3){s.style.opacity=0;setTimeout(()=>s.remove(),950)}});
    for(let i=slots.length-1;i>=0;i--)if(+slots[i].dataset.j>3)slots.splice(i,1);
    const e=make(cyc[start],-1,false);e.style.opacity=0;void e.offsetWidth;e.dataset.j=0;e.style.left=X(0);e.style.opacity=1;slots.unshift(e);
    setTimeout(step,3000)};
  setTimeout(step,2600)}

/* characters: the newest three dealt like collectible cards; they take turns stepping to the front */
function stChars(){const got=charsGot().slice(-3).reverse();const slots=[...got];while(slots.length<3)slots.push(null);
  const card=(c,i)=>c?`<div class="ccd" data-i="${i}"><span class="ccav">${esc(c.ini)}</span><b>${esc(c.n)}</b><small>${esc(c.b)}</small><em>${esc(c.occ)} mentions</em>${i===0?'<i class="ccnew">NEW</i>':""}<span class="ccsh"></span></div>`
    :`<div class="ccd back" data-i="${i}"><span class="ccq">?</span><b>Who’s next?</b><small>Keep baking</small><span class="ccsh"></span></div>`;
  return `<div class="cfan">${slots.map(card).join("")}</div>`}
function runChars(root,run){if(!root)return;const all=[...root.querySelectorAll(".ccd")],real=all.filter(c=>!c.classList.contains("back")),myst=all.filter(c=>c.classList.contains("back"));
  const POS=["front","left","right"].slice(0,Math.max(1,real.length));const rest=["front","left","right"].filter(p=>!POS.includes(p));myst.forEach((c,i)=>c.dataset.pos=rest[i]||"right");let off=0;
  const place=()=>real.forEach((c,i)=>{const p=POS[(i+off)%POS.length];c.dataset.pos=p;if(p==="front"){c.classList.remove("shine");void c.offsetWidth;c.classList.add("shine")}});
  place();if(RMQ()||real.length<2)return;
  const step=()=>{if(run!==collRun||!root.isConnected)return;off=(off+POS.length-1)%POS.length;place();setTimeout(step,3400)};setTimeout(step,3400)}

/* places: newest three pinned along a glowing journey line */
function stPlaces(){const got=placesGot().slice(-3);const slots=[got[0],got[1],got[2]];while(slots.length<3)slots.push(undefined);
  const ord=[];for(let i=0;i<3;i++)ord.push(slots[i]);const filled=ord.filter(Boolean),newest=filled[filled.length-1];
  const P=[[50,74],[150,44],[250,70]];
  const route="M50 74 C 88 30, 112 92, 150 44 S 214 22, 250 70";
  const pin=(p,i)=>{const [x,y]=P[i];
    if(!p)return `<g transform="translate(${x} ${y})"><g class="pin myst" style="--i:${i}"><path d="M0 0 C-7 -9 -11 -15 -11 -21 A11 11 0 1 1 11 -21 C11 -15 7 -9 0 0Z"/><text class="emo" y="-21" fill="rgba(255,255,255,.6)" style="font:900 12px var(--body)">?</text></g><text class="pnm" y="16">Next stop</text></g>`;
    return `<g transform="translate(${x} ${y})">${p===newest?`<ellipse class="pulse" rx="14" ry="5"/>`:""}<ellipse rx="7" ry="2.5" fill="rgba(0,0,0,.35)"/><g class="pin" style="--i:${i}"><path d="M0 0 C-7 -9 -12 -15 -12 -22 A12 12 0 1 1 12 -22 C12 -15 7 -9 0 0Z" fill="var(--c)" stroke="rgba(255,255,255,.8)" stroke-width="1.5"/><circle cy="-22" r="8.5" fill="#123a2a"/><text class="emo" y="-22">${p.em}</text></g><text class="pnm" y="16">${esc(p.n)}</text><text class="pbk" y="28">${esc(p.b)}</text></g>`};
  return `<svg class="pmap" viewBox="0 0 300 112" aria-hidden="true"><defs><mask id="rmask"><path class="rmask" d="${route}"/></mask></defs>
   <path class="ct" d="M-10 30 C 40 10, 80 40, 130 22 S 230 0, 310 18"/><path class="ct" d="M-10 98 C 50 80, 100 104, 170 90 S 260 76, 310 96"/><path class="ct" d="M200 112 C 210 96, 240 92, 262 100 S 300 110, 310 104"/>
   <path class="route" d="${route}" mask="url(#rmask)"/>
   ${filled.length>1?`<circle class="walker" r="2.8"><animateMotion dur="4.5s" begin="3s" repeatCount="indefinite" path="${route}"/></circle>`:""}
   ${ord.map(pin).join("")}</svg>`}

const SOON={prophecy:["Prophecy and Fulfillment of Jesus","blue","pairs linked","Each time a lesson shows a prophecy and its fulfillment, the pair links up here."],
  instr:["Instructions for Today","cocoa","instructions","What Scripture tells you to do, gathered from every lesson you bake."],

function dhero(n,label,note){return `<div class="dhero"><b data-count="${n}">${RMQ()?n:0}</b><span>${esc(label)}</span>${note?`<p>${esc(note)}</p>`:""}</div>`}
function countUp(d){const b=d.querySelector(".dhero b");if(!b||RMQ())return;const n=+b.dataset.count;if(!n){b.textContent="0";return}
  const t0=performance.now(),dur=Math.min(1200,400+n*60);const f=t=>{const p=Math.min(1,(t-t0)/dur);b.textContent=Math.round(n*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
function openCol(k){let d;
  if(k.startsWith("soon:")){const [t,h,lab,note]=SOON[k.slice(5)];d=drill(t,dhero(0,lab,note),{accent:HUES[h]});countUp(d);return}
  if(k==="verses"){const by={};S.revealed.forEach(v=>{(by[v.book]=by[v.book]||[]).push(v)});
    const books=Object.keys(by);
    d=drill("Bible verses",dhero(S.revealed.length,S.revealed.length===1?"verse collected":"verses collected")+(books.length?books.map(b=>`<div class="vbook"><h3>${esc(b)} <span>${by[b].length}</span></h3><div class="vtext">${by[b].sort((a,c)=>a.chap-c.chap||a.v-c.v).map(v=>`<span><sup>${v.chap}:${v.v}</sup>${esc(v.text)}</span> `).join("")}</div></div>`).join("")+`<div class="src">Berean Standard Bible</div>`:`<div class="empty">No verses yet.</div>`),{accent:HUES.amber});countUp(d);return}

  if(k==="places"){const n=placesGot().length;d=drill("Places",dhero(n,n===1?"place visited":"places visited")+`<div class="ggrid">${PLACES.map(p=>`<div class="gcell ${p.locked?"lock":""}" style="--c:${HUES.sage}"><span class="gav emo">${p.em}</span><b>${esc(p.n)}</b><small>${esc(p.b)}</small><em>${esc(p.occ)} mentions</em>${p.locked?'<i class="lk">🔒</i>':""}</div>`).join("")}</div>`,{accent:HUES.sage});countUp(d);return}
}

const mmss=s=>{s=Math.floor(s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const clockT=ms=>new Date(ms).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
function openTV(){const d=drill("Bakery TV",`<div class="tv"><div class="tvscreen" id="tvScr"><div class="tvglow"></div><b id="tvT"></b><span id="tvNow"></span><div class="tvbar"><i id="tvBar"></i></div><span class="tvtc" id="tvTC"></span></div><div id="tvGuide"></div></div>`,{accent:"#ffc65c",onBack:()=>clearInterval(window.tvTimer)});

      let start=now-w.off*1000,h="";for(let k=0;k<6;k++){const idx=(w.i+k)%BTV_LIST.length,x=BTV_LIST[idx];const lab=k===0?"Now playing":k===1?"Up next":"Later";
        h+=`<div class="tvrow ${k===0?"now":""}"><span class="sw" style="background:${x.c2}"></span><span class="t">${clockT(start)}</span><span class="n"><b>${esc(x.t)} Overview</b><span>${lab} · ${mmss(x.d)}</span></span>${k?`<button class="rem ${S.remind[start]?"set":""}" data-at="${start}">${S.remind[start]?"✓ Set":"🔔 Remind me"}</button>`:""}</div>`;start+=x.d*1000}
      $("#tvGuide").innerHTML=h;$("#tvGuide").querySelectorAll(".rem").forEach(b=>b.onclick=()=>{const a=b.dataset.at;S.remind[a]=!S.remind[a];b.classList.toggle("set",!!S.remind[a]);b.textContent=S.remind[a]?"✓ Set":"🔔 Remind me";SFX.tap()})}
    $("#tvTC").textContent=mmss(w.off)+" / "+mmss(v.d);$("#tvBar").style.width=(w.off/v.d*100)+"%"};
